name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quartz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('quartz/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: quartz/.quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz/quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Restyle referenced white-canvas mathematical figures
        run: node scripts/restyle-legacy-figures.mjs --write

      - name: Audit the mathematical figure palette
        run: node scripts/restyle-legacy-figures.mjs --check

      - name: Save the restyled source diagrams to main
        run: |
          if ! git diff --quiet -- content/media; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/media
            git commit -m "Restyle remaining referenced legacy mathematics figures"
            git push origin HEAD:main
          fi

      - name: Generate chapter reference tables
        run: node scripts/generate-chapter-references.mjs --write

      - name: Verify complete chapter reference coverage
        run: node scripts/generate-chapter-references.mjs --check

      - name: Commit new chapter references directly to main
        run: |
          git add -- content/*.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add chapter reference tables throughout mathematics notes"
            git push origin HEAD:main
          fi

      - name: Editorial coverage and structure inventory
        run: node scripts/editorial-inventory.mjs --check

      - name: Mathematical figure and placement audit
        run: node scripts/check-math-figures.mjs

      - name: Build Quartz
        run: npx quartz build

      - name: Quality gate (KaTeX errors, broken links, empty alt, orphaned media)
        run: node scripts/check-quality.mjs

      - name: Definition notation audit (advisory)
        run: node scripts/audit-definition-notation.mjs

      - name: Arithmetic regression checks for worked examples
        run: node scripts/check-arithmetic.mjs

      - name: Check truth practice interactions
        run: node scripts/check-truth-practice.mjs

      - name: Inject image lightbox (click-to-zoom)
        run: node scripts/inject-lightbox.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
