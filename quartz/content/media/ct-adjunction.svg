<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Free monoid universal property</title><desc id="desc">A set map from generators A into the underlying set of a monoid M uniquely extends to a monoid homomorphism from finite words A* into M.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Free monoid universal property</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Specify generators; extension is forced.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="72" y="150" width="655" height="122" rx="14" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><text x="400" y="195" fill="#6DD2BD" font-size="28" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f : A → underlying(M)</text><text x="400" y="244" fill="#F4F5EF" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">choose where generators go</text><line x1="400" y1="278" x2="400" y2="348" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><rect x="72" y="362" width="655" height="122" rx="14" stroke="#C7B6F4" fill="#1C2B40" stroke-width="2.5"/><text x="400" y="406" fill="#C7B6F4" font-size="26" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">unique monoid map  f̂ : A* → M</text><text x="400" y="454" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">evaluate each word</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>