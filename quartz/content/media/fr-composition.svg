<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">Function composition: g first, then f</title><desc id="desc">g(x)=x+1 followed by f(u)=u squared, so (f∘g)(x)=(x+1)². At x=2 the trace is 2→3→9.</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">Function composition: g first, then f</text><rect x="30" y="120" width="1140" height="470" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="40" y="130" width="1120" height="59" rx="13" fill="#122338"/><text x="600" y="162" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Follow the arrows in evaluation order</text><path d="M54 190 H1146" stroke="#87B8EE" opacity=".35" stroke-width="2"/><rect x="76" y="264" width="185" height="100" rx="20" fill="#122338" stroke="#87B8EE" stroke-width="2.3"/><text x="168" y="315" fill="#87B8EE" font-size="29" font-weight="500" text-anchor="middle" dominant-baseline="middle">input x</text><path d="M271 313 L335 313" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><rect x="342" y="248" width="245" height="130" rx="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.3"/><text x="465" y="281" fill="#BCA8EC" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">g(x) = x + 1</text><text x="465" y="341" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">2 → 3</text><path d="M595 313 L658 313" fill="none" stroke="#EDB86D" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowG)"/><rect x="666" y="248" width="245" height="130" rx="20" fill="#122338" stroke="#EDB86D" stroke-width="2.3"/><text x="788" y="281" fill="#EDB86D" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">f(u) = u²</text><text x="788" y="341" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">3 → 9</text><path d="M918 313 L980 313" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><rect x="987" y="264" width="139" height="100" rx="20" fill="#122338" stroke="#98D5A3" stroke-width="2.3"/><text x="1056" y="315" fill="#98D5A3" font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="middle">9</text><text x="600" y="455" fill="#F4F3ED" font-size="30" font-weight="500" text-anchor="middle" dominant-baseline="middle">(f ∘ g)(x) = f(g(x)) = (x + 1)²</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">At x = 2: first g(2) = 3, then f(3) = 9.</text></svg>