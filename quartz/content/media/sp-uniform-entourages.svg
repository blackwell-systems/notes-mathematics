<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 688" role="img" aria-labelledby="title desc"><title id="title">Uniform spaces refine topology without numerical distances</title><desc id="desc">Left panel displays a diagonal and a symmetric band around x equals y in the product X times X. A metric supplies sets of near-pairs U epsilon given by distance smaller than epsilon. Right panel shows points with local neighborhoods: a topology governs local nearness while a uniformity coherently determines near-pairs throughout the space. Same open sets can arise from different uniformities and differ on Cauchy behavior.</desc><rect width="1320" height="688" rx="20" fill="#0C1E30"/><text x="46" y="58" font-family="Arial,Helvetica,sans-serif" font-size="34" text-anchor="start" fill="#F2F7FC" font-weight="700">Uniform spaces refine topology without numerical distances</text><path d="M46 83 L1274 83" stroke="#496779" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="46" y="114" width="593" height="438" rx="14" fill="#173248" stroke="#91BEED" stroke-width="2"/><rect x="666" y="114" width="608" height="438" rx="14" fill="#173248" stroke="#72D4C0" stroke-width="2"/><text x="70" y="155" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" fill="#91BEED" font-weight="700">METRIC → UNIFORMITY</text><text x="70" y="190" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" fill="#C0D0DF">Close pairs satisfy |x − y| &lt; ε.</text><path d="M133 466 L563 466" stroke="#496779" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M133 466 L133 237" stroke="#496779" stroke-width="2" stroke-linecap="round" fill="none"/><polygon points="133,412 476,237 553,237 210,466" fill="#91BEED" fill-opacity=".22" stroke="#91BEED" stroke-width="2"/><path d="M133 466 L553 237" stroke="#F1BD73" stroke-width="3" stroke-linecap="round" fill="none"/><text x="552" y="282" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" fill="#F1BD73">diagonal x = y</text><text x="348" y="503" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#91BEED">Uε = { (x,y) : d(x,y) &lt; ε }</text><text x="691" y="155" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#72D4C0" font-weight="700">TOPOLOGY → NEIGHBORHOODS</text><text x="691" y="190" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" fill="#C0D0DF">Open sets say what is near each point.</text><text x="691" y="223" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" fill="#C0D0DF">Uniformity adds coherent near-pairs across X.</text><ellipse cx="763" cy="359" rx="38" ry="27" stroke="#72D4C0" stroke-width="2" fill="#72D4C0" fill-opacity=".13"/><circle cx="763" cy="359" r="7" fill="#F1BD73"/><ellipse cx="898" cy="331" rx="43" ry="30" stroke="#72D4C0" stroke-width="2" fill="#72D4C0" fill-opacity=".13"/><circle cx="898" cy="331" r="7" fill="#F1BD73"/><ellipse cx="1036" cy="381" rx="48" ry="33" stroke="#72D4C0" stroke-width="2" fill="#72D4C0" fill-opacity=".13"/><circle cx="1036" cy="381" r="7" fill="#F1BD73"/><ellipse cx="1159" cy="313" rx="53" ry="36" stroke="#72D4C0" stroke-width="2" fill="#72D4C0" fill-opacity=".13"/><circle cx="1159" cy="313" r="7" fill="#F1BD73"/><text x="971" y="472" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#72D4C0">No distances need be assigned.</text><text x="660" y="609" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#F2F7FC">Uniform continuity and Cauchy behavior need consistent near-pair information.</text><text x="660" y="654" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#F1BD73">Same topology can support different uniform structures (as on ℝ).</text></svg>