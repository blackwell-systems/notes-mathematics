<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Product compactness is a two-stage selection</title><desc id="desc">Left panel shows one vertical slice of X times Y covered by finitely many original open rectangles; right panel shows finitely selected neighborhoods of X and vertical strips covering the product.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" fill="#F2F5FA" font-family="Georgia,serif" font-size="38" text-anchor="middle">Product compactness is a two-stage selection</text><text x="640" y="106" fill="#C4D2E0" font-family="Georgia,serif" font-size="22" text-anchor="middle">Cover a vertical fiber, then use compactness to select finitely many neighborhoods in X.</text><rect x="55" y="154" width="1170" height="471" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><text x="335" y="207" fill="#7DD9C9" font-family="Georgia,serif" font-size="30" text-anchor="middle">1. Cover a vertical slice</text><text x="943" y="207" fill="#C6A5ED" font-family="Georgia,serif" font-size="29" text-anchor="middle">2. Select finitely many strips</text><rect x="132" y="266" width="430" height="284" fill="#1F4055" stroke="#4C6980" stroke-width="3"/><rect x="237" y="301" width="131" height="214" fill="none" stroke="#7DD9C9" stroke-width="3"/><rect x="283" y="313" width="131" height="197" fill="none" stroke="#C6A5ED" stroke-width="3"/><rect x="329" y="325" width="131" height="180" fill="none" stroke="#F1BD75" stroke-width="3"/><line x1="290" y1="267" x2="290" y2="550" stroke="#F1BD75" stroke-width="3" stroke-dasharray='7 6'/><text x="290" y="583" fill="#F1BD75" font-family="Georgia,serif" font-size="22" text-anchor="middle">{x} × Y</text><rect x="721" y="266" width="432" height="284" fill="#1F4055" stroke="#4C6980" stroke-width="3"/><rect x="740" y="267" width="138" height="283" fill="#244A54" fill-opacity=".8" stroke="#7DD9C9" stroke-width="3"/><text x="806" y="417" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="middle">A1</text><rect x="869" y="267" width="138" height="283" fill="#403D62" fill-opacity=".8" stroke="#C6A5ED" stroke-width="3"/><text x="935" y="417" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="middle">A2</text><rect x="998" y="267" width="138" height="283" fill="#244A54" fill-opacity=".8" stroke="#F1BD75" stroke-width="3"/><text x="1064" y="417" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="middle">A3</text><text x="640" y="680" fill="#F2F5FA" font-family="Georgia,serif" font-size="25" text-anchor="middle">Compactness in Y, then compactness in X, gives a finite subcover.</text></svg>