<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 687" role="img" aria-labelledby="title desc"><title id="title">Vector, affine and projective viewpoints</title><desc id="desc">Three panels. In a vector space an origin 0 and vector v are drawn. In an affine space there are two points p and q and the displacement vector q minus p but no singled-out origin. In a projective view two horizontal parallel affine lines have a shared direction represented by the projective point [1:0:0] at infinity; their projective closures intersect there. Projectivization forms a quotient of nonzero vectors, rather than merely forgetting an origin.</desc><rect width="1320" height="687" rx="20" fill="#0C1E30"/><text x="46" y="58" font-family="Arial,Helvetica,sans-serif" font-size="34" text-anchor="start" fill="#F2F7FC" font-weight="700">Vector, affine and projective viewpoints</text><path d="M46 83 L1274 83" stroke="#496779" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="48" y="115" width="383" height="433" rx="14" fill="#173248" stroke="#91BEED" stroke-width="2"/><rect x="469" y="115" width="384" height="433" rx="14" fill="#173248" stroke="#72D4C0" stroke-width="2"/><rect x="890" y="115" width="382" height="433" rx="14" fill="#173248" stroke="#F1BD73" stroke-width="2"/><text x="71" y="163" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" fill="#91BEED" font-weight="700">VECTOR SPACE</text><text x="491" y="163" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" fill="#72D4C0" font-weight="700">AFFINE SPACE</text><text x="913" y="163" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="start" fill="#F1BD73" font-weight="700">PROJECTIVE SPACE</text><path d="M92 415 L391 415" stroke="#496779" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M208 489 L208 224" stroke="#496779" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="208" cy="415" r="7" fill="#91BEED"/><text x="226" y="444" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="start" fill="#C0D0DF">chosen 0</text><path d="M208 415 L343 328" stroke="#91BEED" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M335.70224319914354 339.9474995574619 L343 328 L329.1048437204502 329.7101555387999" stroke="#91BEED" stroke-width="3" fill="none"/><text x="345" y="315" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" fill="#91BEED">v</text><circle cx="570" cy="404" r="8" fill="#72D4C0"/><circle cx="745" cy="283" r="8" fill="#F1BD73"/><path d="M570 404 L745 283" stroke="#72D4C0" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M738.0942044795528 295.1782588340768 L745 283 L731.1677308085101 285.16063162389116" stroke="#72D4C0" stroke-width="3" fill="none"/><text x="552" y="430" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="start" fill="#72D4C0">p</text><text x="758" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="start" fill="#F1BD73">q</text><text x="661" y="378" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#F2F7FC">q − p</text><text x="662" y="492" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">Displacements, no chosen origin</text><path d="M931 445 L1235 445" stroke="#496779" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M931 400 L1220 400" stroke="#72D4C0" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M931 343 L1220 343" stroke="#C5ACEF" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="1188" y="358" width="59" height="36" rx="9" fill="#112739" stroke="#F1BD73" stroke-width="2"/><path d="M1170 343 L1193 343 L1203 353" stroke="#72D4C0" stroke-width="2" fill="none"/><path d="M1170 400 L1193 400 L1203 395" stroke="#C5ACEF" stroke-width="2" fill="none"/><text x="1210" y="302" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" fill="#F1BD73" font-weight="700">direction [1:0:0]</text><text x="1086" y="483" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#C0D0DF">parallel lines: same direction</text><text x="1086" y="514" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#C0D0DF">their projective closures meet</text><text x="660" y="597" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" fill="#F2F7FC">p + q is not intrinsic in an affine space.  Projective points are lines through 0.</text><text x="660" y="641" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#F1BD73">Do not read this as a chain: projectivization changes the underlying set.</text></svg>