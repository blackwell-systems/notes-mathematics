<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" width="800" height="506" role="img" aria-labelledby="title desc"><title id="title">Signs emerge from pairs</title><desc id="desc">Three proposed integer pairs: (4,1) gives positive 3, (2,2) gives zero, and (1,4) gives negative 3, using the integer equivalence-class construction.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="506" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Signs emerge from pairs</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Compare the two natural coordinates.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="53" y="163" width="225" height="284" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="165" y="213" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="21" font-weight="750">POSITIVE</text><text x="165" y="300" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="550">(4,1)</text><text x="165" y="388" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="56" font-weight="760">3</text><rect x="303" y="163" width="225" height="284" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="415" y="213" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="21" font-weight="750">ZERO</text><text x="415" y="300" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="550">(2,2)</text><text x="415" y="388" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="56" font-weight="760">0</text><rect x="553" y="163" width="225" height="284" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="665" y="213" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="21" font-weight="750">NEGATIVE</text><text x="665" y="300" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="550">(1,4)</text><text x="665" y="388" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="56" font-weight="760">−3</text><text x="40" y="489" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>