<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 598" width="800" height="598" role="img" aria-labelledby="title desc"><title id="title">Cauchy sequences build the reals</title><desc id="desc">A rational Cauchy sequence 1.4, 1.41, 1.414, 1.4142 approaching sqrt2. The real number is represented by the equivalence class of such sequences, not assumed in advance.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="598" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Cauchy sequences build the reals</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Increasingly accurate rational approximations.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="95" y="147" width="610" height="71" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="193" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="34" font-weight="720">1.4</text><rect x="95" y="238" width="610" height="71" rx="14" fill="#19283A" stroke="#87B8EE" stroke-width="2"/><text x="400" y="284" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#87B8EE" font-size="34" font-weight="720">1.41</text><rect x="95" y="329" width="610" height="71" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="375" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="34" font-weight="720">1.414</text><rect x="95" y="420" width="610" height="71" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="400" y="466" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="34" font-weight="720">1.4142</text><text x="400" y="551" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="23" font-weight="550">Sequence terms settle closer together.</text><text x="40" y="581" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>