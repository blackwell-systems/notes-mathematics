<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Compactness and connectedness are independent</title><desc id="desc">Four sets: [0,1] compact connected; {0,1} compact disconnected; R noncompact connected; and two separated open intervals noncompact disconnected.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" fill="#F2F5FA" font-family="Georgia,serif" font-size="38" text-anchor="middle">Compactness and connectedness are independent</text><text x="640" y="106" fill="#C4D2E0" font-family="Georgia,serif" font-size="22" text-anchor="middle">Even on the real line, all four combinations occur.</text><rect x="50" y="150" width="1180" height="475" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><rect x="67" y="222" width="555" height="177" rx="16" fill="#223B4E" stroke="#7DD9C9" stroke-width="2.5"/><text x="344" y="265" fill="#7DD9C9" font-family="Georgia,serif" font-size="25" text-anchor="middle">Compact and connected</text><text x="344" y="306" fill="#F2F5FA" font-family="Georgia,serif" font-size="27" text-anchor="middle">[0,1]</text><line x1="187" y1="352" x2="507" y2="352" stroke="#4C6980" stroke-width="2" /><line x1="247" y1="352" x2="447" y2="352" stroke="#7DD9C9" stroke-width="7" /><circle cx="247" cy="352" r="8" fill="#7DD9C9" stroke="#F2F5FA" stroke-width="2"/><circle cx="447" cy="352" r="8" fill="#7DD9C9" stroke="#F2F5FA" stroke-width="2"/><rect x="659" y="222" width="555" height="177" rx="16" fill="#223B4E" stroke="#C6A5ED" stroke-width="2.5"/><text x="936" y="265" fill="#C6A5ED" font-family="Georgia,serif" font-size="25" text-anchor="middle">Compact and disconnected</text><text x="936" y="306" fill="#F2F5FA" font-family="Georgia,serif" font-size="27" text-anchor="middle">{0,1}</text><line x1="779" y1="352" x2="1099" y2="352" stroke="#4C6980" stroke-width="2" /><circle cx="871" cy="352" r="8" fill="#C6A5ED" stroke="#F2F5FA" stroke-width="2"/><circle cx="1007" cy="352" r="8" fill="#C6A5ED" stroke="#F2F5FA" stroke-width="2"/><rect x="67" y="427" width="555" height="177" rx="16" fill="#223B4E" stroke="#F1BD75" stroke-width="2.5"/><text x="344" y="470" fill="#F1BD75" font-family="Georgia,serif" font-size="25" text-anchor="middle">Noncompact and connected</text><text x="344" y="511" fill="#F2F5FA" font-family="Georgia,serif" font-size="27" text-anchor="middle">ℝ</text><line x1="187" y1="557" x2="507" y2="557" stroke="#4C6980" stroke-width="2" /><line x1="187" y1="557" x2="507" y2="557" stroke="#F1BD75" stroke-width="6" /><text x="177" y="564" fill="#F2F5FA" font-family="Georgia,serif" font-size="25" text-anchor="middle">←</text><text x="517" y="564" fill="#F2F5FA" font-family="Georgia,serif" font-size="25" text-anchor="middle">→</text><rect x="659" y="427" width="555" height="177" rx="16" fill="#223B4E" stroke="#F2A4B0" stroke-width="2.5"/><text x="936" y="470" fill="#F2A4B0" font-family="Georgia,serif" font-size="25" text-anchor="middle">Noncompact and disconnected</text><text x="936" y="511" fill="#F2F5FA" font-family="Georgia,serif" font-size="27" text-anchor="middle">(−2,−1) ∪ (1,2)</text><line x1="779" y1="557" x2="1099" y2="557" stroke="#4C6980" stroke-width="2" /><line x1="787" y1="557" x2="894" y2="557" stroke="#F2A4B0" stroke-width="7" /><line x1="984" y1="557" x2="1091" y2="557" stroke="#F2A4B0" stroke-width="7" /><circle cx="787" cy="557" r="9" fill="#1A304A" stroke="#F2A4B0" stroke-width="4"/><circle cx="894" cy="557" r="9" fill="#1A304A" stroke="#F2A4B0" stroke-width="4"/><circle cx="984" cy="557" r="9" fill="#1A304A" stroke="#F2A4B0" stroke-width="4"/><circle cx="1091" cy="557" r="9" fill="#1A304A" stroke="#F2A4B0" stroke-width="4"/><text x="640" y="676" fill="#F1BD75" font-family="Georgia,serif" font-size="25" text-anchor="middle">Compactness concerns covers; connectedness concerns separation.</text></svg>