<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">Mathematical structures form a network</title><desc id="desc">The upper network branches from the set into orders and lattices, topologies and metrics, vector spaces, and measurable spaces and probability measures. The lower analytic branch shows normed vector spaces separating into Banach spaces, requiring norm completeness, and inner-product spaces, adding inner-product data; Hilbert spaces are exactly complete inner-product spaces and thus lie in both branches. Downward arrows mean stronger conditions or added compatible structure, not automatically invertible constructions.</desc><rect width="1440" height="1060" rx="17" fill="#0C1E30"/><text x="56" y="57" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="38" font-weight="700">Mathematical structures form a network</text><line x1="56" y1="81" x2="1384" y2="81" stroke="#35546A" stroke-width="2"/><text x="56" y="119" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="18">ARROWS DOWN = extra data or a stronger property; no converse is assumed.</text><rect x="614" y="137" width="212" height="70" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="720" y="166" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">SET</text><text x="720" y="190" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">underlying elements</text><line x1="720" y1="207" x2="185" y2="261" stroke="#C6A5ED" stroke-width="2.7" stroke-linecap="round"/><path d="M194.19750738451472 254.966273298218 L185 261 L195.2177323466006 265.0740576448096" stroke="#C6A5ED" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="50" y="271" width="270" height="70" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="185" y="300" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">ORDERED SET</text><text x="185" y="324" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">comparison ≤</text><line x1="720" y1="207" x2="540" y2="261" stroke="#99BFF1" stroke-width="2.7" stroke-linecap="round"/><path d="M547.8858536042582 253.33101617342896 L540 261 L550.8050615374473 263.0617092840594" stroke="#99BFF1" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="405" y="271" width="270" height="70" rx="12" fill="#152F45" stroke="#99BFF1" stroke-width="2.4"/><text x="540" y="300" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">TOPOLOGICAL</text><text x="540" y="324" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">open subsets</text><line x1="720" y1="207" x2="900" y2="261" stroke="#7DD9C9" stroke-width="2.7" stroke-linecap="round"/><path d="M889.1949384625527 263.0617092840594 L900 261 L892.1141463957418 253.33101617342894" stroke="#7DD9C9" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="765" y="271" width="270" height="70" rx="12" fill="#152F45" stroke="#7DD9C9" stroke-width="2.4"/><text x="900" y="300" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">VECTOR SPACE</text><text x="900" y="324" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">addition + scaling</text><line x1="720" y1="207" x2="1250" y2="261" stroke="#F0BD75" stroke-width="2.7" stroke-linecap="round"/><path d="M1239.778432311789 265.06442542007125 L1250 261 L1240.8081836077079 254.95760714531144" stroke="#F0BD75" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="1115" y="271" width="270" height="70" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="1250" y="300" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">MEASURABLE</text><text x="1250" y="324" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">sigma-algebra</text><line x1="185" y1="341" x2="185" y2="390" stroke="#C6A5ED" stroke-width="2.7" stroke-linecap="round"/><path d="M179.92042906904368 380.2430558494279 L185 390 L190.07957093095632 380.2430558494279" stroke="#C6A5ED" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="50" y="398" width="270" height="69" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="185" y="427" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">LATTICE</text><text x="185" y="451" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">pairwise meets + joins</text><line x1="540" y1="341" x2="540" y2="390" stroke="#99BFF1" stroke-width="2.7" stroke-linecap="round"/><path d="M534.9204290690437 380.2430558494279 L540 390 L545.0795709309563 380.2430558494279" stroke="#99BFF1" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="405" y="398" width="270" height="69" rx="12" fill="#152F45" stroke="#99BFF1" stroke-width="2.4"/><text x="540" y="427" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">METRIC SPACE</text><text x="540" y="451" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">distance d; induces opens</text><line x1="1250" y1="341" x2="1250" y2="390" stroke="#F0BD75" stroke-width="2.7" stroke-linecap="round"/><path d="M1244.9204290690436 380.2430558494279 L1250 390 L1255.0795709309564 380.2430558494279" stroke="#F0BD75" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="1115" y="398" width="270" height="69" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="1250" y="427" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">MEASURE SPACE</text><text x="1250" y="451" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">countably additive size</text><line x1="185" y1="467" x2="185" y2="502" stroke="#C6A5ED" stroke-width="2.7" stroke-linecap="round"/><path d="M179.92042906904368 492.2430558494279 L185 502 L190.07957093095632 492.2430558494279" stroke="#C6A5ED" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="50" y="510" width="270" height="67" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="185" y="539" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">COMPLETE LATTICE</text><text x="185" y="563" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">arbitrary meets + joins</text><line x1="540" y1="467" x2="540" y2="502" stroke="#99BFF1" stroke-width="2.7" stroke-linecap="round"/><path d="M534.9204290690437 492.2430558494279 L540 502 L545.0795709309563 492.2430558494279" stroke="#99BFF1" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="405" y="510" width="270" height="67" rx="12" fill="#152F45" stroke="#99BFF1" stroke-width="2.4"/><text x="540" y="539" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">COMPLETE METRIC</text><text x="540" y="563" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">all Cauchy seq. converge</text><line x1="1250" y1="467" x2="1250" y2="502" stroke="#F0BD75" stroke-width="2.7" stroke-linecap="round"/><path d="M1244.9204290690436 492.2430558494279 L1250 502 L1255.0795709309564 492.2430558494279" stroke="#F0BD75" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="1115" y="510" width="270" height="67" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="1250" y="539" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">PROBABILITY</text><text x="1250" y="563" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">total measure = 1</text><rect x="58" y="616" width="1324" height="423" rx="17" fill="#112538" stroke="#35546A" stroke-width="2"/><text x="86" y="658" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700">ANALYTIC CROSS-BRANCH: compatibility and completeness</text><text x="86" y="690" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="17">A normed space combines linear structure with a compatible metric; its norm topology is a TVS.</text><rect x="570" y="715" width="300" height="65" rx="12" fill="#152F45" stroke="#7DD9C9" stroke-width="2.4"/><text x="720" y="744" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">NORMED VECTOR SPACE</text><text x="720" y="768" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">norm + linear operations</text><line x1="720" y1="780" x2="500" y2="827" stroke="#99BFF1" stroke-width="2.7" stroke-linecap="round"/><path d="M508.4803974597418 819.9940840052992 L500 827 L510.602864744084 829.9290372511562" stroke="#99BFF1" stroke-width="2.7" fill="none" stroke-linecap="round"/><line x1="720" y1="780" x2="957" y2="827" stroke="#C6A5ED" stroke-width="2.7" stroke-linecap="round"/><path d="M946.44133680804 830.08457964701 L957 827 L948.4175339946199 820.1195002168088" stroke="#C6A5ED" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="330" y="838" width="340" height="72" rx="12" fill="#152F45" stroke="#99BFF1" stroke-width="2.4"/><text x="500" y="867" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">BANACH SPACE</text><text x="500" y="891" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">norm completeness</text><rect x="787" y="838" width="340" height="72" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="957" y="867" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">INNER-PRODUCT SPACE</text><text x="957" y="891" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">norm from inner product</text><line x1="500" y1="910" x2="717" y2="956" stroke="#99BFF1" stroke-width="2.7" stroke-linecap="round"/><path d="M706.4017855039211 958.9458189854611 L717 956 L708.5085220951852 949.0075181092803" stroke="#99BFF1" stroke-width="2.7" fill="none" stroke-linecap="round"/><line x1="957" y1="910" x2="724" y2="956" stroke="#C6A5ED" stroke-width="2.7" stroke-linecap="round"/><path d="M732.5883382116824 949.1268313885256 L724 956 L734.5560253855805 959.093594682401" stroke="#C6A5ED" stroke-width="2.7" fill="none" stroke-linecap="round"/><rect x="532.5" y="965" width="375" height="64" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="720" y="994" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">HILBERT SPACE</text><text x="720" y="1018" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">complete inner-product space</text><text x="1245" y="739" fill="#C6A5ED" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Inner products</text><text x="1245" y="762" fill="#C6A5ED" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">imply norms;</text><text x="1245" y="785" fill="#C6A5ED" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">not conversely.</text><text x="86" y="777" fill="#99BFF1" text-anchor="start" font-family="Arial,sans-serif" font-size="17">Completeness</text><text x="86" y="801" fill="#99BFF1" text-anchor="start" font-family="Arial,sans-serif" font-size="17">is a property</text><text x="86" y="826" fill="#99BFF1" text-anchor="start" font-family="Arial,sans-serif" font-size="17">of the norm.</text></svg>