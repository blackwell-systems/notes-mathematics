<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 743" role="img" aria-labelledby="title desc"><title id="title">One underlying set, many kinds of structure</title><desc id="desc">A network begins with a set X and branches into orders, topologies, linear/vector structures, and measurable structures. Below order are lattices and complete lattices. Below topology are metric spaces and compactness as a condition; below linear structures are normed spaces and Banach or Hilbert spaces; below measurable structures are measures and probabilities. The lower caption explains that normed space relates linear and metric structures, while Hilbert combines inner product and Banach completeness.</desc><rect width="1320" height="743" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">One underlying set, many kinds of structure</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><text x="50" y="116" font-family="Arial,sans-serif" font-size="20" fill="#B9CFE0" font-weight="normal" text-anchor="start">Downward = additional structure or restriction, never an automatic or unique choice</text><rect x="557.5" y="136" width="205" height="56" rx="11" stroke="#F4BF77" stroke-width="2" fill="#173248"/><text x="660" y="172" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">SET X</text><line x1="660" y1="193" x2="190" y2="250" stroke="#C7B0F3" stroke-width="3"  stroke-linecap="round"/><path d="M200.40973017109454 244.03028327598335 L190 250 L201.53494150561326 253.3083416483308" stroke="#C7B0F3" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="55" y="260" width="270" height="56" rx="11" stroke="#C7B0F3" stroke-width="2" fill="#173248"/><text x="190" y="296" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">ORDER</text><line x1="660" y1="193" x2="501" y2="250" stroke="#94C2F2" stroke-width="3"  stroke-linecap="round"/><path d="M509.8274086664503 241.87123279731313 L501 250 L512.9813355084169 250.66902872490425" stroke="#94C2F2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="366" y="260" width="270" height="56" rx="11" stroke="#94C2F2" stroke-width="2" fill="#173248"/><text x="501" y="296" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">TOPOLOGY</text><line x1="660" y1="193" x2="819" y2="250" stroke="#79D7C2" stroke-width="3"  stroke-linecap="round"/><path d="M807.0186644915831 250.66902872490425 L819 250 L810.1725913335497 241.87123279731313" stroke="#79D7C2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="684" y="260" width="270" height="56" rx="11" stroke="#79D7C2" stroke-width="2" fill="#173248"/><text x="819" y="296" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">LINEAR</text><line x1="660" y1="193" x2="1130" y2="250" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M1118.4650584943868 253.3083416483308 L1130 250 L1119.5902698289055 244.03028327598335" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="995" y="260" width="270" height="56" rx="11" stroke="#F4BF77" stroke-width="2" fill="#173248"/><text x="1130" y="296" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">MEASURABLE</text><line x1="190" y1="317" x2="190" y2="374" stroke="#C7B0F3" stroke-width="3"  stroke-linecap="round"/><path d="M185.3269798922962 362.94726807196537 L190 374 L194.6730201077038 362.94726807196537" stroke="#C7B0F3" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="55" y="381" width="270" height="56" rx="11" stroke="#C7B0F3" stroke-width="2" fill="#173248"/><text x="190" y="417" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Lattice</text><line x1="190" y1="439" x2="190" y2="489" stroke="#C7B0F3" stroke-width="3"  stroke-linecap="round"/><path d="M185.3269798922962 477.94726807196537 L190 489 L194.6730201077038 477.94726807196537" stroke="#C7B0F3" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="55" y="498" width="270" height="56" rx="11" stroke="#C7B0F3" stroke-width="2" fill="#173248"/><text x="190" y="534" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Complete lattice</text><line x1="501" y1="317" x2="501" y2="374" stroke="#94C2F2" stroke-width="3"  stroke-linecap="round"/><path d="M496.3269798922962 362.94726807196537 L501 374 L505.6730201077038 362.94726807196537" stroke="#94C2F2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="366" y="381" width="270" height="56" rx="11" stroke="#94C2F2" stroke-width="2" fill="#173248"/><text x="501" y="417" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Metric space</text><line x1="501" y1="439" x2="501" y2="489" stroke="#94C2F2" stroke-width="3"  stroke-linecap="round"/><path d="M496.3269798922962 477.94726807196537 L501 489 L505.6730201077038 477.94726807196537" stroke="#94C2F2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="366" y="498" width="270" height="56" rx="11" stroke="#94C2F2" stroke-width="2" fill="#173248"/><text x="501" y="534" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Compact: property</text><line x1="819" y1="317" x2="819" y2="374" stroke="#79D7C2" stroke-width="3"  stroke-linecap="round"/><path d="M814.3269798922962 362.94726807196537 L819 374 L823.6730201077038 362.94726807196537" stroke="#79D7C2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="684" y="381" width="270" height="56" rx="11" stroke="#79D7C2" stroke-width="2" fill="#173248"/><text x="819" y="417" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Normed space</text><line x1="819" y1="439" x2="819" y2="489" stroke="#79D7C2" stroke-width="3"  stroke-linecap="round"/><path d="M814.3269798922962 477.94726807196537 L819 489 L823.6730201077038 477.94726807196537" stroke="#79D7C2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="684" y="498" width="270" height="56" rx="11" stroke="#79D7C2" stroke-width="2" fill="#173248"/><text x="819" y="534" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Banach / Hilbert</text><line x1="1130" y1="317" x2="1130" y2="374" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M1125.326979892296 362.94726807196537 L1130 374 L1134.673020107704 362.94726807196537" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="995" y="381" width="270" height="56" rx="11" stroke="#F4BF77" stroke-width="2" fill="#173248"/><text x="1130" y="417" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Measure space</text><line x1="1130" y1="439" x2="1130" y2="489" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M1125.326979892296 477.94726807196537 L1130 489 L1134.673020107704 477.94726807196537" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="995" y="498" width="270" height="56" rx="11" stroke="#F4BF77" stroke-width="2" fill="#173248"/><text x="1130" y="534" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="bold" text-anchor="middle">Probability space</text><rect x="350" y="604" width="620" height="75" rx="12" stroke="#456783" stroke-width="2" fill="#11283c"/><text x="660" y="632" font-family="Arial,sans-serif" font-size="22" fill="#F4BF77" font-weight="bold" text-anchor="middle">Cross-branch connections</text><text x="660" y="658" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Normed ⇒ metric + vector; Hilbert ⇒ Banach + inner product.</text><text x="660" y="706" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">The manifold branch is explored in its own diagram below.</text></svg>