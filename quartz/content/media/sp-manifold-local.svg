<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">From a circle to tangent vectors and lengths</title><desc id="desc">Three panels show the circle S1. In the first, a highlighted local arc is homeomorphic to an open real interval. In the second, a line tangent to the circle at the rightmost point supports a tangent vector, indicating smooth structure. In the third, a tangent vector is assigned length by an additional one-dimensional Riemannian inner product. No two-dimensional metric ellipse is drawn because a circle's tangent space has dimension one.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">From a circle to tangent vectors and lengths</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><rect x="44" y="114" width="388" height="494" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="465" y="114" width="389" height="494" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="887" y="114" width="387" height="494" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="68" y="160" font-family="Arial,sans-serif" font-size="23" fill="#F1F5FC" font-weight="normal" text-anchor="start">1  Topological chart</text><text x="488" y="160" font-family="Arial,sans-serif" font-size="23" fill="#F1F5FC" font-weight="normal" text-anchor="start">2  Smooth tangent</text><text x="910" y="160" font-family="Arial,sans-serif" font-size="22" fill="#F1F5FC" font-weight="normal" text-anchor="start">3  Riemannian length</text><circle cx="236" cy="340" r="120" stroke="#94C2F2" stroke-width="5" fill="none"/><path d="M345 290 A120 120 0 0 1 262 457" stroke="#79D7C2" stroke-width="9" fill="none" stroke-linecap="round"/><text x="236" y="506" font-family="Arial,sans-serif" font-size="18" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Short arcs resemble open intervals</text><circle cx="658" cy="340" r="119" stroke="#94C2F2" stroke-width="4" fill="none"/><line x1="777" y1="210" x2="777" y2="480" stroke="#C7B0F3" stroke-width="4"  stroke-linecap="round"/><circle cx="777" cy="340" r="8" fill="#F4BF77"/><line x1="777" y1="339" x2="777" y2="260" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M781.6730201077038 271.05273192803463 L777 260 L772.3269798922962 271.05273192803463" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><text x="639" y="506" font-family="Arial,sans-serif" font-size="18" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Tangent line is 1-dimensional</text><circle cx="1081" cy="340" r="118" stroke="#94C2F2" stroke-width="4" fill="none"/><line x1="1199" y1="225" x2="1199" y2="456" stroke="#79D7C2" stroke-width="4"  stroke-linecap="round"/><circle cx="1199" cy="340" r="8" fill="#F4BF77"/><line x1="1199" y1="342" x2="1199" y2="268" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M1203.673020107704 279.05273192803463 L1199 268 L1194.326979892296 279.05273192803463" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M1179 340 L1181 268 M1173 340 L1186 340 M1173 268 L1186 268" stroke="#F4BF77" stroke-width="3" fill="none"/><text x="1091" y="506" font-family="Arial,sans-serif" font-size="18" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Tangent lengths need a metric</text><text x="661" y="664" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">A 1D tangent space has lengths, not a 2D metric ellipse.</text></svg>