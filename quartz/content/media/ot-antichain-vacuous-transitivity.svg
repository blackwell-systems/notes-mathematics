<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 475" role="img" aria-labelledby="title desc">
<title id="title">A whole poset can be an antichain: how transitivity still holds</title>
<desc id="desc">Three vertices a, b, and c have only self-loops, representing the relation consisting of (a,a), (b,b), and (c,c). The graph has no arrows between distinct vertices. The right panel explains that self-comparisons satisfy transitivity directly and that a supposed two-step chain involving distinct vertices cannot meet transitivity's premises, so those cases are vacuously true.</desc>
<defs><marker id="self-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#EABD70"/></marker></defs>
<rect width="1320" height="475" fill="#101A2C"/>
<text x="660" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F4F3ED">An antichain can still be a poset</text>
<text x="660" y="94" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#CBD5E2">The entire set is incomparable except for self-comparisons</text>
<rect x="24" y="121" width="721" height="324" rx="22" fill="#19283A" stroke="#536580" stroke-width="2"/>
<text x="384" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#92D9DB">THE RELATION</text>
<text x="384" y="194" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#F4F3ED">R = {(a,a), (b,b), (c,c)}</text>
<path d="M 153 248 C 101 184, 245 184, 193 248" fill="none" stroke="#EABD70" stroke-width="4" stroke-linecap="round" marker-end="url(#self-arrow)"/>
<circle cx="173" cy="288" r="44" fill="#164650" stroke="#78D9CE" stroke-width="4"/>
<text x="173" y="298" text-anchor="middle" fill="#F4F3ED" font-family="Georgia,serif" font-size="32" font-weight="bold">a</text>
<path d="M 364 248 C 312 184, 456 184, 404 248" fill="none" stroke="#EABD70" stroke-width="4" stroke-linecap="round" marker-end="url(#self-arrow)"/>
<circle cx="384" cy="288" r="44" fill="#164650" stroke="#78D9CE" stroke-width="4"/>
<text x="384" y="298" text-anchor="middle" fill="#F4F3ED" font-family="Georgia,serif" font-size="32" font-weight="bold">b</text>
<path d="M 575 248 C 523 184, 667 184, 615 248" fill="none" stroke="#EABD70" stroke-width="4" stroke-linecap="round" marker-end="url(#self-arrow)"/>
<circle cx="595" cy="288" r="44" fill="#164650" stroke="#78D9CE" stroke-width="4"/>
<text x="595" y="298" text-anchor="middle" fill="#F4F3ED" font-family="Georgia,serif" font-size="32" font-weight="bold">c</text>
<text x="384" y="381" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#F4F3ED">Each vertex relates only to itself.</text>
<text x="384" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#CBD5E2">No arrows connect distinct vertices.</text>
<rect x="769" y="121" width="527" height="324" rx="22" fill="#19283A" stroke="#536580" stroke-width="2"/>
<text x="1032" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" fill="#92D9DB">TRANSITIVITY CHECK</text>
<rect x="790" y="187" width="485" height="103" rx="14" fill="#142B36" stroke="#56AFA8" stroke-width="1.5"/>
<text x="814" y="217" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#78D9CE">SELF-COMPARISON</text>
<text x="814" y="248" font-family="Georgia,serif" font-size="24" fill="#F4F3ED">aRa and aRa  ⇒  aRa</text>
<text x="814" y="275" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#CBD5E2">The conclusion holds directly.</text>
<rect x="790" y="306" width="485" height="118" rx="14" fill="#2A253B" stroke="#BA9AE8" stroke-width="1.5"/>
<text x="814" y="335" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#C6AEF0">DISTINCT VERTICES</text>
<text x="814" y="365" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#F4F3ED">No two-step comparison can start.</text>
<text x="814" y="393" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#CBD5E2">Premise false ⇒ conditional true</text>
<text x="814" y="413" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#C6AEF0">(vacuous truth)</text>
</svg>