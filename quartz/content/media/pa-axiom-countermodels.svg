<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" width="800" height="810" role="img" aria-labelledby="title desc">
  <title id="title">Why each Peano condition matters</title>
  <desc id="desc">Three mathematical countermodels in the site’s dark diagram style. First, a successor cycle through zero violates the no-predecessor rule. Second, two elements sharing the same successor violate injectivity. Third, a separate bi-infinite chain violates full induction even though zero has no predecessor and successor is injective.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker>
  </defs>
  <rect width="800" height="810" fill="#101A2C"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="start">
    <text id="head" x="40" y="54" fill="#F4F3ED" font-size="35" font-weight="750">Why the Peano conditions matter</text>
    <text x="40" y="89" fill="#C4CEDA" font-size="21" font-weight="550">Remove one rule and a different structure becomes possible.</text>
    <path d="M40 108 H760" stroke="#45576F" stroke-width="2"/>

    <rect x="40" y="138" width="720" height="188" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
    <rect x="40" y="138" width="6" height="188" rx="3" fill="#EDB86D"/>
    <text x="64" y="178" fill="#EDB86D" font-size="25" font-weight="750">Zero is not a successor</text>
    <text x="64" y="210" fill="#C4CEDA" font-size="19" font-weight="500">Without this axiom, counting can loop.</text>
    <text x="64" y="269" fill="#F4F3ED" font-size="23" font-weight="650">S(0) = 1, S(1) = 0</text>
    <text x="64" y="302" fill="#C4CEDA" font-size="17">Injectivity and induction still hold.</text>

    <path d="M540 229 C564 193 614 193 634 229" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
    <path d="M634 270 C610 307 566 307 540 270" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
    <circle cx="520" cy="249" r="30" fill="#223349" stroke="#EDB86D" stroke-width="3"/>
    <circle cx="654" cy="249" r="30" fill="#223349" stroke="#66C4B4" stroke-width="3"/>
    <text x="520" y="259" fill="#F4F3ED" font-size="30" font-weight="760" text-anchor="middle">0</text>
    <text x="654" y="259" fill="#F4F3ED" font-size="30" font-weight="760" text-anchor="middle">1</text>

    <rect x="40" y="344" width="720" height="188" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
    <rect x="40" y="344" width="6" height="188" rx="3" fill="#66C4B4"/>
    <text x="64" y="384" fill="#66C4B4" font-size="25" font-weight="750">Successor is injective</text>
    <text x="64" y="416" fill="#C4CEDA" font-size="19" font-weight="500">Without this axiom, two inputs merge.</text>
    <text x="64" y="473" fill="#F4F3ED" font-size="23" font-weight="650">S(0) = 1, S(1) = 1</text>
    <text x="64" y="507" fill="#C4CEDA" font-size="17">Zero is excluded; induction still holds.</text>

    <path d="M550 448 H620" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
    <path d="M676 427 C738 389 745 506 676 469" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
    <circle cx="520" cy="448" r="30" fill="#223349" stroke="#EDB86D" stroke-width="3"/>
    <circle cx="654" cy="448" r="30" fill="#223349" stroke="#66C4B4" stroke-width="3"/>
    <text x="520" y="458" fill="#F4F3ED" font-size="30" font-weight="760" text-anchor="middle">0</text>
    <text x="654" y="458" fill="#F4F3ED" font-size="30" font-weight="760" text-anchor="middle">1</text>

    <rect x="40" y="550" width="720" height="206" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
    <rect x="40" y="550" width="6" height="206" rx="3" fill="#BCA8EC"/>
    <text x="64" y="590" fill="#BCA8EC" font-size="25" font-weight="750">Full induction</text>
    <text x="64" y="622" fill="#C4CEDA" font-size="19" font-weight="500">An extra chain can remain unreachable.</text>
    <text x="64" y="690" fill="#F4F3ED" font-size="21" font-weight="600">Two separate chains</text>
    <text x="64" y="721" fill="#C4CEDA" font-size="17">The lower chain never joins the upper.</text>

    <path d="M505 621 H536 M584 621 H614 M662 621 H693" fill="none" stroke="#87B8EE" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr)"/>
    <circle cx="482" cy="621" r="24" fill="#223349" stroke="#EDB86D" stroke-width="2.5"/>
    <circle cx="560" cy="621" r="24" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <circle cx="638" cy="621" r="24" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <text x="482" y="629" fill="#F4F3ED" font-size="23" font-weight="740" text-anchor="middle">0</text>
    <text x="560" y="629" fill="#F4F3ED" font-size="23" font-weight="740" text-anchor="middle">1</text>
    <text x="638" y="629" fill="#F4F3ED" font-size="23" font-weight="740" text-anchor="middle">2</text>
    <text x="716" y="629" fill="#C4CEDA" font-size="27" text-anchor="middle">…</text>

    <text x="452" y="711" fill="#C4CEDA" font-size="26" text-anchor="middle">…</text>
    <path d="M480 703 H496 M541 703 H566 M614 703 H642 M690 703 H706" fill="none" stroke="#87B8EE" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr)"/>
    <circle cx="520" cy="703" r="23" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <circle cx="590" cy="703" r="23" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <circle cx="666" cy="703" r="23" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <text x="520" y="710" fill="#F4F3ED" font-size="19" font-weight="700" text-anchor="middle">a₋₁</text>
    <text x="590" y="710" fill="#F4F3ED" font-size="19" font-weight="700" text-anchor="middle">a₀</text>
    <text x="666" y="710" fill="#F4F3ED" font-size="19" font-weight="700" text-anchor="middle">a₁</text>
    <text x="730" y="711" fill="#C4CEDA" font-size="26" text-anchor="middle">…</text>

    <text x="40" y="797" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text>
  </g>
</svg>