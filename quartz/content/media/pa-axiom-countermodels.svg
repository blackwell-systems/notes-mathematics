<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to break a Peano condition</title>
  <desc id="desc">Left: zero and one form a cycle, violating the rule that zero is not a successor. Center: zero maps to one and one maps to itself, violating successor injectivity. Right: an extra successor chain is disconnected from the chain beginning at zero, violating full induction.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#87B8EE" stroke-width="1.8" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="530" fill="#101A2C"/>
  <text x="40" y="53" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#F4F3ED">Why the Peano conditions matter</text>
  <text x="40" y="86" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#C4CEDA">Remove one condition, and an unintended number system becomes possible.</text>
  <path d="M40 105 H1160" stroke="#45576F" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="40" y="124" width="360" height="376" rx="15" fill="#18283C" stroke="#45576F"/>
    <text x="62" y="165" font-size="24" font-weight="700" fill="#F4F3ED">A cycle through zero</text>
    <text x="62" y="198" font-size="18" fill="#EDB86D">Drop: zero is not a successor</text>
    <path d="M179 265 C203 213 256 213 258 265" stroke="#87B8EE" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M257 315 C238 367 188 367 179 315" stroke="#87B8EE" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
    <circle cx="150" cy="291" r="29" fill="#223349" stroke="#EDB86D" stroke-width="3"/>
    <circle cx="287" cy="291" r="29" fill="#223349" stroke="#66C4B4" stroke-width="3"/>
    <text x="150" y="299" font-size="27" text-anchor="middle" font-weight="700" fill="#F4F3ED">0</text>
    <text x="287" y="299" font-size="27" text-anchor="middle" font-weight="700" fill="#F4F3ED">1</text>
    <text x="62" y="422" font-size="20" fill="#F4F3ED">S(0) = 1,  S(1) = 0</text>
    <text x="62" y="455" font-size="17" fill="#C4CEDA">Injectivity and induction still hold.</text>

    <rect x="420" y="124" width="360" height="376" rx="15" fill="#18283C" stroke="#45576F"/>
    <text x="442" y="165" font-size="24" font-weight="700" fill="#F4F3ED">Two inputs merge</text>
    <text x="442" y="198" font-size="18" fill="#EDB86D">Drop: successor injectivity</text>
    <path d="M554 291 H621" stroke="#87B8EE" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M674 269 C728 220 735 364 675 315" stroke="#87B8EE" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
    <circle cx="525" cy="291" r="29" fill="#223349" stroke="#EDB86D" stroke-width="3"/>
    <circle cx="650" cy="291" r="29" fill="#223349" stroke="#66C4B4" stroke-width="3"/>
    <text x="525" y="299" font-size="27" text-anchor="middle" font-weight="700" fill="#F4F3ED">0</text>
    <text x="650" y="299" font-size="27" text-anchor="middle" font-weight="700" fill="#F4F3ED">1</text>
    <text x="442" y="422" font-size="20" fill="#F4F3ED">S(0) = 1,  S(1) = 1</text>
    <text x="442" y="455" font-size="17" fill="#C4CEDA">Zero is not a successor; induction holds.</text>

    <rect x="800" y="124" width="360" height="376" rx="15" fill="#18283C" stroke="#45576F"/>
    <text x="822" y="165" font-size="24" font-weight="700" fill="#F4F3ED">An unreachable chain</text>
    <text x="822" y="198" font-size="18" fill="#EDB86D">Drop: full induction</text>
    <path d="M878 272 H912 M960 272 H994 M1042 272 H1090" stroke="#87B8EE" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <circle cx="856" cy="272" r="22" fill="#223349" stroke="#EDB86D" stroke-width="2.5"/>
    <circle cx="938" cy="272" r="22" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <circle cx="1020" cy="272" r="22" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <g font-size="21" fill="#F4F3ED" text-anchor="middle"><text x="856" y="279">0</text><text x="938" y="279">1</text><text x="1020" y="279">2</text><text x="1114" y="280">…</text></g>
    <path d="M873 355 H904 M974 355 H1018 M1083 355 H1111" stroke="#87B8EE" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="850" y="363" font-size="22" fill="#F4F3ED" text-anchor="middle">…</text>
    <circle cx="940" cy="355" r="33" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <circle cx="1050" cy="355" r="33" fill="#223349" stroke="#66C4B4" stroke-width="2.5"/>
    <g font-size="21" fill="#F4F3ED" text-anchor="middle"><text x="940" y="363">a₀</text><text x="1050" y="363">a₁</text><text x="1132" y="362">…</text></g>
    <text x="822" y="422" font-size="19" fill="#F4F3ED">The second chain is never reached</text>
    <text x="822" y="455" font-size="17" fill="#C4CEDA">by taking successors of zero.</text>
  </g>
</svg>
