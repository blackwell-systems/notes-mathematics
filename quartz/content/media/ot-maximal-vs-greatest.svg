<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc"><title id="title">Maximal versus greatest in two finite posets</title><desc id="desc">Two side-by-side Hasse diagrams. Left: a and b are incomparable top elements above m, hence both maximal and no greatest element exists. Right: g sits above a and b, which sit above m; g is greatest and therefore maximal.</desc><rect width="1180" height="660" fill="#0c1428"/><text x="590" y="57" fill="#f7f4ff" font-size="40" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">Maximal is not the same as greatest</text><text x="590" y="93" fill="#cbd5ed" font-size="22" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A maximal element has nothing strictly above it; a greatest element is above everything.</text><rect x="35" y="124" width="530" height="505" rx="22" fill="#172744" stroke="#7396ca" stroke-width="2.5"/><rect x="615" y="124" width="530" height="505" rx="22" fill="#172744" stroke="#7396ca" stroke-width="2.5"/><text x="300" y="176" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">Two maximal elements</text><text x="880" y="176" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">One greatest element</text><path d="M300 486 L200 316" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M300 486 L400 316" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="486" r="32" fill="#293858" stroke="#99add1" stroke-width="4"/><text x="300" y="496" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">m</text><circle cx="200" cy="316" r="36" fill="#185761" stroke="#79e5d6" stroke-width="4"/><text x="200" y="326" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">a</text><circle cx="400" cy="316" r="36" fill="#185761" stroke="#79e5d6" stroke-width="4"/><text x="400" y="326" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">b</text><text x="300" y="550" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">a and b are both maximal.</text><text x="300" y="586" fill="#cbd5ed" font-size="21" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Neither lies above the other.</text><path d="M880 506 L780 392" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M880 506 L980 392" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M780 392 L880 263" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M980 392 L880 263" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><circle cx="880" cy="506" r="32" fill="#293858" stroke="#99add1" stroke-width="4"/><text x="880" y="516" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">m</text><circle cx="780" cy="392" r="32" fill="#293858" stroke="#99add1" stroke-width="4"/><text x="780" y="402" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">a</text><circle cx="980" cy="392" r="32" fill="#293858" stroke="#99add1" stroke-width="4"/><text x="980" y="402" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">b</text><circle cx="880" cy="263" r="36" fill="#62501c" stroke="#f1cb74" stroke-width="4"/><text x="880" y="273" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">g</text><text x="880" y="550" fill="#f7f4ff" font-size="21" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">g is above every other element.</text><text x="880" y="586" fill="#cbd5ed" font-size="21" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">So g is greatest and maximal.</text></svg>
