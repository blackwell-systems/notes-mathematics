<text x="54" y="312" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#cbd5e9" font-weight="normal">Prediction p</text>
<text x="54" y="385" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#cbd5e9" font-weight="normal">Residual X − p</text>
