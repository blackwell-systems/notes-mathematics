<text x="50" y="489" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#a1f8e9" font-weight="normal">Odd faces: (1 + 3 + 5) / 3 = 3</text>
<text x="649" y="489" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#dec1fb" font-weight="normal">Even faces: (2 + 4 + 6) / 3 = 4</text>
<text x="50" y="549" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#fff" font-weight="normal">r = X − p = (−2, −2, 0, 0, 2, 2)</text>
<text x="50" y="587" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f7d9a2" font-weight="normal">For every z = (a,b,a,b,a,b),  r · z = 0</text></svg>
