<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Orthogonal projection onto parity-based predictions</title><desc id="desc">For six equally likely die faces, predicting only from parity yields vector p=(3,4,3,4,3,4). Residual r=(-2,-2,0,0,2,2) is orthogonal to every parity-based prediction z=(a,b,a,b,a,b). Odd faces share mean three and even faces mean four.</desc><rect width="1200" height="620" fill="#101a32"/><text x="40" y="57" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#fff" font-weight="bold">Parity turns averaging into projection</text>
<text x="40" y="90" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#cbd5e9" font-weight="normal">The allowed prediction must be constant within each parity group.</text>
