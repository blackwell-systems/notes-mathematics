<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Deformation retraction preserves the essential loop</title><desc id="desc">Three panels show the punctured plane, radial motion toward the circle, and the fixed unit circle, with r(x)=x/norm(x) and a homotopy that never reaches the deleted origin.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">Deformation retraction preserves the essential loop</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">A point moves along its ray to the unit circle without passing through the origin.</text><rect x="45" y="139" width="370" height="470" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="69" y="182" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">1. Punctured plane</text><line x1="67" y1="198" x2="393" y2="198" stroke="#4C6685" stroke-width="1.5" /><rect x="455" y="139" width="370" height="470" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="479" y="182" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">2. Radial motion</text><line x1="477" y1="198" x2="803" y2="198" stroke="#4C6685" stroke-width="1.5" /><rect x="865" y="139" width="370" height="470" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="889" y="182" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">3. Unit circle</text><line x1="887" y1="198" x2="1213" y2="198" stroke="#4C6685" stroke-width="1.5" /><line x1="101" y1="366" x2="359" y2="366" stroke="#4C6685" stroke-width="2" /><line x1="230" y1="244" x2="230" y2="488" stroke="#4C6685" stroke-width="2" /><circle cx="230" cy="366" r="7" fill="#0C1E30" stroke="#F0BD75" stroke-width="2"/><line x1="511" y1="366" x2="769" y2="366" stroke="#4C6685" stroke-width="2" /><line x1="640" y1="244" x2="640" y2="488" stroke="#4C6685" stroke-width="2" /><circle cx="640" cy="366" r="7" fill="#0C1E30" stroke="#F0BD75" stroke-width="2"/><line x1="921" y1="366" x2="1179" y2="366" stroke="#4C6685" stroke-width="2" /><line x1="1050" y1="244" x2="1050" y2="488" stroke="#4C6685" stroke-width="2" /><circle cx="1050" cy="366" r="7" fill="#0C1E30" stroke="#F0BD75" stroke-width="2"/><circle cx="334" cy="366" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="303.53910524340097" cy="292.46089475659903" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="220.93580275424355" cy="262.39575139845846" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="135.7439901481884" cy="322.0477007789673" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="135.7439901481884" cy="409.9522992210327" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="229.99999999999997" cy="470" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="303.5391052434009" cy="439.53910524340097" r="4" fill="#9AC4F3" stroke="#9AC4F3" stroke-width="1"/><circle cx="230" cy="366" r="18" fill="#0C1E30" stroke="#F2A7AC" stroke-width="3"/><text x="230" y="527" font-family="Georgia,serif" font-size="23" fill="#F2A7AC" text-anchor="middle" font-weight="400">origin removed</text><circle cx="640" cy="366" r="116" fill="none" stroke="#7DD9C9" stroke-width="4"/><circle cx="640" cy="366" r="17" fill="#0C1E30" stroke="#F2A7AC" stroke-width="2"/><circle cx="716" cy="280" r="10" fill="#F0BD75" stroke="#F0BD75" stroke-width="2"/><path d="M775.1 288.0 L743.1 306.5" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640.0 210.0 L640.0 247.0" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M512.2 276.5 L542.5 297.7" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520.5 466.3 L548.8 442.5" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M718.0 501.1 L699.5 469.1" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1050" cy="366" r="116" fill="none" stroke="#7DD9C9" stroke-width="5"/><circle cx="1050" cy="366" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="1"/><circle cx="1126" cy="280" r="9" fill="#F0BD75" stroke="#F0BD75" stroke-width="2"/><text x="1050" y="540" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">points on S¹ stay fixed</text><text x="640" y="573" font-family="Georgia,serif" font-size="27" fill="#F0BD75" text-anchor="middle" font-weight="400">r(x) = x / ‖x‖</text><rect x="58" y="632" width="1164" height="64" rx="15" fill="#223145" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="673" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">H(x,t) = ((1−t) + t/‖x‖)x    —    the scale remains positive for x ≠ 0</text></svg>