<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 521" width="800" height="521" role="img" aria-labelledby="title desc"><title id="title">Compactness: finite subcovers</title><desc id="desc">A closed interval with several overlapping open neighborhoods chosen to cover it, illustrating the finite-subcover condition of compactness.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="521" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Compactness: finite subcovers</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A finite selection suffices from any open cover.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><line x1="120" y1="381" x2="685" y2="381" stroke="#F4F5EF" stroke-width="3" /><rect x="119" y="190" width="120" height="32" rx="16" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><rect x="199" y="244" width="150" height="32" rx="16" stroke="#91BFF6" fill="#1C2B40" stroke-width="2.5"/><rect x="326" y="298" width="181" height="32" rx="16" stroke="#C7B6F4" fill="#1C2B40" stroke-width="2.5"/><rect x="457" y="352" width="218" height="32" rx="16" stroke="#F4C474" fill="#1C2B40" stroke-width="2.5"/><text x="400" y="450" fill="#F4F5EF" font-size="22" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">finitely many opens still cover [0,1]</text><text x="40" y="502" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>