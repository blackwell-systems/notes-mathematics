<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">An open cover contains a finite subcover</title><desc id="desc">Five open intervals U1 to U5 cover the closed amber interval from a to b. The selected members U1, U2, U3 are themselves among those five original sets, and their overlapping union covers the entire closed interval including endpoints.</desc><rect width="1280" height="640" rx="16" fill="#0C1E30"/><text x="42" y="61" font-family="Arial,sans-serif" font-size="35" fill="#F2F7FC" text-anchor="start" font-weight="bold">An open cover contains a finite subcover</text><line x1="42" y1="86" x2="1238" y2="86" stroke="#45627B" stroke-width="2" stroke-linecap="round"/><rect x="42" y="110" width="1196" height="451" rx="13" fill="#162F45" stroke="#46617B" stroke-width="2"/><text x="68" y="150" font-family="Arial,sans-serif" font-size="23" fill="#F2F7FC" text-anchor="start" font-weight="normal">One illustrated open cover (five sets)</text><line x1="240" y1="185" x2="560" y2="185" stroke="#72D4C0" stroke-width="7" stroke-linecap="round"/><circle cx="240" cy="185" r="7" fill="#0C1E30" stroke="#72D4C0" stroke-width="2.8"/><circle cx="560" cy="185" r="7" fill="#0C1E30" stroke="#72D4C0" stroke-width="2.8"/><text x="1125" y="191" font-family="Arial,sans-serif" font-size="18" fill="#72D4C0" text-anchor="start" font-weight="normal">U₁</text><line x1="500" y1="223" x2="780" y2="223" stroke="#C5ACEF" stroke-width="7" stroke-linecap="round"/><circle cx="500" cy="223" r="7" fill="#0C1E30" stroke="#C5ACEF" stroke-width="2.8"/><circle cx="780" cy="223" r="7" fill="#0C1E30" stroke="#C5ACEF" stroke-width="2.8"/><text x="1125" y="229" font-family="Arial,sans-serif" font-size="18" fill="#C5ACEF" text-anchor="start" font-weight="normal">U₂</text><line x1="728" y1="261" x2="1045" y2="261" stroke="#91BEED" stroke-width="7" stroke-linecap="round"/><circle cx="728" cy="261" r="7" fill="#0C1E30" stroke="#91BEED" stroke-width="2.8"/><circle cx="1045" cy="261" r="7" fill="#0C1E30" stroke="#91BEED" stroke-width="2.8"/><text x="1125" y="267" font-family="Arial,sans-serif" font-size="18" fill="#91BEED" text-anchor="start" font-weight="normal">U₃</text><line x1="310" y1="299" x2="493" y2="299" stroke="#BDD0E1" stroke-width="7" stroke-linecap="round"/><circle cx="310" cy="299" r="7" fill="#0C1E30" stroke="#BDD0E1" stroke-width="2.8"/><circle cx="493" cy="299" r="7" fill="#0C1E30" stroke="#BDD0E1" stroke-width="2.8"/><text x="1125" y="305" font-family="Arial,sans-serif" font-size="18" fill="#BDD0E1" text-anchor="start" font-weight="normal">U₄</text><line x1="600" y1="337" x2="880" y2="337" stroke="#BDD0E1" stroke-width="7" stroke-linecap="round"/><circle cx="600" cy="337" r="7" fill="#0C1E30" stroke="#BDD0E1" stroke-width="2.8"/><circle cx="880" cy="337" r="7" fill="#0C1E30" stroke="#BDD0E1" stroke-width="2.8"/><text x="1125" y="343" font-family="Arial,sans-serif" font-size="18" fill="#BDD0E1" text-anchor="start" font-weight="normal">U₅</text><line x1="175" y1="443" x2="1083" y2="443" stroke="#91AFC8" stroke-width="2" stroke-linecap="round"/><line x1="265" y1="443" x2="1005" y2="443" stroke="#F1BD73" stroke-width="7" stroke-linecap="round"/><circle cx="265" cy="443" r="7" fill="#F1BD73"/><circle cx="1005" cy="443" r="7" fill="#F1BD73"/><text x="265" y="472" font-family="Arial,sans-serif" font-size="16" fill="#F2F7FC" text-anchor="middle" font-weight="normal">a</text><text x="1005" y="472" font-family="Arial,sans-serif" font-size="16" fill="#F2F7FC" text-anchor="middle" font-weight="normal">b</text><text x="70" y="535" font-family="Arial,sans-serif" font-size="20" fill="#F2F7FC" text-anchor="start" font-weight="normal">The highlighted interval [a,b] lies inside U₁ ∪ U₂ ∪ U₃.</text><text x="640" y="604" font-family="Arial,sans-serif" font-size="22" fill="#F1BD73" text-anchor="middle" font-weight="bold">The selected sets must belong to the ORIGINAL cover.</text></svg>