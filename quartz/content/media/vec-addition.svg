<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Add vectors: place them tip to tail</title><desc id="desc">The sum of vectors u=(3,4) and v=(1,2) is (4,6): blue u goes from the origin to (3,4); red v is moved to start at u's tip, reaching (4,6), while green resultant points directly from origin to (4,6).</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Add vectors: place them tip to tail</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="131" width="732" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="132" width="730" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="406" y="167" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Tip-to-tail construction</text><line x1="52" y1="186" x2="760" y2="186" stroke="#87B8EE" stroke-width="1.4" /><rect x="797" y="131" width="360" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="798" y="132" width="358" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="977" y="167" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Why it works</text><line x1="809" y1="186" x2="1145" y2="186" stroke="#BCA8EC" stroke-width="1.4" /><rect x="142" y="211" width="492" height="325" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="186.72727272727272" y1="211" x2="186.72727272727272" y2="536" stroke="#40536B" stroke-width="2" /><line x1="276.1818181818182" y1="211" x2="276.1818181818182" y2="536" stroke="#40536B" stroke-width="1" /><line x1="365.6363636363636" y1="211" x2="365.6363636363636" y2="536" stroke="#40536B" stroke-width="1" /><line x1="455.09090909090907" y1="211" x2="455.09090909090907" y2="536" stroke="#40536B" stroke-width="1" /><line x1="544.5454545454545" y1="211" x2="544.5454545454545" y2="536" stroke="#40536B" stroke-width="1" /><line x1="634" y1="211" x2="634" y2="536" stroke="#40536B" stroke-width="1" /><line x1="142" y1="514.3333333333334" x2="634" y2="514.3333333333334" stroke="#40536B" stroke-width="2" /><line x1="142" y1="471" x2="634" y2="471" stroke="#40536B" stroke-width="1" /><line x1="142" y1="427.6666666666667" x2="634" y2="427.6666666666667" stroke="#40536B" stroke-width="1" /><line x1="142" y1="384.33333333333337" x2="634" y2="384.33333333333337" stroke="#40536B" stroke-width="1" /><line x1="142" y1="341" x2="634" y2="341" stroke="#40536B" stroke-width="1" /><line x1="142" y1="297.66666666666663" x2="634" y2="297.66666666666663" stroke="#40536B" stroke-width="1" /><line x1="142" y1="254.33333333333331" x2="634" y2="254.33333333333331" stroke="#40536B" stroke-width="1" /><line x1="142" y1="211" x2="634" y2="211" stroke="#40536B" stroke-width="1" /><line x1="186.72727272727272" y1="514.3333333333334" x2="455.09090909090907" y2="341" stroke="#87B8EE" stroke-width="4" marker-end="url(#arr-blue)" stroke-linecap="round"/><line x1="455.09090909090907" y1="341" x2="544.5454545454545" y2="254.33333333333331" stroke="#F28D95" stroke-width="4" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="186.72727272727272" y1="514.3333333333334" x2="544.5454545454545" y2="254.33333333333331" stroke="#98D5A3" stroke-width="5" marker-end="url(#arr-green)" stroke-linecap="round"/><line x1="186.72727272727272" y1="514.3333333333334" x2="276.1818181818182" y2="427.6666666666667" stroke="#F28D95" stroke-width="2" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="276.1818181818182" y1="427.6666666666667" x2="544.5454545454545" y2="254.33333333333331" stroke="#63748B" stroke-width="2" stroke-dasharray="7 6"/><text x="279" y="355" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">u = (3,4)</text><text x="551" y="302" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">v = (1,2)</text><text x="976" y="255" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">u = (3,4)</text><text x="976" y="319" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">v = (1,2)</text><text x="976" y="398" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle">u + v = (4,6)</text><text x="976" y="478" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">The green arrow is the sum</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">u + v = (3,4) + (1,2) = (4,6)</text></svg>