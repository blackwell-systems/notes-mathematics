<svg xmlns="http://www.w3.org/2000/svg" width="800" height="553" viewBox="0 0 800 553" role="img" aria-labelledby="title desc"><title id="title">Adjoin a missing root</title><desc id="desc">Field extension diagram: the polynomial ring K[x] maps to K[x]/(f), where the class alpha of x satisfies f(alpha)=0. If f is irreducible, the quotient is a field.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="553" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Adjoin a missing root</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">An irreducible polynomial defines a field quotient.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="61" y="160" width="288" height="123" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><rect x="450" y="160" width="288" height="123" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="205" y="216" fill="#66C4B4" font-size="36" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">K[x]</text><text x="594" y="216" fill="#BCA8EC" font-size="35" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">K[x] / (f)</text><line x1="360" y1="220" x2="437" y2="220" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="400" y="189" fill="#EDB86D" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">quotient</text><rect x="135" y="338" width="530" height="104" rx="16" fill="#223349" stroke="#EDB86D" stroke-width="2"/><text x="400" y="379" fill="#F4F3ED" font-size="29" font-weight="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α = x + (f)</text><text x="400" y="416" fill="#66C4B4" font-size="28" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">f(α) = 0</text><text x="400" y="501" fill="#C4CEDA" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">If f is irreducible, this quotient is a field.</text><text x="40" y="535" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>