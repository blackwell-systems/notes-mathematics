<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Cylindrical coordinates add height to polar coordinates</title><desc id="desc">Cylinder with a radial vertical wedge illustrating horizontal radius r, azimuth theta, vertical height z and volume element r dr dtheta dz.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" fill="#F4F5FB" font-size="38" font-family="Georgia,serif" text-anchor="middle">Cylindrical coordinates add height to polar coordinates</text><text x="640" y="102" fill="#C1D0DF" font-size="22" font-family="Georgia,serif" text-anchor="middle">The factor r is still required for local volume.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#506B80" stroke-width="2" /><rect x="51" y="155" width="1178" height="469" rx="17" fill="#1A3148" stroke="#7DD9C9" stroke-width="2.5"/><ellipse cx="399" cy="316" rx="178" ry="63" fill="#335E64" fill-opacity=".72" stroke="#7DD9C9" stroke-width="4"/><path d="M221 316 V507 A178 63 0 0 0 577 507 V316" fill="#264A5C" fill-opacity=".57" stroke="#7DD9C9" stroke-width="4"/><path d="M221 507 A178 63 0 0 0 577 507" fill="none" stroke="#7DD9C9" stroke-width="4"/><path d="M399 316 L540 287 L540 482 L399 507 Z" fill="#C6A5ED" fill-opacity=".44" stroke="#F1BD75" stroke-width="3"/><text x="866" y="258" fill="#7DD9C9" font-size="28" font-family="Georgia,serif" text-anchor="middle">r : horizontal radius</text><text x="866" y="326" fill="#C6A5ED" font-size="28" font-family="Georgia,serif" text-anchor="middle">θ : azimuth</text><text x="866" y="395" fill="#F1BD75" font-size="28" font-family="Georgia,serif" text-anchor="middle">z : height</text><text x="866" y="501" fill="#F4F5FB" font-size="31" font-family="Georgia,serif" text-anchor="middle">dV = r dr dθ dz</text><rect x="116" y="644" width="1048" height="61" rx="17" fill="#1A3148" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="683" fill="#F4F5FB" font-size="25" font-family="Georgia,serif" text-anchor="middle">A polar area patch extended vertically gives volume.</text></svg>