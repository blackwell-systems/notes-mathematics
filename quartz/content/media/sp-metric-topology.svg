<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">The same topology can come from different metrics</title><desc id="desc">Two real number lines display the same open interval minus one to one as metric balls centered at zero. The usual absolute-value metric uses radius one; the arctangent-induced metric uses radius pi over four. These metrics induce the same topology on the real line, but the usual metric is complete while the arctangent metric is incomplete because n tends to infinity without a finite arctangent-limit point.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">The same topology can come from different metrics</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><rect x="45" y="119" width="596" height="486" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="676" y="119" width="596" height="486" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="73" y="169" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Usual metric</text><text x="73" y="205" font-family="Arial,sans-serif" font-size="24" fill="#94C2F2" font-weight="normal" text-anchor="start">d(x,y) = |x-y|</text><text x="703" y="169" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Arctangent metric</text><text x="703" y="205" font-family="Arial,sans-serif" font-size="22" fill="#79D7C2" font-weight="normal" text-anchor="start">ρ(x,y) = |arctan x - arctan y|</text><line x1="117" y1="314" x2="577" y2="314" stroke="#B9CFE0" stroke-width="2"  stroke-linecap="round"/><line x1="287" y1="314" x2="627" y2="314" stroke="#94C2F2" stroke-width="10"  stroke-linecap="round"/><circle cx="287" cy="314" r="7" fill="#0C1E30" stroke="#94C2F2" stroke-width="2.5"/><circle cx="627" cy="314" r="7" fill="#0C1E30" stroke="#94C2F2" stroke-width="2.5"/><circle cx="457" cy="314" r="8" fill="#F4BF77"/><text x="287" y="351" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">-1</text><text x="457" y="351" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">0</text><text x="627" y="351" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">1</text><text x="457" y="274" font-family="Arial,sans-serif" font-size="19" fill="#94C2F2" font-weight="normal" text-anchor="middle">B₁(0) = (-1,1)</text><line x1="748" y1="314" x2="1208" y2="314" stroke="#B9CFE0" stroke-width="2"  stroke-linecap="round"/><line x1="918" y1="314" x2="1258" y2="314" stroke="#79D7C2" stroke-width="10"  stroke-linecap="round"/><circle cx="918" cy="314" r="7" fill="#0C1E30" stroke="#79D7C2" stroke-width="2.5"/><circle cx="1258" cy="314" r="7" fill="#0C1E30" stroke="#79D7C2" stroke-width="2.5"/><circle cx="1088" cy="314" r="8" fill="#F4BF77"/><text x="918" y="351" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">-1</text><text x="1088" y="351" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">0</text><text x="1258" y="351" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">1</text><text x="1088" y="274" font-family="Arial,sans-serif" font-size="19" fill="#79D7C2" font-weight="normal" text-anchor="middle">Bπ/4(0) = (-1,1)</text><text x="343" y="444" font-family="Arial,sans-serif" font-size="22" fill="#94C2F2" font-weight="bold" text-anchor="middle">Complete metric</text><text x="970" y="444" font-family="Arial,sans-serif" font-size="22" fill="#79D7C2" font-weight="bold" text-anchor="middle">Incomplete metric</text><text x="343" y="478" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Every usual Cauchy sequence converges.</text><text x="970" y="478" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">n is ρ-Cauchy but has no ρ-limit.</text><text x="343" y="555" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Same open subsets of ℝ</text><text x="970" y="555" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Different Cauchy behavior</text><text x="660" y="660" font-family="Arial,sans-serif" font-size="20" fill="#F4BF77" font-weight="normal" text-anchor="middle">The topology remembers neighborhoods, not the numerical metric or completeness.</text></svg>