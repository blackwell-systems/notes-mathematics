<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Reversing pairs in a bijective function</title>
<desc id="desc">The function f maps 1 to p, 2 to r and 3 to q. The inverse function maps p to 1, r to 2 and q to 3, with every element having exactly one incoming and outgoing arrow in the appropriate direction.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#87B8EE"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#98D5A3"/></marker>
</defs>
<rect width="1200" height="580" fill="#101A2C"/>
<text x="600" y="55" fill="#F4F3ED" font-size="37" font-family="Georgia,serif" font-weight="bold" text-anchor="middle">Reversing every pair gives an inverse function</text>
<text x="600" y="91" fill="#C2CDE0" font-size="19" font-family="Arial,sans-serif" text-anchor="middle">The reversal is a function because every target was reached exactly once</text>
<rect x="28" y="123" width="552" height="378" rx="20" fill="#19283A" stroke="#526580" stroke-width="2"/>
<rect x="620" y="123" width="552" height="378" rx="20" fill="#19283A" stroke="#526580" stroke-width="2"/>
<text x="305" y="165" fill="#87B8EE" font-size="29" font-family="Georgia,serif" text-anchor="middle">f : A → B</text>
<text x="895" y="165" fill="#98D5A3" font-size="29" font-family="Georgia,serif" text-anchor="middle">f⁻¹ : B → A</text>
<text x="150" y="214" fill="#D8E2F0" font-size="20" text-anchor="middle">A = {1,2,3}</text>
<text x="456" y="214" fill="#D8E2F0" font-size="20" text-anchor="middle">B = {p,q,r}</text>
<text x="742" y="214" fill="#D8E2F0" font-size="20" text-anchor="middle">B = {p,q,r}</text>
<text x="1050" y="214" fill="#D8E2F0" font-size="20" text-anchor="middle">A = {1,2,3}</text>
<path d="M178 269L425 269 M178 355L425 439 M178 439L425 355" stroke="#87B8EE" stroke-width="3.7" fill="none" marker-end="url(#a)"/>
<path d="M770 269L1022 269 M770 355L1022 439 M770 439L1022 355" stroke="#98D5A3" stroke-width="3.7" fill="none" marker-end="url(#b)"/>
<circle cx="150" cy="269" r="27" fill="#232D48" stroke="#87B8EE" stroke-width="2.6"/><text x="150" y="277" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">1</text><circle cx="150" cy="355" r="27" fill="#232D48" stroke="#87B8EE" stroke-width="2.6"/><text x="150" y="363" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">2</text><circle cx="150" cy="439" r="27" fill="#232D48" stroke="#87B8EE" stroke-width="2.6"/><text x="150" y="447" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">3</text>
<circle cx="455" cy="269" r="27" fill="#232D48" stroke="#87B8EE" stroke-width="2.6"/><text x="455" y="277" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">p</text><circle cx="455" cy="355" r="27" fill="#232D48" stroke="#87B8EE" stroke-width="2.6"/><text x="455" y="363" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">q</text><circle cx="455" cy="439" r="27" fill="#232D48" stroke="#87B8EE" stroke-width="2.6"/><text x="455" y="447" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">r</text>
<circle cx="741" cy="269" r="27" fill="#232D48" stroke="#98D5A3" stroke-width="2.6"/><text x="741" y="277" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">p</text><circle cx="741" cy="355" r="27" fill="#232D48" stroke="#98D5A3" stroke-width="2.6"/><text x="741" y="363" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">q</text><circle cx="741" cy="439" r="27" fill="#232D48" stroke="#98D5A3" stroke-width="2.6"/><text x="741" y="447" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">r</text>
<circle cx="1051" cy="269" r="27" fill="#232D48" stroke="#98D5A3" stroke-width="2.6"/><text x="1051" y="277" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">1</text><circle cx="1051" cy="355" r="27" fill="#232D48" stroke="#98D5A3" stroke-width="2.6"/><text x="1051" y="363" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">2</text><circle cx="1051" cy="439" r="27" fill="#232D48" stroke="#98D5A3" stroke-width="2.6"/><text x="1051" y="447" font-family="Georgia,serif" font-size="27" fill="#F4F3ED" text-anchor="middle">3</text>
<text x="600" y="541" fill="#F4F3ED" font-size="22" font-family="Georgia,serif" text-anchor="middle">f = {(1,p), (2,r), (3,q)}       f⁻¹ = {(p,1), (r,2), (q,3)}</text>
</svg>