<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">The relation close to is not transitive</title><desc id="desc">On a number line, zero is within one of 0.6 and 0.6 is within one of 1.2, but zero and 1.2 are not within one of each other. Thus the relation is reflexive and symmetric but not transitive.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#87B8EE" stroke-width="1.6"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#EF9292" stroke-width="1.6"/></marker></defs><rect width="1000" height="520" fill="#101A2C"/><text x="40" y="57" fill="#F4F3ED" font-size="35" font-weight="760" text-anchor="start">Close to is not an equivalence relation</text><text x="40" y="96" fill="#C4CEDA" font-size="21" font-weight="450" text-anchor="start">Define a R b whenever |a − b| &lt; 1.</text><line x1="40" y1="113" x2="960" y2="113" stroke="#45576F" stroke-width="2" /><text x="500" y="152" fill="#66C4B4" font-size="23" font-weight="680" text-anchor="middle">The two short hops work</text><path d="M 200 299 Q 340 151 500 299" fill="none" stroke="#66C4B4" stroke-width="4" stroke-linecap="round" /><path d="M 500 299 Q 660 151 800 299" fill="none" stroke="#66C4B4" stroke-width="4" stroke-linecap="round" /><text x="350" y="228" fill="#F4F3ED" font-size="23" font-weight="650" text-anchor="middle">0 R 0.6</text><text x="650" y="228" fill="#F4F3ED" font-size="23" font-weight="650" text-anchor="middle">0.6 R 1.2</text><line x1="125" y1="320" x2="875" y2="320" stroke="#93A6BF" stroke-width="3" /><line x1="200" y1="303" x2="200" y2="338" stroke="#93A6BF" stroke-width="2" /><line x1="500" y1="303" x2="500" y2="338" stroke="#93A6BF" stroke-width="2" /><line x1="800" y1="303" x2="800" y2="338" stroke="#93A6BF" stroke-width="2" /><circle cx="200" cy="320" r="10" fill="#87B8EE" stroke="#101A2C" stroke-width="2"/><circle cx="500" cy="320" r="10" fill="#87B8EE" stroke="#101A2C" stroke-width="2"/><circle cx="800" cy="320" r="10" fill="#87B8EE" stroke="#101A2C" stroke-width="2"/><text x="200" y="365" fill="#F4F3ED" font-size="25" font-weight="750" text-anchor="middle">0</text><text x="500" y="365" fill="#F4F3ED" font-size="25" font-weight="750" text-anchor="middle">0.6</text><text x="800" y="365" fill="#F4F3ED" font-size="25" font-weight="750" text-anchor="middle">1.2</text><path d="M 200 393 Q 500 553 800 393" fill="none" stroke="#EF9292" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><text x="500" y="453" fill="#EF9292" font-size="22" font-weight="720" text-anchor="middle">0 is NOT related to 1.2</text><text x="500" y="492" fill="#C4CEDA" font-size="19" font-weight="460" text-anchor="middle">Two distances of 0.6 do not make the total distance less than 1.</text></svg>
