 <text x="55" y="530" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#F4F3ED">Every arrow excludes its reverse; no node points to itself.</text>
 <text x="55" y="556" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#BCCAD9">A one in cell (i, j) requires a zero in cell (j, i).</text>
