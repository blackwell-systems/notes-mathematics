<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Asymmetric relation: one-way graph and matrix</title>
<desc id="desc">For A = {1, 2, 3}, the relation contains exactly (1,2), (1,3) and (2,3). Three one-way arrows and no loops appear in the directed graph. The adjacency matrix has ones above the diagonal, zeros on the diagonal, and zeros below it where the reverse arrows would be. An asymmetric relation forbids both self-loops and pairs of opposite arrows.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#74CFC0"/></marker><marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#74CFC0"/></marker></defs>
 <rect width="1100" height="570" rx="16" fill="#101A2C"/>
 <rect x="0" y="0" width="8" height="570" rx="4" fill="#74CFC0"/>
 <text x="52" y="64" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#F4F3ED">Asymmetric</text>
 <text x="52" y="103" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#BCCAD9">No self-loops. No reverse arrows.</text>
 <line x1="52" x2="1048" y1="126" y2="126" stroke="#40536B" stroke-width="2"/>
 <text x="74" y="169" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#74CFC0">DIRECTED GRAPH</text>
 <text x="637" y="169" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#74CFC0">ADJACENCY MATRIX</text>
 <line x1="556" y1="160" x2="556" y2="468" stroke="#40536B" stroke-width="2"/>
