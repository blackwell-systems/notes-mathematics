<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">Different meanings of structure-preserving maps</title><desc id="desc">Three panels contrast topology, metric and linear structure. A real homeomorphism x mapped to x cubed preserves topology but not distances. A translation x mapped to x plus five preserves exact Euclidean distances. A shear T of x y to x plus y, y is linear and invertible. Each preserves a different structure; no single notion of isomorphism covers them all.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">Different meanings of structure-preserving maps</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><rect x="43" y="112" width="391" height="479" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="463" y="112" width="392" height="479" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="885" y="112" width="391" height="479" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="68" y="164" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Topological</text><rect x="68" y="205" width="336" height="110" rx="13" stroke="#94C2F2" stroke-width="2" fill="#173248"/><text x="236" y="252" font-family="Arial,sans-serif" font-size="25" fill="#94C2F2" font-weight="bold" text-anchor="middle">f(x) = x³</text><text x="236" y="286" font-family="Arial,sans-serif" font-size="19" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Homeomorphism</text><line x1="100" y1="375" x2="365" y2="375" stroke="#94C2F2" stroke-width="3"  stroke-linecap="round"/><path d="M353.94726807196537 379.6730201077038 L365 375 L353.94726807196537 370.3269798922962" stroke="#94C2F2" stroke-width="3" fill="none" stroke-linecap="round"/><text x="236" y="432" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Preserves opens both ways</text><text x="236" y="485" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Not necessarily isometric</text><text x="488" y="164" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Metric</text><rect x="488" y="205" width="336" height="110" rx="13" stroke="#79D7C2" stroke-width="2" fill="#173248"/><text x="656" y="252" font-family="Arial,sans-serif" font-size="25" fill="#79D7C2" font-weight="bold" text-anchor="middle">f(x) = x + 5</text><text x="656" y="286" font-family="Arial,sans-serif" font-size="19" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Isometry</text><line x1="520" y1="375" x2="785" y2="375" stroke="#79D7C2" stroke-width="3"  stroke-linecap="round"/><path d="M773.9472680719654 379.6730201077038 L785 375 L773.9472680719654 370.3269798922962" stroke="#79D7C2" stroke-width="3" fill="none" stroke-linecap="round"/><text x="656" y="432" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Preserves exact distances</text><text x="656" y="485" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Also continuous</text><text x="910" y="164" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Vector</text><rect x="910" y="205" width="336" height="110" rx="13" stroke="#C7B0F3" stroke-width="2" fill="#173248"/><text x="1078" y="252" font-family="Arial,sans-serif" font-size="25" fill="#C7B0F3" font-weight="bold" text-anchor="middle">T(x,y) = (x+y,y)</text><text x="1078" y="286" font-family="Arial,sans-serif" font-size="19" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Linear isomorphism</text><line x1="942" y1="375" x2="1207" y2="375" stroke="#C7B0F3" stroke-width="3"  stroke-linecap="round"/><path d="M1195.9472680719655 379.6730201077038 L1207 375 L1195.9472680719655 370.3269798922962" stroke="#C7B0F3" stroke-width="3" fill="none" stroke-linecap="round"/><text x="1078" y="432" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Preserves linear operations</text><text x="1078" y="485" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Not every linear map is bounded</text><text x="660" y="654" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="normal" text-anchor="middle">“Same space” depends on which structure and maps you choose to preserve.</text></svg>