<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Total order and partial subset order</title>
<desc id="desc">Left: a four-element total chain one less than two less than three less than four. Right: the Hasse diamond for subsets of a and b under inclusion: empty set below incomparable singleton subsets, and both below the full set. Both are partial orders, but only the left is total.</desc>
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17122d"/><stop offset="1" stop-color="#0b1225"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="54" y="58" fill="#f6f2ff" font-family="Georgia,serif" font-size="37" font-weight="700" text-anchor="start">Total order vs. partial order</text>
<text x="54" y="96" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">The difference is comparability, not whether a relation is defined.</text>
<path d="M54 113 H1146" stroke="#695282" stroke-width="2"/>
<rect x="42" y="133" width="542" height="426" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><rect x="616" y="133" width="542" height="426" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="313" y="178" fill="#bea0f1" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">TOTAL ORDER</text><text x="888" y="178" fill="#78d2c7" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">PARTIAL ORDER</text><text x="313" y="208" fill="#c7c6da" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">1 ≤ 2 ≤ 3 ≤ 4</text><text x="888" y="208" fill="#c7c6da" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Subsets of {a, b}</text><line x1="313" y1="486" x2="313" y2="395" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="313" y1="395" x2="313" y2="304" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="313" y1="304" x2="313" y2="236" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><circle cx="313" cy="486" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="313" y="495" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">1</text><circle cx="313" cy="395" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="313" y="404" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">2</text><circle cx="313" cy="304" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="313" y="313" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">3</text><circle cx="313" cy="236" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="313" y="245" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">4</text><line x1="888" y1="486" x2="752" y2="368" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="888" y1="486" x2="1024" y2="368" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="752" y1="368" x2="888" y2="247" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="1024" y1="368" x2="888" y2="247" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><rect x="832" y="457" width="112" height="58" rx="16" stroke="#78d2c7" stroke-width="3" fill="#26535b" data-subset="none"/><text x="888" y="495" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">∅</text><rect x="696" y="339" width="112" height="58" rx="16" stroke="#78d2c7" stroke-width="3" fill="#26535b" data-subset="a"/><text x="752" y="377" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">{a}</text><rect x="968" y="339" width="112" height="58" rx="16" stroke="#78d2c7" stroke-width="3" fill="#26535b" data-subset="b"/><text x="1024" y="377" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">{b}</text><rect x="824" y="218" width="128" height="58" rx="16" stroke="#78d2c7" stroke-width="3" fill="#26535b" data-subset="ab"/><text x="888" y="256" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">{a,b}</text><text x="313" y="539" fill="#c7c6da" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Every pair is comparable</text><text x="888" y="539" fill="#c7c6da" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">{a} and {b} are incomparable</text><text x="600" y="597" fill="#f1ce90" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Both satisfy the same three poset axioms; only the left one compares every pair.</text>
</svg>