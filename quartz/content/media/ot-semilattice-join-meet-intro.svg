<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc">
<title id="title">Why join is above and meet is below: set inclusion and logical implication</title>
<desc id="desc">Two parallel Hasse diamonds. In the left diamond, subsets of {a,b} are ordered by inclusion: the join {a,b} is the union of {a} and {b}, and the meet empty set is their intersection. Moving upward means a larger set. In the right diamond, the independent conditions K (having a key) and C (having a code) are ordered by logical implication: the join K OR C is above both, because each condition implies OR; the meet K AND C is below both, because AND implies each condition. Moving upward means a weaker, easier-to-satisfy condition. Each diagram uses four distinct elements and the same order shape.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d38"/><stop offset="1" stop-color="#080e21"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a2947"/><stop offset="1" stop-color="#121f36"/></linearGradient>
</defs>
<style>
 .title{fill:#f7f1e7;font-family:Georgia,serif;font-weight:700}
 .heading{fill:#eef2ff;font-family:Georgia,serif;font-weight:700}
 .info{fill:#d7e0ef;font-family:Arial,Helvetica,sans-serif}
 .helper{fill:#bfcce3;font-family:Arial,Helvetica,sans-serif}
 .line{stroke:#c0cbe1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .node{fill:#243453;stroke-width:4}
 .gold{stroke:#f0c46c}
 .teal{stroke:#73e0d1}
 .violet{stroke:#d7a5ec}
 .node-label{fill:#f8f6ff;font-family:Georgia,serif;font-size:37px;font-weight:700;text-anchor:middle;dominant-baseline:central}
 .gold-text{fill:#f2ce88}
 .violet-text{fill:#e5b6f6}
</style>
<rect width="1600" height="970" fill="url(#bg)"/>
<text x="800" y="65" font-size="50" class="title" text-anchor="middle">Joins and meets: the same shape in sets and logic</text>
<text x="800" y="109" font-size="26" class="info" text-anchor="middle">Join = least upper bound · Meet = greatest lower bound</text>
<rect x="36" y="146" width="746" height="688" rx="24" stroke="#83a3d7" stroke-width="3" fill="url(#panel)"/>
<rect x="818" y="146" width="746" height="688" rx="24" stroke="#83a3d7" stroke-width="3" fill="url(#panel)"/>
<text x="409" y="198" font-size="32" class="heading" text-anchor="middle">SET INCLUSION</text>
<text x="1191" y="198" font-size="32" class="heading" text-anchor="middle">LOGICAL IMPLICATION</text>
<text x="409" y="240" font-size="23" class="info" text-anchor="middle">A ⊆ B means A is below B</text>
<text x="1191" y="240" font-size="23" class="info" text-anchor="middle">P ⇒ Q means P is below Q</text>
<text x="409" y="276" font-size="23" fill="#73e0d1" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">↑ UP = larger set</text>
<text x="1191" y="276" font-size="23" fill="#73e0d1" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">↑ UP = weaker, easier condition</text>
<!-- The diamonds show cover relations, not all implied comparisons. -->
<path class="line" d="M409 369 L270 522 L409 682 L548 522 Z"/>
<path class="line" d="M1191 369 L1052 522 L1191 682 L1330 522 Z"/>
<!-- Set inclusion: union and intersection. -->
<circle cx="409" cy="369" r="64" class="node gold"/>
<text x="409" y="369" class="node-label" font-size="34">{a,b}</text>
<circle cx="270" cy="522" r="55" class="node teal"/>
<text x="270" y="522" class="node-label">{a}</text>
<circle cx="548" cy="522" r="55" class="node teal"/>
<text x="548" y="522" class="node-label">{b}</text>
<circle cx="409" cy="682" r="63" class="node violet"/>
<text x="409" y="682" class="node-label" font-size="52">∅</text>
<!-- Implication: AND entails either input, and each input entails OR. -->
<circle cx="1191" cy="369" r="68" class="node gold"/>
<text x="1191" y="369" class="node-label">K ∨ C</text>
<circle cx="1052" cy="522" r="55" class="node teal"/>
<text x="1052" y="522" class="node-label">K</text>
<circle cx="1330" cy="522" r="55" class="node teal"/>
<text x="1330" y="522" class="node-label">C</text>
<circle cx="1191" cy="682" r="69" class="node violet"/>
<text x="1191" y="682" class="node-label">K ∧ C</text>
<!-- Explicit, color-consistent interpretations of the highlighted endpoints. -->
<text x="505" y="353" class="heading gold-text" font-size="27">JOIN = union</text>
<text x="505" y="384" class="helper" font-size="21">least upper bound</text>
<text x="505" y="669" class="heading violet-text" font-size="25">MEET = intersection</text>
<text x="505" y="697" class="helper" font-size="21">greatest lower bound</text>
<text x="1300" y="346" class="heading gold-text" font-size="27">JOIN = OR</text>
<text x="1300" y="376" class="helper" font-size="21">weaker requirement</text>
<text x="1300" y="670" class="heading violet-text" font-size="27">MEET = AND</text>
<text x="1300" y="699" class="helper" font-size="21">stricter requirement</text>
<!-- The edge statements explain WHY the vertical positions follow from the orders. -->
<text x="76" y="770" class="info" font-size="23">∅ ⊆ {a} and ∅ ⊆ {b}</text>
<text x="76" y="805" class="info" font-size="23">{a} ⊆ {a,b} and {b} ⊆ {a,b}</text>
<text x="858" y="770" class="info" font-size="23">(K ∧ C) ⇒ K and (K ∧ C) ⇒ C</text>
<text x="858" y="805" class="info" font-size="23">K ⇒ (K ∨ C) and C ⇒ (K ∨ C)</text>
<rect x="36" y="858" width="1528" height="86" rx="17" stroke="#6f8fbf" stroke-width="2" fill="#1c2944"/>
<text x="800" y="894" class="heading" font-size="30" text-anchor="middle">Same order structure, different meanings of “above.”</text>
<text x="800" y="925" class="info" font-size="23" text-anchor="middle">The four-element set example has joins and meets for every pair, making it a lattice.</text>
</svg>
