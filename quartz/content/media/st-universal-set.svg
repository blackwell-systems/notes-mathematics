<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">A universal set containing subsets A, B and C</title>
<desc id="desc">Dark diagram showing a universal set U with elements 1 through 6 in a large rectangle; A and B overlap at element 3, C contains element 5, and the element 6 lies in U outside the three subsets. The inclusion relations A subset of U, B subset of U, C subset of U are displayed.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17102E"/><stop offset=".6" stop-color="#0B0C21"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2B2049"/><stop offset="1" stop-color="#15152F"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#362552"/><stop offset="1" stop-color="#221A3D"/></linearGradient>
<clipPath id="clipA"><circle cx="600" cy="537" r="211"/></clipPath>
<mask id="minusB" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="990"><rect width="1440" height="990" fill="black"/><circle cx="600" cy="537" r="211" fill="white"/><circle cx="850" cy="537" r="211" fill="black"/></mask>
<mask id="minusA" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="990"><rect width="1440" height="990" fill="black"/><circle cx="850" cy="537" r="211" fill="white"/><circle cx="600" cy="537" r="211" fill="black"/></mask>
<mask id="notA" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="990"><rect width="1440" height="990" fill="black"/><rect x="210" y="290" width="1020" height="502" rx="21" fill="white"/><circle cx="600" cy="537" r="211" fill="black"/></mask>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/>
<text x="720" y="91" fill="#FAF6FF" font-size="73" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">The Universal Set</text><text x="720" y="148" fill="#D3B6F2" font-size="29" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="normal" text-anchor="middle">U contains every element being considered, including elements outside A, B and C.</text><rect x="150" y="214" width="1140" height="590" rx="24" fill="url(#panel)" stroke="#BA84EF" stroke-width="3"/><circle cx="513" cy="509" r="197" fill="#7850B9" fill-opacity=".44" stroke="#B895F2" stroke-width="4"/>
<circle cx="703" cy="509" r="169" fill="#439C9B" fill-opacity=".20" stroke="#66D6CE" stroke-width="4"/>
<circle cx="1031" cy="606" r="103" fill="#A88C43" fill-opacity=".25" stroke="#F0CF8E" stroke-width="4"/><text x="199" y="279" fill="#FAF6FF" font-size="50" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">U</text><text x="419" y="340" fill="#FAF6FF" font-size="48" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">A</text><text x="790" y="380" fill="#FAF6FF" font-size="48" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">B</text><text x="1031" y="572" fill="#FAF6FF" font-size="46" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">C</text><text x="420" y="500" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">1</text><text x="421" y="593" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">2</text><text x="610" y="540" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">3</text><text x="795" y="545" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">4</text><text x="1031" y="668" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">5</text><text x="1158" y="363" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">6</text><rect x="113" y="831" width="1214" height="139" rx="22" fill="url(#footer)" stroke="#B582ED" stroke-width="3"/><text x="720" y="891" fill="#FAF6FF" font-size="48" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">A ⊆ U,  B ⊆ U,  C ⊆ U</text><text x="720" y="939" fill="#DAC5F8" font-size="29" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="normal" text-anchor="middle">6 belongs to U, even though it belongs to none of A, B, or C.</text>
</svg>