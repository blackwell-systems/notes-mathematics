<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Divisors of twelve under divisibility</title>
<desc id="desc">Hasse diagram on positive divisors one, two, three, four, six and twelve. Exactly seven cover relations: 1 to 2 and 3; 2 to 4 and 6; 3 to 6; 4 and 6 to 12. Every upward path is a divisibility comparison, while four and six remain incomparable.</desc>
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17122d"/><stop offset="1" stop-color="#0b1225"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="54" y="58" fill="#f6f2ff" font-family="Georgia,serif" font-size="37" font-weight="700" text-anchor="start">Hasse diagram: covers, not every comparison</text>
<text x="54" y="96" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Bigger divisors appear higher. Reflexive and transitive links are implicit.</text>
<path d="M54 113 H1146" stroke="#695282" stroke-width="2"/>
<rect x="42" y="134" width="738" height="430" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><rect x="802" y="134" width="356" height="430" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="411" y="176" fill="#bea0f1" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Divisibility on {1, 2, 3, 4, 6, 12}</text><line x1="410" y1="511" x2="253" y2="405" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="1" data-to="2"/><line x1="410" y1="511" x2="570" y2="405" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="1" data-to="3"/><line x1="253" y1="405" x2="253" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="2" data-to="4"/><line x1="253" y1="405" x2="570" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="2" data-to="6"/><line x1="570" y1="405" x2="570" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="3" data-to="6"/><line x1="253" y1="298" x2="410" y2="203" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="4" data-to="12"/><line x1="570" y1="298" x2="410" y2="203" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="6" data-to="12"/><circle cx="410" cy="511" r="31" fill="#26535b" stroke="#78d2c7" stroke-width="3" data-node="1"/><text x="410" y="520" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">1</text><circle cx="253" cy="405" r="31" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="2"/><text x="253" y="414" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">2</text><circle cx="570" cy="405" r="31" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="3"/><text x="570" y="414" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">3</text><circle cx="253" cy="298" r="31" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="4"/><text x="253" y="307" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">4</text><circle cx="570" cy="298" r="31" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="6"/><text x="570" y="307" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">6</text><circle cx="410" cy="203" r="31" fill="#624829" stroke="#f1ce90" stroke-width="3" data-node="12"/><text x="410" y="212" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">12</text><text x="827" y="189" fill="#f1ce90" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">READ UPWARD</text><text x="827" y="242" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">1 divides 12</text><text x="827" y="286" fill="#c7c6da" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">via 1 → 2 → 4 → 12</text><text x="827" y="352" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">4 and 6</text><text x="827" y="387" fill="#c7c6da" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">cannot be compared</text><text x="827" y="468" fill="#78d2c7" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Lines show covers;</text><text x="827" y="504" fill="#78d2c7" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">not every division.</text><text x="600" y="596" fill="#f1ce90" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">Seven cover edges recover all comparisons through upward paths.</text>
</svg>