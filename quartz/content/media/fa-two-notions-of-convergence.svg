xt-anchor="start" fill="#B7CADD">Integral error: ∫₀¹ xⁿ dx</text><text x="763" y="239" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#70D0BE">= 1/(n+1) → 0</text><text x="763" y="310" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#B7CADD">Maximum: sup xⁿ</text><text x="763" y="350" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#EDB96E">= 1 for every n</text><text x="763" y="424" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#F2F6FA">Not uniform convergence</text><text x="600" y="520" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#F2F6FA">A small integral does not force a small supremum norm.</text></svg>