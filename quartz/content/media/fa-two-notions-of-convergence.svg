<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Different norms, different limits</title><desc id="desc">Several power curves x to the n on the unit interval become steeper near one. The integral from zero to one equals one over n plus one and tends to zero, while the maximum remains one for every n. Norm convergence depends on the selected norm.</desc><rect width="1200" height="540" rx="19" fill="#0C1E30"/><text x="44" y="58" fill="#F2F6FA" font-family="Georgia,serif" font-size="37" font-weight="bold">Different norms, different limits</text><line x1="44" y1="82" x2="1156" y2="82" stroke="#48637A" stroke-width="2"/><rect x="42" y="105" width="670" height="377" rx="12" fill="#152D42" stroke="#436078" stroke-width="2"/><rect x="736" y="105" width="422" height="377" rx="12" fill="#152D42" stroke="#436078" stroke-width="2"/><text x="62" y="143" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#F2F6FA">Functions y = xⁿ on [0,1]</text><line x1="110" y1="416" x2="645" y2="416" stroke="#819FB9" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="416" x2="110" y2="169" stroke="#819FB9" stroke-width="3" stroke-linecap="round"/><polyline points="110.0,416.0 117.1,413.0 124.3,409.9 131.4,406.9 138.6,403.8 145.7,400.8 152.9,397.7 160.0,394.7 167.1,391.7 174.3,388.6 181.4,385.6 188.6,382.5 195.7,379.5 202.9,376.4 210.0,373.4 217.1,370.4 224.3,367.3 231.4,364.3 238.6,361.2 245.7,358.2 252.9,355.1 260.0,352.1 267.1,349.1 274.3,346.0 281.4,343.0 288.6,339.9 295.7,336.9 302.9,333.8 310.0,330.8 317.1,327.8 324.3,324.7 331.4,321.7 338.6,318.6 345.7,315.6 352.9,312.5 360.0,309.5 367.1,306.5 374.3,303.4 381.4,300.4 388.6,297.3 395.7,294.3 402.9,291.2 410.0,288.2 417.1,285.2 424.3,282.1 431.4,279.1 438.6,276.0 445.7,273.0 452.9,269.9 460.0,266.9 467.1,263.9 474.3,260.8 481.4,257.8 488.6,254.7 495.7,251.7 502.9,248.6 510.0,245.6 517.1,242.6 524.3,239.5 531.4,236.5 538.6,233.4 545.7,230.4