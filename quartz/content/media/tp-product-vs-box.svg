<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Product topology versus box topology</title><desc id="desc">Left panel product basic open restricts only finitely many coordinates, with others entire real lines. Right panel box topology restricts each coordinate, such as all intervals (-1/n,1/n).</desc><defs><marker id="arrow" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="17" fill="#0C1E30"/><text x="640" y="61" font-family="Georgia,serif" font-size="39" fill="#F1F5FC" text-anchor="middle">Product topology versus box topology</text><text x="640" y="104" font-family="Georgia,serif" font-size="23" fill="#C4D1E1" text-anchor="middle">In infinitely many coordinates, the finite-support restriction matters.</text><rect x="50" y="158" width="565" height="464" rx="17" fill="#172F46" stroke="#526A82" stroke-width="2.5"/><rect x="665" y="158" width="565" height="464" rx="17" fill="#172F46" stroke="#526A82" stroke-width="2.5"/><text x="332" y="217" font-family="Georgia,serif" font-size="32" fill="#7DD9C9" text-anchor="middle">Product topology</text><text x="948" y="217" font-family="Georgia,serif" font-size="32" fill="#C6A5ED" text-anchor="middle">Box topology</text><text x="332" y="257" font-family="Georgia,serif" font-size="22" fill="#C4D1E1" text-anchor="middle">Basic neighborhood of 0:</text><text x="948" y="257" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="middle">A box-open neighborhood of 0:</text><text x="162" y="310" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 1</text><text x="430" y="310" font-family="Georgia,serif" font-size="25" fill="#7DD9C9" text-anchor="middle">(−1,1)</text><text x="772" y="310" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 1</text><text x="1050" y="310" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">(−1,1)</text><text x="162" y="373" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 2</text><text x="430" y="373" font-family="Georgia,serif" font-size="25" fill="#7DD9C9" text-anchor="middle">(−½,½)</text><text x="772" y="373" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 2</text><text x="1050" y="373" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">(−½,½)</text><text x="162" y="436" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 3</text><text x="430" y="436" font-family="Georgia,serif" font-size="25" fill="#F1BD75" text-anchor="middle">ℝ</text><text x="772" y="436" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 3</text><text x="1050" y="436" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">(−⅓,⅓)</text><text x="162" y="499" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 4</text><text x="430" y="499" font-family="Georgia,serif" font-size="25" fill="#F1BD75" text-anchor="middle">ℝ</text><text x="772" y="499" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord 4</text><text x="1050" y="499" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">(−¼,¼)</text><text x="162" y="562" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord n</text><text x="430" y="562" font-family="Georgia,serif" font-size="25" fill="#F1BD75" text-anchor="middle">ℝ</text><text x="772" y="562" font-family="Georgia,serif" font-size="21" fill="#C4D1E1" text-anchor="start">coord n</text><text x="1050" y="562" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">…</text><rect x="72" y="641" width="1136" height="60" rx="17" fill="#24364C" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="680" font-family="Georgia,serif" font-size="22" fill="#F1F5FC" text-anchor="middle">Product basics restrict finitely many coordinates; box basics may restrict every coordinate.</text></svg>