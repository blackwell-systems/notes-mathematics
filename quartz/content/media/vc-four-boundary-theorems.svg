<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Four theorems share one local-to-boundary pattern</title><desc id="desc">Four columns compare fundamental theorem of calculus on an interval, Green theorem on planar regions, Stokes theorem on surfaces, and divergence theorem in solids; each maps an interior derivative to appropriate boundary data.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Four theorems share one local-to-boundary pattern</text><text x="640" y="103" font-family="Georgia,serif" font-size="22" fill="#C4D2E1" text-anchor="middle">Each theorem uses its own integrand, region, and orientation.</text><line x1="43" y1="127" x2="1237" y2="127" stroke="#4D6B82" stroke-width="2" /><rect x="42" y="156" width="1196" height="467" rx="17" fill="#1A3147" stroke="#7DD9C9" stroke-width="2.5"/><rect x="85" y="223" width="246" height="310" rx="17" fill="#1A3147" stroke="#7DD9C9" stroke-width="2.5"/><text x="208" y="266" font-family="Georgia,serif" font-size="25" fill="#7DD9C9" text-anchor="middle">Interval</text><text x="208" y="322" font-family="Georgia,serif" font-size="23" fill="#F2F5FB" text-anchor="middle">f′ dx</text><text x="208" y="368" font-family="Georgia,serif" font-size="19" fill="#C4D2E1" text-anchor="middle">integrate inside</text><line x1="113" y1="394" x2="303" y2="394" stroke="#4D6B82" stroke-width="2" /><text x="208" y="452" font-family="Georgia,serif" font-size="20" fill="#F1BD75" text-anchor="middle">endpoints</text><text x="208" y="484" font-family="Georgia,serif" font-size="18" fill="#C4D2E1" text-anchor="middle">measure outside</text><rect x="380" y="223" width="246" height="310" rx="17" fill="#1A3147" stroke="#C6A5ED" stroke-width="2.5"/><text x="503" y="266" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">Planar region</text><text x="503" y="322" font-family="Georgia,serif" font-size="23" fill="#F2F5FB" text-anchor="middle">curl dA</text><text x="503" y="368" font-family="Georgia,serif" font-size="19" fill="#C4D2E1" text-anchor="middle">integrate inside</text><line x1="408" y1="394" x2="598" y2="394" stroke="#4D6B82" stroke-width="2" /><text x="503" y="452" font-family="Georgia,serif" font-size="20" fill="#F1BD75" text-anchor="middle">edge curve</text><text x="503" y="484" font-family="Georgia,serif" font-size="18" fill="#C4D2E1" text-anchor="middle">measure outside</text><rect x="675" y="223" width="246" height="310" rx="17" fill="#1A3147" stroke="#7DD9C9" stroke-width="2.5"/><text x="798" y="266" font-family="Georgia,serif" font-size="25" fill="#7DD9C9" text-anchor="middle">Surface</text><text x="798" y="322" font-family="Georgia,serif" font-size="23" fill="#F2F5FB" text-anchor="middle">curl · n dS</text><text x="798" y="368" font-family="Georgia,serif" font-size="19" fill="#C4D2E1" text-anchor="middle">integrate inside</text><line x1="703" y1="394" x2="893" y2="394" stroke="#4D6B82" stroke-width="2" /><text x="798" y="452" font-family="Georgia,serif" font-size="20" fill="#F1BD75" text-anchor="middle">boundary curve</text><text x="798" y="484" font-family="Georgia,serif" font-size="18" fill="#C4D2E1" text-anchor="middle">measure outside</text><rect x="969" y="223" width="246" height="310" rx="17" fill="#1A3147" stroke="#F1BD75" stroke-width="2.5"/><text x="1092" y="266" font-family="Georgia,serif" font-size="25" fill="#F1BD75" text-anchor="middle">Solid</text><text x="1092" y="322" font-family="Georgia,serif" font-size="23" fill="#F2F5FB" text-anchor="middle">div dV</text><text x="1092" y="368" font-family="Georgia,serif" font-size="19" fill="#C4D2E1" text-anchor="middle">integrate inside</text><line x1="997" y1="394" x2="1187" y2="394" stroke="#4D6B82" stroke-width="2" /><text x="1092" y="452" font-family="Georgia,serif" font-size="20" fill="#F1BD75" text-anchor="middle">outer surface</text><text x="1092" y="484" font-family="Georgia,serif" font-size="18" fill="#C4D2E1" text-anchor="middle">measure outside</text><rect x="136" y="647" width="1008" height="57" rx="17" fill="#1A3147" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="683" font-family="Georgia,serif" font-size="26" fill="#F2F5FB" text-anchor="middle">Integral of local derivative = boundary contribution.</text></svg>