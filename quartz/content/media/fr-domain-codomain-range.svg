<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">Domain, codomain, and range</title><desc id="desc">Domain a,b,c,d maps through f to a codomain of 1,2,3,4,5. Only outputs 2,3,5 are hit; inverse image of 3 is b,c.</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">Domain, codomain, and range</text><rect x="75" y="115" width="1050" height="470" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="85" y="125" width="1030" height="59" rx="13" fill="#122338"/><text x="600" y="157" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">The entire domain maps into the codomain</text><path d="M99 185 H1101" stroke="#87B8EE" opacity=".35" stroke-width="2"/><ellipse cx="195" cy="385" rx="70" ry="120" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><ellipse cx="1011" cy="385" rx="70" ry="146" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><text x="195" y="213" fill="#F4F3ED" font-size="#87B8EE" font-weight="500" text-anchor="middle" dominant-baseline="middle">18</text><text x="1011" y="213" fill="#F4F3ED" font-size="#BCA8EC" font-weight="500" text-anchor="middle" dominant-baseline="middle">18</text><text x="195" y="219" fill="middle" font-size="#87B8EE" font-weight="500" text-anchor="600" dominant-baseline="middle">18</text><path d="M221 307 L980 333" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M221 359 L980 385" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M221 411 L980 385" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M221 463 L980 489" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><circle cx="195" cy="307" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="195" y="307" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">a</text><circle cx="195" cy="359" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="195" y="359" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">b</text><circle cx="195" cy="411" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="195" y="411" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">c</text><circle cx="195" cy="463" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="195" y="463" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">d</text><circle cx="1011" cy="281" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="1011" y="281" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="1011" cy="333" r="20" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="1011" y="333" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="1011" cy="385" r="20" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="1011" y="385" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">3</text><circle cx="1011" cy="437" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="1011" y="437" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">4</text><circle cx="1011" cy="489" r="20" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="1011" y="489" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">5</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">Domain = {a,b,c,d}      Codomain = {1,2,3,4,5}      Range = {2,3,5}</text></svg>