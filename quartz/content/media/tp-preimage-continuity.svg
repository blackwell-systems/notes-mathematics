<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" width="800" height="544" role="img" aria-labelledby="title desc"><title id="title">Continuity pulls openness back</title><desc id="desc">Continuous map f:X→Y, an open set V in Y and its open inverse image f^-1(V) in X.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="544" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Continuity pulls openness back</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Preimages, not images, define topological continuity.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="60" y="149" width="285" height="300" rx="14" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><rect x="457" y="149" width="285" height="300" rx="14" stroke="#C7B6F4" fill="#1C2B40" stroke-width="2.5"/><rect x="500" y="216" width="196" height="117" rx="55" stroke="#C7B6F4" fill="#243850" stroke-width="2.5"/><rect x="108" y="225" width="191" height="100" rx="55" stroke="#6DD2BD" fill="#243850" stroke-width="2.5"/><text x="202" y="194" fill="#6DD2BD" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DOMAIN X</text><text x="599" y="194" fill="#C7B6F4" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">CODOMAIN Y</text><text x="200" y="280" fill="#6DD2BD" font-size="26" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f⁻¹(V)</text><text x="599" y="279" fill="#C7B6F4" font-size="26" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">open V</text><line x1="350" y1="292" x2="446" y2="292" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="267" fill="#F4C474" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f</text><text x="400" y="490" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Continuous: open preimages</text><text x="40" y="525" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>