<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The boundary of a boundary vanishes</title><desc id="desc">A filled triangle with directed boundary edges and three boundary equations canceling the vertices; partial-one partial-two equals zero.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">The boundary of a boundary vanishes</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">Each vertex appears twice, once with each orientation.</text><rect x="50" y="147" width="560" height="470" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="74" y="190" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">The oriented 2-simplex [a,b,c]</text><line x1="72" y1="206" x2="588" y2="206" stroke="#4C6685" stroke-width="1.5" /><rect x="650" y="147" width="580" height="470" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="674" y="190" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">Apply the boundary operator twice</text><line x1="672" y1="206" x2="1208" y2="206" stroke="#4C6685" stroke-width="1.5" /><polygon points="330,236 465,491 202,491" fill="#42506B" stroke="#F0BD75" stroke-width="5"/><circle cx="330" cy="236" r="8" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><circle cx="465" cy="491" r="8" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><circle cx="202" cy="491" r="8" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="325" y="214" font-family="Georgia,serif" font-size="29" fill="#F4F2EF" text-anchor="middle" font-weight="400">a</text><text x="482" y="519" font-family="Georgia,serif" font-size="29" fill="#F4F2EF" text-anchor="start" font-weight="400">b</text><text x="178" y="519" font-family="Georgia,serif" font-size="29" fill="#F4F2EF" text-anchor="start" font-weight="400">c</text><path d="M350 272 L442 459" fill="none" stroke="#F0BD75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M425 490 L236 490" fill="none" stroke="#F0BD75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M217 464 L307 272" fill="none" stroke="#F0BD75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="330" y="565" font-family="Georgia,serif" font-size="22" fill="#F4F2EF" text-anchor="middle" font-weight="400">∂₂[a,b,c] = [b,c] − [a,c] + [a,b]</text><text x="682" y="261" font-family="Georgia,serif" font-size="28" fill="#F4F2EF" text-anchor="start" font-weight="400">∂₁[b,c] = [c] − [b]</text><text x="682" y="326" font-family="Georgia,serif" font-size="27" fill="#F4F2EF" text-anchor="start" font-weight="400">− ∂₁[a,c] = −[c] + [a]</text><text x="682" y="391" font-family="Georgia,serif" font-size="27" fill="#F4F2EF" text-anchor="start" font-weight="400">+ ∂₁[a,b] = [b] − [a]</text><line x1="682" y1="425" x2="1174" y2="425" stroke="#4C6685" stroke-width="2" /><text x="682" y="474" font-family="Georgia,serif" font-size="27" fill="#C3D0E0" text-anchor="start" font-weight="400">Each vertex cancels:</text><text x="940" y="531" font-family="Georgia,serif" font-size="39" fill="#F0BD75" text-anchor="middle" font-weight="700">∂₁ ∂₂ = 0</text><rect x="155" y="633" width="972" height="63" rx="14" fill="#253449" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="674" font-family="Georgia,serif" font-size="28" fill="#F4F2EF" text-anchor="middle" font-weight="400">Every boundary is a cycle; the reverse need not hold.</text></svg>