<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Order duality reverses every comparison</title>
<desc id="desc">Two dark Hasse diagrams show the same three elements. In the original order, incomparable a and b are below c, which is greatest. In the dual, c is below a and b, which are both maximal but neither greatest. Incomparability is unchanged.</desc>
<rect width="1200" height="470" rx="18" fill="#0c1e30"/>
<rect x="45" y="96" width="518" height="303" rx="18" fill="#162d43" stroke="#45647e" stroke-width="2"/>
<rect x="637" y="96" width="518" height="303" rx="18" fill="#162d43" stroke="#45647e" stroke-width="2"/>
<g fill="#f4f3ed" font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="44" font-size="30" font-weight="700">ORDER DUALITY</text>
<text x="600" y="78" font-size="18" fill="#b7cddd">Same elements. Reverse every comparison.</text>
<text x="304" y="131" font-size="22" font-weight="700">ORIGINAL ORDER</text>
<text x="895" y="131" font-size="22" font-weight="700">DUAL ORDER</text>
</g>
<g fill="none" stroke="#a9c6df" stroke-width="5" stroke-linecap="round">
<path d="M209 292 L304 205 L399 292"/>
<path d="M799 204 L895 290 L990 204"/>
</g>
<g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
<circle cx="209" cy="303" r="29" fill="#236475" stroke="#79d2c8" stroke-width="3"/><text x="209" y="313" fill="#ffffff" font-size="27">a</text>
<circle cx="399" cy="303" r="29" fill="#236475" stroke="#79d2c8" stroke-width="3"/><text x="399" y="313" fill="#ffffff" font-size="27">b</text>
<circle cx="304" cy="195" r="29" fill="#674f80" stroke="#bda9e7" stroke-width="3"/><text x="304" y="205" fill="#ffffff" font-size="27">c</text>
<circle cx="799" cy="195" r="29" fill="#236475" stroke="#79d2c8" stroke-width="3"/><text x="799" y="205" fill="#ffffff" font-size="27">a</text>
<circle cx="990" cy="195" r="29" fill="#236475" stroke="#79d2c8" stroke-width="3"/><text x="990" y="205" fill="#ffffff" font-size="27">b</text>
<circle cx="895" cy="303" r="29" fill="#674f80" stroke="#bda9e7" stroke-width="3"/><text x="895" y="313" fill="#ffffff" font-size="27">c</text>
<text x="304" y="365" fill="#cddbe7" font-size="18">a and b minimal; c greatest</text>
<text x="895" y="365" fill="#cddbe7" font-size="18">c least; a and b maximal</text>
<text x="600" y="262" fill="#f0be77" font-size="46">⇄</text>
<text x="600" y="445" font-size="19" fill="#b4c9d7">Incomparability between a and b remains in both orders.</text>
</g>
</svg>
