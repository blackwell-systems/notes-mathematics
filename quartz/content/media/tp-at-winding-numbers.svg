<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Loops on a circle have integer winding numbers</title><desc id="desc">Four circular diagrams show winding numbers zero, plus one, minus one and plus two; loop concatenation adds winding numbers and fundamental group of circle equals the integers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">Loops on a circle have integer winding numbers</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">Based loops are classified by the number and direction of complete turns.</text><rect x="48" y="145" width="574" height="211" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="72" y="188" font-family="Georgia,serif" font-size="26" fill="#9AC4F3" text-anchor="start" font-weight="700">n = 0</text><line x1="70" y1="204" x2="600" y2="204" stroke="#4C6685" stroke-width="1.5" /><circle cx="213" cy="274" r="63" fill="none" stroke="#4C6685" stroke-width="3"/><circle cx="276" cy="274" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="1"/><text x="291" y="282" font-family="Georgia,serif" font-size="24" fill="#F4F2EF" text-anchor="start" font-weight="400">p</text><text x="393" y="281" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="middle" font-weight="400">constant loop</text><rect x="659" y="145" width="574" height="211" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="683" y="188" font-family="Georgia,serif" font-size="26" fill="#F0BD75" text-anchor="start" font-weight="700">n = +1</text><line x1="681" y1="204" x2="1211" y2="204" stroke="#4C6685" stroke-width="1.5" /><circle cx="824" cy="274" r="63" fill="none" stroke="#4C6685" stroke-width="3"/><circle cx="887" cy="274" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="1"/><text x="902" y="282" font-family="Georgia,serif" font-size="24" fill="#F4F2EF" text-anchor="start" font-weight="400">p</text><text x="1004" y="281" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="middle" font-weight="400">counterclockwise</text><path d="M887 274 A63 63 0 1 0 761 274 A63 63 0 1 0 885 260" stroke="#F0BD75" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="1005" y="322" font-family="Georgia,serif" font-size="19" fill="#C3D0E0" text-anchor="middle" font-weight="400">one full turn</text><rect x="48" y="374" width="574" height="211" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="72" y="417" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">n = −1</text><line x1="70" y1="433" x2="600" y2="433" stroke="#4C6685" stroke-width="1.5" /><circle cx="213" cy="503" r="63" fill="none" stroke="#4C6685" stroke-width="3"/><circle cx="276" cy="503" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="1"/><text x="291" y="511" font-family="Georgia,serif" font-size="24" fill="#F4F2EF" text-anchor="start" font-weight="400">p</text><text x="393" y="510" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="middle" font-weight="400">clockwise</text><path d="M276 503 A63 63 0 1 1 150 503 A63 63 0 1 1 274 489" stroke="#C9A8F2" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="394" y="551" font-family="Georgia,serif" font-size="19" fill="#C3D0E0" text-anchor="middle" font-weight="400">one full turn</text><rect x="659" y="374" width="574" height="211" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="683" y="417" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">n = +2</text><line x1="681" y1="433" x2="1211" y2="433" stroke="#4C6685" stroke-width="1.5" /><circle cx="824" cy="503" r="63" fill="none" stroke="#4C6685" stroke-width="3"/><circle cx="887" cy="503" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="1"/><text x="902" y="511" font-family="Georgia,serif" font-size="24" fill="#F4F2EF" text-anchor="start" font-weight="400">p</text><text x="1004" y="510" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="middle" font-weight="400">two circuits</text><path d="M887 503 A63 63 0 1 0 761 503 A63 63 0 1 0 885 489" stroke="#7DD9C9" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="1005" y="551" font-family="Georgia,serif" font-size="19" fill="#C3D0E0" text-anchor="middle" font-weight="400">trace the same circle twice</text><rect x="48" y="615" width="1185" height="80" rx="15" fill="#243344" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="652" font-family="Georgia,serif" font-size="36" fill="#F0BD75" text-anchor="middle" font-weight="700">π₁(S¹) ≅ ℤ</text><text x="640" y="681" font-family="Georgia,serif" font-size="19" fill="#F4F2EF" text-anchor="middle" font-weight="400">Concatenation adds winding numbers; reversing a loop changes its sign.</text></svg>