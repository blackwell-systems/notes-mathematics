<svg xmlns="http://www.w3.org/2000/svg" width="800" height="562" viewBox="0 0 800 562" role="img" aria-labelledby="title desc"><title id="title">Which finite field sizes exist?</title><desc id="desc">Rows of finite fields with sizes 2,4,8 and 3,9,27, illustrating that finite fields have prime power cardinalities and exist for all prime powers.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="562" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Which finite field sizes exist?</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">For every prime p and n ≥ 1, a field F_(pⁿ) exists.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="61" y="160" width="677" height="130" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="120" y="207" fill="#66C4B4" font-size="27" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">p = 2</text><rect x="268" y="194" width="119" height="70" rx="10" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="327" y="239" fill="#F4F3ED" font-size="27" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">F₂</text><rect x="410" y="194" width="119" height="70" rx="10" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="469" y="239" fill="#F4F3ED" font-size="27" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">F₄</text><rect x="552" y="194" width="119" height="70" rx="10" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="611" y="239" fill="#F4F3ED" font-size="27" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">F₈</text><rect x="61" y="317" width="677" height="130" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="120" y="364" fill="#BCA8EC" font-size="27" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">p = 3</text><rect x="268" y="351" width="119" height="70" rx="10" fill="#223349" stroke="#BCA8EC" stroke-width="2"/><text x="327" y="396" fill="#F4F3ED" font-size="27" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">F₃</text><rect x="410" y="351" width="119" height="70" rx="10" fill="#223349" stroke="#BCA8EC" stroke-width="2"/><text x="469" y="396" fill="#F4F3ED" font-size="27" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">F₉</text><rect x="552" y="351" width="119" height="70" rx="10" fill="#223349" stroke="#BCA8EC" stroke-width="2"/><text x="611" y="396" fill="#F4F3ED" font-size="27" font-weight="730" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">F₂₇</text><text x="400" y="522" fill="#EDB86D" font-size="24" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Finite field sizes must be prime powers pⁿ.</text><text x="40" y="544" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>