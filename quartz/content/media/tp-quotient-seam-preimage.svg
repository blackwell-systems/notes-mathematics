<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 654" role="img" aria-labelledby="title desc"><title id="title">Quotient topology: neighborhoods at the seam</title><desc id="desc">The interval from zero to one has its endpoints identified in the quotient to form a circle. An open arc surrounding the identified seam point on the circle pulls back to two relatively open pieces near zero and one in the original interval. Quotient openness is tested by its full preimage.</desc><rect width="1280" height="654" rx="20" fill="#0C1E30"/><text x="54" y="65" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F3F6FC">Quotient topology: neighborhoods at the seam</text><line x1="54" y1="87" x2="1226" y2="87" stroke="#34566C" stroke-width="2"/><rect x="53" y="111" width="1174" height="443" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><text x="79" y="154" font-family="Arial,sans-serif" font-size="24" fill="#F3F6FC" text-anchor="start" font-weight="normal">Start with the interval [0,1]</text><line x1="142" y1="217" x2="586" y2="217" stroke="#7CA9C9" stroke-width="3"/><path d="M142 217 l15 -7 v14 Z M586 217 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="210" y1="217" x2="518" y2="217" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="210" cy="217" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="518" cy="217" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="210" y="252" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">0</text><text x="518" y="252" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1</text><path d="M225 190 Q364 83 503 190" stroke="#F2BB68" stroke-width="3" fill="none"/><text x="365" y="125" font-family="Arial,sans-serif" font-size="22" fill="#F2BB68" text-anchor="middle" font-weight="bold">0 ~ 1</text><line x1="603" y1="215" x2="724" y2="215" stroke="#F2BB68" stroke-width="4"/><path d="M711 205 L727 215 L711 225" fill="none" stroke="#F2BB68" stroke-width="4"/><circle cx="938" cy="245" r="108" fill="none" stroke="#68D2C0" stroke-width="8"/><path d="M897 146 A108 108 0 0 1 979 146" stroke="#F2BB68" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="938" cy="137" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="1067" y="166" font-family="Arial,sans-serif" font-size="20" fill="#F2BB68" text-anchor="start" font-weight="normal">[0] = [1]</text><text x="938" y="380" font-family="Arial,sans-serif" font-size="27" fill="#F3F6FC" text-anchor="middle" font-weight="bold">Q ≅ S¹</text><text x="79" y="331" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="start" font-weight="normal">An open seam neighborhood pulls back to two end pieces:</text><line x1="160" y1="427" x2="635" y2="427" stroke="#7CA9C9" stroke-width="3"/><path d="M160 427 l15 -7 v14 Z M635 427 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="200" y1="427" x2="277" y2="427" stroke="#F2BB68" stroke-width="8" stroke-linecap="round"/><circle cx="200" cy="427" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="277" cy="427" r="9" fill="#0C1E30" stroke="#F2BB68" stroke-width="3"/><line x1="517" y1="427" x2="594" y2="427" stroke="#F2BB68" stroke-width="8" stroke-linecap="round"/><circle cx="517" cy="427" r="9" fill="#0C1E30" stroke="#F2BB68" stroke-width="3"/><circle cx="594" cy="427" r="9" fill="#0C1E30" stroke="#F2BB68" stroke-width="3"/><circle cx="200" cy="427" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="594" cy="427" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="200" y="465" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">0</text><text x="594" y="465" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1</text><text x="367" y="502" font-family="Arial,sans-serif" font-size="23" fill="#F2BB68" text-anchor="middle" font-weight="normal">[0, ε) ∪ (1−ε, 1]</text><text x="796" y="471" font-family="Arial,sans-serif" font-size="21" fill="#68D2C0" text-anchor="start" font-weight="normal">q⁻¹(U) is relatively open</text><rect x="53" y="566" width="1174" height="62" rx="10" fill="#10263A" stroke="#426982" stroke-width="2"/><text x="640" y="606" font-family="Arial,sans-serif" font-size="22" fill="#F3F6FC" text-anchor="middle" font-weight="normal">In the quotient, U is open exactly when q⁻¹(U) is open in [0,1].</text></svg>