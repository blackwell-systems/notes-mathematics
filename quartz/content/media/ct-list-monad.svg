<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">The list monad</title><desc id="desc">List monad unit sends a to singleton list [a]. Multiplication flattens nested lists [[a,b],[c],[]] to [a,b,c].</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">The list monad</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Unit wraps; multiplication flattens.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="84" y="150" width="632" height="100" rx="14" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><text x="400" y="204" fill="#F4F5EF" font-size="34" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">a   →   [a]</text><text x="400" y="232" fill="#6DD2BD" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">unit: singleton list</text><line x1="400" y1="260" x2="400" y2="327" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><rect x="84" y="340" width="632" height="112" rx="14" stroke="#C7B6F4" fill="#1C2B40" stroke-width="2.5"/><text x="400" y="390" fill="#F4F5EF" font-size="28" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">[[a,b], [c], []] → [a,b,c]</text><text x="400" y="429" fill="#C7B6F4" font-size="20" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">multiplication: flatten one layer</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>