<text x="1241" y="493" font-size="29" fill="#e2c4fc" text-anchor="middle" font-family="Georgia,serif">Even class</text>
<text x="1241" y="542" font-size="39" fill="#f8f3ed" text-anchor="middle" font-family="Georgia,serif">{2, 4}</text>
