<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 755" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Building a relation diagram from ordered pairs</title>
<desc id="diagram-desc">The parity relation on the set 1 2 3 4 has eight selected ordered pairs. A four by four membership grid highlights those pairs; a directed graph draws four vertices, self-loops, and two-way arrows between 1 and 3 and between 2 and 4. The resulting equivalence classes are the sets {1,3} and {2,4}.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#e9bf70"/></marker></defs>
<rect width="1500" height="755" fill="#101625"/>
<text x="750" y="72" font-size="54" fill="#f3eee7" text-anchor="middle" font-family="Georgia,serif" font-weight="bold">From pairs to a relation diagram</text>
<text x="750" y="110" font-size="22" fill="#bfcadd" text-anchor="middle" font-family="Arial,sans-serif">A = {1, 2, 3, 4}  ·  two numbers are related when they have the same parity</text>
<rect x="28" y="153" width="462" height="521" rx="20" fill="#121c2e" stroke="#78cac4" stroke-width="2.3"/>
<rect x="520" y="153" width="462" height="521" rx="20" fill="#121c2e" stroke="#c39ce6" stroke-width="2.3"/>
<rect x="1012" y="153" width="460" height="521" rx="20" fill="#121c2e" stroke="#e3c17f" stroke-width="2.3"/>
<rect x="28" y="153" width="462" height="75" rx="20" fill="#194040" stroke="#78cac4" stroke-width="0"/>
<rect x="520" y="153" width="462" height="75" rx="20" fill="#32294a" stroke="#c39ce6" stroke-width="0"/>
<rect x="1012" y="153" width="460" height="75" rx="20" fill="#4c3a2b" stroke="#e3c17f" stroke-width="0"/>
<text x="259" y="201" font-size="33" fill="#f5f0e8" text-anchor="middle" font-family="Georgia,serif">1. Select the pairs</text>
<text x="751" y="201" font-size="33" fill="#f5f0e8" text-anchor="middle" font-family="Georgia,serif">2. Draw every arrow</text>
<text x="1242" y="201" font-size="33" fill="#f5f0e8" text-anchor="middle" font-family="Georgia,serif">3. Read the classes</text>
<text x="240" y="246" font-size="20" fill="#c9d4e2" text-anchor="middle" font-family="Arial,sans-serif">Second element  →</text>
<text x="80" y="286" font-size="18" fill="#c9d4e2" font-family="Arial,sans-serif">First</text>
<text x="80" y="310" font-size="22" fill="#c9d4e2" >↓</text>
