<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Extreme values need compactness and continuity</title><desc id="desc">Three schematic function graphs: continuous downward parabola on [0,2] attains extrema, identity on open (0,1) has no extreme values, and discontinuous f(x)=abs(x) except f(0)=2 on compact [-1,1] has infimum zero but no minimum.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" font-family="Georgia,serif" font-size="37" fill="#F2F5FA" text-anchor="middle">Extreme values need compactness and continuity</text><text x="640" y="107" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">Dropping a hypothesis can make a supremum or infimum unattainable.</text><rect x="27" y="160" width="390" height="470" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="222" y="207" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="middle">Compact and continuous</text><rect x="445" y="160" width="390" height="470" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="640" y="207" font-family="Georgia,serif" font-size="26" fill="#C8A7EE" text-anchor="middle">Open domain</text><rect x="863" y="160" width="390" height="470" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="1058" y="207" font-family="Georgia,serif" font-size="26" fill="#F0BD75" text-anchor="middle">Discontinuous function</text><line x1="82" y1="548" x2="82" y2="270" stroke="#C1D0E1" stroke-width="2" /><line x1="82" y1="548" x2="370" y2="548" stroke="#C1D0E1" stroke-width="2" /><line x1="501" y1="548" x2="501" y2="270" stroke="#C1D0E1" stroke-width="2" /><line x1="501" y1="548" x2="789" y2="548" stroke="#C1D0E1" stroke-width="2" /><line x1="922" y1="548" x2="922" y2="270" stroke="#C1D0E1" stroke-width="2" /><line x1="922" y1="548" x2="1210" y2="548" stroke="#C1D0E1" stroke-width="2" /><path d="M114 458 Q224 284 347 458" fill="none" stroke="#7DD9C9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="226" cy="370" r="9" fill="#F0BD75" stroke="#F2F5FA" stroke-width="3"/><circle cx="114" cy="458" r="9" fill="#7DD9C9" stroke="#F2F5FA" stroke-width="3"/><circle cx="347" cy="458" r="9" fill="#7DD9C9" stroke="#F2F5FA" stroke-width="3"/><text x="226" y="329" font-family="Georgia,serif" font-size="22" fill="#F0BD75" text-anchor="middle">max attained</text><path d="M526 494 L760 326" fill="none" stroke="#C8A7EE" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="526" cy="494" r="9" fill="#1A3047" stroke="#C8A7EE" stroke-width="3"/><circle cx="760" cy="326" r="9" fill="#1A3047" stroke="#C8A7EE" stroke-width="3"/><text x="632" y="588" font-family="Georgia,serif" font-size="20" fill="#C1D0E1" text-anchor="middle">f(x)=x, 0&lt;x&lt;1</text><path d="M953 351 L1040 489" fill="none" stroke="#F0BD75" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1040 489 L1128 351" fill="none" stroke="#F0BD75" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1040" cy="489" r="9" fill="#1A3047" stroke="#F0BD75" stroke-width="3"/><circle cx="1040" cy="287" r="9" fill="#F2A3B0" stroke="#F2F5FA" stroke-width="3"/><text x="1041" y="261" font-family="Georgia,serif" font-size="22" fill="#F2A3B0" text-anchor="middle">f(0)=2</text><text x="1055" y="587" font-family="Georgia,serif" font-size="18" fill="#C1D0E1" text-anchor="middle">infimum 0 not attained</text><text x="210" y="600" font-family="Georgia,serif" font-size="19" fill="#C1D0E1" text-anchor="middle">maximum and minimum</text><rect x="71" y="647" width="1138" height="57" rx="16" stroke="#F0BD75" stroke-width="2.5" fill="#293648"/><text x="640" y="683" font-family="Georgia,serif" font-size="23" fill="#F2F5FA" text-anchor="middle">On a nonempty compact domain, continuity guarantees attained extrema.</text></svg>