<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Divergence theorem: local sources to outer flux</title><desc id="desc">A unit ball has outward radial arrows and equations divergence of F=(x,y,z) equals three, giving volume integral four pi and boundary flux four pi.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Divergence theorem: local sources to outer flux</text><text x="640" y="103" font-family="Georgia,serif" font-size="22" fill="#C4D2E1" text-anchor="middle">The radial field has constant divergence and outward flux.</text><line x1="43" y1="127" x2="1237" y2="127" stroke="#4D6B82" stroke-width="2" /><rect x="53" y="149" width="1171" height="478" rx="17" fill="#1A3147" stroke="#7DD9C9" stroke-width="2.5"/><circle cx="404" cy="396" r="177" fill="#305A65" fill-opacity=".58" stroke="#7DD9C9" stroke-width="4"/><ellipse cx="404" cy="396" rx="177" ry="69" fill="none" stroke="#C6A5ED" stroke-width="2.5"/><line x1="404" y1="256.32" x2="404" y2="186.48" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="525.68" y1="396" x2="586.52" y2="396" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="282.32" y1="396" x2="221.48" y2="396" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="404" y1="535.6800000000001" x2="404" y2="605.5200000000001" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="474.56" y1="317.52" x2="509.84000000000003" y2="278.28" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="326.96000000000004" y1="466.56" x2="288.44000000000005" y2="501.84000000000003" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><text x="880" y="251" font-family="Georgia,serif" font-size="27" fill="#7DD9C9" text-anchor="middle">F(x,y,z) = (x,y,z)</text><text x="880" y="339" font-family="Georgia,serif" font-size="31" fill="#C6A5ED" text-anchor="middle">div F = 3</text><text x="880" y="444" font-family="Georgia,serif" font-size="26" fill="#F1BD75" text-anchor="middle">volume integral = 4π</text><text x="880" y="497" font-family="Georgia,serif" font-size="25" fill="#F1BD75" text-anchor="middle">outward sphere flux = 4π</text><rect x="109" y="647" width="1062" height="58" rx="17" fill="#1A3147" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="684" font-family="Georgia,serif" font-size="24" fill="#F2F5FB" text-anchor="middle">Shared internal faces cancel; only the outer surface remains.</text></svg>