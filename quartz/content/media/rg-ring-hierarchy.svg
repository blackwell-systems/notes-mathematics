<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" role="img" aria-labelledby="title desc"><title id="title">A ladder of stronger structures</title><desc id="desc">From broadest to narrowest algebraic structure: ring, commutative ring, integral domain, and field. The field is the strongest and smallest tier because each level adds another axiom.</desc><rect width="800" height="590" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="34">A ladder of stronger structures</text><text x="40" y="91" fill="#C4CEDA" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20">Each higher level is a special case of the one below.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="230" y="150" width="340" height="79" rx="12" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="183" fill="#BCA8EC" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="25">FIELD</text><text x="400" y="216" fill="#C4CEDA" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19">All nonzero elements invertible</text><rect x="177.5" y="244" width="445" height="79" rx="12" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="277" fill="#66C4B4" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="25">INTEGRAL DOMAIN</text><text x="400" y="310" fill="#C4CEDA" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19">Commutative; no zero divisors</text><rect x="125" y="338" width="550" height="79" rx="12" fill="#19283A" stroke="#87B8EE" stroke-width="2"/><text x="400" y="371" fill="#87B8EE" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="25">COMMUTATIVE RING</text><text x="400" y="404" fill="#C4CEDA" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19">Multiplication also commutes</text><rect x="67.5" y="432" width="665" height="79" rx="12" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="400" y="465" fill="#EDB86D" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="25">RING</text><text x="400" y="498" fill="#C4CEDA" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19">Two operations; distributivity</text><text x="400" y="547" fill="#F4F3ED" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">Upper structures satisfy all laws below.</text><text x="40" y="572" fill="#C4CEDA" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="720" font-size="15">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>