<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">The four-element subset lattice</title>
<desc id="desc">The Hasse diagram has empty set at the bottom, the incomparable singleton subsets a and b in the middle, and their union a,b at the top. Inclusion covers form the diamond. The singleton join is a,b and meet is empty set.</desc>
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17122d"/><stop offset="1" stop-color="#0b1225"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="54" y="58" fill="#f6f2ff" font-family="Georgia,serif" font-size="37" font-weight="700" text-anchor="start">Hasse diagram: an order with incomparable elements</text>
<text x="54" y="96" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Incomparability is allowed in a lattice, provided joins and meets exist.</text>
<path d="M54 113 H1146" stroke="#695282" stroke-width="2"/>
<rect x="42" y="134" width="738" height="430" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><rect x="802" y="134" width="356" height="430" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="411" y="175" fill="#78d2c7" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Power set of {a, b} under inclusion</text><line x1="411" y1="503" x2="255" y2="373" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="none" data-to="a"/><line x1="411" y1="503" x2="567" y2="373" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="none" data-to="b"/><line x1="255" y1="373" x2="411" y2="243" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="a" data-to="ab"/><line x1="567" y1="373" x2="411" y2="243" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="b" data-to="ab"/><rect x="355" y="474" width="112" height="58" rx="16" stroke="#78d2c7" stroke-width="3" fill="#26535b" data-subset="none"/><text x="411" y="512" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">∅</text><rect x="199" y="344" width="112" height="58" rx="16" stroke="#bea0f1" stroke-width="3" fill="#493767" data-subset="a"/><text x="255" y="382" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">{a}</text><rect x="511" y="344" width="112" height="58" rx="16" stroke="#bea0f1" stroke-width="3" fill="#493767" data-subset="b"/><text x="567" y="382" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">{b}</text><rect x="336" y="214" width="150" height="58" rx="16" stroke="#f1ce90" stroke-width="3" fill="#624829" data-subset="ab"/><text x="411" y="252" fill="#f6f2ff" font-family="Georgia,serif" font-size="25" font-weight="600" text-anchor="middle">{a,b}</text><text x="827" y="195" fill="#f1ce90" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">INCOMPARABLE</text><text x="827" y="250" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">{a} is not a subset</text><text x="827" y="282" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">of {b}, or vice versa.</text><text x="827" y="360" fill="#c7c6da" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">But both have:</text><text x="827" y="401" fill="#f1ce90" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">join = {a,b}</text><text x="827" y="444" fill="#78d2c7" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">meet = ∅</text><text x="600" y="597" fill="#f1ce90" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">An incomparable pair can still have a join and a meet: this diamond is a lattice.</text>
</svg>