<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Well-definedness of a function on equivalence classes</title><desc id="desc">Bad rule F sends the identical input classes [1] and [4] to two distinct integers 2 and 5. Good rule G sends each class to another class, and outputs [2] and [5] are the same class modulo three.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#87B8EE" stroke-width="1.6"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#EF9292" stroke-width="1.6"/></marker></defs><rect width="1000" height="520" fill="#101A2C"/><text x="40" y="57" fill="#F4F3ED" font-size="35" font-weight="760" text-anchor="start">Well-defined means one answer per class</text><text x="40" y="96" fill="#C4CEDA" font-size="21" font-weight="450" text-anchor="start">Modulo 3, [1] = [4]. The chosen representative must not matter.</text><line x1="40" y1="113" x2="960" y2="113" stroke="#45576F" stroke-width="2" /><rect x="36" y="140" width="446" height="319" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="518" y="140" width="446" height="319" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="61" y="180" fill="#EF9292" font-size="22" font-weight="760" text-anchor="start">FAIL: INTEGER OUTPUTS</text><text x="543" y="180" fill="#66C4B4" font-size="22" font-weight="760" text-anchor="start">PASS: CLASS OUTPUTS</text><text x="61" y="224" fill="#F4F3ED" font-size="22" font-weight="550" text-anchor="start">F([a]) = a + 1</text><text x="543" y="224" fill="#F4F3ED" font-size="22" font-weight="550" text-anchor="start">G([a]) = [a + 1]</text><rect x="63" y="270" width="183" height="58" rx="10" fill="#26334A" stroke="#87B8EE" stroke-width="2"/><text x="154" y="307" fill="#F4F3ED" font-size="23" font-weight="690" text-anchor="middle">[1] = [4]</text><path d="M 246 300 C 292 300 288 271 334 271" fill="none" stroke="#EF9292" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arrow-red)"/><path d="M 246 300 C 292 300 288 358 334 358" fill="none" stroke="#EF9292" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="350" y="245" width="90" height="53" rx="12" fill="#3A2935" stroke="#EF9292" stroke-width="2"/><rect x="350" y="333" width="90" height="53" rx="12" fill="#3A2935" stroke="#EF9292" stroke-width="2"/><text x="395" y="280" fill="#F4F3ED" font-size="27" font-weight="740" text-anchor="middle">2</text><text x="395" y="368" fill="#F4F3ED" font-size="27" font-weight="740" text-anchor="middle">5</text><text x="259" y="430" fill="#EF9292" font-size="19" font-weight="620" text-anchor="middle">Different integers: ambiguous!</text><rect x="540" y="270" width="180" height="58" rx="10" fill="#26334A" stroke="#87B8EE" stroke-width="2"/><text x="630" y="307" fill="#F4F3ED" font-size="23" font-weight="690" text-anchor="middle">[1] = [4]</text><path d="M 721 300 L 799 300" fill="none" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="813" y="268" width="128" height="63" rx="12" fill="#203C40" stroke="#66C4B4" stroke-width="2"/><text x="877" y="306" fill="#F4F3ED" font-size="21" font-weight="690" text-anchor="middle">[2] = [5]</text><text x="740" y="430" fill="#66C4B4" font-size="19" font-weight="620" text-anchor="middle">One output class: unambiguous.</text><text x="500" y="494" fill="#C4CEDA" font-size="20" font-weight="480" text-anchor="middle">Changing representatives cannot change the output of a function on classes.</text></svg>
