<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Conditional probability changes the reference event</title><desc id="desc">Venn diagram of events A and B with intersection highlighted. Conditioning on B asks which share of probability mass assigned to B is also in A, using P(A intersection B) divided by P(B), assuming P(B) is positive.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="46" y="60" font-family="Arial,Helvetica,sans-serif" font-size="35" text-anchor="start" font-weight="bold" fill="#F2F5FC">Conditional probability changes the reference event</text><line x1="46" y1="84" x2="1394" y2="84" stroke="#35546A" stroke-width="2" /><rect x="54" y="118" width="850" height="565" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="78" y="158" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#99BFF1">Condition on B: keep only B</text><rect x="930" y="118" width="457" height="565" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="954" y="158" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#7DD9C9">Normalize within B</text><rect x="169" y="205" width="616" height="391" rx="5" fill="#233F52" stroke="#B9CFE0" stroke-width="2.4"/><text x="188" y="236" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="normal" fill="#B9CFE0">Ω</text><defs><clipPath id="intersect-a"><ellipse cx="432" cy="411" rx="175" ry="132"/></clipPath></defs><ellipse cx="432" cy="411" rx="175" ry="132" fill="#2B5372" stroke="#99BFF1" stroke-width="4"/><ellipse cx="555" cy="411" rx="175" ry="132" fill="#24594F" stroke="#7DD9C9" stroke-width="4"/><ellipse cx="555" cy="411" rx="175" ry="132" fill="#648C73" stroke="none" clip-path="url(#intersect-a)"/><text x="335" y="418" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#F2F5FC">A</text><text x="653" y="418" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" font-weight="normal" fill="#F2F5FC">B</text><text x="492" y="416" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" font-weight="bold" fill="#F2F5FC">A ∩ B</text><text x="205" y="645" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#B9CFE0">Blue: A  ·  Green: B  ·  Gold: A ∩ B</text><rect x="969" y="249" width="366" height="85" rx="10" fill="#11293C" stroke="#456783" stroke-width="2"/><text x="1152" y="283" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#F0BD75">P(A ∩ B)</text><line x1="1043" y1="303" x2="1264" y2="303" stroke="#B9CFE0" stroke-width="2" /><text x="1152" y="328" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#7DD9C9">P(B)</text><text x="1153" y="387" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#F2F5FC">P(A | B) = overlap / B</text><text x="1153" y="466" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#F0BD75">Requirement: P(B) &gt; 0</text><text x="1153" y="539" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#B9CFE0">B becomes the</text><text x="1153" y="569" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#B9CFE0">reference population.</text><text x="720" y="733" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#B9CFE0">The Venn regions convey set inclusion, not literal probability-proportional area.</text></svg>