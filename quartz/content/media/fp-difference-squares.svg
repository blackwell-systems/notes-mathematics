<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">Difference of squares rearrangement</title>
<desc id="desc">A large a by a square with a b by b corner removed forms an L. Two colored rectangular pieces of sizes a times (a minus b) and b times (a minus b) can be rearranged into one rectangle with sides a minus b and a plus b.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="650" rx="16" fill="#101A2C"/>
<text x="48" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#F4F3ED" font-weight="700" text-anchor="start">Difference of squares: rearrange the area</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="500" text-anchor="start">Remove a smaller square, then reassemble what remains.</text>
<path d="M48 127 H932" fill="none" stroke="#42576D" stroke-width="2" />
<rect x="72" y="168" width="379" height="363" rx="13" fill="#102336" stroke="#42576D" stroke-width="2"/><text x="94" y="205" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0CBD8" font-weight="700" text-anchor="start">ORIGINAL SHAPE</text><rect x="150" y="242" width="142" height="218" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="292" y="322" width="80" height="138" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><rect x="292" y="242" width="80" height="80" rx="2" fill="#182A3D" stroke="#678095" stroke-width="2"/><path d="M294 244 L370 320 M370 244 L294 320" fill="none" stroke="#678095" stroke-width="2" /><text x="221" y="353" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#87B8EE" font-weight="700" text-anchor="middle">a</text><text x="221" y="381" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#87B8EE" font-weight="600" text-anchor="middle">× (a−b)</text><text x="332" y="382" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#EDB86D" font-weight="700" text-anchor="middle">b</text><text x="332" y="406" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#EDB86D" font-weight="600" text-anchor="middle">×</text><text x="332" y="429" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#EDB86D" font-weight="600" text-anchor="middle">(a−b)</text><text x="331" y="277" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#C0CBD8" font-weight="700" text-anchor="middle">b²</text><text x="159" y="482" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#F4F3ED" font-weight="600" text-anchor="start">a−b</text><text x="107" y="354" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="600" text-anchor="middle">a</text><text x="331" y="224" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#C0CBD8" font-weight="600" text-anchor="middle">b</text><path d="M474 349 H574" fill="none" stroke="#66C4B4" stroke-width="5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="595" y="168" width="313" height="363" rx="13" fill="#102336" stroke="#42576D" stroke-width="2"/><text x="614" y="205" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0CBD8" font-weight="700" text-anchor="start">REARRANGED</text><rect x="677" y="226" width="142" height="218" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="677" y="444" width="142" height="68" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><text x="748" y="331" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#87B8EE" font-weight="700" text-anchor="middle">a</text><text x="748" y="360" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#87B8EE" font-weight="600" text-anchor="middle">× (a−b)</text><text x="748" y="480" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#EDB86D" font-weight="700" text-anchor="middle">b(a−b)</text><text x="748" y="218" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#66C4B4" font-weight="700" text-anchor="middle">a−b</text><text x="842" y="381" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#66C4B4" font-weight="700" text-anchor="start">a+b</text><text x="487" y="576" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#F4F3ED" font-weight="700" text-anchor="middle">a² − b²  =  (a−b)(a+b)</text>
<path d="M48 586 H932" fill="none" stroke="#42576D" stroke-width="1.5" />
<text x="48" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" font-weight="500" text-anchor="start">This area rearrangement assumes a &gt; b &gt; 0; the identity is algebraic for all a, b.</text>
</svg>
