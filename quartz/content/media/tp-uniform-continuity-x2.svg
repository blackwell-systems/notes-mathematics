<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Pointwise continuity is not uniform continuity</title><desc id="desc">Two graphs of x squared, with compact interval guaranteeing uniform continuity by Heine-Cantor; on all real numbers x_n=n and y_n=n+1/n approach each other but their squared outputs stay at least two apart.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" font-family="Georgia,serif" font-size="37" fill="#F2F5FA" text-anchor="middle">Pointwise continuity is not uniform continuity</text><text x="640" y="107" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">The same formula behaves differently on a compact interval and on all of ℝ.</text><rect x="46" y="148" width="576" height="469" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><rect x="657" y="148" width="579" height="469" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="334" y="208" font-family="Georgia,serif" font-size="34" fill="#7DD9C9" text-anchor="middle">x² on [0,2]</text><text x="946" y="208" font-family="Georgia,serif" font-size="34" fill="#C8A7EE" text-anchor="middle">x² on ℝ</text><text x="334" y="263" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">A single δ works for all x,y</text><text x="946" y="263" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">Arbitrarily close inputs can</text><text x="946" y="295" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">have distant outputs</text><line x1="133" y1="532" x2="133" y2="288" stroke="#C1D0E1" stroke-width="2" /><line x1="133" y1="532" x2="540" y2="532" stroke="#C1D0E1" stroke-width="2" /><line x1="750" y1="532" x2="750" y2="288" stroke="#C1D0E1" stroke-width="2" /><line x1="750" y1="532" x2="1157" y2="532" stroke="#C1D0E1" stroke-width="2" /><path d="M158 521 Q242 520 300 479 Q380 437 495 304" fill="none" stroke="#7DD9C9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M762 527 Q869 527 939 481 Q1042 412 1128 301" fill="none" stroke="#C8A7EE" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="301" cy="479" r="7" fill="#F0BD75" stroke="#F2F5FA" stroke-width="3"/><circle cx="323" cy="467" r="7" fill="#F0BD75" stroke="#F2F5FA" stroke-width="3"/><line x1="301" y1="483" x2="323" y2="483" stroke="#F0BD75" stroke-width="2" /><circle cx="1040" cy="403" r="7" fill="#F0BD75" stroke="#F2F5FA" stroke-width="3"/><circle cx="1053" cy="384" r="7" fill="#F2A3B0" stroke="#F2F5FA" stroke-width="3"/><text x="336" y="581" font-family="Georgia,serif" font-size="21" fill="#7DD9C9" text-anchor="middle">compact domain: Heine–Cantor</text><text x="944" y="581" font-family="Georgia,serif" font-size="21" fill="#C8A7EE" text-anchor="middle">xₙ=n,  yₙ=n+1/n</text><rect x="85" y="642" width="1110" height="63" rx="16" stroke="#F0BD75" stroke-width="2.5" fill="#293648"/><text x="640" y="681" font-family="Georgia,serif" font-size="26" fill="#F2F5FA" text-anchor="middle">|yₙ−xₙ|→0 but |yₙ²−xₙ²|→2 on ℝ.</text></svg>