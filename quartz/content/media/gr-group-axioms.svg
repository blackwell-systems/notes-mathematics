<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">What makes a group?</title><desc id="desc">Three group axioms: associativity, identity and inverses. Commutativity is not required.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="560" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">What makes a group?</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">One operation; three axioms; no required commutativity.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="36" y="148" width="228" height="285" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="52" y="168" width="196" height="44" rx="10" fill="#87B8EE" stroke="#87B8EE" stroke-width="2"/><text x="150" y="198" fill="#101A2C" font-size="19" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ASSOCIATIVITY</text><text x="150" y="286" fill="#F4F3ED" font-size="28" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">(ab)c = a(bc)</text><text x="150" y="358" fill="#C4CEDA" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Regroup without reordering.</text><rect x="286" y="148" width="228" height="285" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="302" y="168" width="196" height="44" rx="10" fill="#66C4B4" stroke="#66C4B4" stroke-width="2"/><text x="400" y="198" fill="#101A2C" font-size="19" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">IDENTITY</text><text x="400" y="286" fill="#F4F3ED" font-size="28" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ea = ae = a</text><text x="400" y="358" fill="#C4CEDA" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">There is a neutral action.</text><rect x="536" y="148" width="228" height="285" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="552" y="168" width="196" height="44" rx="10" fill="#BCA8EC" stroke="#BCA8EC" stroke-width="2"/><text x="650" y="198" fill="#101A2C" font-size="19" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">INVERSES</text><text x="650" y="286" fill="#F4F3ED" font-size="28" font-weight="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">aa⁻¹ = a⁻¹a = e</text><text x="650" y="358" fill="#C4CEDA" font-size="17" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Each action can be undone.</text><text x="400" y="482" fill="#EDB86D" font-size="24" font-weight="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Commutativity ab = ba is NOT required.</text><text x="40" y="540" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>