<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="title desc"><title id="title">An integer is a class of pairs</title><desc id="desc">Pairs (3,1), (4,2), (5,3) are equivalent because cross sums agree. They are different natural pairs representing the same constructed integer 2.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="520" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">An integer is a class of pairs</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">(a,b) represents the proposed difference a − b.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="53" y="172" width="230" height="105" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="168" y="237" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="35" font-weight="750">(3, 1)</text><text x="293" y="239" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="550">~</text><rect x="305" y="172" width="230" height="105" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="420" y="237" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="35" font-weight="750">(4, 2)</text><text x="545" y="239" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="550">~</text><rect x="557" y="172" width="230" height="105" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="672" y="237" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="35" font-weight="750">(5, 3)</text><rect x="117" y="344" width="565" height="90" rx="14" fill="#19283A" stroke="#87B8EE" stroke-width="2"/><text x="400" y="380" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="750">a + d = c + b</text><text x="400" y="415" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="24" font-weight="550">All three pairs represent the integer 2</text><text x="40" y="503" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>