<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">An open ball excludes its boundary</title><desc id="desc">A teal disk centered at x with radius r has a dashed boundary. Point z is strictly inside the circle and belongs to the open ball. Point y is at distance exactly r and is excluded; point w is outside the ball.</desc><rect width="1000" height="590" fill="#101A2C"/><text x="42" y="61" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#F4F3ED" text-anchor="start" >An open ball excludes its boundary</text><text x="42" y="100" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >In Euclidean distance, the open ball contains every point closer than r.</text><line x1="40" y1="119" x2="960" y2="119" stroke="#45576F" stroke-width="2" /><rect x="48" y="143" width="904" height="334" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><line x1="150" y1="326" x2="871" y2="326" stroke="#45576F" stroke-width="1.8" /><line x1="483" y1="162" x2="483" y2="458" stroke="#45576F" stroke-width="1.8" /><circle cx="483" cy="326" r="151" fill="#66C4B4" fill-opacity=".13" stroke="#66C4B4" stroke-width="3.5" stroke-dasharray="10 8"/><line x1="483" y1="326" x2="634" y2="326" stroke="#EDB86D" stroke-width="3" /><circle cx="483" cy="326" r="9" fill="#F4F3ED" stroke="#101A2C" stroke-width="2" /><circle cx="544" cy="255" r="8" fill="#66C4B4" stroke="#F4F3ED" stroke-width="2" /><circle cx="634" cy="326" r="10" fill="#19283A" stroke="#EDB86D" stroke-width="3" /><circle cx="731" cy="238" r="8" fill="#F0A3A3" stroke="#F4F3ED" stroke-width="2" /><text x="466" y="356" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F4F3ED" text-anchor="middle" >x</text><text x="558" y="248" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#66C4B4" text-anchor="start" >z</text><text x="647" y="315" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#EDB86D" text-anchor="start" >y</text><text x="744" y="236" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F0A3A3" text-anchor="start" >w</text><text x="557" y="312" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#EDB86D" text-anchor="middle" >r</text><text x="92" y="202" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#F4F3ED" text-anchor="start" >B(x,r) = {z : d(x,z) &lt; r}</text><text x="91" y="247" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#66C4B4" text-anchor="start" >Filled interior: included</text><text x="690" y="391" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#EDB86D" text-anchor="start" >Dashed circle:</text><text x="690" y="416" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#C4CEDA" text-anchor="start" >boundary excluded</text><text x="690" y="455" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#F0A3A3" text-anchor="start" >w is outside</text><line x1="40" y1="501" x2="960" y2="501" stroke="#45576F" stroke-width="2" /><text x="46" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#C4CEDA" text-anchor="start" >Inside: d(x,z) &lt; r. Boundary: d(x,y) = r, so y is excluded.</text><text x="42" y="577" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C4CEDA" text-anchor="start" >REAL ANALYSIS  /  VISUAL PROOF INTUITION</text></svg>
