<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Green's theorem links interior curl to boundary work</title><desc id="desc">A disk filled with small counterclockwise circulations has an oriented outer boundary. For F=(-y/2,x/2), the planar curl is 1, and both area integral and boundary line integral equal pi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Green's theorem links interior curl to boundary work</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">The unit-disk example gives the same value by either calculation.</text><line x1="42" y1="124" x2="1238" y2="124" stroke="#4C6983" stroke-width="2" /><rect x="53" y="152" width="1175" height="471" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#193249"/><circle cx="374" cy="396" r="175" fill="#2A5660" fill-opacity=".44" stroke="#7DD9C9" stroke-width="5"/><line x1="510" y1="302" x2="465" y2="257" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="506" y1="506" x2="546" y2="461" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="253" y1="521" x2="308" y2="547" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="233" y1="288" x2="203" y2="328" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><path d="M339 351 A16 16 0 1 0 307 351" fill="none" stroke="#C6A5ED" stroke-width="2.5" stroke-linecap="round" /><path d="M412 349 A16 16 0 1 0 380 349" fill="none" stroke="#C6A5ED" stroke-width="2.5" stroke-linecap="round" /><path d="M345 430 A16 16 0 1 0 313 430" fill="none" stroke="#C6A5ED" stroke-width="2.5" stroke-linecap="round" /><path d="M420 433 A16 16 0 1 0 388 433" fill="none" stroke="#C6A5ED" stroke-width="2.5" stroke-linecap="round" /><text x="374" y="601" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">Counterclockwise boundary C</text><text x="862" y="258" font-family="Georgia,serif" font-size="29" fill="#7DD9C9" text-anchor="middle">F = (−y/2, x/2)</text><text x="862" y="342" font-family="Georgia,serif" font-size="29" fill="#C6A5ED" text-anchor="middle">planar curl = 1</text><text x="862" y="444" font-family="Georgia,serif" font-size="30" fill="#F1BD75" text-anchor="middle">∫∫D 1 dA = π</text><text x="862" y="517" font-family="Georgia,serif" font-size="30" fill="#F1BD75" text-anchor="middle">∮C F · dr = π</text><text x="640" y="680" font-family="Georgia,serif" font-size="24" fill="#F2F5FB" text-anchor="middle">Interior circulation sums to the circulation along the outer edge.</text></svg>