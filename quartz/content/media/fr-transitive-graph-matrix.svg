<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Transitive relation: graph and matrix</title>
<desc id="desc">Two blue directed arrows, 1 to 2 and 2 to 3, are accompanied by a gold shortcut arrow 1 to 3. The matrix highlights the one entries in row 1 column 2, row 2 column 3, and row 1 column 3, showing that the two-step route has its required shortcut.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87B8EE"/></marker><marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#EDB86D"/></marker></defs>
 <rect width="1100" height="570" rx="16" fill="#101A2C"/>
 <rect x="0" y="0" width="8" height="570" rx="4" fill="#87B8EE"/>
 <text x="52" y="64" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#F4F3ED">Transitive</text>
 <text x="52" y="103" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#BCCAD9">A two-step path forces a shortcut.</text>
 <line x1="52" x2="1048" y1="126" y2="126" stroke="#40536B" stroke-width="2"/>
 <text x="74" y="169" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#87B8EE">DIRECTED GRAPH</text>
 <text x="637" y="169" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#87B8EE">ADJACENCY MATRIX</text>
