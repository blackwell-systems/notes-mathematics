 <path data-edge="1-2" d="M 177 319 L 264 319" fill="none" stroke="#87B8EE" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr)"/>
<path data-edge="2-3" d="M 336 319 L 423 319" fill="none" stroke="#87B8EE" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arr)"/>
<path data-edge="1-3" d="M 161 348 C 209 457, 384 457, 439 348" fill="none" stroke="#EDB86D" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrGold)"/>
