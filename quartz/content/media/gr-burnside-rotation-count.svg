<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Burnside: count fixed colorings</title><desc id="desc">Bar chart of 2-colorings of four corners fixed by each rotation in cyclic group C4: identity 16, quarter turn 2, half turn 4, three-quarter turn 2. The average is 6 rotation-orbits.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="560" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Burnside: count fixed colorings</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Four corners, two colors, rotations only (C₄).</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="100" y="192" width="105" height="240" rx="5" fill="#66C4B4" stroke="#66C4B4" stroke-width="1"/><text x="152" y="178" fill="#66C4B4" font-size="26" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">16</text><text x="152" y="467" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">identity</text><rect x="272" y="402" width="105" height="30" rx="5" fill="#87B8EE" stroke="#87B8EE" stroke-width="1"/><text x="324" y="388" fill="#87B8EE" font-size="26" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="324" y="467" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">90°</text><rect x="444" y="372" width="105" height="60" rx="5" fill="#EDB86D" stroke="#EDB86D" stroke-width="1"/><text x="496" y="358" fill="#EDB86D" font-size="26" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4</text><text x="496" y="467" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">180°</text><rect x="616" y="402" width="105" height="30" rx="5" fill="#BCA8EC" stroke="#BCA8EC" stroke-width="1"/><text x="668" y="388" fill="#BCA8EC" font-size="26" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="668" y="467" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">270°</text><text x="400" y="511" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">(16 + 2 + 4 + 2) / 4 = 6 distinct necklaces</text><text x="40" y="540" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>