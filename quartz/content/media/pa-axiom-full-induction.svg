<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 397" width="800" height="397" role="img" aria-labelledby="title desc">
<title id="title">5  ·  Full induction</title>
<desc id="desc">The subset P contains zero and is closed under every successor step. All elements along the chain are highlighted as members of P, and full second-order induction forces P to equal the whole natural-number domain N.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 7 L7 3.5 Z" fill="#87B8EE"/></marker></defs>
<rect width="800" height="397" fill="#101A2C"/>
<text x="40" y="52" text-anchor="start" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="750">5  ·  Full induction</text>
<text x="40" y="87" text-anchor="start" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500">A successor-closed set containing zero contains everything.</text>
<path d="M40 108 H760" stroke="#45576F" stroke-width="2"/>

<rect x="48" y="133" width="704" height="211" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<text x="92" y="170" text-anchor="start" fill="#BCA8EC" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">P ⊆ N</text>
<circle cx="140" cy="229" r="33" fill="#223349" stroke="#EDB86D" stroke-width="3"/><text x="140" y="239" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">0</text>
<circle cx="270" cy="229" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="270" y="239" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">1</text>
<circle cx="400" cy="229" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="400" y="239" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">2</text>
<circle cx="530" cy="229" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="530" y="239" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">3</text>
<line x1="178" y1="229" x2="233" y2="229" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="308" y1="229" x2="363" y2="229" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="438" y1="229" x2="493" y2="229" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="568" y1="229" x2="622" y2="229" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="671" y="241" text-anchor="middle" fill="#66C4B4" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="600">…</text>
<text x="157" y="312" text-anchor="middle" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600">0 ∈ P</text>
<text x="518" y="312" text-anchor="middle" fill="#66C4B4" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600">n ∈ P ⇒ S(n) ∈ P</text>
<text x="400" y="370" text-anchor="middle" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600">Full induction forces P = N</text>

<text x="40" y="380" text-anchor="start" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text>
</svg>
