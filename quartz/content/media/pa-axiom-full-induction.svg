<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" role="img" aria-labelledby="title desc">
<title id="title">Why full induction rules out hidden successor chains</title>
<desc id="desc">In an upper panel a hypothetical domain N contains two disconnected successor chains. P is the chain reached from zero; it includes zero and is closed under successor, yet leaves out the lower chain, making P different from N and violating full induction. The lower panel states the required full-induction conclusion: such a P must equal N.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 7 L7 3.5 Z" fill="#87B8EE"/></marker></defs>
<rect width="800" height="660" fill="#101A2C"/>
<text x="40" y="53" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" text-anchor="start">Why full induction matters</text>
<text x="40" y="89" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="520" text-anchor="start">Does the chain from zero account for all of N?</text>
<path d="M40 108 H760" stroke="#45576F" stroke-width="2"/>
<rect x="40" y="126" width="720" height="318" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<text x="65" y="164" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="740" text-anchor="start">THE FIRST FOUR CONDITIONS ALLOW THIS</text>
<text x="65" y="190" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" text-anchor="start">N can have two disconnected successor chains.</text>
<rect x="65" y="205" width="670" height="93" rx="13" fill="#17342F" stroke="#66C4B4" stroke-width="2"/>
<text x="88" y="253" fill="#66C4B4" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="760" text-anchor="start">P</text>
<circle cx="181" cy="259" r="25" fill="#223349" stroke="#EDB86D" stroke-width="2.8"/><text x="181" y="267" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">0</text>
<circle cx="306" cy="259" r="25" fill="#223349" stroke="#66C4B4" stroke-width="2.8"/><text x="306" y="267" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text>
<circle cx="431" cy="259" r="25" fill="#223349" stroke="#66C4B4" stroke-width="2.8"/><text x="431" y="267" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text>
<circle cx="556" cy="259" r="25" fill="#223349" stroke="#66C4B4" stroke-width="2.8"/><text x="556" y="267" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text>
<line x1="208" y1="259" x2="279" y2="259" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="333" y1="259" x2="404" y2="259" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="458" y1="259" x2="529" y2="259" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="652" y="268" fill="#66C4B4" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="680" text-anchor="middle">…</text>
<text x="90" y="332" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" text-anchor="start">Outside P</text>
<text x="172" y="386" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="540" text-anchor="middle">…</text>
<circle cx="261" cy="378" r="28" fill="#223349" stroke="#BCA8EC" stroke-width="2.8"/><text x="261" y="386" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">a₋₁</text>
<circle cx="389" cy="378" r="28" fill="#223349" stroke="#BCA8EC" stroke-width="2.8"/><text x="389" y="386" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">a₀</text>
<circle cx="517" cy="378" r="28" fill="#223349" stroke="#BCA8EC" stroke-width="2.8"/><text x="517" y="386" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">a₁</text>
<line x1="290" y1="378" x2="359" y2="378" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="418" y1="378" x2="487" y2="378" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="603" y="386" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="540" text-anchor="middle">…</text>
<text x="673" y="423" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="730" text-anchor="middle">P ≠ N</text>
<rect x="40" y="460" width="720" height="155" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/>
<text x="65" y="497" fill="#66C4B4" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="740" text-anchor="start">FULL INDUCTION RULES OUT THAT EXTRA CHAIN</text>
<text x="65" y="530" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="510" text-anchor="start">If zero belongs to P and P is successor-closed, then P = N.</text>
<circle cx="173" cy="575" r="22" fill="#223349" stroke="#EDB86D" stroke-width="2.8"/><text x="173" y="583" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">0</text>
<circle cx="298" cy="575" r="22" fill="#223349" stroke="#66C4B4" stroke-width="2.8"/><text x="298" y="583" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text>
<circle cx="423" cy="575" r="22" fill="#223349" stroke="#66C4B4" stroke-width="2.8"/><text x="423" y="583" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text>
<circle cx="548" cy="575" r="22" fill="#223349" stroke="#66C4B4" stroke-width="2.8"/><text x="548" y="583" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text>
<line x1="197" y1="575" x2="272" y2="575" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="322" y1="575" x2="397" y2="575" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="447" y1="575" x2="522" y2="575" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="654" y="583" fill="#66C4B4" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="650" text-anchor="middle">…</text>
<text x="40" y="641" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="start">CONSTRUCTION  /  PROOF  /  EXAMPLE</text>
</svg>