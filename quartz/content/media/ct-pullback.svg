<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Pullback: matching images</title><desc id="desc">Commutative pullback square P→A→C and P→B→C, with f∘p=g∘q. Set pullbacks consist of matching pairs.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Pullback: matching images</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Only pairs that agree in the target survive.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><circle cx="195" cy="184" r="44" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="195" y="193" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A</text><circle cx="590" cy="184" r="44" fill="#243850" stroke="#F4C474" stroke-width="3"/><text x="590" y="193" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C</text><circle cx="195" cy="412" r="44" fill="#243850" stroke="#91BFF6" stroke-width="3"/><text x="195" y="421" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">P</text><circle cx="590" cy="412" r="44" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="590" y="421" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">B</text><line x1="253" y1="184" x2="531" y2="184" stroke="#6DD2BD" stroke-width="3" marker-end="url(#arr)"/><line x1="195" y1="245" x2="195" y2="350" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="253" y1="412" x2="531" y2="412" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="590" y1="350" x2="590" y2="245" stroke="#C7B6F4" stroke-width="3" marker-end="url(#arr)"/><text x="392" y="164" fill="#6DD2BD" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f</text><text x="397" y="390" fill="#91BFF6" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">q</text><text x="168" y="314" fill="#91BFF6" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">p</text><text x="618" y="312" fill="#C7B6F4" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">g</text><text x="398" y="303" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f ∘ p = g ∘ q</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>