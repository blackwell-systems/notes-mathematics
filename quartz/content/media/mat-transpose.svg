<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Transposing swaps rows and columns</title><desc id="desc">Matrix A=[[1,2,3],[4,5,6]] of shape 2 by 3 is transposed into A transpose=[[1,4],[2,5],[3,6]] of shape 3 by 2.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Transposing swaps rows and columns</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="43" y="134" width="515" height="444" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="44" y="135" width="513" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="300.5" y="170" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">A  •  2 rows × 3 columns</text><line x1="55" y1="189" x2="546" y2="189" stroke="#87B8EE" stroke-width="1.4" /><rect x="642" y="134" width="515" height="444" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="643" y="135" width="513" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="899.5" y="170" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Aᵀ  •  3 rows × 2 columns</text><line x1="654" y1="189" x2="1145" y2="189" stroke="#BCA8EC" stroke-width="1.4" /><rect x="110" y="265" width="116" height="84" rx="2" fill="#28415E" stroke="#40536B" stroke-width="1.5"/><text x="168" y="314.56" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">1</text><rect x="226" y="265" width="116" height="84" rx="2" fill="#28415E" stroke="#40536B" stroke-width="1.5"/><text x="284" y="314.56" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">2</text><rect x="342" y="265" width="116" height="84" rx="2" fill="#28415E" stroke="#40536B" stroke-width="1.5"/><text x="400" y="314.56" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">3</text><rect x="110" y="349" width="116" height="84" rx="2" fill="#3A3043" stroke="#40536B" stroke-width="1.5"/><text x="168" y="398.56" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">4</text><rect x="226" y="349" width="116" height="84" rx="2" fill="#3A3043" stroke="#40536B" stroke-width="1.5"/><text x="284" y="398.56" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">5</text><rect x="342" y="349" width="116" height="84" rx="2" fill="#3A3043" stroke="#40536B" stroke-width="1.5"/><text x="400" y="398.56" fill="#F4F3ED" font-family="DejaVu Sans