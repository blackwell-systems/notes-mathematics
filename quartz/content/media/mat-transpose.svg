r="middle">Those rows become columns</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">The entry at row i, column j moves to row j, column i.</text></svg>