<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Probability rules: complement and disjoint additivity</title><desc id="desc">Two event diagrams. The left partitions the sample space into event A and its complement, with probabilities summing to one. The right shows non-overlapping events A and B and their additive probabilities. Diagram areas are schematic.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="46" y="60" font-family="Arial,Helvetica,sans-serif" font-size="35" text-anchor="start" font-weight="bold" fill="#F2F5FC">Probability rules: complement and disjoint additivity</text><line x1="46" y1="84" x2="1394" y2="84" stroke="#35546A" stroke-width="2" /><rect x="42" y="118" width="660" height="562" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="66" y="158" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#99BFF1">Complement: A versus not A</text><rect x="734" y="118" width="660" height="562" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="758" y="158" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#7DD9C9">Disjoint events: A and B</text><rect x="162" y="224" width="420" height="294" rx="6" fill="#223B50" stroke="#B9CFE0" stroke-width="3"/><ellipse cx="364" cy="372" rx="124" ry="103" fill="#315B78" stroke="#99BFF1" stroke-width="3"/><text x="356" y="385" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#F2F5FC">A</text><text x="518" y="294" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" font-weight="normal" fill="#B9CFE0">Aᶜ</text><text x="372" y="562" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#F0BD75">P(A) + P(Aᶜ) = 1</text><rect x="850" y="224" width="420" height="294" rx="6" fill="#223B50" stroke="#B9CFE0" stroke-width="3"/><ellipse cx="966" cy="372" rx="80" ry="103" fill="#315B78" stroke="#99BFF1" stroke-width="3"/><ellipse cx="1157" cy="372" rx="80" ry="103" fill="#27564C" stroke="#7DD9C9" stroke-width="3"/><text x="966" y="381" font-family="Arial,Helvetica,sans-serif" font-size="31" text-anchor="middle" font-weight="normal" fill="#F2F5FC">A</text><text x="1157" y="381" font-family="Arial,Helvetica,sans-serif" font-size="31" text-anchor="middle" font-weight="normal" fill="#F2F5FC">B</text><text x="1059" y="562" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" font-weight="bold" fill="#F0BD75">P(A ∪ B) = P(A) + P(B)</text><text x="372" y="618" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#B9CFE0">All outcomes belong to A or its complement</text><text x="1059" y="618" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#B9CFE0">A ∩ B = ∅: no overlap</text><text x="720" y="724" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="normal" fill="#B9CFE0">Regions are schematic: their geometric areas need not equal their probabilities.</text></svg>