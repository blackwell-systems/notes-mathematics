<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Continuity: input control gives output control</title><desc id="desc">The graph of f(x)=x squared at c=1 is shown with an input interval c plus or minus delta one fourth and output band f(c) plus or minus epsilon three fourths. The curve segment over the input interval stays inside the output band. A dashed vertical at c and dashed horizontal at f(c) meet at the point on the graph.</desc><rect width="1000" height="590" fill="#101A2C"/><text x="42" y="61" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#F4F3ED" text-anchor="start" >Continuity: input control gives output control</text><text x="42" y="100" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >A concrete example: f(x) = x², c = 1, δ = 1/4, ε = 3/4.</text><line x1="40" y1="119" x2="960" y2="119" stroke="#45576F" stroke-width="2" /><rect x="48" y="141" width="904" height="339" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><rect x="90" y="290.75" width="840" height="136.5" fill="#87B8EE" fill-opacity=".12"/><rect x="431.5" y="164" width="209" height="286" fill="#EDB86D" fill-opacity=".08"/><line x1="96" y1="427.25" x2="923" y2="427.25" stroke="#66C4B4" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="96" y1="359" x2="923" y2="359" stroke="#87B8EE" stroke-width="2" /><line x1="96" y1="290.75" x2="923" y2="290.75" stroke="#66C4B4" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="431.5" y1="174" x2="431.5" y2="450" stroke="#EDB86D" stroke-width="1.7" stroke-dasharray="5 5"/><line x1="536" y1="174" x2="536" y2="450" stroke="#87B8EE" stroke-width="1.7" stroke-dasharray="6 5"/><line x1="640.5" y1="174" x2="640.5" y2="450" stroke="#EDB86D" stroke-width="1.7" stroke-dasharray="5 5"/><line x1="100" y1="450" x2="919" y2="450" stroke="#C4CEDA" stroke-width="2.3" /><line x1="118" y1="165" x2="118" y2="452" stroke="#C4CEDA" stroke-width="2.3" /><path d="M159.8 449.1 L166.8 448.8 L173.8 448.4 L180.9 447.9 L187.9 447.5 L194.9 446.9 L201.9 446.3 L209.0 445.7 L216.0 445.0 L223.0 444.3 L230.0 443.5 L237.0 442.6 L244.1 441.7 L251.1 440.8 L258.1 439.8 L265.1 438.7 L272.2 437.6 L279.2 436.5 L286.2 435.3 L293.2 434.0 L300.2 432.7 L307.3 431.3 L314.3 429.9 L321.3 428.5 L328.3 427.0 L335.4 425.4 L342.4 423.8 L349.4 422.1 L356.4 420.4 L363.4 418.6 L370.5 416.8 L377.5 414.9 L384.5 413.0 L391.5 411.0 L398.6 409.0 L405.6 406.9 L412.6 404.8 L419.6 402.6 L426.7 400.4 L433.7 398.1 L440.7 395.8 L447.7 393.4 L454.7 390.9 L461.8 388.5 L468.8 385.9 L475.8 383.3 L482.8 380.7 L489.9 378.0 L496.9 375.2 L503.9 372.4 L510.9 369.6 L517.9 366.7 L525.0 363.7 L532.0 360.7 L539.0 357.7 L546.0 354.6 L553.1 351.4 L560.1 348.2 L567.1 345.0 L574.1 341.6 L581.1 338.3 L588.2 334.9 L595.2 331.4 L602.2 327.9 L609.2 324.3 L616.3 320.7 L623.3 317.0 L630.3 313.3 L637.3 309.5 L644.3 305.7 L651.4 301.8 L658.4 297.9 L665.4 293.9 L672.4 289.9 L679.5 285.8 L686.5 281.7 L693.5 277.5 L700.5 273.3 L707.5 269.0 L714.6 264.6 L721.6 260.3 L728.6 255.8 L735.6 251.3 L742.7 246.8 L749.7 242.2 L756.7 237.5 L763.7 232.8 L770.7 228.1 L777.8 223.3 L784.8 218.4 L791.8 213.5 L798.8 208.6 L805.9 203.6 L812.9 198.5 L819.9 193.4 L826.9 188.2 L834.0 183.0 L841.0 177.8 L848.0 172.5 L855.0 167.1 L862.0 161.7 " fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M431.5 398.8 L436.5 397.2 L441.5 395.5 L446.4 393.8 L451.4 392.1 L456.4 390.4 L461.4 388.6 L466.3 386.8 L471.3 385.0 L476.3 383.1 L481.3 381.3 L486.2 379.4 L491.2 377.5 L496.2 375.5 L501.2 373.5 L506.1 371.5 L511.1 369.5 L516.1 367.5 L521.1 365.4 L526.0 363.3 L531.0 361.2 L536.0 359.0 L541.0 356.8 L546.0 354.6 L550.9 352.4 L555.9 350.1 L560.9 347.8 L565.9 345.5 L570.8 343.2 L575.8 340.8 L580.8 338.5 L585.8 336.0 L590.7 333.6 L595.7 331.1 L600.7 328.7 L605.7 326.1 L610.6 323.6 L615.6 321.0 L620.6 318.4 L625.6 315.8 L630.5 313.2 L635.5 310.5 L640.5 307.8 " fill="none" stroke="#66C4B4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="536" cy="359" r="7" fill="#F4F3ED" stroke="#101A2C" stroke-width="2" /><text x="93" y="296.75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#66C4B4" text-anchor="end" >f(c)+ε</text><text x="93" y="365" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#87B8EE" text-anchor="end" >f(c)</text><text x="93" y="433.25" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#66C4B4" text-anchor="end" >f(c)−ε</text><text x="431.5" y="471" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#EDB86D" text-anchor="middle" >c−δ</text><text x="536" y="471" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#87B8EE" text-anchor="middle" >c</text><text x="640.5" y="471" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#EDB86D" text-anchor="middle" >c+δ</text><text x="733" y="195" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#BCA8EC" text-anchor="start" >f(x) = x²</text><text x="733" y="223" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#C4CEDA" text-anchor="start" >c = 1</text><line x1="40" y1="501" x2="960" y2="501" stroke="#45576F" stroke-width="2" /><text x="46" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#C4CEDA" text-anchor="start" >If |x−1| &lt; 1/4, then |x²−1| &lt; 3/4.</text><text x="42" y="577" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C4CEDA" text-anchor="start" >REAL ANALYSIS  /  VISUAL PROOF INTUITION</text></svg>
