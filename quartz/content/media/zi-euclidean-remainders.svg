<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 585" width="800" height="585" role="img" aria-labelledby="title desc"><title id="title">Euclidean algorithm: descent</title><desc id="desc">Successive divisions 107=3×30+17, 30=17+13, 17=13+4, 13=3×4+1, 4=4×1+0. The last nonzero remainder is gcd 107 and 30, equal to 1.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="585" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Euclidean algorithm: descent</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Each remainder is smaller than the previous divisor.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="102" y="136" width="590" height="60" rx="8" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="176" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="650">107 = 3·30 + 17</text><rect x="102" y="210" width="590" height="60" rx="8" fill="#19283A" stroke="#87B8EE" stroke-width="2"/><text x="400" y="250" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="650">30 = 1·17 + 13</text><rect x="102" y="284" width="590" height="60" rx="8" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="324" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="650">17 = 1·13 + 4</text><rect x="102" y="358" width="590" height="60" rx="8" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="400" y="398" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="650">13 = 3·4 + 1</text><rect x="102" y="432" width="590" height="60" rx="8" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="472" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="650">4 = 4·1 + 0</text><text x="400" y="538" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="21" font-weight="550">Last nonzero remainder = gcd(107,30) = 1</text><text x="40" y="568" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>