<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">Probability and topology are different kinds of structure</title><desc id="desc">The left panel shows a three outcome space with a probability distribution: outcome a weight one half, outcome b one third, and outcome c one sixth, summing to one. The right panel separates a topology of open sets from a sigma-algebra of measurable sets, linked by the Borel operation sigma of topology; a measure assigns nonnegative sizes to measurable sets, and total size one produces probability.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">Probability and topology are different kinds of structure</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><rect x="43" y="119" width="577" height="471" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="643" y="119" width="632" height="471" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="72" y="168" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Measurable events</text><text x="72" y="211" font-family="Arial,sans-serif" font-size="25" fill="#B9CFE0" font-weight="normal" text-anchor="start">Ω = {a,b,c}</text><circle cx="172" cy="344" r="48" fill="#25526A" fill-opacity=".45" stroke="#94C2F2" stroke-width="3"/><text x="172" y="352" font-family="Arial,sans-serif" font-size="27" fill="#F1F5FC" font-weight="bold" text-anchor="middle">a</text><text x="172" y="425" font-family="Arial,sans-serif" font-size="20" fill="#94C2F2" font-weight="normal" text-anchor="middle">P = 1/2</text><circle cx="330" cy="344" r="48" fill="#25526A" fill-opacity=".45" stroke="#79D7C2" stroke-width="3"/><text x="330" y="352" font-family="Arial,sans-serif" font-size="27" fill="#F1F5FC" font-weight="bold" text-anchor="middle">b</text><text x="330" y="425" font-family="Arial,sans-serif" font-size="20" fill="#79D7C2" font-weight="normal" text-anchor="middle">P = 1/3</text><circle cx="489" cy="344" r="48" fill="#25526A" fill-opacity=".45" stroke="#F4BF77" stroke-width="3"/><text x="489" y="352" font-family="Arial,sans-serif" font-size="27" fill="#F1F5FC" font-weight="bold" text-anchor="middle">c</text><text x="489" y="425" font-family="Arial,sans-serif" font-size="20" fill="#F4BF77" font-weight="normal" text-anchor="middle">P = 1/6</text><text x="329" y="517" font-family="Arial,sans-serif" font-size="24" fill="#F1F5FC" font-weight="normal" text-anchor="middle">1/2 + 1/3 + 1/6 = 1</text><text x="670" y="168" font-family="Arial,sans-serif" font-size="24" fill="#F1F5FC" font-weight="normal" text-anchor="start">Topology and measure are distinct</text><rect x="677" y="205" width="268" height="87" rx="13" stroke="#94C2F2" stroke-width="2" fill="#173248"/><text x="811" y="245" font-family="Arial,sans-serif" font-size="24" fill="#94C2F2" font-weight="normal" text-anchor="middle">Topology τ</text><text x="811" y="274" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">open subsets</text><rect x="971" y="205" width="264" height="87" rx="13" stroke="#C7B0F3" stroke-width="2" fill="#173248"/><text x="1104" y="244" font-family="Arial,sans-serif" font-size="23" fill="#C7B0F3" font-weight="normal" text-anchor="middle">σ-algebra Σ</text><text x="1104" y="274" font-family="Arial,sans-serif" font-size="17" fill="#B9CFE0" font-weight="normal" text-anchor="middle">measurable subsets</text><line x1="944" y1="249" x2="968" y2="249" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M956.9472680719654 253.6730201077038 L968 249 L956.9472680719654 244.3269798922962" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><text x="959" y="193" font-family="Arial,sans-serif" font-size="19" fill="#F4BF77" font-weight="normal" text-anchor="middle">σ(τ)</text><line x1="1100" y1="293" x2="1100" y2="363" stroke="#79D7C2" stroke-width="3"  stroke-linecap="round"/><path d="M1095.326979892296 351.94726807196537 L1100 363 L1104.673020107704 351.94726807196537" stroke="#79D7C2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="972" y="377" width="263" height="93" rx="13" stroke="#79D7C2" stroke-width="2" fill="#173248"/><text x="1104" y="418" font-family="Arial,sans-serif" font-size="25" fill="#79D7C2" font-weight="normal" text-anchor="middle">Measure μ</text><text x="1104" y="449" font-family="Arial,sans-serif" font-size="16" fill="#F1F5FC" font-weight="normal" text-anchor="middle">μ(Ω)=1 ⇒ probability</text><text x="677" y="535" font-family="Arial,sans-serif" font-size="19" fill="#B9CFE0" font-weight="normal" text-anchor="start">Borel construction links opens to measurable sets.</text><text x="660" y="648" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="normal" text-anchor="middle">A measure assigns size to events; it does not supply a distance between points.</text></svg>