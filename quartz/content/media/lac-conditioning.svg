<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Conditioning: intersection angle matters</title><desc id="desc">Two systems intersect at (2,2). On the left two lines cross with a wide angle and the solution is robust. On the right nearly parallel lines have solutions that can move far under small perturbations.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Conditioning: intersection angle matters</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="42" y="132" width="534" height="447" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="43" y="133" width="532" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="309" y="168" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Well-conditioned</text><line x1="54" y1="187" x2="564" y2="187" stroke="#87B8EE" stroke-width="1.4" /><rect x="624" y="132" width="534" height="447" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="625" y="133" width="532" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="891" y="168" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Ill-conditioned</text><line x1="636" y1="187" x2="1146" y2="187" stroke="#F28D95" stroke-width="1.4" /><rect x="107" y="220" width="395" height="296" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="107" y1="220" x2="107" y2="516" stroke="#40536B" stroke-width="1" /><line x1="172.83333333333331" y1="220" x2="172.83333333333331" y2="516" stroke="#40536B" stroke-width="2" /><line x1="238.66666666666666" y1="220" x2="238.66666666666666" y2="516" stroke="#40536B" stroke-width="1" /><line x1="304.5" y1="220" x2="304.5" y2="516" stroke="#40536B" stroke-width="1" /><line x1="370.3333333333333" y1="220" x2="370.3333333333333" y2="516" stroke="#40536B" stroke-width="1" /><line x1="436.1666666666667" y1="220" x2="436.1666666666667" y2="516" stroke="#40536B" stroke-width="1" /><line x1="502" y1="220" x2="502" y2="516" stroke="#40536B" stroke-width="1" /><line x1="107" y1="516" x2="502" y2="516" stroke="#40536B" stroke-width="1" /><line x1="107" y1="466.6666666666667" x2="502" y2="466.6666666666667" stroke="#40536B" stroke-width="2" /><line x1="107" y1="417.3333333333333" x2="502" y2="417.3333333333333" stroke="#40536B" stroke-width="1" /><line x1="107" y1="368" x2="502" y2="368" stroke="#40536B" stroke-width="1" /><line x1="107" y1="318.66666666666663" x2="502" y2="318.66666666666663" stroke="#40536B" stroke-width="1" /><line x1="107" y1="269.33333333333337" x2="502" y2="269.33333333333337" stroke="#40536B" stro