" stroke-width="3.3" /><line x1="683" y1="524.88" x2="1078" y2="214.07999999999998" stroke="#F28D95" stroke-width="3.3" /><circle cx="880.5" cy="368" r="8" fill="#98D5A3" stroke="none" stroke-width="1.5"/><line x1="683" y1="507.61333333333334" x2="1078" y2="196.81333333333333" stroke="#EDB86D" stroke-width="2.4" stroke-dasharray="8 5"/><text x="889" y="550" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Tiny changes can shift intersection</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Near-parallel constraints make the solution sensitive to small changes.</text></svg>