<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Curl-free does not always imply conservative</title><desc id="desc">Two paths in a gradient field have equal work between endpoints, while a circular path about the missing origin in the punctured plane has nonzero circulation even though the field has zero curl there.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Curl-free does not always imply conservative</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">The topology of the region matters.</text><line x1="42" y1="124" x2="1238" y2="124" stroke="#4C6983" stroke-width="2" /><rect x="42" y="151" width="578" height="474" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#193249"/><rect x="665" y="151" width="573" height="474" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#193249"/><text x="330" y="207" font-family="Georgia,serif" font-size="27" fill="#7DD9C9" text-anchor="middle">Conservative: F = ∇(xy)</text><text x="950" y="207" font-family="Georgia,serif" font-size="25" fill="#C6A5ED" text-anchor="middle">Curl-free, but not conservative</text><circle cx="169" cy="492" r="7" fill="#F1BD75" stroke="#F2F5FB" stroke-width="2"/><circle cx="480" cy="317" r="7" fill="#F1BD75" stroke="#F2F5FB" stroke-width="2"/><path d="M169 492 Q314 242 480 317" fill="none" stroke="#7DD9C9" stroke-width="5" stroke-linecap="round" /><path d="M169 492 Q358 550 480 317" fill="none" stroke="#F1BD75" stroke-width="5" stroke-linecap="round" /><text x="330" y="570" font-family="Georgia,serif" font-size="24" fill="#C4D0E0" text-anchor="middle">Both paths give Δφ = 1</text><circle cx="952" cy="409" r="137" fill="none" stroke="#F1BD75" stroke-width="5"/><circle cx="952" cy="409" r="18" fill="#0C1E30" stroke="#F3A9B2" stroke-width="3"/><path d="M1087 410 A135 135 0 0 0 953 274" fill="none" stroke="#7DD9C9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="951" y="583" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">∮ F · dr = 2π, despite curl = 0</text><rect x="99" y="648" width="1082" height="57" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#193249"/><text x="640" y="683" font-family="Georgia,serif" font-size="27" fill="#F2F5FB" text-anchor="middle">A hole can obstruct a global potential.</text></svg>