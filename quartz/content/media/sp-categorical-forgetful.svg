<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 854" role="img" aria-labelledby="title desc"><title id="title">Categories relate spaces by structure-preserving maps</title><desc id="desc">On the upper row a chain of forgetful functors takes the category of Hilbert spaces with bounded linear maps to Banach spaces with bounded linear maps, then to topological spaces with continuous maps and finally to sets with functions. A second row sends real vector spaces with linear maps to sets with functions. A lower panel traces a bounded linear map through these functors, preserving identity and composition while progressively forgetting information.</desc><rect width="1440" height="854" rx="17" fill="#0C1E30"/><text x="56" y="57" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="38" font-weight="700">Categories relate spaces by structure-preserving maps</text><line x1="56" y1="81" x2="1384" y2="81" stroke="#35546A" stroke-width="2"/><text x="56" y="120" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="19">FUNCTORS map both objects and arrows, respecting identities and composition.</text><rect x="52" y="146" width="1336" height="359" rx="18" fill="#112538" stroke="#416077" stroke-width="2"/><text x="75" y="185" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700">Forgetful functors: progressively less structure is retained</text><rect x="63" y="235" width="222" height="76" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="174" y="264" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Hilb</text><text x="174" y="288" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">bounded linear maps</text><rect x="404" y="235" width="222" height="76" rx="12" fill="#152F45" stroke="#99BFF1" stroke-width="2.4"/><text x="515" y="264" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Ban</text><text x="515" y="288" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">bounded linear maps</text><rect x="740" y="235" width="222" height="76" rx="12" fill="#152F45" stroke="#7DD9C9" stroke-width="2.4"/><text x="851" y="264" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Top</text><text x="851" y="288" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">continuous maps</text><rect x="1105" y="235" width="222" height="76" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="1216" y="264" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Set</text><text x="1216" y="288" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">all functions</text><line x1="288" y1="271" x2="426" y2="271" stroke="#BBD0E1" stroke-width="2.7" stroke-linecap="round"/><path d="M416.2430558494279 276.0795709309563 L426 271 L416.2430558494279 265.9204290690437" stroke="#BBD0E1" stroke-width="2.7" fill="none" stroke-linecap="round"/><line x1="628" y1="271" x2="748" y2="271" stroke="#BBD0E1" stroke-width="2.7" stroke-linecap="round"/><path d="M738.2430558494278 276.0795709309563 L748 271 L738.2430558494278 265.9204290690437" stroke="#BBD0E1" stroke-width="2.7" fill="none" stroke-linecap="round"/><line x1="963" y1="271" x2="1101" y2="271" stroke="#BBD0E1" stroke-width="2.7" stroke-linecap="round"/><path d="M1091.243055849428 276.0795709309563 L1101 271 L1091.243055849428 265.9204290690437" stroke="#BBD0E1" stroke-width="2.7" fill="none" stroke-linecap="round"/><text x="350" y="222" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">retain norm</text><text x="687" y="222" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">retain opens</text><text x="1028" y="222" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">retain elements</text><rect x="397" y="373" width="236" height="75" rx="12" fill="#152F45" stroke="#7DD9C9" stroke-width="2.4"/><text x="515" y="402" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Vectℝ</text><text x="515" y="426" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">linear maps</text><rect x="1104" y="373" width="224" height="75" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="1216" y="402" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Set</text><text x="1216" y="426" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">ordinary functions</text><line x1="634" y1="409" x2="1100" y2="409" stroke="#BBD0E1" stroke-width="2.7" stroke-linecap="round"/><path d="M1090.243055849428 414.0795709309563 L1100 409 L1090.243055849428 403.9204290690437" stroke="#BBD0E1" stroke-width="2.7" fill="none" stroke-linecap="round"/><text x="865" y="392" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">forget + and scalar multiplication</text><text x="75" y="477" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="17">Hilb, Ban, and Vectℝ are categories of spaces AND particular choices of morphisms.</text><rect x="52" y="527" width="1336" height="244" rx="18" fill="#112538" stroke="#416077" stroke-width="2"/><text x="75" y="568" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700">A linear operator T: H → K between Hilbert spaces</text><text x="75" y="605" fill="#F0BD75" text-anchor="start" font-family="Arial,sans-serif" font-size="19">In Hilb:  T is bounded and linear.</text><text x="75" y="640" fill="#99BFF1" text-anchor="start" font-family="Arial,sans-serif" font-size="19">After forgetting: the same map is bounded linear in Ban.</text><text x="75" y="675" fill="#7DD9C9" text-anchor="start" font-family="Arial,sans-serif" font-size="19">After forgetting again: the same map is continuous in Top.</text><text x="75" y="710" fill="#C6A5ED" text-anchor="start" font-family="Arial,sans-serif" font-size="19">Finally: it is an underlying function in Set.</text><text x="75" y="751" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="17">Not an equivalence of categories: forgetting structure loses information.</text><text x="720" y="815" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Categories organize whole families of spaces, not a more specialized kind of point-set space.</text></svg>