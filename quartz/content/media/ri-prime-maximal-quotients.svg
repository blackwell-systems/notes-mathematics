<svg xmlns="http://www.w3.org/2000/svg" width="800" height="552" viewBox="0 0 800 552" role="img" aria-labelledby="title desc"><title id="title">Prime and maximal ideals</title><desc id="desc">A proper prime ideal P produces an integral-domain quotient R/P. A maximal ideal M produces a field quotient R/M. Every maximal ideal is prime, but not every prime ideal is maximal.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="552" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Prime and maximal ideals</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Quotient structure characterizes each condition.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="80" y="162" width="638" height="120" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="209" fill="#66C4B4" font-size="26" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PRIME IDEAL  P</text><text x="400" y="255" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">R / P has no zero divisors</text><rect x="80" y="319" width="638" height="120" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="366" fill="#BCA8EC" font-size="26" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">MAXIMAL IDEAL  M</text><text x="400" y="412" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">R / M is a field</text><text x="400" y="500" fill="#EDB86D" font-size="25" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Maximal ⇒ prime      (converse fails)</text><text x="40" y="534" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>