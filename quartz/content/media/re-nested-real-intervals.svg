<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 565" width="800" height="565" role="img" aria-labelledby="title desc"><title id="title">Completeness fills the gap</title><desc id="desc">Three nested intervals with rational endpoints containing sqrt2: (1.4,1.5), (1.41,1.42), and (1.414,1.415). They shrink toward a real number absent from the rationals.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="565" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Completeness fills the gap</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Nested rational brackets specify a limit.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="89" y="155" width="624" height="88" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="211" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="34" font-weight="750">1.4 &lt; √2 &lt; 1.5</text><rect x="89" y="263" width="624" height="88" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="319" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="34" font-weight="750">1.41 &lt; √2 &lt; 1.42</text><rect x="89" y="371" width="624" height="88" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="400" y="427" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="34" font-weight="750">1.414 &lt; √2 &lt; 1.415</text><text x="400" y="527" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="22" font-weight="550">Each next interval is nested inside the last.</text><text x="40" y="548" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>