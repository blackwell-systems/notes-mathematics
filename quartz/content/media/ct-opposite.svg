<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Opposite category</title><desc id="desc">Upper row has A→B labeled f in category C; lower row has B→A labeled f in opposite category C-op.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Opposite category</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Reverse arrows, retain the composition laws.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><circle cx="226" cy="184" r="38" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="226" y="193" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A</text><circle cx="584" cy="184" r="38" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="584" y="193" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">B</text><line x1="283" y1="184" x2="525" y2="184" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="162" fill="#F4C474" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f in C</text><circle cx="226" cy="358" r="38" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="226" y="367" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">B</text><circle cx="584" cy="358" r="38" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="584" y="367" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A</text><line x1="525" y1="358" x2="283" y2="358" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><text x="400" y="336" fill="#F4C474" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f in Cᵒᵖ</text><text x="400" y="479" fill="#C1CDDA" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Same objects; every arrow reverses.</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>