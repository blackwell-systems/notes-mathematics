<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Pointwise convergence need not be uniform</title><desc id="desc">Left panel plots the five continuous curves x to the powers 1, 2, 5, 20, and 100 on the interval from zero to one. The higher powers stay near zero except very close to one. Right panel shows their discontinuous pointwise limit: zero for x less than one with an open dot at (1,0), and a filled dot at (1,1). Supremum error remains one for each n.</desc><rect width="1000" height="590" fill="#101A2C"/><text x="42" y="61" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#F4F3ED" text-anchor="start" >Pointwise convergence need not be uniform</text><text x="42" y="100" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >As n increases, the curves approach a function with a jump at x = 1.</text><line x1="40" y1="119" x2="960" y2="119" stroke="#45576F" stroke-width="2" /><rect x="38" y="143" width="590" height="341" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><rect x="646" y="143" width="316" height="341" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><text x="62" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F4F3ED" text-anchor="start" >Continuous functions xⁿ</text><text x="670" y="179" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F4F3ED" text-anchor="start" >Pointwise limit f</text><line x1="89" y1="442" x2="603" y2="442" stroke="#C4CEDA" stroke-width="2" /><line x1="91" y1="205" x2="91" y2="444" stroke="#C4CEDA" stroke-width="2" /><path d="M91.0 442.0 L93.3 441.0 L95.6 439.9 L97.9 438.9 L100.2 437.8 L102.5 436.8 L104.9 435.7 L107.2 434.7 L109.5 433.6 L111.8 432.6 L114.1 431.5 L116.4 430.5 L118.7 429.5 L121.0 428.4 L123.3 427.4 L125.6 426.3 L127.9 425.3 L130.3 424.2 L132.6