<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Three strictly increasing infinite cardinalities under power sets</title>
<desc id="desc">A dark three-level tower places aleph-null at the bottom, the continuum c equals two to the aleph-null in the middle, and two to the c at the top. Upward arrows are labeled power set. The countably infinite naturals, integers and rationals share aleph-null; the reals and subsets of the naturals share the continuum cardinality; subsets of the reals have cardinality two to the c. The diagram makes no claim about potential sizes between the shown levels.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17102F"/><stop offset="1" stop-color="#070A1B"/></linearGradient>
<linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2B2047"/><stop offset="1" stop-color="#10142E"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#33264E"/><stop offset="1" stop-color="#1E1A3C"/></linearGradient>
<linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#674588"/><stop offset="1" stop-color="#37234F"/></linearGradient>
<marker id="uparrow" markerWidth="14" markerHeight="14" refX="6" refY="6" orient="auto" viewBox="0 0 12 12"><path d="M0 12 L6 0 L12 12" fill="none" stroke="#C995FE" stroke-width="2"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/>
<text x="720" y="86" fill="#FAF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="70" font-weight="bold" text-anchor="middle">Hierarchy of Infinite Cardinalities</text><text x="720" y="144" fill="#D9C6F4" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="normal" text-anchor="middle">Power sets are always strictly larger than the original set.</text><path d="M75 166 H1365" stroke="#8759BC" stroke-width="2"/><rect  x="210" y="227" width="1020" height="150" rx="25" fill="url(#plate)" stroke="#B68BFA" stroke-width="3"/><text x="720" y="294" fill="#D9B4FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="70" font-weight="bold" text-anchor="middle">2ᶜ</text><text x="720" y="347" fill="#E9DBF8" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="normal" text-anchor="middle">|𝒫(ℝ)| — subsets of the reals</text><rect  x="210" y="482" width="1020" height="150" rx="25" fill="url(#plate)" stroke="#B68BFA" stroke-width="3"/><text x="720" y="549" fill="#F6D8A5" font-family="Georgia, 'DejaVu Serif', serif" font-size="70" font-weight="bold" text-anchor="middle">𝔠 = 2^ℵ₀</text><text x="720" y="602" fill="#E9DBF8" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="normal" text-anchor="middle">|ℝ| = |𝒫(ℕ)| — the continuum</text><rect  x="210" y="738" width="1020" height="150" rx="25" fill="url(#plate)" stroke="#B68BFA" stroke-width="3"/><text x="720" y="805" fill="#A9DDD7" font-family="Georgia, 'DejaVu Serif', serif" font-size="70" font-weight="bold" text-anchor="middle">ℵ₀</text><text x="720" y="858" fill="#E9DBF8" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="normal" text-anchor="middle">|ℕ| = |ℤ| = |ℚ| — countably infinite</text><path d="M720 735 L720 642" stroke="#E5B7FC" stroke-width="5" marker-end="url(#uparrow)" fill="none"/>
<path d="M720 478 L720 387" stroke="#E5B7FC" stroke-width="5" marker-end="url(#uparrow)" fill="none"/><text x="944" y="686" fill="#E2C4F9" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-weight="normal" text-anchor="start">power set</text><text x="944" y="430" fill="#E2C4F9" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-weight="normal" text-anchor="start">power set</text><text x="122" y="918" fill="#DAC8F4" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-weight="normal" text-anchor="start">Every upward step is a strict increase (Cantor's theorem).</text><text x="122" y="955" fill="#BDAAE3" font-family="Georgia, 'DejaVu Serif', serif" font-size="26" font-weight="normal" text-anchor="start">No claim is made about cardinalities between these levels.</text>
</svg>