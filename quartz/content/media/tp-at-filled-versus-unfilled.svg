<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">One filled face changes first homology</title><desc id="desc">Two identically shaped oriented triangles: one has edges only and nontrivial first homology, and the second has a filled two-simplex whose boundary is the edge cycle and first homology is zero.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">One filled face changes first homology</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">The same edge cycle can be nontrivial or the boundary of a face.</text><rect x="55" y="140" width="567" height="467" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="79" y="183" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">A. Perimeter only</text><line x1="77" y1="199" x2="600" y2="199" stroke="#4C6685" stroke-width="1.5" /><rect x="657" y="140" width="567" height="467" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="681" y="183" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">B. Fill the 2-simplex</text><line x1="679" y1="199" x2="1202" y2="199" stroke="#4C6685" stroke-width="1.5" /><polygon points="340,239 494,497 186,497" fill="none" stroke="#F0BD75" stroke-width="6"/><circle cx="340" cy="239" r="7" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="340" y="221" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">a</text><circle cx="494" cy="497" r="7" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="494" y="479" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">b</text><circle cx="186" cy="497" r="7" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="186" y="479" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">c</text><text x="340" y="564" font-family="Georgia,serif" font-size="23" fill="#7DD9C9" text-anchor="middle" font-weight="400">z is a cycle, not a boundary</text><polygon points="945,239 1099,497 791,497" fill="#4F4664" stroke="#F0BD75" stroke-width="6"/><circle cx="945" cy="239" r="7" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="945" y="221" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">a</text><circle cx="1099" cy="497" r="7" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="1099" y="479" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">b</text><circle cx="791" cy="497" r="7" fill="#F4F2EF" stroke="#7DD9C9" stroke-width="4"/><text x="791" y="479" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">c</text><text x="945" y="564" font-family="Georgia,serif" font-size="23" fill="#F0BD75" text-anchor="middle" font-weight="400">z = ∂₂[a,b,c]</text><text x="340" y="335" font-family="Georgia,serif" font-size="28" fill="#F4F2EF" text-anchor="middle" font-weight="400">no filled face</text><text x="944" y="360" font-family="Georgia,serif" font-size="36" fill="#F0BD75" text-anchor="middle" font-weight="400">[a,b,c]</text><rect x="87" y="627" width="1106" height="67" rx="16" fill="#263348" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="671" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="middle" font-weight="400">Both have ∂₁z = 0; only the filled triangle has z = ∂₂(face).</text></svg>