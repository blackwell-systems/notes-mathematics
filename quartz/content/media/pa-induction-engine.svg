<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 524" width="800" height="524" role="img" aria-labelledby="title desc"><title id="title">Induction is a closure principle</title><desc id="desc">Induction diagram: the base condition P(0) and the inductive implication P(n) implies P(S(n)) establish the property for every natural n.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="524" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Induction is a closure principle</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Prove a base and prove preservation by successor.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="54" y="170" width="294" height="110" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="201" y="214" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="25" font-weight="770">BASE CASE</text><text x="201" y="259" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="34" font-weight="550">P(0)</text><rect x="452" y="170" width="294" height="110" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="599" y="214" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="24" font-weight="770">INDUCTIVE STEP</text><text x="599" y="259" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="26" font-weight="550">P(n) ⇒ P(S(n))</text><line x1="200" y1="288" x2="330" y2="370" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="600" y1="288" x2="470" y2="370" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="120" y="380" width="560" height="89" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="400" y="416" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="23" font-weight="780">CONCLUSION</text><text x="400" y="451" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="25" font-weight="550">P(n) holds for every natural n</text><text x="40" y="507" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>