<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 549" width="800" height="549" role="img" aria-labelledby="title desc"><title id="title">Dedekind cuts: a boundary in Q</title><desc id="desc">A Dedekind cut corresponding to sqrt2 divides the rationals into the lower set q&lt;sqrt2 and its complement q&gt;=sqrt2. The cut itself represents a new real boundary.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="549" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Dedekind cuts: a boundary in Q</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">One real value separates the rational order.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="55" y="162" width="327" height="272" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><rect x="417" y="162" width="327" height="272" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="218" y="218" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="26" font-weight="780">LOWER CUT</text><text x="580" y="218" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="24" font-weight="760">COMPLEMENT</text><text x="218" y="291" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="33" font-weight="550">q &lt; √2</text><text x="580" y="291" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="33" font-weight="550">q ≥ √2</text><text x="218" y="355" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="22" font-weight="550">Downward closed</text><text x="580" y="355" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="22" font-weight="550">Upper side</text><text x="400" y="496" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="24" font-weight="550">The boundary determines the real number.</text><text x="40" y="532" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>