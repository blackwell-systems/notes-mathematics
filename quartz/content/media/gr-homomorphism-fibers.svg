<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Homomorphism: many inputs, one output</title><desc id="desc">The group homomorphism from Z modulo 6 to Z modulo 3 has fibers {0,3} to 0; {1,4} to 1; and {2,5} to 2. Its kernel is {0,3}.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="560" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Homomorphism: many inputs, one output</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">f : Z/6 → Z/3 sends a residue to its value mod 3.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="68" y="163" width="244" height="72" rx="18" fill="#19283A" stroke="#66C4B4" stroke-width="2.5"/><text x="190" y="208" fill="#F4F3ED" font-size="28" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0, 3</text><line x1="336" y1="199" x2="480" y2="199" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="575" cy="199" r="36" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="575" y="209" fill="#F4F3ED" font-size="30" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="68" y="267" width="244" height="72" rx="18" fill="#19283A" stroke="#BCA8EC" stroke-width="2.5"/><text x="190" y="312" fill="#F4F3ED" font-size="28" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1, 4</text><line x1="336" y1="303" x2="480" y2="303" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="575" cy="303" r="36" fill="#223349" stroke="#BCA8EC" stroke-width="2.6"/><text x="575" y="313" fill="#F4F3ED" font-size="30" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><rect x="68" y="371" width="244" height="72" rx="18" fill="#19283A" stroke="#EDB86D" stroke-width="2.5"/><text x="190" y="416" fill="#F4F3ED" font-size="28" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2, 5</text><line x1="336" y1="407" x2="480" y2="407" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="575" cy="407" r="36" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="575" y="417" fill="#F4F3ED" font-size="30" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="190" y="490" fill="#C4CEDA" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Z/6 (inputs)</text><text x="575" y="490" fill="#C4CEDA" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Z/3 (outputs)</text><text x="40" y="540" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>