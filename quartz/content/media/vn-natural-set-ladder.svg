<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="title desc">
<title id="title">Von Neumann natural numbers from the empty set</title>
<desc id="desc">Four cards show the first von Neumann natural numbers: zero is the empty set and contains no elements; one is the set containing zero; two contains zero and one; three contains zero, one, and two. Each successive number contains all the earlier numbers, as defined by the successor n union singleton n.</desc>
<rect width="800" height="490" fill="#101A2C"/>
<text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="34" font-weight="750">A number contains its predecessors</text>
<text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="20" font-weight="500">One concrete set-theoretic encoding of counting</text>
<path d="M40 108 H760" stroke="#45576F" stroke-width="2"/>
<rect x="40" y="142" width="170" height="240" rx="15" fill="#19283A" stroke="#EDB86D" stroke-width="2"/>
<text x="125" y="184" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="36" font-weight="750">0</text>
<path d="M55 199 H195" stroke="#45576F" stroke-width="1.7"/>
<text x="125" y="242" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="21" font-weight="650">∅</text>
<text x="125" y="315" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="19" font-weight="500">(empty)</text>
<text x="125" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="17" font-weight="500">0 elements</text>
<rect x="225" y="142" width="170" height="240" rx="15" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<text x="310" y="184" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="36" font-weight="750">1</text>
<path d="M240 199 H380" stroke="#45576F" stroke-width="1.7"/>
<text x="310" y="242" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="21" font-weight="650">{0}</text>
<circle cx="310" cy="304" r="19" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="310" y="312" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="20" font-weight="600">0</text>
<text x="310" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="17" font-weight="500">1 element</text>
<rect x="410" y="142" width="170" height="240" rx="15" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<text x="495" y="184" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="36" font-weight="750">2</text>
<path d="M425 199 H565" stroke="#45576F" stroke-width="1.7"/>
<text x="495" y="242" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="21" font-weight="650">{0,1}</text>
<circle cx="472" cy="304" r="19" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="472" y="312" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="20" font-weight="600">0</text><circle cx="518" cy="304" r="19" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="518" y="312" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="20" font-weight="600">1</text>
<text x="495" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="17" font-weight="500">2 elements</text>
<rect x="595" y="142" width="170" height="240" rx="15" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<text x="680" y="184" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="36" font-weight="750">3</text>
<path d="M610 199 H750" stroke="#45576F" stroke-width="1.7"/>
<text x="680" y="242" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="21" font-weight="650">{0,1,2}</text>
<circle cx="634" cy="304" r="19" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="634" y="312" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="20" font-weight="600">0</text><circle cx="680" cy="304" r="19" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="680" y="312" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="20" font-weight="600">1</text><circle cx="726" cy="304" r="19" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="726" y="312" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="20" font-weight="600">2</text>
<text x="680" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="17" font-weight="500">3 elements</text>
<text x="400" y="429" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="19" font-weight="550">Successor keeps everything already present, then adds n itself.</text>
<text x="40" y="471" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text>
</svg>