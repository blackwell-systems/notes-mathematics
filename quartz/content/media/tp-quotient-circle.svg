<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 529" width="800" height="529" role="img" aria-labelledby="title desc"><title id="title">Quotient: glue endpoints</title><desc id="desc">The interval [0,1] maps to a circle by identifying endpoint 0 with endpoint 1; the quotient topology makes the induced map continuous.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="529" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Quotient: glue endpoints</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A segment becomes a circle after identifying endpoints.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="67" y="179" width="306" height="96" rx="14" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><text x="219" y="236" fill="#F4F5EF" font-size="32" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">[0,1]</text><line x1="385" y1="228" x2="495" y2="228" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><circle cx="624" cy="284" r="105" fill="none" stroke="#C7B6F4" stroke-width="7"/><text x="624" y="286" fill="#C7B6F4" font-size="30" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">S¹</text><text x="400" y="202" fill="#F4C474" font-size="21" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">identify 0 ~ 1</text><text x="400" y="477" fill="#F4F5EF" font-size="25" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">[0,1] / (0 ~ 1) ≅ circle</text><text x="40" y="510" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>