<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545" role="img" aria-labelledby="title desc"><title id="title">The multiplicative group of F₄</title><desc id="desc">Repeated multiplication by alpha cycles the three nonzero field elements 1, alpha, alpha+1 and back to 1. The multiplicative group of F4 has order 3 and is cyclic.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="545" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">The multiplicative group of F₄</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">The three nonzero field elements form a cycle.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><line x1="437.6854381382906" y1="209.26671104786513" x2="542.3145618617094" y2="312.73328895213484" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="527" y1="350" x2="273" y2="350" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="257.6854381382906" y1="312.73328895213484" x2="362.3145618617094" y2="209.26671104786513" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="400" cy="172" r="46" fill="#223349" stroke="#EDB86D" stroke-width="3"/><text x="400" y="182" fill="#F4F3ED" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><circle cx="580" cy="350" r="46" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="580" y="360" fill="#F4F3ED" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α</text><circle cx="220" cy="350" r="46" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="220" y="360" fill="#F4F3ED" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α+1</text><text x="400" y="298" fill="#EDB86D" font-size="26" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">multiply by α</text><text x="400" y="484" fill="#F4F3ED" font-size="25" font-weight="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α³ = 1  ;  F₄× has order 3</text><text x="40" y="527" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>