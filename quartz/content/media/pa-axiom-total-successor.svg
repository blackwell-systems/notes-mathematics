<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc">
<title id="title">2  ·  Total successor</title>
<desc id="desc">Every natural number has one well-defined successor that remains in N. Shown is a finite window into the successor chain with arrows between successive natural numbers.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 7 L7 3.5 Z" fill="#87B8EE"/></marker></defs>
<rect width="800" height="360" fill="#101A2C"/>
<text x="40" y="52" text-anchor="start" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="750">2  ·  Total successor</text>
<text x="40" y="87" text-anchor="start" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500">For every input in N, S gives exactly one output in N.</text>
<path d="M40 108 H760" stroke="#45576F" stroke-width="2"/>

<rect x="48" y="133" width="704" height="170" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<circle cx="144" cy="220" r="33" fill="#223349" stroke="#EDB86D" stroke-width="3"/><text x="144" y="230" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">0</text>
<circle cx="310" cy="220" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="310" y="230" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">1</text>
<circle cx="476" cy="220" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="476" y="230" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">2</text>
<circle cx="642" cy="220" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="642" y="230" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">3</text>
<line x1="182" y1="220" x2="269" y2="220" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="348" y1="220" x2="435" y2="220" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="514" y1="220" x2="601" y2="220" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="226" y="198" text-anchor="middle" fill="#87B8EE" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">S</text>
<text x="393" y="198" text-anchor="middle" fill="#87B8EE" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">S</text>
<text x="559" y="198" text-anchor="middle" fill="#87B8EE" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">S</text>
<text x="400" y="289" text-anchor="middle" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">S : N → N</text>

<text x="40" y="343" text-anchor="start" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text>
</svg>
