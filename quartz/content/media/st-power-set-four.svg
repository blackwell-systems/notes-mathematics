<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc"><title id="title">Complete power-set lattice for four elements</title><desc id="desc">The complete Hasse lattice for the power set of {a,b,c,d} has sixteen nodes and thirty-two cover edges. The five levels, from four members to none, have counts one, four, six, four and one, equal to C(4,k). The counts sum to sixteen.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#1C1034"/><stop offset="1" stop-color="#08091B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#392350"/><stop offset="1" stop-color="#1B1734"/></linearGradient>
<linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#60368A"/><stop offset="1" stop-color="#37204D"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#41245D"/><stop offset="1" stop-color="#23173D"/></linearGradient>
</defs><rect width="1680" height="1180" fill="url(#bg)"/><text x="840" y="80" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="69" text-anchor="middle" font-weight="700">Power Set of Four Elements</text><text x="840" y="134" font-family="Georgia, 'DejaVu Serif', serif"  font-size="30" text-anchor="middle" fill="#DCC8F9">The 16 subsets of {a, b, c, d}, grouped by size and immediate inclusion.</text><path d="M40 169 H1640" stroke="#8F65BF" stroke-width="2"/><rect x="28" y="212" width="255" height="96" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="155" y="254" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="27" text-anchor="middle" font-weight="700">4 elements</text><text x="155" y="290" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#D6B8FA">C(4,4) = 1</text><rect x="28" y="360" width="255" height="96" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="155" y="402" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="27" text-anchor="middle" font-weight="700">3 elements</text><text x="155" y="438" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#D6B8FA">C(4,3) = 4</text><rect x="28" y="513" width="255" height="96" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="155" y="555" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="27" text-anchor="middle" font-weight="700">2 elements</text><text x="155" y="591" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#D6B8FA">C(4,2) = 6</text><rect x="28" y="666" width="255" height="96" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="155" y="708" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="27" text-anchor="middle" font-weight="700">1 element</text><text x="155" y="744" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#D6B8FA">C(4,1) = 4</text><rect x="28" y="819" width="255" height="96" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="155" y="861" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="27" text-anchor="middle" font-weight="700">0 elements</text><text x="155" y="897" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#D6B8FA">C(4,0) = 1</text><path data-from="7" data-to="15" d="M545 408 L950 260" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="11" data-to="15" d="M815 408 L950 260" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="13" data-to="15" d="M1085 408 L950 260" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="14" data-to="15" d="M1355 408 L950 260" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="3" data-to="7" d="M375 561 L545 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="3" data-to="11" d="M375 561 L815 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="5" data-to="7" d="M605 561 L545 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="5" data-to="13" d="M605 561 L1085 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="9" data-to="11" d="M835 561 L815 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="9" data-to="13" d="M835 561 L1085 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="6" data-to="7" d="M1065 561 L545 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="6" data-to="14" d="M1065 561 L1355 408" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="10" data-to="11" d="M1295 561 L815