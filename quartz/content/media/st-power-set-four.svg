roke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="0" data-to="2" d="M950 867 L815 714" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="0" data-to="4" d="M950 867 L1085 714" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><path data-from="0" data-to="8" d="M950 867 L1355 714" fill="none" stroke="#C39EE8" stroke-width="3" stroke-opacity=".72"/><rect x="824" y="222" width="252" height="76" rx="18" fill="url(#highlight)" stroke="#D6A5FF" stroke-width="3" data-mask="15" data-rank="4"/><text x="950" y="273" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="32" text-anchor="middle" >{a, b, c, d}</text><rect x="435" y="370" width="220" height="76" rx="18" fill="url(#highlight)" stroke="#D6A5FF" stroke-width="3" data-mask="7" data-rank="3"/><text x="545" y="421" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="32" text-anchor="middle" >{a, b, c}</text><rect x="705" y="370" width="220" height="76" rx="18" fill="url(#highlight)" stroke="#D6A5FF" stroke-width="3" data-mask="11" data-rank="3"/><text x="815" y="421" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="32" text-anchor="middle" >{a, b, d}</text><rect x="975" y="370" width="220" height="76" rx="18" fill="url(#highlight)" stroke="#D6A5FF" stroke-width="3" data-mask="13" data-rank="3"/><text x="1085" y="421" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="32" text-anchor="middle" >{a, c, d}</text><rect x="1245" y="370" width="220" height="76" rx="18" fill="url(#highlight)" stroke="#D6A5FF" stroke-width="3" data-mask="14" data-rank="3"/><text x="1355" y="421" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="32" text-anchor="middle" >{b, c, d}</text><rect x="284.5" y="523" width="181" height="76" rx="18" fill="url(#highlight)" stroke="#D6A5FF" stroke-width="3" data-mask="3" data-rank="2"/><text x="375" y="574" font-family="Georgia, 'DejaVu