<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Divergence versus curl</title><desc id="desc">On the left arrows of F=(x,y) expand outward with divergence 2 and zero curl; on the right arrows of G=(-y,x) rotate counterclockwise with divergence zero and planar curl 2.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Divergence versus curl</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">Outward expansion and rotation are different local properties.</text><line x1="42" y1="124" x2="1238" y2="124" stroke="#4C6983" stroke-width="2" /><rect x="44" y="153" width="572" height="469" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#193249"/><rect x="666" y="153" width="571" height="469" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#193249"/><text x="330" y="210" font-family="Georgia,serif" font-size="28" fill="#7DD9C9" text-anchor="middle">Divergence: F = (x,y)</text><text x="950" y="210" font-family="Georgia,serif" font-size="28" fill="#C6A5ED" text-anchor="middle">Curl: G = (−y,x)</text><line x1="225" y1="306" x2="191" y2="272" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="225" y1="411" x2="191" y2="411" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="225" y1="516" x2="191" y2="550" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="330" y1="306" x2="330" y2="272" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="330" y1="516" x2="330" y2="550" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="435" y1="306" x2="469" y2="272" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="435" y1="411" x2="469" y2="411" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="435" y1="516" x2="469" y2="550" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="850" y1="307" x2="879" y2="278" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="850" y1="411" x2="850" y2="382" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="850" y1="515" x2="821" y2="486" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="950" y1="307" x2="979" y2="307" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="950" y1="515" x2="921" y2="515" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="1050" y1="307" x2="1079" y2="336" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="1050" y1="411" x2="1050" y2="440" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="1050" y1="515" x2="1021" y2="544" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="559" font-family="Georgia,serif" font-size="23" fill="#C4D0E0" text-anchor="middle">div F = 2, planar curl = 0</text><text x="950" y="559" font-family="Georgia,serif" font-size="23" fill="#C4D0E0" text-anchor="middle">div G = 0, planar curl = 2</text><rect x="96" y="645" width="1088" height="63" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#193249"/><text x="640" y="684" font-family="Georgia,serif" font-size="24" fill="#F2F5FB" text-anchor="middle">Divergence measures local net outflow; curl measures local circulation.</text></svg>