<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Read a matrix: row first, column second</title><desc id="desc">A 3 by 4 matrix with the second row and third column highlighted. Their intersection at row 2 column 3 is entry a23. The first subscript selects a row and second selects a column.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Read a matrix: row first, column second</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="44" y="132" width="745" height="445" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="45" y="133" width="743" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="416.5" y="168" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Matrix A has 3 rows and 4 columns</text><line x1="56" y1="187" x2="777" y2="187" stroke="#87B8EE" stroke-width="1.4" /><rect x="218" y="239" width="96" height="81" rx="2" fill="#122338" stroke="#40536B" stroke-width="1.5"/><text x="266" y="286.79" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₁₁</text><rect x="314" y="239" width="96" height="81" rx="2" fill="#122338" stroke="#40536B" stroke-width="1.5"/><text x="362" y="286.79" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₁₂</text><rect x="410" y="239" width="96" height="81" rx="2" fill="#3C3148" stroke="#40536B" stroke-width="1.5"/><text x="458" y="286.79" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₁₃</text><rect x="506" y="239" width="96" height="81" rx="2" fill="#122338" stroke="#40536B" stroke-width="1.5"/><text x="554" y="286.79" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₁₄</text><rect x="218" y="320" width="96" height="81" rx="2" fill="#254361" stroke="#40536B" stroke-width="1.5"/><text x="266" y="367.78999999999996" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₂₁</text><rect x="314" y="320" width="96" height="81" rx="2" fill="#254361" stroke="#40536B" stroke-width="1.5"/><text x="362" y="367.78999999999996" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₂₂</text><rect x="410" y="320" width="96" height="81" rx="2" fill="#4A4564" stroke="#40536B" stroke-width="1.5"/><text x="458" y="367.78999999999996" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">a₂₃</