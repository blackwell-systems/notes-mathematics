<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">Closing a relation adds only missing pairs</title><desc id="desc">Original edges 1 to 2, 2 to 3 in blue. Reflexive adds loops, symmetric adds reverses, transitive adds 1 to 3, all red.</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">Closing a relation adds only missing pairs</text><rect x="25" y="120" width="560" height="248" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="35" y="130" width="540" height="59" rx="13" fill="#122338"/><text x="305" y="162" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Original relation</text><path d="M49 190 H561" stroke="#87B8EE" opacity=".35" stroke-width="2"/><path d="M192 255 L286 255" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M333 255 L421 255" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><circle cx="170" cy="255" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="170" y="255" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="311" cy="255" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="311" y="255" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="446" cy="255" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="446" y="255" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">3</text><text x="305" y="330" fill="#C4CEDA" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle">R = {(1,2), (2,3)}</text><rect x="615" y="120" width="560" height="248" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="625" y="130" width="540" height="59" rx="13" fill="#122338"/><text x="895" y="162" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Reflexive closure</text><path d="M639 190 H1151" stroke="#F28D95" opacity=".35" stroke-width="2"/><path d="M782 255 L876 255" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M923 255 L1011 255" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M748 235 C705 156 815 156 772 235" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><path d="M889 235 C846 156 956 156 913 235" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><path d="M1024 235 C981 156 1091 156 1048 235" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><circle cx="760" cy="255" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="760" y="255" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="901" cy="255" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="901" y="255" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="1036" cy="255" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="1036" y="255" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">3</text><text x="895" y="330" fill="#F28D95" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle">Add (1,1), (2,2), (3,3)</text><rect x="25" y="380" width="560" height="248" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="35" y="390" width="540" height="59" rx="13" fill="#122338"/><text x="305" y="422" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Symmetric closure</text><path d="M49 450 H561" stroke="#F28D95" opacity=".35" stroke-width="2"/><path d="M192 515 L286 515" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M333 515 L421 515" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M289 537 L195 537" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><path d="M424 537 L336 537" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><circle cx="170" cy="515" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="170" y="515" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="311" cy="515" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="311" y="515" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="446" cy="515" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="446" y="515" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">3</text><text x="305" y="590" fill="#F28D95" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle">Add (2,1), (3,2)</text><rect x="615" y="380" width="560" height="248" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="625" y="390" width="540" height="59" rx="13" fill="#122338"/><text x="895" y="422" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Transitive closure</text><path d="M639 450 H1151" stroke="#F28D95" opacity=".35" stroke-width="2"/><path d="M782 515 L876 515" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M923 515 L1011 515" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M772 538 Q901 620 1024 538" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><circle cx="760" cy="515" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="760" y="515" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="901" cy="515" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="901" y="515" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="1036" cy="515" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="1036" y="515" fill="#F4F3ED" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">3</text><text x="895" y="590" fill="#F28D95" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle">Add (1,3)</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">Red marks pairs added to satisfy each property.</text></svg>