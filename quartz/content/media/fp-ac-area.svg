<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">AC method area model for 6x squared plus 11x plus 3</title>
<desc id="desc">A four-part rectangle with widths three x and one and heights two x and three has tile areas six x squared, two x, nine x, and three. The middle terms two x plus nine x give eleven x, and the sides give factors (three x plus one)(two x plus three).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="650" rx="16" fill="#101A2C"/>
<text x="48" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#F4F3ED" font-weight="700" text-anchor="start">Quadratic factoring: the AC rectangle</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="500" text-anchor="start">6x² + 11x + 3 becomes a rectangle with two binomial sides.</text>
<path d="M48 127 H932" fill="none" stroke="#42576D" stroke-width="2" />
<rect x="61" y="167" width="481" height="365" rx="13" fill="#102336" stroke="#42576D" stroke-width="2"/><rect x="160" y="205" width="180" height="120" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="340" y="205" width="60" height="120" rx="2" fill="#14283C" stroke="#BCA8EC" stroke-width="2"/><rect x="160" y="325" width="180" height="180" rx="2" fill="#14283C" stroke="#BCA8EC" stroke-width="2"/><rect x="340" y="325" width="60" height="180" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><text x="250" y="271" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#87B8EE" font-weight="700" text-anchor="middle">6x²</text><text x="370" y="271" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#BCA8EC" font-weight="700" text-anchor="middle">2x</text><text x="250" y="432" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#BCA8EC" font-weight="700" text-anchor="middle">9x</text><text x="370" y="432" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#EDB86D" font-weight="700" text-anchor="middle">3</text><text x="250" y="195" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F3ED" font-weight="700" text-anchor="middle">3x</text><text x="370" y="195" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F3ED" font-weight="700" text-anchor="middle">1</text><text x="148" y="271" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F3ED" font-weight="700" text-anchor="end">2x</text><text x="148" y="433" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F3ED" font-weight="700" text-anchor="end">3</text><text x="280" y="523" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#66C4B4" font-weight="600" text-anchor="middle">width = 3x + 1</text><rect x="575" y="188" width="350" height="319" rx="13" fill="#182A3D" stroke="#42576D" stroke-width="2"/><text x="599" y="232" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#EDB86D" font-weight="700" text-anchor="start">SPLIT THE MIDDLE TERM</text><text x="600" y="280" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#F4F3ED" font-weight="700" text-anchor="start">a × c = 6 × 3 = 18</text><text x="600" y="323" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#BCA8EC" font-weight="700" text-anchor="start">9 × 2 = 18</text><text x="600" y="361" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#BCA8EC" font-weight="700" text-anchor="start">9 + 2 = 11</text><path d="M600 385 H896" fill="none" stroke="#42576D" stroke-width="1.5" /><text x="600" y="432" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#66C4B4" font-weight="700" text-anchor="start">(3x + 1)(2x + 3)</text><text x="90" y="565" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#F4F3ED" font-weight="500" text-anchor="start">The 9x and 2x rectangles explain exactly where 11x comes from.</text>
<path d="M48 586 H932" fill="none" stroke="#42576D" stroke-width="1.5" />
<text x="48" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" font-weight="500" text-anchor="start">Area interpretation for x ≥ 0; the polynomial identity holds for every real x.</text>
</svg>
