<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 624" role="img" aria-labelledby="title desc"><title id="title">Relative openness in a subspace</title><desc id="desc">Three aligned number lines show the closed interval A from zero to one, the ambient open interval V from minus one to one half, and their intersection U from zero inclusive to one half exclusive. U is relatively open inside A, but is not open as a subset of the real line.</desc><rect width="1280" height="624" rx="20" fill="#0C1E30"/><text x="54" y="65" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F3F6FC">Relative openness in a subspace</text><line x1="54" y1="87" x2="1226" y2="87" stroke="#34566C" stroke-width="2"/><rect x="52" y="110" width="1176" height="432" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><line x1="260" y1="190" x2="835" y2="190" stroke="#7CA9C9" stroke-width="3"/><path d="M260 190 l15 -7 v14 Z M835 190 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="260" y1="313" x2="835" y2="313" stroke="#7CA9C9" stroke-width="3"/><path d="M260 313 l15 -7 v14 Z M835 313 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="260" y1="438" x2="835" y2="438" stroke="#7CA9C9" stroke-width="3"/><path d="M260 438 l15 -7 v14 Z M835 438 l-15 -7 v14 Z" fill="#7CA9C9"/><text x="70" y="153" font-family="Arial,sans-serif" font-size="25" fill="#F3F6FC" text-anchor="start" font-weight="normal">1  The subspace A = [0,1]</text><line x1="500" y1="190" x2="800" y2="190" stroke="#F2BB68" stroke-width="11" stroke-linecap="round"/><circle cx="500" cy="190" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="800" cy="190" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="500" y="224" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">0</text><text x="800" y="224" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1</text><text x="867" y="185" font-family="Arial,sans-serif" font-size="19" fill="#F2BB68" text-anchor="start" font-weight="normal">Closed endpoints belong to A</text><text x="70" y="279" font-family="Arial,sans-serif" font-size="25" fill="#F3F6FC" text-anchor="start" font-weight="normal">2  Ambient open interval V = (-1, 1/2)</text><line x1="350" y1="313" x2="650" y2="313" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="350" cy="313" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><circle cx="650" cy="313" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><text x="350" y="349" font-family="Arial,sans-serif" font-size="18" fill="#F3F6FC" text-anchor="middle" font-weight="normal">-1</text><text x="650" y="349" font-family="Arial,sans-serif" font-size="18" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1/2</text><text x="867" y="305" font-family="Arial,sans-serif" font-size="19" fill="#68D2C0" text-anchor="start" font-weight="normal">Open in the real line</text><text x="70" y="403" font-family="Arial,sans-serif" font-size="25" fill="#F3F6FC" text-anchor="start" font-weight="normal">3  Intersection U = A ∩ V = [0, 1/2)</text><line x1="500" y1="438" x2="650" y2="438" stroke="#F2BB68" stroke-width="10" stroke-linecap="round"/><circle cx="500" cy="438" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="650" cy="438" r="9" fill="#0C1E30" stroke="#F2BB68" stroke-width="3"/><text x="500" y="473" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">0</text><text x="650" y="473" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1/2</text><text x="800" y="473" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1</text><text x="867" y="437" font-family="Arial,sans-serif" font-size="19" fill="#F2BB68" text-anchor="start" font-weight="normal">Open in A, not in ℝ</text><rect x="52" y="558" width="1176" height="49" rx="10" fill="#10263A" stroke="#426982" stroke-width="2"/><text x="640" y="591" font-family="Arial,sans-serif" font-size="20" fill="#F3F6FC" text-anchor="middle" font-weight="normal">A set may be open relative to A without being open in the ambient space.</text></svg>