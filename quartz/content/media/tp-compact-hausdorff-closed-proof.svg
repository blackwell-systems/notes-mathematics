<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 778" role="img" aria-labelledby="title desc"><title id="title">Why compact subsets of Hausdorff spaces are closed</title><desc id="desc">A compact region K is covered by three illustrated open neighborhoods V1 V2 and V3 around representative points. Outside K is x, surrounded by three open neighborhoods U1 U2 and U3, each chosen disjoint from its paired V. Compactness supplies finitely many V covering K. The intersection of the corresponding U is still open, contains x and misses all of K.</desc><rect width="1280" height="778" rx="16" fill="#0C1E30"/><text x="42" y="61" font-family="Arial,sans-serif" font-size="35" fill="#F2F7FC" text-anchor="start" font-weight="bold">Why compact subsets of Hausdorff spaces are closed</text><line x1="42" y1="86" x2="1238" y2="86" stroke="#45627B" stroke-width="2" stroke-linecap="round"/><rect x="44" y="112" width="1192" height="566" rx="13" fill="#162F45" stroke="#46617B" stroke-width="2"/><text x="76" y="158" font-family="Arial,sans-serif" font-size="23" fill="#F2F7FC" text-anchor="start" font-weight="normal">1  Separate x from each y in the compact set K</text><ellipse cx="877" cy="334" rx="248" ry="93" fill="#24415A" fill-opacity=".85" stroke="#F1BD73" stroke-width="4"/><text x="878" y="339" font-family="Arial,sans-serif" font-size="30" fill="#F1BD73" text-anchor="middle" font-weight="bold">K</text><ellipse cx="700" cy="334" rx="163" ry="133" fill="none" stroke="#91BEED" stroke-width="3" stroke-dasharray="7 6"/><text x="700" y="214" font-family="Arial,sans-serif" font-size="22" fill="#91BEED" text-anchor="middle" font-weight="normal">V₁</text><ellipse cx="867" cy="334" rx="163" ry="133" fill="none" stroke="#72D4C0" stroke-width="3" stroke-dasharray="7 6"/><text x="867" y="214" font-family="Arial,sans-serif" font-size="22" fill="#72D4C0" text-anchor="middle" font-weight="normal">V₂</text><ellipse cx="1025" cy="334" rx="163" ry="133" fill="none" stroke="#C5ACEF" stroke-width="3" stroke-dasharray="7 6"/><text x="1025" y="214" font-family="Arial,sans-serif" font-size="22" fill="#C5ACEF" text-anchor="middle" font-weight="normal">V₃</text><circle cx="206" cy="339" r="11" fill="#F1BD73" stroke="#F2F7FC" stroke-width="2"/><circle cx="206" cy="339" r="123" stroke="#91BEED" stroke-width="3" fill="none"/><circle cx="206" cy="339" r="96" stroke="#72D4C0" stroke-width="3" fill="none"/><circle cx="206" cy="339" r="69" stroke="#C5ACEF" stroke-width="3" fill="none"/><text x="206" y="353" font-family="Arial,sans-serif" font-size="27" fill="#F1BD73" text-anchor="middle" font-weight="bold">x</text><text x="80" y="497" font-family="Arial,sans-serif" font-size="20" fill="#F2F7FC" text-anchor="start" font-weight="normal">All Uᵢ surround x; each Uᵢ is disjoint from its paired Vᵢ.</text><text x="80" y="536" font-family="Arial,sans-serif" font-size="20" fill="#F2F7FC" text-anchor="start" font-weight="normal">2  Compactness selects finitely many Vᵢ covering K.</text><text x="80" y="576" font-family="Arial,sans-serif" font-size="21" fill="#72D4C0" text-anchor="start" font-weight="normal">3  U = U₁ ∩ U₂ ∩ U₃ is open around x and disjoint from K.</text><text x="641" y="741" font-family="Arial,sans-serif" font-size="21" fill="#F2F7FC" text-anchor="middle" font-weight="normal">Thus x lies in an open subset of X \ K; the complement of K is open.</text></svg>