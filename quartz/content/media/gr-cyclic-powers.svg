<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">A generator visits every element</title><desc id="desc">The cycle of repeated multiplication by 3 modulo 7: 1,3,2,6,4,5, returning to 1. This proves 3 generates the multiplicative group of nonzero residues modulo 7.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="560" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">A generator visits every element</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Powers of 3 modulo 7 cycle through all nonzero residues.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><line x1="443.6384044716072" y1="178.45536178864288" x2="536.3615955283929" y2="215.54463821135712" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="578.5934446557212" y1="279.9789484989126" x2="576.4065553442788" y2="353.0210515010874" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="531.1069505586836" y1="416.8047675003897" x2="443.8930494413164" y2="450.1952324996103" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="356.1069505586836" y1="450.1952324996103" x2="268.8930494413164" y2="416.8047675003897" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="223.59344465572119" y1="353.0210515010874" x2="221.40655534427881" y2="279.9789484989126" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="263.6384044716072" y1="215.54463821135712" x2="356.3615955283928" y2="178.45536178864288" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="400" cy="161" r="42" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="400" y="171" fill="#F4F3ED" font-size="31" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><circle cx="580" cy="233" r="42" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="580" y="243" fill="#F4F3ED" font-size="31" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3</text><circle cx="575" cy="400" r="42" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="575" y="410" fill="#F4F3ED" font-size="31" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><circle cx="400" cy="467" r="42" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="400" y="477" fill="#F4F3ED" font-size="31" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">6</text><circle cx="225" cy="400" r="42" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="225" y="410" fill="#F4F3ED" font-size="31" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4</text><circle cx="220" cy="233" r="42" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="220" y="243" fill="#F4F3ED" font-size="31" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">5</text><text x="400" y="320" fill="#EDB86D" font-size="25" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">multiply by 3 (mod 7)</text><text x="40" y="540" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>