xt-anchor="middle">First entry: (1, 2) · (5, 7) = 19</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">c₁₁ = 1·5 + 2·7 = 19    •    Every entry is a row–column dot product.</text></svg>