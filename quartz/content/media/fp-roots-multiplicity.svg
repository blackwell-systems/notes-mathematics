<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">Simple crossing and double touching roots graph</title>
<desc id="desc">Graph of f(x)=(x minus 3) squared times (x plus 3), with horizontal axis at y zero. The curve crosses the axis at x negative three because that root occurs once, rises to a positive local maximum, and touches the axis at x three without crossing because its factor is squared, then rises again.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="650" rx="16" fill="#101A2C"/>
<text x="48" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#F4F3ED" font-weight="700" text-anchor="start">Roots and multiplicity: read the graph</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="500" text-anchor="start">f(x) = (x−3)²(x+3) has one crossing and one touch.</text>
