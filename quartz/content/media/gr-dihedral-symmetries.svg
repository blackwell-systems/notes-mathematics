<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545" role="img" aria-labelledby="title desc"><title id="title">The eight symmetries of a square</title><desc id="desc">Four rotation cards showing zero, 90, 180 and 270 degrees, plus a reminder of the four additional reflections, giving eight dihedral symmetries in total.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="545" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">The eight symmetries of a square</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">D₄ has four rotations and four reflections.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="78" y="180" width="150" height="185" rx="18" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="153" y="235" fill="#66C4B4" font-size="32" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">r⁰</text><text x="153" y="288" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0°</text><text x="153" y="334" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">rotation</text><rect x="250" y="180" width="150" height="185" rx="18" fill="#19283A" stroke="#87B8EE" stroke-width="2"/><text x="325" y="235" fill="#87B8EE" font-size="32" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">r¹</text><text x="325" y="288" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">90°</text><text x="325" y="334" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">rotation</text><rect x="422" y="180" width="150" height="185" rx="18" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="497" y="235" fill="#EDB86D" font-size="32" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">r²</text><text x="497" y="288" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">180°</text><text x="497" y="334" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">rotation</text><rect x="594" y="180" width="150" height="185" rx="18" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="669" y="235" fill="#BCA8EC" font-size="32" font-weight="780" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">r³</text><text x="669" y="288" fill="#F4F3ED" font-size="26" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">270°</text><text x="669" y="334" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">rotation</text><rect x="85" y="418" width="630" height="72" rx="18" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="400" y="463" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4 rotations + 4 reflections = 8 symmetries</text><text x="40" y="525" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>