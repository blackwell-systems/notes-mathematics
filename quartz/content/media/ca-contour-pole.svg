<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Contours remember enclosed poles</title><desc id="desc">Two counterclockwise closed circular contours of radius one in the complex plane. The left encloses the singularity zero of one over z, giving a contour integral two pi i. The right does not enclose zero and gives integral zero because one over z is holomorphic on its interior.</desc><rect width="1200" height="540" rx="19" fill="#0C1E30"/><text x="44" y="58" fill="#F2F6FA" font-family="Georgia,serif" font-size="37" font-weight="bold">Contours remember enclosed poles</text><line x1="44" y1="82" x2="1156" y2="82" stroke="#48637A" stroke-width="2"/><rect x="43" y="105" width="535" height="365" rx="12" fill="#152D42" stroke="#436078" stroke-width="2"/><rect x="623" y="105" width="535" height="365" rx="12" fill="#152D42" stroke="#436078" stroke-width="2"/><text x="72" y="149" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#F2F6FA">Pole inside</text><text x="651" y="149" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#F2F6FA">Pole outside</text><circle cx="317" cy="285" r="114" stroke="#91BCEE" stroke-width="5" fill="none"/><circle cx="881" cy="285" r="114" stroke="#91BCEE" stroke-width="5" fill="none"/><path d="M378 188 Q403 202 415 227 L392 216" fill="none" stroke="#91BCEE" stroke-width="5" stroke-linecap="round"/><path d="M941 188 Q968 202 981 228 L955 216" fill="none" stroke="#91BCEE" stroke-width="5" stroke-linecap="round"/><circle cx="317" cy="285" r="11" fill="#EDB96E"/><circle cx="1040" cy="285" r="11" fill="#EDB96E"/><text x="333" y="274" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#EDB96E">0</text><text x="1058" y="277" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#EDB96E">0</text><text x="317" y="435" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#F2F6FA">∮ dz / z = 2πi</text><text x="881" y="435" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#F2F6FA">∮ dz / z = 0</text><text x="600" y="520" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#F2F6FA">Same integrand, different winding around the singularity.</text></svg>