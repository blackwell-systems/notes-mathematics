<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Power set Hasse lattice for a three-element set</title>
<desc id="desc">The eight subsets of {a,b,c} form four levels: empty set; singleton sets {a}, {b}, {c}; two-element sets {a,b}, {a,c}, {b,c}; and the full set. Twelve Hasse edges connect immediately included subsets. The levels have counts 1, 3, 3, 1, giving eight subsets.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17102F"/><stop offset="1" stop-color="#070A1B"/></linearGradient>
<linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2B2047"/><stop offset="1" stop-color="#10142E"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#33264E"/><stop offset="1" stop-color="#1E1A3C"/></linearGradient>
<linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#674588"/><stop offset="1" stop-color="#37234F"/></linearGradient>
<marker id="uparrow" markerWidth="14" markerHeight="14" refX="6" refY="6" orient="auto" viewBox="0 0 12 12"><path d="M0 12 L6 0 L12 12" fill="none" stroke="#C995FE" stroke-width="2"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/>
<text x="720" y="86" fill="#FAF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="70" font-weight="bold" text-anchor="middle">Power Set of Three Elements</text><text x="720" y="144" fill="#D9C6F4" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="normal" text-anchor="middle">Every subset appears once; upward edges add exactly one element.</text><path d="M75 166 H1365" stroke="#8759BC" stroke-width="2"/><text x="720" y="224" fill="#DDBDFA" font-family="Georgia, 'DejaVu Serif', serif" font-size="45" font-weight="bold" text-anchor="middle">|𝒫({a, b, c})| = 2³ = 8</text><path data-cover="->a" d="M720 745 L370 588" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="->b" d="M720 745 L720 588" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="->c" d="M720 745 L1070 588" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="a->a,b" d="M370 588 L370 435" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="a->a,c" d="M370 588 L720 435" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="b->a,b" d="M720 588 L370 435" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="b->b,c" d="M720 588 L1070 435" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="c->a,c" d="M1070 588 L720 435" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="c->b,c" d="M1070 588 L1070 435" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="a,b->a,b,c" d="M370 435 L720 286" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="a,c->a,b,c" d="M720 435 L720 286" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><path data-cover="b,c->a,b,c" d="M1070 435 L720 286" fill="none" stroke="#C5A4EB" stroke-width="4" stroke-linecap="round"/><rect data-subset="" x="629" y="704" width="182" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="720" y="760" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">∅</text><rect data-subset="a" x="275" y="547" width="190" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="370" y="603" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{a}</text><rect data-subset="b" x="625" y="547" width="190" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="720" y="603" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{b}</text><rect data-subset="c" x="975" y="547" width="190" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="1070" y="603" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{c}</text><rect data-subset="a,b" x="260" y="394" width="220" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="370" y="450" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{a, b}</text><rect data-subset="a,c" x="610" y="394" width="220" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="720" y="450" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{a, c}</text><rect data-subset="b,c" x="960" y="394" width="220" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="1070" y="450" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{b, c}</text><rect data-subset="a,b,c" x="585" y="245" width="270" height="82" rx="19" fill="url(#node)" stroke="#CA9AFD" stroke-width="3"/><text x="720" y="301" fill="#FBF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="bold" text-anchor="middle">{a, b, c}</text><text x="172" y="302" fill="#D4B5F5" font-family="Georgia, 'DejaVu Serif', serif" font-size="26" font-weight="normal" text-anchor="start">3 elements</text><text x="172" y="453" fill="#D4B5F5" font-family="Georgia, 'DejaVu Serif', serif" font-size="26" font-weight="normal" text-anchor="start">2 elements</text><text x="172" y="605" fill="#D4B5F5" font-family="Georgia, 'DejaVu Serif', serif" font-size="26" font-weight="normal" text-anchor="start">1 element</text><text x="172" y="762" fill="#D4B5F5" font-family="Georgia, 'DejaVu Serif', serif" font-size="26" font-weight="normal" text-anchor="start">0 elements</text><rect  x="48" y="831" width="1344" height="133" rx="24" fill="url(#footer)" stroke="#AF7BF3" stroke-width="3"/><text x="720" y="885" fill="#FAF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="44" font-weight="bold" text-anchor="middle">1 + 3 + 3 + 1 = 8 subsets</text><text x="720" y="929" fill="#D9C9F2" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-weight="normal" text-anchor="middle">Each edge is a strict inclusion that adds one element; reflexive edges are implicit.</text>
</svg>