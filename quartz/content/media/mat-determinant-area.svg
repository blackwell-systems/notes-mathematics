<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Determinant: area scaling and collapse</title><desc id="desc">Left: the transformation with matrix [[2,1],[1,3]] has determinant 5 and maps the unit square to a parallelogram of area 5. Right: [[1,2],[2,4]] has determinant 0 and collapses the unit square to a line.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Determinant: area scaling and collapse</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="130" width="541" height="447" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="131" width="539" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="310.5" y="166" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">det(A) = 5: area becomes 5</text><line x1="52" y1="185" x2="569" y2="185" stroke="#87B8EE" stroke-width="1.4" /><rect x="617" y="130" width="541" height="447" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="618" y="131" width="539" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="887.5" y="166" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">det(B) = 0: square collapses</text><line x1="629" y1="185" x2="1146" y2="185" stroke="#F28D95" stroke-width="1.4" /><rect x="111" y="233" width="392" height="290" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="146.63636363636363" y1="233" x2="146.63636363636363" y2="523" stroke="#40536B" stroke-width="2" /><line x1="217.9090909090909" y1="233" x2="217.9090909090909" y2="523" stroke="#40536B" stroke-width="1" /><line x1="289.1818181818182" y1="233" x2="289.1818181818182" y2="523" stroke="#40536B" stroke-width="1" /><line x1="360.4545454545455" y1="233" x2="360.4545454545455" y2="523" stroke="#40536B" stroke-width="1" /><line x1="431.72727272727275" y1="233" x2="431.72727272727275" y2="523" stroke="#40536B" stroke-width="1" /><line x1="503" y1="233" x2="503" y2="523" stroke="#40536B" stroke-width="1" /><line x1="111" y1="496.6363636363636" x2="503" y2="496.6363636363636" stroke="#40536B" stroke-width="2" /><line x1="111" y1="443.9090909090909" x2="503" y2="443.9090909090909" stroke="#40536B" stroke-width="1" /><line x1="111" y1="391.1818181818182" x2="503" y2="391.1818181818182" stroke="#40536B" stroke-width="1" /><line x1="111" y1="338.4545454545455" x2="503" y2="338.4545454545455" stroke="#40536B" stroke-width="1" /><line x1="111" y1="285.72727272727275" x2="503" y2="285.72727272727275" stroke="#40536B" stroke-width="1" /><line x1="111" y1="233" x2="503" y2="233" stroke="#40536B" stroke