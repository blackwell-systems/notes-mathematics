<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The infinite-dimensional unit ball is not compact</title><desc id="desc">The first three unit basis vectors of ell-two are shown as a finite-coordinate schematic, while all infinitely many orthonormal vectors have norm one and pairwise distance square root two, preventing sequential compactness.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" fill="#F2F5FA" font-family="Georgia,serif" font-size="38" text-anchor="middle">The infinite-dimensional unit ball is not compact</text><text x="640" y="106" fill="#C4D2E0" font-family="Georgia,serif" font-size="22" text-anchor="middle">Orthonormal vectors stay √2 apart, so no subsequence can converge.</text><rect x="54" y="149" width="750" height="471" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><rect x="830" y="149" width="395" height="471" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><text x="427" y="216" fill="#7DD9C9" font-family="Georgia,serif" font-size="30" text-anchor="middle">Finite-coordinate sketch of ℓ²</text><line x1="246" y1="498" x2="563" y2="498" stroke="#7DD9C9" stroke-width="5" /><circle cx="563" cy="498" r="8" fill="#7DD9C9" stroke="#F2F5FA" stroke-width="2"/><text x="575" y="486" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="start">e₁</text><line x1="246" y1="498" x2="355" y2="290" stroke="#C6A5ED" stroke-width="5" /><circle cx="355" cy="290" r="8" fill="#C6A5ED" stroke="#F2F5FA" stroke-width="2"/><text x="367" y="278" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="start">e₂</text><line x1="246" y1="498" x2="152" y2="352" stroke="#F1BD75" stroke-width="5" /><circle cx="152" cy="352" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><text x="164" y="340" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="start">e₃</text><circle cx="246" cy="498" r="8" fill="#F2F5FA" stroke="#F2F5FA" stroke-width="2"/><text x="467" y="565" fill="#C4D2E0" font-family="Georgia,serif" font-size="21" text-anchor="middle">… infinitely many basis vectors eₙ</text><text x="1026" y="253" fill="#7DD9C9" font-family="Georgia,serif" font-size="31" text-anchor="middle">‖eₙ‖ = 1</text><text x="1026" y="344" fill="#C6A5ED" font-family="Georgia,serif" font-size="29" text-anchor="middle">‖eₘ−eₙ‖ = √2</text><text x="1026" y="379" fill="#C4D2E0" font-family="Georgia,serif" font-size="24" text-anchor="middle">for m ≠ n</text><text x="1026" y="489" fill="#F2A4B0" font-family="Georgia,serif" font-size="26" text-anchor="middle">No convergent</text><text x="1026" y="523" fill="#F2A4B0" font-family="Georgia,serif" font-size="26" text-anchor="middle">subsequence</text><rect x="83" y="638" width="1113" height="66" rx="16" fill="#263449" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="680" fill="#F2F5FA" font-family="Georgia,serif" font-size="26" text-anchor="middle">Closed + bounded is not sufficient for compactness in ℓ².</text></svg>