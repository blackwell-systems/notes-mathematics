<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Eigenvectors keep their line under a linear map</title><desc id="desc">Under A=diag(2,1), eigenvector e1=(1,0) becomes (2,0), e2=(0,1) stays (0,1), and generic vector u=(1,1) becomes (2,1), changing direction.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Eigenvectors keep their line under a linear map</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="42" y="128" width="537" height="453" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="43" y="129" width="535" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="310.5" y="164" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Before: e₁, e₂, and u</text><line x1="54" y1="183" x2="567" y2="183" stroke="#87B8EE" stroke-width="1.4" /><rect x="621" y="128" width="537" height="453" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="622" y="129" width="535" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="889.5" y="164" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">After A = diag(2, 1)</text><line x1="633" y1="183" x2="1146" y2="183" stroke="#BCA8EC" stroke-width="1.4" /><rect x="109" y="235" width="402" height="290" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="109" y1="235" x2="109" y2="525" stroke="#40536B" stroke-width="1" /><line x1="209.5" y1="235" x2="209.5" y2="525" stroke="#40536B" stroke-width="2" /><line x1="310" y1="235" x2="310" y2="525" stroke="#40536B" stroke-width="1" /><line x1="410.5" y1="235" x2="410.5" y2="525" stroke="#40536B" stroke-width="1" /><line x1="511" y1="235" x2="511" y2="525" stroke="#40536B" stroke-width="1" /><line x1="109" y1="525" x2="511" y2="525" stroke="#40536B" stroke-width="1" /><line x1="109" y1="452.5" x2="511" y2="452.5" stroke="#40536B" stroke-width="2" /><line x1="109" y1="380" x2="511" y2="380" stroke="#40536B" stroke-width="1" /><line x1="109" y1="307.5" x2="511" y2="307.5" stroke="#40536B" stroke-width="1" /><line x1="109" y1="235" x2="511" y2="235" stroke="#40536B" stroke-width="1" /><line x1="209.5" y1="452.5" x2="310" y2="452.5" stroke="#87B8EE" stroke-width="4" marker-end="url(#arr-blue)" stroke-linecap="round"/><line x1="209.5" y1="452.5" x2="209.5" y2="380" stroke="#F28D95" stroke-width="4" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="209.5" y1="452.5" x2="310" y2="380" stroke="#98D5A3" stroke-width="4" marker-end="url(#arr-green)" stroke-linecap="round"/><rect x="689" y="235" width="402" height="290" rx="2" fill="#122338" stro