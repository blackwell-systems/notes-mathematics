<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">Perfect square trinomial four-area model</title>
<desc id="desc">A square of side x plus three is partitioned at x and 3 along each side, giving tiles x squared, 3x, 3x and 9. The two identical rectangular strips add to six x.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="650" rx="16" fill="#101A2C"/>
<text x="48" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#F4F3ED" font-weight="700" text-anchor="start">Perfect square: the doubled middle</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="500" text-anchor="start">Both side lengths are x + 3, so two matching strips appear.</text>
<path d="M48 127 H932" fill="none" stroke="#42576D" stroke-width="2" />
<rect x="64" y="167" width="498" height="363" rx="13" fill="#102336" stroke="#42576D" stroke-width="2"/><rect x="153" y="248" width="230" height="182" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="383" y="248" width="108" height="182" rx="2" fill="#14283C" stroke="#BCA8EC" stroke-width="2"/><rect x="153" y="430" width="230" height="73" rx="2" fill="#14283C" stroke="#BCA8EC" stroke-width="2"/><rect x="383" y="430" width="108" height="73" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><text x="268" y="344" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#87B8EE" font-weight="700" text-anchor="middle">x²</text><text x="437" y="345" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#BCA8EC" font-weight="700" text-anchor="middle">3x</text><text x="268" y="473" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#BCA8EC" font-weight="700" text-anchor="middle">3x</text><text x="437" y="473" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#EDB86D" font-weight="700" text-anchor="middle">9</text><text x="268" y="235" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#87B8EE" font-weight="700" text-anchor="middle">x</text><text x="437" y="235" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#EDB86D" font-weight="700" text-anchor="middle">3</text><text x="141" y="346" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#87B8EE" font-weight="700" text-anchor="end">x</text><text x="141" y="474" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#EDB86D" font-weight="700" text-anchor="end">3</text><rect x="596" y="210" width="316" height="266" rx="14" fill="#182A3D" stroke="#42576D" stroke-width="2"/><text x="627" y="267" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#C0CBD8" font-weight="700" text-anchor="start">ONE LARGE SQUARE</text><text x="627" y="311" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#F4F3ED" font-weight="600" text-anchor="start">x² + 3x + 3x + 9</text><text x="627" y="359" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#BCA8EC" font-weight="700" text-anchor="start">= x² + 6x + 9</text><path d="M627 388 H880" fill="none" stroke="#42576D" stroke-width="2" /><text x="627" y="435" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#66C4B4" font-weight="700" text-anchor="start">= (x + 3)²</text><text x="90" y="558" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#F4F3ED" font-weight="500" text-anchor="start">The middle coefficient is 2 × 3 = 6 because there are TWO 3x regions.</text>
<path d="M48 586 H932" fill="none" stroke="#42576D" stroke-width="1.5" />
<text x="48" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" font-weight="500" text-anchor="start">Area interpretation for x ≥ 0; the identity holds for every real x.</text>
</svg>
