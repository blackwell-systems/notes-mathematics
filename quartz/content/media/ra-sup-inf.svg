<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Supremum and infimum: two kinds of bounds</title><desc id="desc">The set S={1/n:n&gt;=1} on a number line. Filled dots at 1, 1/2, 1/3 and smaller values approach the hollow point 0. Supremum 1 belongs to S; infimum 0 does not. The region at and right of 1 consists of upper bounds.</desc><rect width="1000" height="590" fill="#101A2C"/><text x="42" y="61" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#F4F3ED" text-anchor="start" >Supremum and infimum: two kinds of bounds</text><text x="42" y="100" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >S = {1, 1/2, 1/3, ...} is bounded even though its smallest value is missing.</text><line x1="40" y1="119" x2="960" y2="119" stroke="#45576F" stroke-width="2" /><rect x="48" y="144" width="904" height="329" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><rect x="755" y="184" width="197" height="242" fill="#66C4B4" fill-opacity=".12"/><line x1="100" y1="345" x2="918" y2="345" stroke="#C4CEDA" stroke-width="3" /><line x1="155" y1="335" x2="155" y2="355" stroke="#C4CEDA" stroke-width="2" /><text x="155" y="387" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#F4F3ED" text-anchor="middle" >0</text><line x1="305" y1="335" x2="305" y2="355" stroke="#C4CEDA" stroke-width="2" /><text x="305" y="387" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#F4F3ED" text-anchor="middle" >1/4</text><line x1="455" y1="335" x2="455" y2="355" stroke="#C4CEDA" stroke-width="2" /><text x="455" y="387" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#F4F3ED" text-anchor="middle" >1/2</text><line x1="755" y1="335" x2="755" y2="355" stroke="#C4CEDA" stroke-width="2" /><text x="755" y="387" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#F4F3ED" text-anchor="middle" >1</text><line x1="155" y1="203" x2="155" y2="411" stroke="#EDB86D" stroke-width="2" stroke-dasharray="5 7"/><line x1="755" y1="203" x2="755" y2="411" stroke="#66C4B4" stroke-width="2" stroke-dasharray="5 7"/><text x="93" y="181" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#F4F3ED" text-anchor="start" >S = {1/n : n ≥ 1}</text><text x="780" y="224" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#66C4B4" text-anchor="start" >UPPER BOUNDS</text><circle cx="755.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="455.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="355.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="305.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="275.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="255.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="240.71" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="230.00" cy="345" r="7" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="221.67" cy="345" r="5" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="215.00" cy="345" r="5" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="205.00" cy="345" r="5" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="195.00" cy="345" r="5" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="185.00" cy="345" r="4" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="176.43" cy="345" r="4" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="170.00" cy="345" r="4" fill="#87B8EE" stroke="#101A2C" stroke-width="1.5" /><circle cx="155" cy="345" r="10" fill="#19283A" stroke="#EDB86D" stroke-width="3" /><circle cx="755" cy="345" r="10" fill="#66C4B4" stroke="#F4F3ED" stroke-width="2" /><text x="167" y="246" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#EDB86D" text-anchor="start" >inf S = 0</text><text x="167" y="276" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#C4CEDA" text-anchor="start" >Not attained</text><text x="718" y="266" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#66C4B4" text-anchor="start" >sup S = 1</text><text x="718" y="295" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#C4CEDA" text-anchor="start" >Attained</text><text x="110" y="443" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >Points 1/n accumulate near 0, but 0 is not in S.</text><line x1="40" y1="501" x2="960" y2="501" stroke="#45576F" stroke-width="2" /><text x="46" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#C4CEDA" text-anchor="start" >Supremum = least upper bound. Infimum = greatest lower bound.</text><text x="42" y="577" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C4CEDA" text-anchor="start" >REAL ANALYSIS  /  VISUAL PROOF INTUITION</text></svg>
