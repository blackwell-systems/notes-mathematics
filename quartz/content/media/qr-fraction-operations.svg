<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" aria-labelledby="title desc"><title id="title">Well-defined fraction arithmetic</title><desc id="desc">Two arithmetic examples for rational fractions: 1/2 plus 1/3 equals 5/6, and 1/2 times 1/3 equals 1/6. The rational construction proves these operations do not depend on representations.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="510" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Well-defined fraction arithmetic</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Every result must be independent of representatives.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="72" y="158" width="657" height="124" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="210" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="750">1/2 + 1/3 = (3 + 2)/6</text><text x="400" y="254" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="37" font-weight="760">= 5/6</text><rect x="72" y="312" width="657" height="124" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="363" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="35" font-weight="720">1/2 × 1/3 = 1/6</text><text x="400" y="407" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="21" font-weight="550">Denominators remain nonzero</text><text x="40" y="493" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>