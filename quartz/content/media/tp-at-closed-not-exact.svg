<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A closed form need not be globally exact</title><desc id="desc">Two panels illustrate the angular 1-form on the punctured plane: it is closed, has integral 2pi around a unit circle, and cannot be globally exact.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">A closed form need not be globally exact</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">Around a missing point, a nonzero loop integral obstructs a global potential.</text><rect x="50" y="151" width="567" height="465" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="74" y="194" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">Closed around the missing point</text><line x1="72" y1="210" x2="595" y2="210" stroke="#4C6685" stroke-width="1.5" /><rect x="653" y="151" width="577" height="465" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="677" y="194" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">Not exact on the punctured plane</text><line x1="675" y1="210" x2="1208" y2="210" stroke="#4C6685" stroke-width="1.5" /><circle cx="329" cy="376" r="132" fill="none" stroke="#7DD9C9" stroke-width="4"/><circle cx="329" cy="376" r="14" fill="#0C1E30" stroke="#F2A7AC" stroke-width="3"/><text x="329" y="411" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">origin removed</text><circle cx="950" cy="376" r="132" fill="none" stroke="#7DD9C9" stroke-width="4"/><circle cx="950" cy="376" r="14" fill="#0C1E30" stroke="#F2A7AC" stroke-width="3"/><text x="950" y="411" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">origin removed</text><path d="M425 285 A132 132 0 0 0 280 253" fill="none" stroke="#F0BD75" stroke-width="6" marker-end="url(#arrow)"/><text x="329" y="555" font-family="Georgia,serif" font-size="37" fill="#F0BD75" text-anchor="middle" font-weight="400">∮ ω = 2π</text><text x="948" y="265" font-family="Georgia,serif" font-size="36" fill="#7DD9C9" text-anchor="middle" font-weight="400">dω = 0</text><text x="948" y="505" font-family="Georgia,serif" font-size="32" fill="#F2A7AC" text-anchor="middle" font-weight="400">ω ≠ dφ globally</text><rect x="77" y="632" width="1126" height="67" rx="15" fill="#253449" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="675" font-family="Georgia,serif" font-size="23" fill="#F4F2EF" text-anchor="middle" font-weight="400">A form can be locally closed yet have nonzero integral around an essential loop.</text></svg>