<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Transforming a uniform random variable into an exponential one</title><desc id="desc">The source X is uniformly distributed from zero to one, with a flat density one. The transformation Y equals negative log X produces an exponential distribution with rate one and density exp of negative y for nonnegative y. Both probability densities integrate to one.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="45" y="59" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#F2F5FC" text-anchor="start" font-weight="bold">Transforming a uniform random variable into an exponential one</text><line x1="46" y1="82" x2="1394" y2="82" stroke="#35546A" stroke-width="2" /><rect x="44" y="122" width="592" height="544" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="65" y="161" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#99BFF1" text-anchor="start" font-weight="bold">X ~ Uniform(0,1)</text><rect x="795" y="122" width="601" height="544" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="816" y="161" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#EA91A0" text-anchor="start" font-weight="bold">Y = -ln(X) ~ Exponential(1)</text><line x1="131" y1="540" x2="547" y2="540" stroke="#B9CFE0" stroke-width="2" /><line x1="131" y1="238" x2="131" y2="540" stroke="#B9CFE0" stroke-width="2" /><line x1="131" y1="540" x2="131" y2="546" stroke="#B9CFE0" stroke-width="1.4" /><text x="131" y="567" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">0</text><line x1="339" y1="540" x2="339" y2="546" stroke="#B9CFE0" stroke-width="1.4" /><text x="339" y="567" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">0.5</text><line x1="547" y1="540" x2="547" y2="546" stroke="#B9CFE0" stroke-width="1.4" /><text x="547" y="567" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">1</text><line x1="131" y1="540" x2="547" y2="540" stroke="#35546A" stroke-width="1" /><text x="119" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#B9CFE0" text-anchor="end" font-weight="normal">0</text><line x1="131" y1="409.8275862068965" x2="547" y2="409.8275862068965" stroke="#35546A" stroke-width="1" /><text x="119" y="414.8275862068965" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#B9CFE0" text-anchor="end" font-weight="normal">0.5</text><line x1="131" y1="279.6551724137931" x2="547" y2="279.6551724137931" stroke="#35546A" stroke-width="1" /><text x="119" y="284.6551724137931" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#B9CFE0" text-anchor="end" font-weight="normal">1</text><rect x="131" y="279.6551724137931" width="416" height="260.3448275862069" rx="0" fill="#245C57" stroke="#7DD9C9" stroke-width="2"/><text x="310" y="593" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#B9CFE0" text-anchor="middle" font-weight="normal">Density fX(x) = 1</text><rect x="645" y="305" width="142" height="81" rx="12" fill="#11293C" stroke="#F0BD75" stroke-width="2"/><text x="716" y="336" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#F0BD75" text-anchor="middle" font-weight="bold">Y = -ln X</text><text x="716" y="365" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">(0,1) → (0,∞)</text><line x1="655" y1="414" x2="773" y2="414" stroke="#F0BD75" stroke-width="4" /><path d="M764.00 404.00 L776.00 414.00 L764.00 424.00" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="863" y1="540" x2="1322" y2="540" stroke="#B9CFE0" stroke-width="2" /><line x1="863" y1="238" x2="863" y2="540" stroke="#B9CFE0" stroke-width="2" /><line x1="863" 