<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Circular arithmetic modulo three</title>
  <desc id="desc">A three-position dial has zero at the top, one at the lower right, and two at the lower left. Three clockwise arrows labeled plus one show the cycle zero to one to two to zero. A companion explanation shows that one, four, and seven all land on position one because each leaves remainder one when divided by three.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 8 5 L 1 9 Z" fill="#B9CFDE"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .headline { font-size: 39px; font-weight: 760; fill: #F4F3ED; }
    .subtitle { font-size: 23px; font-weight: 500; fill: #C4CEDA; }
    .section { font-size: 20px; font-weight: 740; letter-spacing: .05em; fill: #C4CEDA; }
    .node-number { font-size: 40px; font-weight: 760; fill: #F4F3ED; }
    .step { font-size: 21px; font-weight: 740; fill: #C4CEDA; }
    .cycle { font-size: 32px; font-weight: 740; fill: #F4F3ED; }
    .body { font-size: 22px; font-weight: 500; fill: #C4CEDA; }
    .formula { font-size: 31px; font-weight: 740; fill: #C9A6EF; }
    .footer { font-size: 19px; font-weight: 500; fill: #C4CEDA; }
  </style>
  <rect width="1200" height="590" fill="#101A2C"/>
  <text x="40" y="59" class="headline">Modulo 3: counting around a circle</text>
  <text x="40" y="98" class="subtitle">Three positions, repeating forever as we add one.</text>
  <line x1="40" x2="1160" y1="118" y2="118" stroke="#45576F" stroke-width="2"/>

  <!-- Traverse the three residues clockwise: 0 -> 1 -> 2 -> 0. -->
  <path d="M 348 151 C 446 170, 490 280, 461 358" fill="none" stroke="#B9CFDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 405 427 C 350 497, 270 497, 215 427" fill="none" stroke="#B9CFDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 159 357 C 130 280, 174 170, 272 151" fill="none" stroke="#B9CFDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <text x="478" y="260" class="step">+1</text>
  <text x="310" y="517" text-anchor="middle" class="step">+1</text>
  <text x="114" y="260" class="step">+1</text>

  <circle cx="310" cy="181" r="39" fill="#243850" stroke="#80DFD2" stroke-width="4"/>
  <text x="310" y="195" text-anchor="middle" class="node-number">0</text>
  <circle cx="435" cy="397" r="39" fill="#243850" stroke="#C9A6EF" stroke-width="4"/>
  <text x="435" y="411" text-anchor="middle" class="node-number">1</text>
  <circle cx="185" cy="397" r="39" fill="#243850" stroke="#F4C474" stroke-width="4"/>
  <text x="185" y="411" text-anchor="middle" class="node-number">2</text>

  <line x1="610" x2="610" y1="153" y2="516" stroke="#45576F" stroke-width="2"/>
  <text x="652" y="191" class="section">REPEAT THE SAME STEP</text>
  <text x="652" y="250" class="cycle">0 &#8594; 1 &#8594; 2 &#8594; 0</text>
  <text x="652" y="294" class="body">After three steps, we return to zero.</text>
  <text x="652" y="328" class="body">Adding another three changes no position.</text>
  <line x1="652" x2="1156" y1="357" y2="357" stroke="#45576F" stroke-width="2"/>
  <text x="652" y="396" class="section">SAME POSITION, DIFFERENT INTEGERS</text>
  <text x="652" y="445" class="formula">1 &#8801; 4 &#8801; 7 (mod 3)</text>
  <text x="652" y="483" class="body">Each leaves remainder 1.</text>

  <line x1="40" x2="1160" y1="541" y2="541" stroke="#45576F" stroke-width="2"/>
  <text x="40" y="569" class="footer">The dial repeats; equivalence classes collect every integer landing at the same position.</text>
</svg>