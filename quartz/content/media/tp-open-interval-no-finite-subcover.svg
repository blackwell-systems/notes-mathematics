<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 778" role="img" aria-labelledby="title desc"><title id="title">A cover with no finite subcover</title><desc id="desc">Increasing open intervals U2, U4, U8 and U16 approach zero from the right but never include zero. The family U_n for n at least two covers the entire open interval (0,1). A finite choice with largest N covers only (1/N,1), leaving points near zero uncovered. The diagram marks x=1/16 as missed by the selection U2, U4, U8.</desc><rect width="1280" height="778" rx="16" fill="#0C1E30"/><text x="42" y="61" font-family="Arial,sans-serif" font-size="35" fill="#F2F7FC" text-anchor="start" font-weight="bold">A cover with no finite subcover</text><line x1="42" y1="86" x2="1238" y2="86" stroke="#45627B" stroke-width="2" stroke-linecap="round"/><rect x="44" y="106" width="1192" height="573" rx="13" fill="#162F45" stroke="#46617B" stroke-width="2"/><text x="70" y="155" font-family="Arial,sans-serif" font-size="23" fill="#F2F7FC" text-anchor="start" font-weight="normal">Every point of (0,1) belongs to some Uₙ = (1/n,1)</text><line x1="238" y1="203" x2="1015" y2="203" stroke="#91AFC8" stroke-width="2" stroke-linecap="round"/><line x1="627" y1="203" x2="1015" y2="203" stroke="#91BEED" stroke-width="8" stroke-linecap="round"/><circle cx="627" cy="203" r="8" fill="#0C1E30" stroke="#91BEED" stroke-width="3"/><circle cx="1015" cy="203" r="8" fill="#0C1E30" stroke="#91BEED" stroke-width="3"/><text x="82" y="208" font-family="Arial,sans-serif" font-size="24" fill="#91BEED" text-anchor="start" font-weight="normal">U2</text><text x="627" y="235" font-family="Arial,sans-serif" font-size="17" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1/2</text><text x="1015" y="234" font-family="Arial,sans-serif" font-size="16" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1</text><line x1="238" y1="280" x2="1015" y2="280" stroke="#91AFC8" stroke-width="2" stroke-linecap="round"/><line x1="432" y1="280" x2="1015" y2="280" stroke="#C5ACEF" stroke-width="8" stroke-linecap="round"/><circle cx="432" cy="280" r="8" fill="#0C1E30" stroke="#C5ACEF" stroke-width="3"/><circle cx="1015" cy="280" r="8" fill="#0C1E30" stroke="#C5ACEF" stroke-width="3"/><text x="82" y="285" font-family="Arial,sans-serif" font-size="24" fill="#C5ACEF" text-anchor="start" font-weight="normal">U4</text><text x="432" y="312" font-family="Arial,sans-serif" font-size="17" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1/4</text><text x="1015" y="311" font-family="Arial,sans-serif" font-size="16" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1</text><line x1="238" y1="357" x2="1015" y2="357" stroke="#91AFC8" stroke-width="2" stroke-linecap="round"/><line x1="335" y1="357" x2="1015" y2="357" stroke="#72D4C0" stroke-width="8" stroke-linecap="round"/><circle cx="335" cy="357" r="8" fill="#0C1E30" stroke="#72D4C0" stroke-width="3"/><circle cx="1015" cy="357" r="8" fill="#0C1E30" stroke="#72D4C0" stroke-width="3"/><text x="82" y="362" font-family="Arial,sans-serif" font-size="24" fill="#72D4C0" text-anchor="start" font-weight="normal">U8</text><text x="335" y="389" font-family="Arial,sans-serif" font-size="17" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1/8</text><text x="1015" y="388" font-family="Arial,sans-serif" font-size="16" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1</text><line x1="238" y1="434" x2="1015" y2="434" stroke="#91AFC8" stroke-width="2" stroke-linecap="round"/><line x1="287" y1="434" x2="1015" y2="434" stroke="#F1BD73" stroke-width="8" stroke-linecap="round"/><circle cx="287" cy="434" r="8" fill="#0C1E30" stroke="#F1BD73" stroke-width="3"/><circle cx="1015" cy="434" r="8" fill="#0C1E30" stroke="#F1BD73" stroke-width="3"/><text x="82" y="439" font-family="Arial,sans-serif" font-size="24" fill="#F1BD73" text-anchor="start" font-weight="normal">U16</text><text x="287" y="466" font-family="Arial,sans-serif" font-size="17" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1/16</text><text x="1015" y="465" font-family="Arial,sans-serif" font-size="16" fill="#F2F7FC" text-anchor="middle" font-weight="normal">1</text><text x="68" y="537" font-family="Arial,sans-serif" font-size="22" fill="#F2F7FC" text-anchor="start" font-weight="normal">Example: selecting U₂, U₄, U₈ leaves a gap near 0.</text><line x1="238" y1="586" x2="1015" y2="586" stroke="#91AFC8" stroke-width="2" stroke-linecap="round"/><line x1="238" y1="586" x2="335" y2="586" stroke="#EDA7AA" stroke-width="10" stroke-linecap="round"/><line x1="335" y1="586" x2="1015" y2="586" stroke="#72D4C0" stroke-width="9" stroke-linecap="round"/><circle cx="335" cy="586" r="8" fill="#0C1E30" stroke="#72D4C0" stroke-width="3"/><circle cx="287" cy="586" r="10" fill="#F1BD73" stroke="#F2F7FC" stroke-width="2"/><text x="287" y="626" font-family="Arial,sans-serif" font-size="19" fill="#F1BD73" text-anchor="middle" font-weight="normal">x = 1/16 is missed</text><text x="640" y="740" font-family="Arial,sans-serif" font-size="20" fill="#F2F7FC" text-anchor="middle" font-weight="normal">Any finite choice has a largest N and misses points in (0,1/N].</text></svg>