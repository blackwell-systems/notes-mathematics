<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545" role="img" aria-labelledby="title desc"><title id="title">Why quotient products are well-defined</title><desc id="desc">Starting with a prime equals a+i and b prime equals b+j, their product difference equals aj+ib+ij. Every extra term belongs to the two-sided ideal I, so the resulting coset does not change.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="545" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Why quotient products are well-defined</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">An ideal absorbs the difference between representatives.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="62" y="144" width="317" height="87" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><rect x="421" y="144" width="317" height="87" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="220" y="197" fill="#66C4B4" font-size="27" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">a′ = a + i</text><text x="580" y="197" fill="#BCA8EC" font-size="27" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">b′ = b + j</text><line x1="220" y1="240" x2="342" y2="304" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="580" y1="240" x2="456" y2="304" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="100" y="323" width="600" height="105" rx="16" fill="#223349" stroke="#EDB86D" stroke-width="2"/><text x="400" y="374" fill="#F4F3ED" font-size="28" font-weight="725" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">a′b′ − ab = aj + ib + ij</text><text x="400" y="410" fill="#EDB86D" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">every extra term is in I</text><text x="400" y="491" fill="#66C4B4" font-size="26" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Therefore  a′b′ + I = ab + I</text><text x="40" y="527" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>