<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">The parallelogram law distinguishes inner-product norms</title><desc id="desc">On the left the Euclidean unit circle in R squared gives the parallelogram identity for unit coordinate vectors x and y, left and right both four. On the right the taxicab l1 unit ball is a diamond; x and y have norm one but x plus y and x minus y each have norm two, giving left side eight and right side four, violating the identity.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">The parallelogram law distinguishes inner-product norms</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><rect x="46" y="110" width="597" height="477" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="676" y="110" width="596" height="477" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="77" y="157" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Euclidean norm: circle</text><text x="708" y="157" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">Taxicab norm: diamond</text><line x1="158" y1="351" x2="526" y2="351" stroke="#48657A" stroke-width="2"  stroke-linecap="round"/><line x1="335" y1="179" x2="335" y2="518" stroke="#48657A" stroke-width="2"  stroke-linecap="round"/><line x1="797" y1="351" x2="1160" y2="351" stroke="#48657A" stroke-width="2"  stroke-linecap="round"/><line x1="973" y1="179" x2="973" y2="518" stroke="#48657A" stroke-width="2"  stroke-linecap="round"/><circle cx="335" cy="351" r="125" fill="#23445D" fill-opacity=".45" stroke="#94C2F2" stroke-width="4"/><polygon points="973,226 1098,351 973,476 848,351" fill="#375164" fill-opacity=".35" stroke="#79D7C2" stroke-width="4"/><line x1="335" y1="351" x2="460" y2="351" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M448.94726807196537 355.6730201077038 L460 351 L448.94726807196537 346.3269798922962" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="335" y1="351" x2="335" y2="226" stroke="#C7B0F3" stroke-width="3"  stroke-linecap="round"/><path d="M339.6730201077038 237.05273192803463 L335 226 L330.3269798922962 237.05273192803463" stroke="#C7B0F3" stroke-width="3" fill="none" stroke-linecap="round"/><text x="469" y="359" font-family="Arial,sans-serif" font-size="23" fill="#F4BF77" font-weight="normal" text-anchor="start">x</text><text x="323" y="215" font-family="Arial,sans-serif" font-size="23" fill="#C7B0F3" font-weight="normal" text-anchor="start">y</text><line x1="973" y1="351" x2="1098" y2="351" stroke="#F4BF77" stroke-width="3"  stroke-linecap="round"/><path d="M1086.9472680719655 355.6730201077038 L1098 351 L1086.9472680719655 346.3269798922962" stroke="#F4BF77" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="973" y1="351" x2="973" y2="226" stroke="#C7B0F3" stroke-width="3"  stroke-linecap="round"/><path d="M977.6730201077038 237.05273192803463 L973 226 L968.3269798922962 237.05273192803463" stroke="#C7B0F3" stroke-width="3" fill="none" stroke-linecap="round"/><text x="1107" y="359" font-family="Arial,sans-serif" font-size="23" fill="#F4BF77" font-weight="normal" text-anchor="start">x</text><text x="961" y="215" font-family="Arial,sans-serif" font-size="23" fill="#C7B0F3" font-weight="normal" text-anchor="start">y</text><text x="345" y="546" font-family="Arial,sans-serif" font-size="22" fill="#94C2F2" font-weight="bold" text-anchor="middle">LHS = 4; RHS = 4</text><text x="972" y="546" font-family="Arial,sans-serif" font-size="22" fill="#79D7C2" font-weight="bold" text-anchor="middle">LHS = 8; RHS = 4</text><text x="660" y="640" font-family="Arial,sans-serif" font-size="19" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Inner-product norms obey ||x+y||² + ||x-y||² = 2||x||² + 2||y||².</text></svg>