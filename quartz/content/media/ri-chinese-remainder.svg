<svg xmlns="http://www.w3.org/2000/svg" width="800" height="576" viewBox="0 0 800 576" role="img" aria-labelledby="title desc"><title id="title">Chinese remainder theorem</title><desc id="desc">A table mapping residues 0 through 5 modulo 6 to unique ordered pairs of their residues modulo 2 and 3, establishing the bijection Z/6 ≅ Z/2 × Z/3.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="576" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Chinese remainder theorem</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Integer arithmetic mod 6 splits into mod 2 and mod 3.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="55" y="155" width="695" height="342" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="400" y="205" fill="#F4F3ED" font-size="31" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Z/6  ≅  Z/2 × Z/3</text><rect x="85" y="207" width="620" height="31" rx="5" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="210" y="230" fill="#EDB86D" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">a mod 6</text><text x="400" y="230" fill="#EDB86D" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">mod 2</text><text x="585" y="230" fill="#EDB86D" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">mod 3</text><text x="210" y="265" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="400" y="265" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="585" y="265" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="210" y="300" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="400" y="300" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="585" y="300" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="210" y="335" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="400" y="335" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="585" y="335" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="210" y="370" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3</text><text x="400" y="370" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="585" y="370" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="210" y="405" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4</text><text x="400" y="405" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="585" y="405" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="210" y="440" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">5</text><text x="400" y="440" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="585" y="440" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="400" y="530" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Every pair appears exactly once.</text><text x="40" y="558" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>