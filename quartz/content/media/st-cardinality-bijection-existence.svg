<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Equal cardinality means a bijection exists, not that every function is bijective</title>
<desc id="desc">Three dark-violet diagrams contrast functions. First, two sets of three elements have equal cardinality, but the function 1 to a, 2 to a, 3 to b is not a bijection. Second, between the very same sets, a different function maps 1 to a, 2 to b, 3 to c and is a bijection. Third, sets of three and four elements cannot be in bijection. The existence symbol means at least one, not every mapping.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17102F"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x2=".25" y2="1"><stop stop-color="#2D204C"/><stop offset="1" stop-color="#11142B"/></linearGradient>
<linearGradient id="header" x2=".8" y2="1"><stop stop-color="#392750"/><stop offset="1" stop-color="#241C42"/></linearGradient>
<linearGradient id="footer" x2="1" y2="1"><stop stop-color="#30234C"/><stop offset="1" stop-color="#16162F"/></linearGradient>
<marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" viewBox="0 0 9 9"><path d="M0 0L9 4.5L0 9Z" fill="#C499FF"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="1050" rx="0" fill="url(#bg)"/>
<path d="M64 80H315 M1125 80H1376" stroke="#AD81E6" stroke-width="2.5" opacity=".85"/>
<text x="720" y="95" fill="#FAF6FF" font-size="64" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">Cardinality and Bijections</text>
<text x="720" y="154" fill="#DCCAF4" font-size="28" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">Equal size guarantees SOME bijection exists — not that every mapping works.</text>
<rect x="27" y="203" width="444" height="566" rx="24" fill="url(#panel)" stroke="#715394" stroke-width="2.3"/><rect x="29" y="205" width="440" height="72" rx="22" fill="url(#header)"/><text x="249" y="251" fill="#FFC3B6" font-size="27" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">Equal size, not bijective</text><text x="249" y="312" fill="#F8F6FF" font-size="24" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A = {1,2,3}     B = {a,b,c}</text><text x="249" y="354" fill="#F0D3A4" font-size="25" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">|A| = |B| = 3</text><text x="97" y="395" fill="#C6DDF7" font-size="25" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A</text><text x="256" y="395" fill="#D4AFF8" font-size="25" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">B</text><rect x="57" y="412" width="83" height="257" rx="35" fill="#15253E" stroke="#7ABEE9" stroke-width="2.5"/><rect x="214" y="412" width="83" height="257" rx="35" fill="#1C1A40" stroke="#BD91EF" stroke-width="2.5"/><path d="M128 460 L234 460" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M128 532 L234 460" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M128 604 L234 532" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="97" y="471" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">1</text><text x="97" y="543" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">2</text><text x="97" y="615" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">3</text><text x="256" y="471" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">a</text><text x="256" y="543" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">b</text><text x="256" y="615" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">c</text><rect x="311" y="414" width="146" height="256" rx="16" fill="#24203F" stroke="#735C94" stroke-width="1.5"/><text x="384" y="460" fill="#F0A0B8" font-size="24" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">NOT</text><text x="384" y="492" fill="#F0A0B8" font-size="22" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">bijective</text><text x="323" y="533" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">1 and 2 both</text><text x="323" y="560" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">map to a</text><text x="323" y="604" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">c is never</text><text x="323" y="631" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">reached</text><text x="249" y="728" fill="#DCC6FC" font-size="19" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">Equal sizes do NOT fix this function.</text>
<rect x="498" y="203" width="444" height="566" rx="24" fill="url(#panel)" stroke="#715394" stroke-width="2.3"/><rect x="500" y="205" width="440" height="72" rx="22" fill="url(#header)"/><text x="720" y="251" fill="#B8EBC7" font-size="27" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">Equal size, bijective</text><text x="720" y="312" fill="#F8F6FF" font-size="24" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A = {1,2,3}     B = {a,b,c}</text><text x="720" y="354" fill="#F0D3A4" font-size="25" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">|A| = |B| = 3</text><text x="568" y="395" fill="#C6DDF7" font-size="25" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A</text><text x="727" y="395" fill="#D4AFF8" font-size="25" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">B</text><rect x="528" y="412" width="83" height="257" rx="35" fill="#15253E" stroke="#7ABEE9" stroke-width="2.5"/><rect x="685" y="412" width="83" height="257" rx="35" fill="#1C1A40" stroke="#BD91EF" stroke-width="2.5"/><path d="M599 460 L705 460" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M599 532 L705 532" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M599 604 L705 604" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="568" y="471" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">1</text><text x="568" y="543" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">2</text><text x="568" y="615" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">3</text><text x="727" y="471" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">a</text><text x="727" y="543" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">b</text><text x="727" y="615" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">c</text><rect x="782" y="414" width="146" height="256" rx="16" fill="#24203F" stroke="#735C94" stroke-width="1.5"/><text x="855" y="460" fill="#B8EBC7" font-size="20" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">BIJECTION</text><text x="794" y="511" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">Each input</text><text x="794" y="538" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">has one target</text><text x="794" y="587" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">Each target</text><text x="794" y="614" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">is used once</text><text x="720" y="728" fill="#B8EBC7" font-size="19" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A different function CAN pair them.</text>
<rect x="969" y="203" width="444" height="566" rx="24" fill="url(#panel)" stroke="#715394" stroke-width="2.3"/><rect x="971" y="205" width="440" height="72" rx="22" fill="url(#header)"/><text x="1191" y="251" fill="#E0C5FF" font-size="27" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">Different sizes</text><text x="1191" y="312" fill="#F8F6FF" font-size="24" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A = {1,2,3}     B = {a,b,c,d}</text><text x="1191" y="354" fill="#F0D3A4" font-size="25" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">|A| = 3,   |B| = 4</text><text x="1039" y="395" fill="#C6DDF7" font-size="25" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">A</text><text x="1198" y="395" fill="#D4AFF8" font-size="25" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">B</text><rect x="999" y="412" width="83" height="257" rx="35" fill="#15253E" stroke="#7ABEE9" stroke-width="2.5"/><rect x="1156" y="412" width="83" height="257" rx="35" fill="#1C1A40" stroke="#BD91EF" stroke-width="2.5"/><path d="M1070 460 L1176 450" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M1070 532 L1176 507" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M1070 604 L1176 564" fill="none" stroke="#C499FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="1039" y="471" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">1</text><text x="1039" y="543" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">2</text><text x="1039" y="615" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">3</text><text x="1198" y="461" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">a</text><text x="1198" y="518" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">b</text><text x="1198" y="575" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">c</text><text x="1198" y="632" fill="#F8F6FF" font-size="34" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">d</text><rect x="1253" y="414" width="146" height="256" rx="16" fill="#24203F" stroke="#735C94" stroke-width="1.5"/><text x="1326" y="460" fill="#F0A0B8" font-size="19" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">IMPOSSIBLE</text><text x="1265" y="511" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">Four target</text><text x="1265" y="538" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">elements</text><text x="1265" y="585" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">Only three</text><text x="1265" y="612" fill="#E8DCF4" font-size="17" font-weight="normal" text-anchor="start" font-family="Georgia, 'DejaVu Serif', serif">inputs</text><text x="1191" y="728" fill="#DCC6FC" font-size="19" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">No bijection can pair these sets.</text>
<rect x="27" y="795" width="1386" height="226" rx="24" fill="url(#footer)" stroke="#735693" stroke-width="2"/>
<text x="720" y="855" fill="#F6DEB1" font-size="42" font-weight="bold" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">|A| = |B|    ⇔    ∃ a bijection f: A → B</text>
<text x="720" y="912" fill="#F4EBFA" font-size="27" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">∃ means: at least one possible function pairs all elements exactly once.</text>
<text x="720" y="960" fill="#D7BAF9" font-size="27" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">It does NOT mean: every function between those sets is bijective.</text>
<text x="720" y="1000" fill="#B6A8D3" font-size="21" font-weight="normal" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif">This principle applies to finite and infinite sets.</text>
</svg>