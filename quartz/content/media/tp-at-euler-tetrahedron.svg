<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Euler characteristic counts cells, not appearance</title><desc id="desc">A tetrahedron graph with four vertices and six edges, showing four triangular faces and V−E+F=2; triangulation gives Euler characteristic of a sphere.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">Euler characteristic counts cells, not appearance</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">For a triangulated sphere, four vertices minus six edges plus four faces equals two.</text><rect x="49" y="144" width="758" height="460" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="73" y="187" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">Sphere triangulated as a tetrahedron</text><line x1="71" y1="203" x2="785" y2="203" stroke="#4C6685" stroke-width="1.5" /><rect x="832" y="144" width="396" height="460" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="856" y="187" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">Alternating cell counts</text><line x1="854" y1="203" x2="1206" y2="203" stroke="#4C6685" stroke-width="1.5" /><line x1="244" y1="270" x2="149" y2="475" stroke="#F0BD75" stroke-width="4" /><line x1="244" y1="270" x2="543" y2="475" stroke="#F0BD75" stroke-width="4" /><line x1="244" y1="270" x2="423" y2="353" stroke="#F0BD75" stroke-width="4" /><line x1="149" y1="475" x2="543" y2="475" stroke="#F0BD75" stroke-width="4" stroke-dasharray="8 8"/><line x1="149" y1="475" x2="423" y2="353" stroke="#F0BD75" stroke-width="4" /><line x1="543" y1="475" x2="423" y2="353" stroke="#F0BD75" stroke-width="4" /><circle cx="244" cy="270" r="9" fill="#7DD9C9" stroke="#F4F2EF" stroke-width="2"/><circle cx="149" cy="475" r="9" fill="#7DD9C9" stroke="#F4F2EF" stroke-width="2"/><circle cx="543" cy="475" r="9" fill="#7DD9C9" stroke="#F4F2EF" stroke-width="2"/><circle cx="423" cy="353" r="9" fill="#7DD9C9" stroke="#F4F2EF" stroke-width="2"/><text x="187" y="554" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="start" font-weight="400">4 vertices     6 edges     4 triangular faces</text><text x="1023" y="269" font-family="Georgia,serif" font-size="38" fill="#7DD9C9" text-anchor="middle" font-weight="400">V = 4</text><text x="1023" y="345" font-family="Georgia,serif" font-size="38" fill="#C9A8F2" text-anchor="middle" font-weight="400">E = 6</text><text x="1023" y="421" font-family="Georgia,serif" font-size="38" fill="#F0BD75" text-anchor="middle" font-weight="400">F = 4</text><line x1="876" y1="454" x2="1189" y2="454" stroke="#4C6685" stroke-width="2" /><text x="1023" y="516" font-family="Georgia,serif" font-size="29" fill="#F4F2EF" text-anchor="middle" font-weight="400">χ = 4 − 6 + 4 = 2</text><rect x="80" y="630" width="1120" height="65" rx="14" fill="#263348" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="671" font-family="Georgia,serif" font-size="24" fill="#F4F2EF" text-anchor="middle" font-weight="400">Euler characteristic is unchanged by subdivision: χ = V − E + F.</text></svg>