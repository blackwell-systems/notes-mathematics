<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Spherical coordinates: angles and volume</title><desc id="desc">A sphere and radial line illustrate rho, polar angle phi measured down from positive z, and azimuth theta, yielding the volume factor rho squared sine phi.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Spherical coordinates: angles and volume</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C7D4E1" text-anchor="middle">Use φ from the positive z-axis and θ around the z-axis.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#4C6A82" stroke-width="2"/><rect x="54" y="152" width="1172" height="475" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#173147"/><circle cx="377" cy="391" r="153" fill="#2C425E" fill-opacity=".55" stroke="#7DD9C9" stroke-width="4"/><ellipse cx="377" cy="391" rx="153" ry="58" fill="none" stroke="#C6A5ED" stroke-width="3"/><line x1="377" y1="555" x2="377" y2="197" stroke="#F1BD75" stroke-width="3"/><line x1="377" y1="391" x2="475" y2="274" stroke="#F1BD75" stroke-width="5"/><path d="M377 321 A70 70 0 0 1 420 336" fill="none" stroke="#C6A5ED" stroke-width="4"/><text x="447" y="305" font-family="Georgia,serif" font-size="27" fill="#C6A5ED" text-anchor="middle">φ</text><text x="435" y="370" font-family="Georgia,serif" font-size="25" fill="#F1BD75" text-anchor="middle">ρ</text><text x="863" y="240" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="middle">ρ : radial distance</text><text x="863" y="311" font-family="Georgia,serif" font-size="26" fill="#C6A5ED" text-anchor="middle">φ : angle from +z</text><text x="863" y="382" font-family="Georgia,serif" font-size="26" fill="#F1BD75" text-anchor="middle">θ : azimuth around z</text><text x="863" y="508" font-family="Georgia,serif" font-size="28" fill="#F2F5FB" text-anchor="middle">dV = ρ² sinφ dρ dφ dθ</text><rect x="119" y="645" width="1042" height="62" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#173147"/><text x="640" y="682" font-family="Georgia,serif" font-size="25" fill="#F2F5FB" text-anchor="middle">Angular arc lengths: ρ dφ and ρ sinφ dθ.</text></svg>