<path d="M96 882 H352 M105 892 V741" stroke="#8DABC1" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<text x="82" y="903" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#B3C4D0">0</text>
<text x="344" y="905" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B3C4D0">x</text>
<text x="88" y="761" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B3C4D0">y</text>
<text x="83" y="840" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">1</text>
<text x="148" y="903" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">1</text>
<text x="196" y="903" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">2</text>
<text x="244" y="903" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">3</text>
<path d="M105 882 L201 834" fill="none" stroke="#87B8EE" stroke-width="5" stroke-linecap="round" marker-end="url(#head-blue)"/>
<text x="161" y="808" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#87B8EE">u = (2, 1)</text>
</g>
<g aria-label="The transformation rule">
<text x="408" y="759" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#F4F3ED">T(x, y) =</text>
<text x="417" y="796" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#F4F3ED">(x + y, 0)</text>
<path d="M413 843 H571" stroke="#66C4B4" stroke-width="6" fill="none" marker-end="url(#head-teal)" stroke-linecap="round"/>
<text x="429" y="881" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8">apply the map</text>
</g>
