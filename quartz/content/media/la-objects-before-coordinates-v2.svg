<text x="615" y="903" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#B3C4D0">0</text>
<text x="877" y="905" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B3C4D0">x</text>
<text x="621" y="761" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B3C4D0">y</text>
<text x="616" y="840" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">1</text>
<text x="681" y="903" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">1</text>
<text x="729" y="903" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">2</text>
<text x="777" y="903" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B3C4D0">3</text>
<path d="M638 882 L782 882" fill="none" stroke="#66C4B4" stroke-width="5" stroke-linecap="round" marker-end="url(#head-teal)"/>
<text x="694" y="790" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#66C4B4">T(u) = (3, 0)</text>
</g>
<text x="62" y="956" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#C0CBD8">The entire vector moves. The same rule also preserves addition and scaling.</text>
<g transform="translate(0 237)">
<rect x="34" y="770" width="912" height="160" rx="13" fill="#182A3D" stroke="#42576D" stroke-width="2"/>
<text x="62" y="809" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#EDB86D" font-weight="700" letter-spacing=".4">03   MATRIX: A WAY TO WRITE THE MAP</text>
<text x="74" y="884" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#F4F3ED" font-weight="700">A =</text>
<path d="M169 842 H154 V902 H169" fill="none" stroke="#F4F3ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M270 842 H284 V902 H270" fill="none" stroke="#F4F3ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="192" y="866" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F4F3ED" >1</text>
<text x="251" y="866" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F4F3ED" >1</text>
<text x="192" y="895" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F4F3ED" >0</text>
<text x="251" y="895" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F4F3ED" >0</text>
<text x="323" y="875" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#66C4B4" font-weight="700">A · (2, 1) = (3, 0)</text>
<text x="323" y="912" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0CBD8" >Using standard bases. New bases can change A, not T.</text>
</g>
</svg>
