<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1192" role="img" aria-labelledby="title desc">
<title id="title">Linear algebra starts with vectors and maps, not matrices</title>
<desc id="desc">One consistent example across three stages. First, in V equals R squared, the whole vectors u equals (2,1) and v equals (0,3) are drawn to scale on coordinate axes, with their sum u plus v equals (2,4); a dotted translated v arrow demonstrates head-to-tail addition. Both addition and scalar multiplication keep results within the space. Second, two side-by-side coordinate planes display the linear map T(x,y) equals (x+y,0), with an arrow across the panels showing how the input vector u equals (2,1) becomes the output vector T(u) equals (3,0). Third, after choosing the standard basis, the very same T is encoded by matrix A with first row 1,1 and second row 0,0, which maps the coordinate column (2,1) to (3,0). Vectors are entire objects, coordinates describe them, maps act on them, and matrices represent maps in chosen bases.</desc>
<defs><marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#87B8EE"/></marker><marker id="head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BCA8EC"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="1192" fill="#101A2C" rx="15"/>
<text x="48" y="63" font-family="Georgia,serif" font-size="40" fill="#F4F3ED" font-weight="700">Linear algebra before matrices</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#C0CBD8" >Vectors are whole objects. Coordinates describe them.</text>
<path d="M48 126 H932" fill="none" stroke="#42576D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="34" y="146" width="912" height="429" rx="13" fill="#182A3D" stroke="#42576D" stroke-width="2"/>
<text x="62" y="187" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#66C4B4" font-weight="700" letter-spacing="1">01   VECTOR SPACE</text>
<text x="61" y="220" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F4F3ED" >V = ℝ²: all ordered pairs of real numbers.</text>
<path d="M 109 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 164 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 90 493 H 447" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 219 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 90 438 H 447" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 274 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 90 383 H 447" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 329 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 90 328 H 447" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 384 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 90 273 H 447" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 439 254 V 512" fill="none" stroke="#294053" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M95 493 H452 M164 524 V247" fill="none" stroke="#91A3B5" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" />
<text x="445" y="513" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#C0CBD8" >x</text>
<text x="177" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#C0CBD8" >y</text>
<text x="143" y="518" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" >0</text>
<text x="267" y="512" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" >2</text>
<text x="145" y="387" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" >2</text>
<path d="M164 493 L274 438" fill="none" stroke="#87B8EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-blue)"/>
<path d="M164 493 L164 328" fill="none" stroke="#BCA8EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-violet)"/>
<path d="M274 438 L274 273" fill="none" stroke="#BCA8EC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#head-violet)"/>
<path d="M164 493 L274 273" fill="none" stroke="#66C4B4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-teal)"/>
<text x="293" y="445" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#87B8EE" font-weight="700">u</text>
<text x="143" y="313" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#BCA8EC" font-weight="700">v</text>
<text x="291" y="270" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#66C4B4" font-weight="700">u + v</text>
<rect x="482" y="248" width="426" height="267" rx="13" fill="#102336" stroke="#466177" stroke-width="2"/>
<text x="508" y="289" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#87B8EE" font-weight="700">u = (2, 1)</text>
<text x="508" y="330" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#BCA8EC" font-weight="700">v = (0, 3)</text>
<path d="M508 350 H881" fill="none" stroke="#42576D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="508" y="395" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#66C4B4" font-weight="700">u + v = (2, 4)</text>
<text x="508" y="442" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#EDB86D" font-weight="650">2u = (4, 2)</text>
<text x="508" y="479" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" >The results stay in V.</text>
<text x="64" y="555" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0CBD8" >u and v name entire vectors; 2 and 1 are the components of u.</text>
<rect x="34" y="598" width="912" height="388" rx="13" fill="#182A3D" stroke="#42576D" stroke-width="2"/>
<text x="62" y="638" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#87B8EE" font-weight="700" letter-spacing="1">02   LINEAR MAP</text>
<text x="62" y="673" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#F4F3ED">One rule transforms vectors from the input space to the output space.</text>
<g aria-label="INPUT  ·  V = ℝ² coordinate plane">
<rect x="62" y="702" width="318" height="216" rx="9" fill="#102336" stroke="#466177" stroke-width="1.6"/>
<text x="80" y="735" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing=".45" fill="#C0CBD8">INPUT  ·  V = ℝ²</text>
<path d="M105 746 V882" stroke="#2C4356" stroke-width="1" />
