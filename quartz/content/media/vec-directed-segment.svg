<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">A vector is a directed displacement</title><desc id="desc">An arrow from initial point A=(1,1) to terminal point B=(5,4). Its direction is from A toward B, its length is the magnitude, and moving the arrow without changing length or direction describes the same free vector.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">A vector is a directed displacement</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="131" width="732" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="132" width="730" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="406" y="167" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">One directed line segment</text><line x1="52" y1="186" x2="760" y2="186" stroke="#87B8EE" stroke-width="1.4" /><rect x="797" y="131" width="360" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="798" y="132" width="358" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="977" y="167" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Read the arrow</text><line x1="809" y1="186" x2="1145" y2="186" stroke="#BCA8EC" stroke-width="1.4" /><rect x="139" y="210" width="500" height="320" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="139" y1="210" x2="139" y2="530" stroke="#40536B" stroke-width="2" /><line x1="222.33333333333331" y1="210" x2="222.33333333333331" y2="530" stroke="#40536B" stroke-width="1" /><line x1="305.66666666666663" y1="210" x2="305.66666666666663" y2="530" stroke="#40536B" stroke-width="1" /><line x1="389" y1="210" x2="389" y2="530" stroke="#40536B" stroke-width="1" /><line x1="472.3333333333333" y1="210" x2="472.3333333333333" y2="530" stroke="#40536B" stroke-width="1" /><line x1="555.6666666666667" y1="210" x2="555.6666666666667" y2="530" stroke="#40536B" stroke-width="1" /><line x1="639" y1="210" x2="639" y2="530" stroke="#40536B" stroke-width="1" /><line x1="139" y1="530" x2="639" y2="530" stroke="#40536B" stroke-width="2" /><line x1="139" y1="466" x2="639" y2="466" stroke="#40536B" stroke-width="1" /><line x1="139" y1="402" x2="639" y2="402" stroke="#40536B" stroke-width="1" /><line x1="139" y1="338" x2="639" y2="338" stroke="#40536B" stroke-width="1" /><line x1="139" y1="274" x2="639" y2="274" stroke="#40536B" stroke-width="1" /><line x1="139" y1="210" x2="639" y2="210" stroke="#40536B" stroke-width="1" /><line x1="222.33333333333331" y1="466" x2="555.6666666666667" y2="274" stroke="#87B8EE" stroke-width="5" marker-end="url(#arr-blue)" stroke-linecap="round"/><circle cx="222.33333333333331" cy="466" r="8" fill="#EDB86D" stroke="none" stroke-width="1.5"/><circle cx="555.6666666666667" cy="274" r="8" fill="#98D5A3" stroke="none" stroke-width="1.5"/><text x="241" y="448" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">A  •  tail</text><text x="562" y="251" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">B  •  head</text><text x="976" y="258" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Direction: A → B</text><text x="976" y="335" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Magnitude: its length</text><text x="976" y="413" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Displacement: B − A</text><text x="976" y="474" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Here: (4, 3)</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">A free vector remembers displacement, not a fixed starting point.</text></svg>