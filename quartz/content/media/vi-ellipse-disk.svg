<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The ellipse is a scaled unit disk</title><desc id="desc">The unit disk maps to an ellipse with semiaxes three and two by x=3u,y=2v, multiplying its area by six.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" fill="#F4F5FB" font-size="38" font-family="Georgia,serif" text-anchor="middle">The ellipse is a scaled unit disk</text><text x="640" y="102" fill="#C1D0DF" font-size="22" font-family="Georgia,serif" text-anchor="middle">A change of variables simplifies the shape and supplies its area factor.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#506B80" stroke-width="2" /><rect x="55" y="152" width="556" height="475" rx="17" fill="#1A3148" stroke="#7DD9C9" stroke-width="2.5"/><rect x="667" y="152" width="556" height="475" rx="17" fill="#1A3148" stroke="#C6A5ED" stroke-width="2.5"/><text x="334" y="210" fill="#7DD9C9" font-size="29" font-family="Georgia,serif" text-anchor="middle">Unit disk</text><text x="945" y="210" fill="#C6A5ED" font-size="29" font-family="Georgia,serif" text-anchor="middle">Stretched ellipse</text><circle cx="334" cy="400" r="125" fill="#345F60" fill-opacity=".67" stroke="#7DD9C9" stroke-width="4"/><ellipse cx="946" cy="400" rx="186" ry="125" fill="#554A6D" fill-opacity=".68" stroke="#C6A5ED" stroke-width="4"/><text x="334" y="569" fill="#F4F5FB" font-size="25" font-family="Georgia,serif" text-anchor="middle">u² + v² ≤ 1</text><text x="945" y="569" fill="#F4F5FB" font-size="24" font-family="Georgia,serif" text-anchor="middle">x²/9 + y²/4 ≤ 1</text><line x1="539" y1="412" x2="738" y2="412" stroke="#F1BD75" stroke-width="4" /><text x="637" y="381" fill="#F1BD75" font-size="24" font-family="Georgia,serif" text-anchor="middle">(3u, 2v)</text><rect x="122" y="644" width="1036" height="61" rx="17" fill="#1A3148" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="682" fill="#F4F5FB" font-size="26" font-family="Georgia,serif" text-anchor="middle">Lengths scale by 3 and 2; area scales by 6.</text></svg>