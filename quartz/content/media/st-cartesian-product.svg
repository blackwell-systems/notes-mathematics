<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Cartesian product: six ordered pairs from three by two elements</title>
<desc id="desc">Grid with columns 1, 2, 3 from A and rows a, b from B, and exactly six dots at their intersections. Each dot is labeled by its ordered pair, such as (1,a). The result contains three times two equal to six ordered pairs.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#171029"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2D204B"/><stop offset="1" stop-color="#11142C"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#382651"/><stop offset="1" stop-color="#211A3B"/></linearGradient>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12" fill="#C69AFF"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/><text x="720" y="88" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="72" font-weight="bold">Cartesian Product</text><text x="720" y="147" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D8C4F5" font-size="30" font-weight="normal">Pair every first coordinate with every second coordinate.</text><path d="M70 175 H1370" stroke="#9261C6" stroke-width="2"/><text x="720" y="254" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E2CDFB" font-size="43" font-weight="bold">A = {1, 2, 3}     B = {a, b}</text><rect x="265" y="294" width="939" height="492" rx="24" fill="url(#panel)" stroke="#A67AE8" stroke-width="3"/><line x1="449" y1="372" x2="449" y2="716" stroke="#6B5A96" stroke-width="2" stroke-linecap="round"/><line x1="715" y1="372" x2="715" y2="716" stroke="#6B5A96" stroke-width="2" stroke-linecap="round"/><line x1="981" y1="372" x2="981" y2="716" stroke="#6B5A96" stroke-width="2" stroke-linecap="round"/><line x1="362" y1="440" x2="1069" y2="440" stroke="#6B5A96" stroke-width="2" stroke-linecap="round"/><line x1="362" y1="647" x2="1069" y2="647" stroke="#6B5A96" stroke-width="2" stroke-linecap="round"/><text x="449" y="353" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D6BCFC" font-size="38" font-weight="bold">1</text><text x="715" y="353" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D6BCFC" font-size="38" font-weight="bold">2</text><text x="981" y="353" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D6BCFC" font-size="38" font-weight="bold">3</text><text x="329" y="452" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D8C3FF" font-size="43" font-weight="bold">a</text><text x="329" y="659" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D8C3FF" font-size="43" font-weight="bold">b</text><circle cx="449" cy="440" r="24" fill="#9E6DEA" stroke="#DFB3FF" stroke-width="3"/><text x="449" y="517" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="31" font-weight="normal">(1, a)</text><circle cx="715" cy="440" r="24" fill="#9E6DEA" stroke="#DFB3FF" stroke-width="3"/><text x="715" y="517" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="31" font-weight="normal">(2, a)</text><circle cx="981" cy="440" r="24" fill="#9E6DEA" stroke="#DFB3FF" stroke-width="3"/><text x="981" y="517" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="31" font-weight="normal">(3, a)</text><circle cx="449" cy="647" r="24" fill="#9E6DEA" stroke="#DFB3FF" stroke-width="3"/><text x="449" y="724" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="31" font-weight="normal">(1, b)</text><circle cx="715" cy="647" r="24" fill="#9E6DEA" stroke="#DFB3FF" stroke-width="3"/><text x="715" y="724" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="31" font-weight="normal">(2, b)</text><circle cx="981" cy="647" r="24" fill="#9E6DEA" stroke="#DFB3FF" stroke-width="3"/><text x="981" y="724" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="31" font-weight="normal">(3, b)</text><rect x="43" y="823" width="1354" height="137" rx="21" fill="url(#footer)" stroke="#B783EF" stroke-width="3"/><text x="720" y="881" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="43" font-weight="bold">|A × B| = |A| · |B| = 3 × 2 = 6</text><text x="720" y="926" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E1CFF4" font-size="27" font-weight="normal">Order matters: (1, a) is an ordered pair, not an unordered two-element set.</text></svg>