<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">The eight ordered pairs in the odd-even equivalence relation</title><desc id="desc">A 4-by-4 grid shows all sixteen ordered pairs in A cross A for A equals one, two, three, four. Eight highlighted cells have matching parity, four odd-odd and four even-even. The other eight cells are dimmed. The highlighted pairs are explicitly listed in two groups on the right.</desc><rect width="1100" height="660" fill="#101A2C"/>
<text x="42" y="58" fill="#F4F3ED" font-size="35" font-weight="750" text-anchor="start">Which ordered pairs belong to the relation?</text>
<text x="42" y="97" fill="#C4CEDA" font-size="22" font-weight="500" text-anchor="start">A = {1, 2, 3, 4}     a ~ b exactly when a and b have the same parity.</text>
