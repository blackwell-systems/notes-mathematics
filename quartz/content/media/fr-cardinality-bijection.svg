<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">The naturals and integers can be paired</title><desc id="desc">A bijection sends 0→0,1→−1,2→1,3→−2,4→2,5→−3, and so on. Each integer is reached once.</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">The naturals and integers can be paired</text><rect x="30" y="120" width="1140" height="450" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="40" y="130" width="1120" height="59" rx="13" fill="#122338"/><text x="600" y="162" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Interleave nonnegative and negative integers</text><path d="M54 190 H1146" stroke="#87B8EE" opacity=".35" stroke-width="2"/><text x="83" y="271" fill="#87B8EE" font-size="29" font-weight="500" text-anchor="middle" dominant-baseline="middle">ℕ</text><text x="83" y="481" fill="#98D5A3" font-size="29" font-weight="500" text-anchor="middle" dominant-baseline="middle">ℤ</text><circle cx="170" cy="260" r="34" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="170" y="260" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">0</text><path d="M170 295 L170 438" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><circle cx="170" cy="469" r="34" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="170" y="469" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">0</text><circle cx="335" cy="260" r="34" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="335" y="260" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">1</text><path d="M335 295 L335 438" fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowV)"/><circle cx="335" cy="469" r="34" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="335" y="469" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">−1</text><circle cx="500" cy="260" r="34" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="500" y="260" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">2</text><path d="M500 295 L500 438" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><circle cx="500" cy="469" r="34" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="500" y="469" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="665" cy="260" r="34" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="665" y="260" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">3</text><path d="M665 295 L665 438" fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowV)"/><circle cx="665" cy="469" r="34" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="665" y="469" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">−2</text><circle cx="830" cy="260" r="34" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="830" y="260" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">4</text><path d="M830 295 L830 438" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><circle cx="830" cy="469" r="34" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="830" y="469" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="995" cy="260" r="34" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="995" y="260" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">5</text><path d="M995 295 L995 438" fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowV)"/><circle cx="995" cy="469" r="34" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="995" y="469" fill="#F4F3ED" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">−3</text><text x="1110" y="260" fill="#F4F3ED" font-size="34" font-weight="500" text-anchor="middle" dominant-baseline="middle">…</text><text x="1110" y="468" fill="#F4F3ED" font-size="34" font-weight="500" text-anchor="middle" dominant-baseline="middle">…</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">The listing reaches every integer exactly once.</text></svg>