<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 780" role="img" aria-labelledby="title desc">
<title id="title">Constructing a Hasse diagram from a relation</title>
<desc id="desc">For the divisibility order on the set 1, 2, 4, the first panel draws all six ordered pairs as a directed relation graph, including three loops and arrows 1 to 2, 2 to 4, and 1 to 4. The second removes loops and the transitive shortcut from 1 to 4, retaining only covers. The third removes arrowheads and places 4 above 2 above 1 to obtain a Hasse diagram.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7.3" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e7c17c"/></marker>
<marker id="looparrow" markerWidth="9" markerHeight="9" refX="7.3" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7fced1"/></marker>
</defs>
<rect width="1450" height="780" fill="#0d1525"/>
<text x="725" y="72" font-size="49" fill="#f4eee7" text-anchor="middle" font-family="Georgia,serif" font-weight="bold">How a relation becomes a Hasse diagram</text>
<text x="725" y="115" font-size="26" fill="#becde0" text-anchor="middle" font-family="Georgia,serif">P = {1, 2, 4}, ordered by divisibility</text>
<rect x="30" y="153" width="435" height="532" rx="19" fill="#121d30" stroke="#81cfc5" stroke-width="2.5"/>
<rect x="506" y="153" width="435" height="532" rx="19" fill="#121d30" stroke="#c6a8eb" stroke-width="2.5"/>
<rect x="982" y="153" width="435" height="532" rx="19" fill="#121d30" stroke="#ddbd7d" stroke-width="2.5"/>
<rect x="30" y="153" width="435" height="71" rx="19" fill="#184340" stroke="#81cfc5" stroke-width="2.5"/>
<rect x="506" y="153" width="435" height="71" rx="19" fill="#302842" stroke="#c6a8eb" stroke-width="2.5"/>
<rect x="982" y="153" width="435" height="71" rx="19" fill="#403623" stroke="#ddbd7d" stroke-width="2.5"/>
<text x="248" y="198" font-size="29" fill="#f7f1e9" text-anchor="middle" font-family="Georgia,serif">1. Full relation graph</text>
<text x="723" y="198" font-size="29" fill="#f7f1e9" text-anchor="middle" font-family="Georgia,serif">2. Keep only covers</text>
<text x="1198" y="198" font-size="29" fill="#f7f1e9" text-anchor="middle" font-family="Georgia,serif">3. Draw the Hasse diagram</text>
<path d="M220 518 V437" stroke="#e7c17c" fill="none" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M220 369 V287" stroke="#e7c17c" fill="none" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M250 534 C398 474 398 305 250 254" stroke="#e7c17c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M198 530 C126 484,253 436,243 530" stroke="#7fced1" fill="none" stroke-width="3.2" marker-end="url(#looparrow)"/><path d="M198 380 C126 334,253 286,243 380" stroke="#7fced1" fill="none" stroke-width="3.2" marker-end="url(#looparrow)"/><path d="M198 230 C126 184,253 136,243 230" stroke="#7fced1" fill="none" stroke-width="3.2" marker-end="url(#looparrow)"/>
<rect x="191" y="523" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="220" y="563" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">1</text><rect x="191" y="373" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="220" y="413" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="191" y="223" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="220" y="263" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">4</text>
<path d="M720 518 V437" stroke="#e7c17c" fill="none" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M720 369 V287" stroke="#e7c17c" fill="none" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="691" y="523" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="720" y="563" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">1</text><rect x="691" y="373" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="720" y="413" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="691" y="223" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="720" y="263" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">4</text>
<path d="M1217 518 V437 M1217 369 V287" stroke="#e7c17c" fill="none" stroke-width="4.5" stroke-linecap="round" /><rect x="1188" y="523" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="1217" y="563" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">1</text><rect x="1188" y="373" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="1217" y="413" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="1188" y="223" width="58" height="58" rx="29" fill="#242b48" stroke="#b9a2dd" stroke-width="2.5"/><text x="1217" y="263" font-size="33" fill="#f5f2ec" text-anchor="middle" font-family="Georgia,serif">4</text>
<text x="248" y="640" font-size="22" fill="#cbd7e0" text-anchor="middle" font-family="Arial,sans-serif">3 loops + 3 distinct pairs</text>
<text x="723" y="640" font-size="22" fill="#cbd7e0" text-anchor="middle" font-family="Arial,sans-serif">1→4 follows via 1→2→4</text>
<text x="1198" y="640" font-size="22" fill="#cbd7e0" text-anchor="middle" font-family="Arial,sans-serif">No loops or arrowheads</text>
<rect x="73" y="708" width="1304" height="49" rx="12" fill="#28263b" stroke="#e7c17c" stroke-width="2.5"/>
<text x="725" y="740" font-size="24" fill="#f6f1ec" text-anchor="middle" font-family="Georgia,serif">The Hasse diagram retains exactly the cover relations; upward paths recover the rest.</text>
</svg>