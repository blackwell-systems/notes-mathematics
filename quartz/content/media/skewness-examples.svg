<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Skewness: the direction of a distribution's longer tail</title><desc id="desc">Three illustrative skewness distributions. The negatively skewed curve has a longer tail on the left and its mean lies left of its median; the symmetric curve has aligned mean and median; the positively skewed curve has a longer right tail and mean to the right of median. These mean-median relationships are common, not universal.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="45" y="59" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#F2F5FC" text-anchor="start" font-weight="bold">Skewness: the direction of a distribution's longer tail</text><line x1="46" y1="82" x2="1394" y2="82" stroke="#35546A" stroke-width="2" /><rect x="39" y="124" width="441" height="541" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="60" y="163" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#99BFF1" text-anchor="start" font-weight="bold">Negative skew</text><rect x="499" y="124" width="441" height="541" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="520" y="163" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#C6A5ED" text-anchor="start" font-weight="bold">Symmetric</text><rect x="959" y="124" width="441" height="541" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="980" y="163" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#F0BD75" text-anchor="start" font-weight="bold">Positive skew</text><line x1="68" y1="545" x2="448" y2="545" stroke="#B9CFE0" stroke-width="2" /><path d="M68.00 545.00 L68.00 544.20 L71.17 544.13 L74.33 544.06 L77.50 543.97 L80.67 543.88 L83.83 543.79 L87.00 543.68 L90.17 543.57 L93.33 543.45 L96.50 543.31 L99.67 543.17 L102.83 543.01 L106.00 542.85 L109.17 542.66 L112.33 542.47 L115.50 542.26 L118.67 542.03 L121.83 541.78 L125.00 541.51 L128.17