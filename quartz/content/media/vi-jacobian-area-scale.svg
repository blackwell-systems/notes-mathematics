<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A Jacobian measures local area scaling</title><desc id="desc">The mapping Phi(u,v)=(2u+v,v) sends a unit square to a parallelogram of area two, illustrating the absolute value of a Jacobian determinant.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">A Jacobian measures local area scaling</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C7D4E1" text-anchor="middle">A unit square transforms into a parallelogram.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#4C6A82" stroke-width="2"/><rect x="51" y="153" width="557" height="467" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#173147"/><rect x="671" y="153" width="558" height="467" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#173147"/><text x="331" y="209" font-family="Georgia,serif" font-size="28" fill="#7DD9C9" text-anchor="middle">Unit square (u,v)</text><text x="949" y="209" font-family="Georgia,serif" font-size="27" fill="#C6A5ED" text-anchor="middle">Transformed parallelogram</text><polygon points="213,485 340,485 340,358 213,358" fill="#316B64" fill-opacity=".7" stroke="#7DD9C9" stroke-width="4"/><polygon points="809,485 1063,485 1190,358 936,358" fill="#53446C" fill-opacity=".7" stroke="#C6A5ED" stroke-width="4"/><line x1="501" y1="420" x2="689" y2="420" stroke="#F1BD75" stroke-width="4"/><text x="594" y="400" font-family="Georgia,serif" font-size="26" fill="#F1BD75" text-anchor="middle">Φ</text><text x="329" y="552" font-family="Georgia,serif" font-size="29" fill="#7DD9C9" text-anchor="middle">area = 1</text><text x="950" y="552" font-family="Georgia,serif" font-size="29" fill="#C6A5ED" text-anchor="middle">area = 2</text><rect x="113" y="642" width="1053" height="63" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#173147"/><text x="640" y="681" font-family="Georgia,serif" font-size="25" fill="#F2F5FB" text-anchor="middle">Φ(u,v) = (2u + v, v)         |det DΦ| = 2</text></svg>