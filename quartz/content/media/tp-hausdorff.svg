<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Hausdorff separation</title><desc id="desc">Two distinct points x and y, each enclosed by an open neighborhood, with neighborhoods U and V disjoint.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Hausdorff separation</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Distinct points admit disjoint open neighborhoods.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="68" y="159" width="666" height="284" rx="14" stroke="#91BFF6" fill="#1C2B40" stroke-width="2.5"/><ellipse cx="239" cy="292" rx="119" ry="85" fill="none" stroke="#6DD2BD" stroke-width="4"/><ellipse cx="556" cy="292" rx="119" ry="85" fill="none" stroke="#C7B6F4" stroke-width="4"/><circle cx="239" cy="292" r="22" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="239" y="301" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">x</text><circle cx="556" cy="292" r="22" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="556" y="301" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">y</text><text x="400" y="489" fill="#F4F5EF" font-size="25" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">U ∩ V = ∅</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>