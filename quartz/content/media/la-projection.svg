<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Projection and perpendicular residual</title><desc id="desc">The vector b=(2,4) splits into projection p=(3,1) onto span(3,1) and perpendicular residual e=(-1,3). Their dot product is 3(-1)+1(3)=0.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Projection and perpendicular residual</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="42" y="128" width="710" height="453" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="43" y="129" width="708" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="397" y="164" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">One vector, two perpendicular parts</text><line x1="54" y1="183" x2="740" y2="183" stroke="#87B8EE" stroke-width="1.4" /><rect x="775" y="128" width="383" height="453" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="776" y="129" width="381" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="966.5" y="164" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Read the geometry</text><line x1="787" y1="183" x2="1146" y2="183" stroke="#BCA8EC" stroke-width="1.4" /><rect x="160" y="215" width="480" height="318" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="160" y1="215" x2="160" y2="533" stroke="#40536B" stroke-width="1" /><line x1="240" y1="215" x2="240" y2="533" stroke="#40536B" stroke-width="2" /><line x1="320" y1="215" x2="320" y2="533" stroke="#40536B" stroke-width="1" /><line x1="400" y1="215" x2="400" y2="533" stroke="#40536B" stroke-width="1" /><line x1="480" y1="215" x2="480" y2="533" stroke="#40536B" stroke-width="1" /><line x1="560" y1="215" x2="560" y2="533" stroke="#40536B" stroke-width="1" /><line x1="640" y1="215" x2="640" y2="533" stroke="#40536B" stroke-width="1" /><line x1="160" y1="533" x2="640" y2="533" stroke="#40536B" stroke-width="1" /><line x1="160" y1="480" x2="640" y2="480" stroke="#40536B" stroke-width="2" /><line x1="160" y1="427" x2="640" y2="427" stroke="#40536B" stroke-width="1" /><line x1="160" y1="374" x2="640" y2="374" stroke="#40536B" stroke-width="1" /><line x1="160" y1="321" x2="640" y2="321" stroke="#40536B" stroke-width="1" /><line x1="160" y1="268" x2="640" y2="268" stroke="#40536B" stroke-width="1" /><line x1="160" y1="215" x2="640" y2="215" stroke="#40536B" stroke-width="1" /><line x1="160" y1="497.6666666666667" x2="640" y2="391.66666666666663" stroke="#63748B" stroke-width="2" stroke-dasharray="7 6"/><line x1="240" y1="480" x2="480" y2="427" stroke="#98D5A3" stroke-width="4" marker-end="url(#arr-green)" stroke-linecap="round"/><line x1="240" y1="480" x2="400" y2="268" stroke="#87B8EE" stroke-width="4" marker-end="url(#arr-blue)" stroke-linecap="round"/><line x1="480" y1="427" x2="400" y2="268" stroke="#BCA8EC" stroke-width="4" marker-end="url(#arr-violet)" stroke-linecap="round"/><text x="474" y="242" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">b = (2, 4)</text><text x="560" y="474" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">p = (3, 1)</text><text x="990" y="263" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">Projection: p = (3, 1)</text><text x="990" y="318" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">Residual: e = (−1, 3)</text><text x="990" y="385" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">p · e = −3 + 3 = 0</text><text x="990" y="446" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">The residual is at 90°</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">b = p + e, and e is perpendicular to the projection direction.</text></svg>