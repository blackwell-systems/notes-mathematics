<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Yoneda: one value determines all</title><desc id="desc">Yoneda evaluation of a natural transformation η at identity of A gives a∈F(A), and any component η_X(f) equals F(f)(a).</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Yoneda: one value determines all</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A natural transformation is fixed by its value on identity.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="60" y="152" width="678" height="135" rx="14" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><text x="399" y="197" fill="#6DD2BD" font-size="26" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One element</text><text x="399" y="246" fill="#F4F5EF" font-size="31" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">a = η_A(id_A) in F(A)</text><line x1="400" y1="298" x2="400" y2="355" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="369" width="678" height="117" rx="14" stroke="#C7B6F4" fill="#1C2B40" stroke-width="2.5"/><text x="400" y="418" fill="#C7B6F4" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Every arrow f : A → X gives</text><text x="400" y="463" fill="#F4F5EF" font-size="29" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">η_X(f) = F(f)(a)</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>