<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc"><title id="title">Multiplication by i rotates 90°</title><desc id="desc">A four-cycle 1 to i to negative 1 to negative i to 1 under repeated multiplication by i, corresponding to quarter turns in the complex plane.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="560" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Multiplication by i rotates 90°</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Complex multiplication has geometric meaning.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><line x1="437.9117977096698" y1="193.5906672376492" x2="558.0882022903302" y2="306.4093327623508" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="552.9712597316286" y1="371.19807375353776" x2="443.02874026837145" y2="445.80192624646224" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="357.111153868888" y1="445.59682198227887" x2="248.88884613111202" y2="371.40317801772113" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="243.72909171828346" y1="306.2157068238961" x2="362.2709082817166" y2="193.7842931761039" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="400" cy="158" r="43" fill="#223349" stroke="#EDB86D" stroke-width="3"/><text x="400" y="168" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="31" font-weight="770">1</text><circle cx="596" cy="342" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="596" y="352" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="31" font-weight="770">i</text><circle cx="400" cy="475" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="400" y="485" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="31" font-weight="770">−1</text><circle cx="206" cy="342" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="206" y="352" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="31" font-weight="770">−i</text><text x="400" y="327" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="26" font-weight="740">multiply by i</text><text x="40" y="543" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>