<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 645" role="img" aria-labelledby="title desc"><title id="title">Connectedness and Hausdorff separation</title><desc id="desc">Left, a real interval is shown unbroken, while an attempted decomposition into two relatively open pieces misses their common boundary point one half; hence it is not a separation of the interval. Right, two distinct real points lie in disjoint open neighborhoods, witnessing the Hausdorff property. These properties answer different questions.</desc><rect width="1280" height="645" rx="20" fill="#0C1E30"/><text x="54" y="65" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F3F6FC">Connectedness and Hausdorff separation</text><line x1="54" y1="87" x2="1226" y2="87" stroke="#34566C" stroke-width="2"/><rect x="54" y="111" width="562" height="424" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><rect x="640" y="111" width="586" height="424" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><text x="83" y="153" font-family="Arial,sans-serif" font-size="23" fill="#F3F6FC" text-anchor="start" font-weight="normal">Connectedness is about splitting</text><text x="83" y="187" font-family="Arial,sans-serif" font-size="20" fill="#B4C9D9" text-anchor="start" font-weight="normal">[0,1] has no open separation</text><line x1="105" y1="262" x2="563" y2="262" stroke="#7CA9C9" stroke-width="3"/><path d="M105 262 l15 -7 v14 Z M563 262 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="170" y1="262" x2="510" y2="262" stroke="#F2BB68" stroke-width="8" stroke-linecap="round"/><circle cx="170" cy="262" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="510" cy="262" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="170" y="300" font-family="Arial,sans-serif" font-size="18" fill="#F3F6FC" text-anchor="middle" font-weight="normal">0</text><text x="510" y="300" font-family="Arial,sans-serif" font-size="18" fill="#F3F6FC" text-anchor="middle" font-weight="normal">1</text><text x="83" y="351" font-family="Arial,sans-serif" font-size="19" fill="#B4C9D9" text-anchor="start" font-weight="normal">Attempt U = [0,1/2), V = (1/2,1]</text><line x1="105" y1="415" x2="563" y2="415" stroke="#7CA9C9" stroke-width="3"/><path d="M105 415 l15 -7 v14 Z M563 415 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="170" y1="415" x2="335" y2="415" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="170" cy="415" r="9" fill="#68D2C0" stroke="#68D2C0" stroke-width="3"/><circle cx="335" cy="415" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><line x1="335" y1="415" x2="510" y2="415" stroke="#C3A0E9" stroke-width="8" stroke-linecap="round"/><circle cx="510" cy="415" r="9" fill="#C3A0E9" stroke="#C3A0E9" stroke-width="3"/><circle cx="335" cy="415" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><text x="335" y="460" font-family="Arial,sans-serif" font-size="20" fill="#F2A7AE" text-anchor="middle" font-weight="bold">1/2 is missing</text><text x="80" y="498" font-family="Arial,sans-serif" font-size="18" fill="#F2A7AE" text-anchor="start" font-weight="normal">U ∪ V is not the entire interval.</text><text x="673" y="153" font-family="Arial,sans-serif" font-size="23" fill="#F3F6FC" text-anchor="start" font-weight="normal">Hausdorffness separates points</text><text x="673" y="188" font-family="Arial,sans-serif" font-size="20" fill="#B4C9D9" text-anchor="start" font-weight="normal">Distinct x, y have disjoint opens</text><line x1="683" y1="262" x2="1177" y2="262" stroke="#7CA9C9" stroke-width="3"/><path d="M683 262 l15 -7 v14 Z M1177 262 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="721" y1="262" x2="894" y2="262" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="721" cy="262" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><circle cx="894" cy="262" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><line x1="984" y1="262" x2="1150" y2="262" stroke="#F2BB68" stroke-width="8" stroke-linecap="round"/><circle cx="984" cy="262" r="9" fill="#0C1E30" stroke="#F2BB68" stroke-width="3"/><circle cx="1150" cy="262" r="9" fill="#0C1E30" stroke="#F2BB68" stroke-width="3"/><circle cx="804" cy="262" r="10" fill="#68D2C0" stroke="#68D2C0" stroke-width="3"/><circle cx="1065" cy="262" r="10" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="802" y="234" font-family="Arial,sans-serif" font-size="26" fill="#68D2C0" text-anchor="middle" font-weight="bold">U</text><text x="1065" y="234" font-family="Arial,sans-serif" font-size="26" fill="#F2BB68" text-anchor="middle" font-weight="bold">V</text><text x="804" y="302" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">x</text><text x="1065" y="302" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">y</text><text x="928" y="367" font-family="Arial,sans-serif" font-size="24" fill="#F3F6FC" text-anchor="middle" font-weight="normal">U ∩ V = ∅</text><text x="928" y="400" font-family="Arial,sans-serif" font-size="19" fill="#B4C9D9" text-anchor="middle" font-weight="normal">Different points; disjoint neighborhoods.</text><rect x="54" y="549" width="1172" height="67" rx="10" fill="#10263A" stroke="#426982" stroke-width="2"/><text x="640" y="591" font-family="Arial,sans-serif" font-size="20" fill="#F3F6FC" text-anchor="middle" font-weight="normal">Connectedness concerns the whole space; Hausdorffness concerns pairs of points.</text></svg>