<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Why sequential compactness needs closedness and boundedness</title><desc id="desc">Three number-line schematic panels show 1/n in open interval (0,1) converging outside, n in R escaping infinity, and every sequence in closed bounded [0,1] having a convergent subsequence with limit inside.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" font-family="Georgia,serif" font-size="37" fill="#F2F5FA" text-anchor="middle">Why sequential compactness needs closedness and boundedness</text><text x="640" y="107" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">Two failed examples and the successful compact case.</text><rect x="41" y="164" width="373" height="461" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="227" y="215" font-family="Georgia,serif" font-size="25" fill="#C8A7EE" text-anchor="middle">Bounded, not closed</text><text x="227" y="268" font-family="Georgia,serif" font-size="35" fill="#F2F5FA" text-anchor="middle">(0,1)</text><line x1="80" y1="392" x2="372" y2="392" stroke="#526980" stroke-width="2" /><circle cx="129" cy="392" r="6" fill="#1A3047" stroke="#C8A7EE" stroke-width="3"/><circle cx="162.6" cy="392" r="6" fill="#C8A7EE" stroke="#C8A7EE" stroke-width="3"/><circle cx="198.3" cy="392" r="6" fill="#C8A7EE" stroke="#C8A7EE" stroke-width="3"/><circle cx="246.60000000000002" cy="392" r="6" fill="#C8A7EE" stroke="#C8A7EE" stroke-width="3"/><circle cx="339" cy="392" r="6" fill="#C8A7EE" stroke="#C8A7EE" stroke-width="3"/><text x="227" y="518" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">limit escapes the set</text><text x="227" y="583" font-family="Georgia,serif" font-size="16" fill="#C1D0E1" text-anchor="middle">xₙ = 1/n → 0 ∉ (0,1)</text><rect x="454" y="164" width="373" height="461" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="640" y="215" font-family="Georgia,serif" font-size="25" fill="#F0BD75" text-anchor="middle">Closed, not bounded</text><text x="640" y="268" font-family="Georgia,serif" font-size="35" fill="#F2F5FA" text-anchor="middle">ℝ</text><line x1="493" y1="392" x2="785" y2="392" stroke="#526980" stroke-width="2" /><circle cx="529" cy="392" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="3"/><circle cx="580" cy="392" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="3"/><circle cx="631" cy="392" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="3"/><circle cx="682" cy="392" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="3"/><circle cx="733" cy="392" r="6" fill="#F0BD75" stroke="#F0BD75" stroke-width="3"/><text x="640" y="518" font-family="Georgia,serif" font-size="21" fill="#C1D0E1" text-anchor="middle">terms escape to infinity</text><text x="640" y="583" font-family="Georgia,serif" font-size="16" fill="#C1D0E1" text-anchor="middle">xₙ = n has no convergent subsequence</text><rect x="867" y="164" width="373" height="461" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="1053" y="215" font-family="Georgia,serif" font-size="25" fill="#7DD9C9" text-anchor="middle">Closed and bounded</text><text x="1053" y="268" font-family="Georgia,serif" font-size="35" fill="#F2F5FA" text-anchor="middle">[0,1]</text><line x1="906" y1="392" x2="1198" y2="392" stroke="#526980" stroke-width="2" /><circle cx="1151" cy="392" r="6" fill="#7DD9C9" stroke="#7DD9C9" stroke-width="3"/><circle cx="1074.24" cy="392" r="6" fill="#7DD9C9" stroke="#7DD9C9" stroke-width="3"/><circle cx="1026.6488" cy="392" r="6" fill="#7DD9C9" stroke="#7DD9C9" stroke-width="3"/><circle cx="997.142256" cy="392" r="6" fill="#7DD9C9" stroke="#7DD9C9" stroke-width="3"/><circle cx="978.84819872" cy="392" r="6" fill="#7DD9C9" stroke="#7DD9C9" stroke-width="3"/><circle cx="967.5058832064" cy="392" r="6" fill="#7DD9C9" stroke="#7DD9C9" stroke-width="3"/><text x="1053" y="518" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">a limit remains inside</text><text x="1053" y="583" font-family="Georgia,serif" font-size="16" fill="#C1D0E1" text-anchor="middle">Every sequence has a convergent subsequence</text><rect x="125" y="641" width="1030" height="64" rx="16" stroke="#F0BD75" stroke-width="2.5" fill="#293648"/><text x="640" y="682" font-family="Georgia,serif" font-size="27" fill="#F2F5FA" text-anchor="middle">In ℝ, sequential compactness ⇔ closed and bounded.</text></svg>