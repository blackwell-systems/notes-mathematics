<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Normal distribution: the 68–95–99.7 rule</title><desc id="desc">Standard normal bell curve with three nested symmetric bands centered at zero. Approximately 68.27 percent of values lie between minus one and plus one standard deviation, 95.45 percent between minus two and plus two, and 99.73 percent between minus three and plus three.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="45" y="59" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#F2F5FC" text-anchor="start" font-weight="bold">Normal distribution: the 68–95–99.7 rule</text><line x1="46" y1="82" x2="1394" y2="82" stroke="#35546A" stroke-width="2" /><rect x="45" y="121" width="1348" height="552" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="66" y="160" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#99BFF1" text-anchor="start" font-weight="bold">Standard normal distribution: μ = 0 and σ = 1</text><line x1="170" y1="475" x2="1260" y2="475" stroke="#B9CFE0" stroke-width="2" /><line x1="170" y1="198" x2="170" y2="475" stroke="#B9CFE0" stroke-width="2" /><line x1="306.25" y1="475" x2="306.25" y2="481" stroke="#B9CFE0" stroke-width="1.4" /><text x="306.25" y="502" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">-3</text><line x1="442.5" y1="475" x2="442.5" y2="481" stroke="#B9CFE0" stroke-width="1.4" /><text x="442.5" y="502" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">-2</text><line x1="578.75" y1="475" x2="578.75" y2="481" stroke="#B9CFE0" stroke-width="1.4" /><text x="578.75" y="502" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CFE0" text-anchor="middle" font-weight="normal">-1</text><line x1="715" y1="475" x2="715" y2="481" stroke="#B9CFE0" stroke-width="1.4" /><text x="715" y