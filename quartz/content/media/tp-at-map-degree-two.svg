<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A circle map doubles the winding number</title><desc id="desc">A map of degree two on the unit circle sends the generator of the fundamental group to twice the generator; the induced homomorphism on integers multiplies by two.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">A circle map doubles the winding number</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">The map z ↦ z² carries a once-winding loop to a twice-winding loop.</text><rect x="52" y="147" width="557" height="471" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="76" y="190" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">Input loop: one turn</text><line x1="74" y1="206" x2="587" y2="206" stroke="#4C6685" stroke-width="1.5" /><rect x="671" y="147" width="558" height="471" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="695" y="190" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">Output loop: two turns</text><line x1="693" y1="206" x2="1207" y2="206" stroke="#4C6685" stroke-width="1.5" /><circle cx="330" cy="354" r="125" fill="none" stroke="#7DD9C9" stroke-width="5"/><circle cx="455" cy="354" r="7" fill="#F0BD75" stroke="#F0BD75" stroke-width="4"/><path d="M455 354 A125 125 0 0 0 330 229" fill="none" stroke="#F0BD75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="330" y="538" font-family="Georgia,serif" font-size="26" fill="#F4F2EF" text-anchor="middle" font-weight="400">winding = 1</text><circle cx="948" cy="354" r="125" fill="none" stroke="#7DD9C9" stroke-width="5"/><circle cx="1073" cy="354" r="7" fill="#F0BD75" stroke="#F0BD75" stroke-width="4"/><path d="M1073 354 A125 125 0 0 0 948 229" fill="none" stroke="#F0BD75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M1072 352 A125 125 0 1 0 823 354 A125 125 0 1 0 1070 336" fill="none" stroke="#C9A8F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="948" y="538" font-family="Georgia,serif" font-size="26" fill="#F4F2EF" text-anchor="middle" font-weight="400">winding = 2</text><path d="M613 363 L664 363" fill="none" stroke="#F0BD75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="337" font-family="Georgia,serif" font-size="25" fill="#F0BD75" text-anchor="middle" font-weight="400">z ↦ z²</text><rect x="120" y="629" width="1040" height="69" rx="16" fill="#263348" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="674" font-family="Georgia,serif" font-size="29" fill="#F4F2EF" text-anchor="middle" font-weight="400">On π₁(S¹) ≅ ℤ, the induced map is n ↦ 2n.</text></svg>