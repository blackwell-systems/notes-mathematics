<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1620" viewBox="0 0 1440 1620" role="img" aria-labelledby="title desc">
<title id="title">Classes of relations, total orders, chains, and antichains</title>
<desc id="desc">A two-part educational diagram. The upper hierarchy starts with relations, then binary relations, then preorders defined by reflexivity and transitivity. Preorders branch into partial orders adding antisymmetry and equivalence relations adding symmetry. Total orders are partial orders with comparable pairs. Equality is the sole relation on a fixed set that is both an equivalence and partial order. The lower diagrams show the same four-element inclusion poset twice: one highlights a chain of three comparable subsets; one highlights the incomparable singleton antichain. A third panel uses equality on three points, where the whole set is an antichain and transitivity holds vacuously for nontrivial cases. Hasse diagrams omit self-loops and transitive edges.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111C35"/><stop offset="1" stop-color="#0A1123"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#9DBCE8"/></marker>
</defs>
<rect width="1440" height="1620" fill="url(#background)"/>
<text x="720" y="63" font-family="Georgia, 'DejaVu Serif', serif" font-size="47" font-weight="700" fill="#F4F3ED" text-anchor="middle">Relations, orders, chains, and antichains</text>
<text x="720" y="103" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" fill="#C6D1E0" text-anchor="middle">First classify the relation; then examine subsets inside an ordered set</text>
<path d="M65 129 H1375" fill="none" stroke="#4F6B93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="164" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" fill="#8BB9F0" text-anchor="middle">PART I · CLASSIFY THE RELATION</text>
<rect x="437" y="185" width="566" height="74" rx="18" fill="#192E4C" stroke="#8BB9F0" stroke-width="2.5"/>
<text x="720" y="215" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#F4F3ED" text-anchor="middle">RELATIONS (ANY ARITY)</text>
<text x="720" y="244" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#C6D1E0" text-anchor="middle">unary, binary, ternary, ...</text>
<path d="M720 259 V282" fill="none" stroke="#8BB9F0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="437" y="290" width="566" height="73" rx="18" fill="#192E4C" stroke="#8BB9F0" stroke-width="2.5"/>
<text x="720" y="319" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#F4F3ED" text-anchor="middle">BINARY RELATIONS</text>
<text x="720" y="346" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#C6D1E0" text-anchor="middle">two inputs; represented by ordered pairs</text>
<path d="M720 363 V387" fill="none" stroke="#8BB9F0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="326" y="396" width="788" height="87" rx="18" fill="#28213D" stroke="#C4A5F5" stroke-width="2.5"/>
<text x="720" y="434" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="29" font-weight="700" fill="#F4F3ED" text-anchor="middle">PREORDERS</text>
<text x="720" y="464" font-family="Georgia, 'DejaVu Serif', serif" font-size="23" font-weight="600" fill="#C4A5F5" text-anchor="middle">reflexive + transitive</text>
<path d="M720 483 V495 H369 V518" fill="none" stroke="#8BB9F0" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M720 495 H1070 V518" fill="none" stroke="#8BB9F0" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="68" y="526" width="602" height="140" rx="18" fill="#163943" stroke="#7CDBCC" stroke-width="2.5"/>
<text x="369" y="565" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="29" font-weight="700" fill="#F4F3ED" text-anchor="middle">PARTIAL ORDERS</text>
<text x="369" y="598" font-family="Georgia, 'DejaVu Serif', serif" font-size="23" font-weight="600" fill="#7CDBCC" text-anchor="middle">+ antisymmetry</text>
<text x="369" y="632" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" fill="#C6D1E0" text-anchor="middle">Distinct elements cannot compare both ways</text>
<rect x="770" y="526" width="602" height="140" rx="18" fill="#29213D" stroke="#C4A5F5" stroke-width="2.5"/>
<text x="1071" y="565" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#F4F3ED" text-anchor="middle">EQUIVALENCE RELATIONS</text>
<text x="1071" y="598" font-family="Georgia, 'DejaVu Serif', serif" font-size="23" font-weight="600" fill="#C4A5F5" text-anchor="middle">+ symmetry</text>
<text x="1071" y="632" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#C6D1E0" text-anchor="middle">Every comparison must work in reverse</text>
<path d="M369 666 V735" fill="none" stroke="#7CDBCC" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M606 666 L728 708 H1020 V735" fill="none" stroke="#8BB9F0" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1071 666 V735" fill="none" stroke="#C4A5F5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="68" y="748" width="602" height="112" rx="18" fill="#362A22" stroke="#EDB86D" stroke-width="2.5"/>
<text x="369" y="788" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#EDB86D" text-anchor="middle">TOTAL ORDERS</text>
<text x="369" y="819" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="550" fill="#F4F3ED" text-anchor="middle">partial order + every pair comparable</text>
<text x="369" y="841" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#C6D1E0" text-anchor="middle">All earlier axioms are retained</text>
<rect x="770" y="748" width="602" height="112" rx="18" fill="#20334E" stroke="#8BB9F0" stroke-width="2.5"/>
<text x="1071" y="782" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="700" fill="#8BB9F0" text-anchor="middle">EQUALITY: THE ONLY OVERLAP</text>
<text x="1071" y="815" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="550" fill="#F4F3ED" text-anchor="middle">symmetric + antisymmetric + reflexive</text>
<text x="1071" y="840" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" fill="#C6D1E0" text-anchor="middle">Only (x, x) pairs, on the same underlying set</text>
<rect x="146" y="890" width="1148" height="58" rx="14" fill="#19263B" stroke="#677F9F" stroke-width="1.7"/>
<text x="720" y="926" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="600" fill="#F4F3ED" text-anchor="middle">A POSET = an underlying set P equipped with a partial-order relation</text>
<path d="M65 968 H1375" fill="none" stroke="#4F6B93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="1005" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700" fill="#8BB9F0" text-anchor="middle">PART II · INSIDE A POSET</text>
<text x="720" y="1037" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="400" fill="#C6D1E0" text-anchor="middle">Same inclusion poset in the first two panels · a different equality poset in the third</text>
<rect x="28" y="1065" width="436" height="427" rx="18" fill="#17283C" stroke="#7CDBCC" stroke-width="2.5"/>
<text x="246" y="1110" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="29" font-weight="700" fill="#7CDBCC" text-anchor="middle">CHAIN</text>
<text x="246" y="1142" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#C6D1E0" text-anchor="middle">Every pair in the selected subset compares</text>
<rect x="502" y="1065" width="436" height="427" rx="18" fill="#17283C" stroke="#EDB86D" stroke-width="2.5"/>
<text x="720" y="1110" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="29" font-weight="700" fill="#EDB86D" text-anchor="middle">ANTICHAIN</text>
<text x="720" y="1142" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#C6D1E0" text-anchor="middle">No distinct selected elements compare</text>
<rect x="976" y="1065" width="436" height="427" rx="18" fill="#17283C" stroke="#C4A5F5" stroke-width="2.5"/>
<text x="1194" y="1110" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#C4A5F5" text-anchor="middle">ENTIRE-SET ANTICHAIN</text>
<text x="1194" y="1142" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#C6D1E0" text-anchor="middle">The equality relation on {a, b, c}</text>
<text x="246" y="1187" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" fill="#F4F3ED" text-anchor="middle">P({a, b}) ordered by inclusion</text>
<path data-diagram="chain" data-from="a" data-to="ab" d="M224.4 1249.4 L178.6 1290.6" fill="none" stroke="#7CDBCC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path data-diagram="chain" data-from="b" data-to="ab" d="M267.6 1249.4 L313.4 1290.6" fill="none" stroke="#596D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-diagram="chain" data-from="none" data-to="a" d="M178.6 1329.4 L224.4 1370.6" fill="none" stroke="#7CDBCC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path data-diagram="chain" data-from="none" data-to="b" d="M313.4 1329.4 L267.6 1370.6" fill="none" stroke="#596D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-diagram="chain" data-subset="ab" data-selected="true" cx="246" cy="1230" r="28" stroke="#7CDBCC" fill="#122338" stroke-width="3.3"/>
<text x="246" y="1237" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="650" fill="#F4F3ED" text-anchor="middle">{a, b}</text>
<circle data-diagram="chain" data-subset="a" data-selected="true" cx="157" cy="1310" r="28" stroke="#7CDBCC" fill="#122338" stroke-width="3.3"/>
<text x="157" y="1317" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="650" fill="#F4F3ED" text-anchor="middle">{a}</text>
<circle data-diagram="chain" data-subset="b" data-selected="false" cx="335" cy="1310" r="28" stroke="#688198" fill="#202C40" stroke-width="3.3"/>
<text x="335" y="1317" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="650" fill="#ACBBD0" text-anchor="middle">{b}</text>
<circle data-diagram="chain" data-subset="none" data-selected="true" cx="246" cy="1390" r="28" stroke="#7CDBCC" fill="#122338" stroke-width="3.3"/>
<text x="246" y="1397" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="650" fill="#F4F3ED" text-anchor="middle">∅</text>
<text x="246" y="1460" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="650" fill="#7CDBCC" text-anchor="middle">Selected: ∅, {a}, {a, b}</text>
<text x="720" y="1187" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" fill="#F4F3ED" text-anchor="middle">P({a, b}) ordered by inclusion</text>
<path data-diagram="antichain" data-from="a" data-to="ab" d="M698.4 1249.4 L652.6 1290.6" fill="none" stroke="#596D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-diagram="antichain" data-from="b" data-to="ab" d="M741.6 1249.4 L787.4 1290.6" fill="none" stroke="#596D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-diagram="antichain" data-from="none" data-to="a" d="M652.6 1329.4 L698.4 1370.6" fill="none" stroke="#596D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path data-diagram="antichain" data-from="none" data-to="b" d="M787.4 1329.4 L741.6 1370.6" fill="none" stroke="#596D83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-diagram="antichain" data-subset="ab" data-selected="false" cx="720" cy="1230" r="28" stroke="#688198" fill="#202C40" stroke-width="3.3"/>
<text x="720" y="1237" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="650" fill="#ACBBD0" text-anchor="middle">{a, b}</text>
<circle data-diagram="antichain" data-subset="a" data-selected="true" cx="631" cy="1310" r="28" stroke="#EDB86D" fill="#122338" stroke-width="3.3"/>
<text x="631" y="1317" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="650" fill="#F4F3ED" text-anchor="middle">{a}</text>
<circle data-diagram="antichain" data-subset="b" data-selected="true" cx="809" cy="1310" r="28" stroke="#EDB86D" fill="#122338" stroke-width="3.3"/>
<text x="809" y="1317" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="650" fill="#F4F3ED" text-anchor="middle">{b}</text>
<circle data-diagram="antichain" data-subset="none" data-selected="false" cx="720" cy="1390" r="28" stroke="#688198" fill="#202C40" stroke-width="3.3"/>
<text x="720" y="1397" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="650" fill="#ACBBD0" text-anchor="middle">∅</text>
<text x="720" y="1460" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="650" fill="#EDB86D" text-anchor="middle">Selected: {a} and {b}</text>
<text x="1194" y="1190" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400" fill="#F4F3ED" text-anchor="middle">Only self-comparisons exist</text>
<circle data-diagram="equality" data-subset="a" data-selected="true" cx="1055" cy="1307" r="31" stroke="#C4A5F5" fill="#122338" stroke-width="3.3"/>
<text x="1055" y="1315" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="700" fill="#F4F3ED" text-anchor="middle">a</text>
<circle data-diagram="equality" data-subset="b" data-selected="true" cx="1194" cy="1307" r="31" stroke="#C4A5F5" fill="#122338" stroke-width="3.3"/>
<text x="1194" y="1315" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="700" fill="#F4F3ED" text-anchor="middle">b</text>
<circle data-diagram="equality" data-subset="c" data-selected="true" cx="1333" cy="1307" r="31" stroke="#C4A5F5" fill="#122338" stroke-width="3.3"/>
<text x="1333" y="1315" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="25" font-weight="700" fill="#F4F3ED" text-anchor="middle">c</text>
<text x="1194" y="1378" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="650" fill="#C4A5F5" text-anchor="middle">No Hasse edges</text>
<text x="1194" y="1413" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="400" fill="#F4F3ED" text-anchor="middle">All three elements form an antichain</text>
<text x="1194" y="1441" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#C6D1E0" text-anchor="middle">Transitivity: vacuous for distinct cases</text>
<path d="M65 1535 H1375" fill="none" stroke="#4F6B93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="1570" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="600" fill="#F4F3ED" text-anchor="middle">Chains and antichains are subsets of posets, not new kinds of relations.</text>
<text x="720" y="1598" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400" fill="#C6D1E0" text-anchor="middle">Hasse preview: upward lines show covers; self-comparisons and transitive shortcuts are omitted.</text>
</svg>