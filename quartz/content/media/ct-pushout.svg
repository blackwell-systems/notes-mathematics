<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Pushout: glue along a source</title><desc id="desc">C maps to A and B; pushout Q identifies images f(c) and g(c), producing a universal glued object.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Pushout: glue along a source</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Two objects share an interface C.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><circle cx="190" cy="177" r="44" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="190" y="186" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A</text><circle cx="400" cy="177" r="44" fill="#243850" stroke="#F4C474" stroke-width="3"/><text x="400" y="186" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C</text><circle cx="610" cy="177" r="44" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="610" y="186" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">B</text><circle cx="400" cy="413" r="52" fill="#243850" stroke="#91BFF6" stroke-width="3"/><text x="400" y="422" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Q</text><line x1="342" y1="177" x2="247" y2="177" stroke="#6DD2BD" stroke-width="3" marker-end="url(#arr)"/><line x1="456" y1="177" x2="553" y2="177" stroke="#C7B6F4" stroke-width="3" marker-end="url(#arr)"/><line x1="205" y1="223" x2="355" y2="386" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="594" y1="223" x2="447" y2="386" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><text x="310" y="152" fill="#6DD2BD" font-size="22" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f</text><text x="500" y="152" fill="#C7B6F4" font-size="22" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">g</text><text x="400" y="323" fill="#F4C474" font-size="22" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">identify f(c) with g(c)</text><text x="400" y="497" fill="#C1CDDA" font-size="20" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pushout Q</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>