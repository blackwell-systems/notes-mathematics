<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Poisson process: event times and cumulative counts</title><desc id="desc">Event timeline with 12 irregularly spaced sample arrivals between time zero and five and a teal cumulative step count. Six observed events occur in the first two time units. For a rate-three Poisson process N(t) has a Poisson distribution with mean three t, and gaps are exponential.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="45" y="59" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#F2F5FC" text-anchor="start" font-weight="bold">Poisson process: event times and cumulative counts</text><line x1="46" y1="82" x2="1394" y2="82" stroke="#35546A" stroke-width="2" /><rect x="54" y="116" width="1332" height="575" rx="14" fill="#173248" stroke="#456783" stroke-width="2"/><text x="75" y="155" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#99BFF1" text-anchor="start" font-weight="bold">One possible realization: λ = 3 arrivals per unit time</text><line x1="126" y1="445" x2="1316" y2="445" stroke="#B9CFE0" stroke-width="3" /><line x1="126" y1="436" x2="126" y2="454" stroke="#B9CFE0" stroke-width="2" /><text x="126" y="482" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">0</text><line x1="364" y1="436" x2="364" y2="454" stroke="#B9CFE0" stroke-width="2" /><text x="364" y="482" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">1</text><line x1="602" y1="436" x2="602" y2="454" stroke="#B9CFE0" stroke-width="2" /><text x="602" y="482" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">2</text><line x1="840" y1="436" x2="840" y2="454" stroke="#B9CFE0" stroke-width="2" /><text x="840" y="482" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">3</text><line x1="1078" y1="436" x2="1078" y2="454" stroke="#B9CFE0" stroke-width="2" /><text x="1078" y="482" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">4</text><line x1="1316" y1="436" x2="1316" y2="454" stroke="#B9CFE0" stroke-width="2" /><text x="1316" y="482" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">5</text><text x="130" y="217" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#B9CFE0" text-anchor="start" font-weight="normal">Event times (dots on timeline)</text><circle cx="164.07999999999998" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="164.07999999999998" y1="433" x2="164.07999999999998" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="218.82" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="218.82" y1="433" x2="218.82" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="297.36" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="297.36" y1="433" x2="297.36" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="383.04" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="383.04" y1="433" x2="383.04" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="525.8399999999999" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="525.8399999999999" y1="433" x2="525.8399999999999" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="561.5400000000001" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="561.5400000000001" y1="433" x2="561.5400000000001" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="651.98" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="651.98" y1="433" x2="651.98" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="742.42" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="742.42" y1="433" x2="742.42" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="873.32" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="873.32" y1="433" x2="873.32" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="906.64" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="906.64" y1="433" x2="906.64" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="1037.54" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="1037.54" y1="433" x2="1037.54" y2="418" stroke="#99BFF1" stroke-width="1.7" /><circle cx="1208.9" cy="445" r="9" fill="#99BFF1" stroke="none" stroke-width="0"/><line x1="1208.9" y1="433" x2="1208.9" y2="418" stroke="#99BFF1" stroke-width="1.7" /><path d="M126.00 405.00 L164.08 405.00 L164.08 388.00 L218.82 388.00 L218.82 371.00 L297.36 371.00 L297.36 354.00 L383.04 354.00 L383.04 337.00 L525.84 337.00 L525.84 320.00 L561.54 320.00 L561.54 303.00 L651.98 303.00 L651.98 286.00 L742.42 286.00 L742.42 269.00 L873.32 269.00 L873.32 252.00 L906.64 252.00 L906.64 235.00 L1037.54 235.00 L1037.54 218.00 L1208.90 218.00 L1208.90 201.00 L1316.00 201.00" fill="none" stroke="#7DD9C9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="131" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#7DD9C9" text-anchor="start" font-weight="normal">Cumulative count N(t) (teal steps)</text><rect x="126" y="508" width="476" height="58" rx="7" fill="#11293C" stroke="#F0BD75" stroke-width="2"/><text x="364" y="544" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#F0BD75" text-anchor="middle" font-weight="normal">N(2) = 6 observed arrivals</text><text x="126" y="621" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CFE0" text-anchor="start" font-weight="normal">The number in a time window is random:</text><text x="126" y="661" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#F2F5FC" text-anchor="start" font-weight="normal">N(t) ~ Poisson(λt) and waiting times ~ Exponential(λ)</text><text x="720" y="735" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CFE0" text-anchor="middle" font-weight="normal">Dots show one sampled-looking path, not deterministic or equally spaced arrivals.</text></svg>