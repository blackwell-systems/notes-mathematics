<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Universal product</title><desc id="desc">Product cone from X to A and B factors uniquely through A×B with projections p_A and p_B and mediating arrow ⟨f,g⟩.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Universal product</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A pair of arrows uniquely factors through A×B.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><circle cx="400" cy="176" r="44" fill="#243850" stroke="#F4C474" stroke-width="3"/><text x="400" y="185" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">X</text><circle cx="195" cy="406" r="44" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="195" y="415" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A</text><circle cx="605" cy="406" r="44" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="605" y="415" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">B</text><circle cx="400" cy="311" r="53" fill="#243850" stroke="#91BFF6" stroke-width="3"/><text x="400" y="320" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A×B</text><line x1="369" y1="216" x2="417" y2="258" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="355" y1="335" x2="246" y2="389" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="447" y1="335" x2="554" y2="389" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="363" y1="193" x2="214" y2="366" stroke="#6DD2BD" stroke-width="3" marker-end="url(#arr)"/><line x1="439" y1="193" x2="587" y2="366" stroke="#C7B6F4" stroke-width="3" marker-end="url(#arr)"/><text x="283" y="263" fill="#6DD2BD" font-size="22" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f</text><text x="510" y="263" fill="#C7B6F4" font-size="22" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">g</text><text x="358" y="243" fill="#F4C474" font-size="20" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">⟨f,g⟩</text><text x="274" y="361" fill="#91BFF6" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">p_A</text><text x="523" y="361" fill="#91BFF6" font-size="19" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">p_B</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>