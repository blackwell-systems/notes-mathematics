<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Why the Intermediate Value Theorem needs its hypotheses</title><desc id="desc">Three side by side graphs: a continuous curve crosses intermediate target height, discontinuous jump from zero to one skips one-half, and continuous identity on disconnected domain [-2,-1] union [1,2] skips zero.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" font-family="Georgia,serif" font-size="37" fill="#F2F5FA" text-anchor="middle">Why the Intermediate Value Theorem needs its hypotheses</text><text x="640" y="107" font-family="Georgia,serif" font-size="22" fill="#C1D0E1" text-anchor="middle">A continuous curve on an interval cannot skip a height; two failures explain why.</text><rect x="31" y="154" width="391" height="467" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="226" y="202" font-family="Georgia,serif" font-size="27" fill="#7DD9C9" text-anchor="middle">IVT works</text><rect x="445" y="154" width="391" height="467" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="640" y="202" font-family="Georgia,serif" font-size="27" fill="#C8A7EE" text-anchor="middle">Discontinuity breaks it</text><rect x="859" y="154" width="391" height="467" rx="16" stroke="#526980" stroke-width="2.5" fill="#1A3047"/><text x="1054" y="202" font-family="Georgia,serif" font-size="27" fill="#F0BD75" text-anchor="middle">Disconnected domain</text><line x1="80" y1="545" x2="80" y2="277" stroke="#C1D0E1" stroke-width="2" /><line x1="80" y1="545" x2="360" y2="545" stroke="#C1D0E1" stroke-width="2" /><line x1="494" y1="545" x2="494" y2="277" stroke="#C1D0E1" stroke-width="2" /><line x1="494" y1="545" x2="775" y2="545" stroke="#C1D0E1" stroke-width="2" /><line x1="908" y1="545" x2="908" y2="277" stroke="#C1D0E1" stroke-width="2" /><line x1="908" y1="545" x2="1187" y2="545" stroke="#C1D0E1" stroke-width="2" /><path d="M110 507 C172 505 184 440 230 410 S303 315 343 299" fill="none" stroke="#7DD9C9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="80" y1="408" x2="354" y2="408" stroke="#F0BD75" stroke-width="3" stroke-dasharray="9 6"/><circle cx="231" cy="408" r="9" fill="#F0BD75" stroke="#F2F5FA" stroke-width="3"/><text x="345" y="394" font-family="Georgia,serif" font-size="22" fill="#F0BD75" text-anchor="start">v</text><text x="238" y="441" font-family="Georgia,serif" font-size="22" fill="#F2F5FA" text-anchor="start">c</text><path d="M512 483 L631 483" fill="none" stroke="#7DD9C9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M631 335 L762 335" fill="none" stroke="#7DD9C9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="631" cy="483" r="8" fill="#1A3047" stroke="#7DD9C9" stroke-width="3"/><circle cx="631" cy="335" r="9" fill="#7DD9C9" stroke="#F2F5FA" stroke-width="3"/><line x1="500" y1="408" x2="771" y2="408" stroke="#F0BD75" stroke-width="3" stroke-dasharray="9 6"/><text x="762" y="397" font-family="Georgia,serif" font-size="22" fill="#F0BD75" text-anchor="end">v = ½</text><path d="M931 497 L1017 439" fill="none" stroke="#7DD9C9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M1080 351 L1165 288" fill="none" stroke="#7DD9C9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><line x1="913" y1="408" x2="1188" y2="408" stroke="#F0BD75" stroke-width="3" stroke-dasharray="9 6"/><text x="1176" y="392" font-family="Georgia,serif" font-size="22" fill="#F0BD75" text-anchor="end">v = 0</text><text x="224" y="586" font-family="Georgia,serif" font-size="19" fill="#C1D0E1" text-anchor="middle">continuous on [a,b]</text><text x="642" y="586" font-family="Georgia,serif" font-size="19" fill="#C1D0E1" text-anchor="middle">a jump skips v</text><text x="1054" y="586" font-family="Georgia,serif" font-size="19" fill="#C1D0E1" text-anchor="middle">f(x)=x on two intervals</text><rect x="71" y="644" width="1138" height="59" rx="16" stroke="#F0BD75" stroke-width="2.5" fill="#293648"/><text x="640" y="681" font-family="Georgia,serif" font-size="25" fill="#F2F5FA" text-anchor="middle">Continuity and an interval domain are both essential hypotheses.</text></svg>