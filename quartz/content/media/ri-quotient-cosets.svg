<svg xmlns="http://www.w3.org/2000/svg" width="800" height="563" viewBox="0 0 800 563" role="img" aria-labelledby="title desc"><title id="title">Quotienting the integers</title><desc id="desc">Three additive cosets modulo 3: multiples of 3; integers one more than multiples of 3; integers two more. Every integer belongs to exactly one coset.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="563" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Quotienting the integers</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Z / 3Z partitions integers into three classes.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="55" y="151" width="690" height="94" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="94" y="189" fill="#66C4B4" font-size="26" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">0 + I</text><text x="94" y="225" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">…, −6, −3, 0, 3, 6, …</text><rect x="55" y="264" width="690" height="94" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="94" y="302" fill="#BCA8EC" font-size="26" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1 + I</text><text x="94" y="338" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">…, −5, −2, 1, 4, 7, …</text><rect x="55" y="377" width="690" height="94" rx="16" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="94" y="415" fill="#EDB86D" font-size="26" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">2 + I</text><text x="94" y="451" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">…, −4, −1, 2, 5, 8, …</text><text x="400" y="514" fill="#C4CEDA" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">I = 3Z ;  each integer belongs to one coset.</text><text x="40" y="545" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>