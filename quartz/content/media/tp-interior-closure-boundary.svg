<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Interior, closure, and boundary of A = (0,1]</title><desc id="desc">Four aligned real number lines for A=(0,1], its interior (0,1), closure [0,1], and boundary {0,1}; zero is a boundary point outside A and one is a boundary point inside A.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><line x1="54" y1="91" x2="1226" y2="91" stroke="#506885" stroke-width="2"/><text x="640" y="61" fill="#F2F4F9" font-size="39" font-family="Georgia,serif" text-anchor="middle">Interior, closure, and boundary of A = (0,1]</text><text x="640" y="122" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">The status of an endpoint depends on the construction, not its appearance.</text><rect x="50" y="159" width="1180" height="470" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><text x="81" y="231" fill="#F2BC75" font-size="30" font-family="Georgia,serif" text-anchor="start">A = (0,1]</text><line x1="585" y1="223" x2="1159" y2="223" stroke="#506885" stroke-width="2" /><line x1="740" y1="223" x2="1010" y2="223" stroke="#F2BC75" stroke-width="8" /><circle cx="740" cy="223" r="10" fill="#0C1E30" stroke="#F2BC75" stroke-width="4"/><circle cx="1010" cy="223" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><text x="740" y="260" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">0</text><text x="1010" y="260" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">1</text><text x="81" y="335" fill="#7DD9C9" font-size="30" font-family="Georgia,serif" text-anchor="start">Interior = (0,1)</text><line x1="585" y1="327" x2="1159" y2="327" stroke="#506885" stroke-width="2" /><line x1="740" y1="327" x2="1010" y2="327" stroke="#7DD9C9" stroke-width="8" /><circle cx="740" cy="327" r="10" fill="#0C1E30" stroke="#7DD9C9" stroke-width="4"/><circle cx="1010" cy="327" r="10" fill="#0C1E30" stroke="#7DD9C9" stroke-width="4"/><text x="740" y="364" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">0</text><text x="1010" y="364" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">1</text><text x="81" y="439" fill="#CAA8F0" font-size="30" font-family="Georgia,serif" text-anchor="start">Closure = [0,1]</text><line x1="585" y1="431" x2="1159" y2="431" stroke="#506885" stroke-width="2" /><line x1="740" y1="431" x2="1010" y2="431" stroke="#CAA8F0" stroke-width="8" /><circle cx="740" cy="431" r="10" fill="#CAA8F0" stroke="#CAA8F0" stroke-width="4"/><circle cx="1010" cy="431" r="10" fill="#CAA8F0" stroke="#CAA8F0" stroke-width="4"/><text x="740" y="468" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">0</text><text x="1010" y="468" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">1</text><text x="81" y="543" fill="#F3A3B3" font-size="30" font-family="Georgia,serif" text-anchor="start">Boundary = {0,1}</text><line x1="585" y1="535" x2="1159" y2="535" stroke="#506885" stroke-width="2" /><line x1="740" y1="535" x2="1010" y2="535" stroke="#F3A3B3" stroke-width="2" /><circle cx="740" cy="535" r="10" fill="#F3A3B3" stroke="#F3A3B3" stroke-width="4"/><circle cx="1010" cy="535" r="10" fill="#F3A3B3" stroke="#F3A3B3" stroke-width="4"/><line x1="749" y1="535" x2="1001" y2="535" stroke="#506885" stroke-width="2" /><circle cx="740" cy="535" r="10" fill="#F3A3B3" stroke="#F3A3B3" stroke-width="4"/><circle cx="1010" cy="535" r="10" fill="#F3A3B3" stroke="#F3A3B3" stroke-width="4"/><text x="740" y="572" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">0</text><text x="1010" y="572" fill="#C2D0E0" font-size="19" font-family="Georgia,serif" text-anchor="middle">1</text><text x="640" y="669" fill="#F2BC75" font-size="26" font-family="Georgia,serif" text-anchor="middle">0 is outside A; 1 is inside A. Both are boundary points.</text></svg>