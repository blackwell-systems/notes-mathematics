<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Rows and columns: two views of Ax = b</title><desc id="desc">The same system 2x-y=0 and -x+2y=3 has solution x=1,y=2. As rows it is an intersection of lines; as columns it is 1(2,-1)+2(-1,2)=(0,3).</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Rows and columns: two views of Ax = b</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="42" y="128" width="537" height="453" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="43" y="129" width="535" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="310.5" y="164" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Row picture: intersecting lines</text><line x1="54" y1="183" x2="567" y2="183" stroke="#87B8EE" stroke-width="1.4" /><rect x="621" y="128" width="537" height="453" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="622" y="129" width="535" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="889.5" y="164" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Column picture: combining vectors</text><line x1="633" y1="183" x2="1146" y2="183" stroke="#BCA8EC" stroke-width="1.4" /><rect x="100" y="231" width="414" height="284" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="100" y1="231" x2="100" y2="515" stroke="#40536B" stroke-width="1" /><line x1="159.14285714285714" y1="231" x2="159.14285714285714" y2="515" stroke="#40536B" stroke-width="2" /><line x1="218.28571428571428" y1="231" x2="218.28571428571428" y2="515" stroke="#40536B" stroke-width="1" /><line x1="277.42857142857144" y1="231" x2="277.42857142857144" y2="515" stroke="#40536B" stroke-width="1" /><line x1="336.57142857142856" y1="231" x2="336.57142857142856" y2="515" stroke="#40536B" stroke-width="1" /><line x1="395.7142857142857" y1="231" x2="395.7142857142857" y2="515" stroke="#40536B" stroke-width="1" /><line x1="454.85714285714283" y1="231" x2="454.85714285714283" y2="515" stroke="#40536B" stroke-width="1" /><line x1="514" y1="231" x2="514" y2="515" stroke="#40536B" stroke-width="1" /><line x1="100" y1="515" x2="514" y2="515" stroke="#40536B" stroke-width="1" /><line x1="100" y1="483.44444444444446" x2="514" y2="483.44444444444446" stroke="#40536B" stroke-width="2" /><line x1="100" y1="451.8888888888889" x2="514" y2="451.8888888888889" stroke="#40536B" stroke-width="1" /><line x1="100" y1="420.3333333333333" x2="514" y2="420.3333333333333" stroke="#40536B" stroke-width="1" /><line x1="100" y1="388.77777777777777" x2="514" y2="388.77777777777777" stroke="#40536B" stroke-width="1" /><line x1="100" y1="357.22222222222223" x2="514" y2="357.22222222222223" stroke="#40536B" stroke-width="1" /><line x1="100" y1="325.66666666666663" x2="514" y2="325.66666666666663" stroke="#40536B" stroke-width="1" /><line x1="100" y1="294.1111111111111" x2="514" y2="294.1111111111111" stroke="#40536B" stroke-width="1" /><line x1="100" y1="262.55555555555554" x2="514" y2="262.55555555555554" stroke="#40536B" stroke-width="1" /><line x1="100" y1="231" x2="514" y2="231" stroke="#40536B" stroke-width="1" /><line x1="135.48571428571427" y1="508.68888888888887" x2="419.3714285714286" y2="205.75555555555553" stroke="#87B8EE" stroke-width="4" /><line x1="100" y1="404.55555555555554" x2="514" y2="294.1111111111111" stroke="#F28D95" stroke-width="4" /><circle cx="277.42857142857144" cy="357.22222222222223" r="9" fill="#EDB86D" stroke="none" stroke-width="1.5"/><text x="313" y="218" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">(1, 2) satisfies both equations</text><rect x="689" y="229" width="404" height="294" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="689" y1="229" x2="689" y2="523" stroke="#40536B" stroke-width="1" /><line x1="756.3333333333334" y1="229" x2="756.3333333333334" y2="523" stroke="#40536B" stroke-width="1" /><line x1="823.6666666666666" y1="229" x2="823.6666666666666" y2="523" stroke="#40536B" stroke-width="1" /><line x1="891" y1="229" x2="891" y2="523" stroke="#40536B" stroke-width="2" /><line x1="958.3333333333333" y1="229" x2="958.3333333333333" y2="523" stroke="#40536B" stroke-width="1" /><line x1="1025.6666666666667" y1="229" x2="1025.6666666666667" y2="523" stroke="#40536B" stroke-width="1" /><line x1="1093" y1="229" x2="1093" y2="523" stroke="#40536B" stroke-width="1" /><line x1="689" y1="523" x2="1093" y2="523" stroke="#40536B" stroke-width="1" /><line x1="689" y1="481" x2="1093" y2="481" stroke="#40536B" stroke-width="1" /><line x1="689" y1="439" x2="1093" y2="439" stroke="#40536B" stroke-width="2" /><line x1="689" y1="397" x2="1093" y2="397" stroke="#40536B" stroke-width="1" /><line x1="689" y1="355" x2="1093" y2="355" stroke="#40536B" stroke-width="1" /><line x1="689" y1="313" x2="1093" y2="313" stroke="#40536B" stroke-width="1" /><line x1="689" y1="271" x2="1093" y2="271" stroke="#40536B" stroke-width="1" /><line x1="689" y1="229" x2="1093" y2="229" stroke="#40536B" stroke-width="1" /><line x1="891" y1="439" x2="1025.6666666666667" y2="481" stroke="#87B8EE" stroke-width="4" marker-end="url(#arr-blue)" stroke-linecap="round"/><line x1="1025.6666666666667" y1="481" x2="891" y2="313" stroke="#F28D95" stroke-width="4" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="891" y1="439" x2="891" y2="313" stroke="#98D5A3" stroke-width="4" marker-end="url(#arr-green)" stroke-linecap="round"/><text x="884" y="215" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">(2, −1) + 2(−1, 2) = (0, 3)</text><text x="310" y="563" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">2x − y = 0   and   −x + 2y = 3</text><text x="890" y="563" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">The sum reaches b = (0, 3)</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Same equations • row view: constraints • column view: combination</text></svg>