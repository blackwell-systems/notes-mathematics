<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 648" role="img" aria-labelledby="title desc"><title id="title">Product topology: rectangles and projections</title><desc id="desc">Left, an open rectangular region U times V sits in the Cartesian product X times Y. Right, a map h from Z into the product is followed by two coordinate projections to X and Y. Continuity of h is equivalent to continuity of both coordinate maps.</desc><rect width="1280" height="648" rx="20" fill="#0C1E30"/><text x="54" y="65" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F3F6FC">Product topology: rectangles and projections</text><line x1="54" y1="87" x2="1226" y2="87" stroke="#34566C" stroke-width="2"/><rect x="54" y="115" width="583" height="423" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><rect x="657" y="115" width="569" height="423" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><text x="84" y="158" font-family="Arial,sans-serif" font-size="23" fill="#F3F6FC" text-anchor="start" font-weight="normal">Basic opens are rectangles</text><line x1="164" y1="453" x2="554" y2="453" stroke="#7CA9C9" stroke-width="3"/><line x1="164" y1="453" x2="164" y2="211" stroke="#7CA9C9" stroke-width="3"/><line x1="554" y1="453" x2="554" y2="211" stroke="#7CA9C9" stroke-width="2"/><line x1="164" y1="211" x2="554" y2="211" stroke="#7CA9C9" stroke-width="2"/><rect x="266" y="286" width="201" height="102" fill="#F2BB68" fill-opacity=".17" stroke="#F2BB68" stroke-width="4"/><path d="M266 388 V438 M467 388 V438 M266 443 H467" fill="none" stroke="#68D2C0" stroke-width="2" stroke-dasharray="6 5"/><text x="367" y="348" font-family="Arial,sans-serif" font-size="28" fill="#F2BB68" text-anchor="middle" font-weight="bold">U × V</text><text x="367" y="484" font-family="Arial,sans-serif" font-size="21" fill="#68D2C0" text-anchor="middle" font-weight="normal">U (in X)</text><text x="128" y="338" font-family="Arial,sans-serif" font-size="22" fill="#68D2C0" text-anchor="start" font-weight="normal">V</text><text x="562" y="476" font-family="Arial,sans-serif" font-size="20" fill="#91BDF2" text-anchor="start" font-weight="normal">X</text><text x="141" y="202" font-family="Arial,sans-serif" font-size="20" fill="#91BDF2" text-anchor="start" font-weight="normal">Y</text><text x="682" y="158" font-family="Arial,sans-serif" font-size="23" fill="#F3F6FC" text-anchor="start" font-weight="normal">Continuity into a product</text><rect x="699" y="238" width="100" height="62" rx="7" fill="#173248" stroke="#68D2C0" stroke-width="2"/><text x="749" y="278" font-family="Arial,sans-serif" font-size="27" fill="#F3F6FC" text-anchor="middle" font-weight="bold">Z</text><rect x="880" y="237" width="160" height="62" rx="7" fill="#173248" stroke="#91BDF2" stroke-width="2"/><text x="960" y="277" font-family="Arial,sans-serif" font-size="27" fill="#F3F6FC" text-anchor="middle" font-weight="bold">X × Y</text><rect x="1103" y="195" width="83" height="62" rx="7" fill="#173248" stroke="#68D2C0" stroke-width="2"/><text x="1144.5" y="235" font-family="Arial,sans-serif" font-size="27" fill="#F3F6FC" text-anchor="middle" font-weight="bold">X</text><rect x="1103" y="291" width="83" height="62" rx="7" fill="#173248" stroke="#68D2C0" stroke-width="2"/><text x="1144.5" y="331" font-family="Arial,sans-serif" font-size="27" fill="#F3F6FC" text-anchor="middle" font-weight="bold">Y</text><line x1="799" y1="268" x2="878" y2="268" stroke="#68D2C0" stroke-width="4"/><path d="M869 260 L880 268 L869 276" fill="none" stroke="#68D2C0" stroke-width="3"/><line x1="1040" y1="258" x2="1100" y2="225" stroke="#68D2C0" stroke-width="4"/><line x1="1040" y1="283" x2="1100" y2="322" stroke="#68D2C0" stroke-width="4"/><text x="838" y="249" font-family="Arial,sans-serif" font-size="19" fill="#F2BB68" text-anchor="middle" font-weight="normal">h</text><text x="1075" y="218" font-family="Arial,sans-serif" font-size="20" fill="#F3F6FC" text-anchor="middle" font-weight="normal">pₓ</text><text x="1075" y="328" font-family="Arial,sans-serif" font-size="20" fill="#F3F6FC" text-anchor="middle" font-weight="normal">pᵧ</text><text x="949" y="384" font-family="Arial,sans-serif" font-size="23" fill="#F3F6FC" text-anchor="middle" font-weight="normal">h continuous iff</text><text x="949" y="416" font-family="Arial,sans-serif" font-size="21" fill="#B4C9D9" text-anchor="middle" font-weight="normal">both coordinate maps are</text><text x="949" y="447" font-family="Arial,sans-serif" font-size="21" fill="#F2BB68" text-anchor="middle" font-weight="bold">continuous</text><rect x="54" y="554" width="1172" height="61" rx="10" fill="#10263A" stroke="#426982" stroke-width="2"/><text x="640" y="594" font-family="Arial,sans-serif" font-size="21" fill="#F3F6FC" text-anchor="middle" font-weight="normal">The open rectangles U × V make continuity equivalent to continuity of each projection.</text></svg>