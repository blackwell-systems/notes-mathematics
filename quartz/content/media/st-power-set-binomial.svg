<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc"><title id="title">General power set and binomial coefficients</title><desc id="desc">Schematic ranks of a general finite power set, with counts C(n,n)=1, C(n,n-1)=n, C(n,k), C(n,1)=n and C(n,0)=1. A k-element subset is made by choosing exactly k of n members, so C(n,k) counts it. Summing over all k gives 2 to the n by the binomial theorem. Only representative ranks are drawn.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#1C1034"/><stop offset="1" stop-color="#08091B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#392350"/><stop offset="1" stop-color="#1B1734"/></linearGradient>
<linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#60368A"/><stop offset="1" stop-color="#37204D"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#41245D"/><stop offset="1" stop-color="#23173D"/></linearGradient>
</defs><rect width="1680" height="1180" fill="url(#bg)"/><text x="840" y="83" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="68" text-anchor="middle" font-weight="700">Power Set of an n-Element Set</text><text x="840" y="135" font-family="Georgia, 'DejaVu Serif', serif"  font-size="31" text-anchor="middle" fill="#DEC4F9">Every size k contributes C(n,k) subsets.</text><path d="M40 160 H1640" stroke="#8F65BE" stroke-width="2"/><rect x="30" y="195" width="302" height="105" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="181" y="237" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="30" text-anchor="middle" font-weight="700">k = n</text><text x="181" y="275" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#E2C1F9">C(n,n) = 1</text><rect x="357" y="195" width="1289" height="105" rx="18" fill="url(#panel)" stroke="#AB7DE8" stroke-width="3" data-level="n"/><text x="394" y="249" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="40" >S = {a₁, a₂, …, aₙ}</text><text x="394" y="283" font-family="Georgia, 'DejaVu Serif', serif"  font-size="25" fill="#CCB9DD">The one full set</text><rect x="30" y="342" width="302" height="105" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="181" y="384" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="30" text-anchor="middle" font-weight="700">k = n−1</text><text x="181" y="422" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#E2C1F9">C(n,n−1) = n</text><rect x="357" y="342" width="1289" height="105" rx="18" fill="url(#panel)" stroke="#AB7DE8" stroke-width="3" data-level="n−1"/><text x="394" y="396" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="33" >S ∖ {a₁}    S ∖ {a₂}    …    S ∖ {aₙ}</text><text x="394" y="430" font-family="Georgia, 'DejaVu Serif', serif"  font-size="25" fill="#CCB9DD">Omit one element</text><rect x="30" y="489" width="302" height="105" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="181" y="531" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="30" text-anchor="middle" font-weight="700">k = k</text><text x="181" y="569" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#E2C1F9">C(n,k)</text><rect x="357" y="489" width="1289" height="105" rx="18" fill="url(#highlight)" stroke="#E1ADFF" stroke-width="4" data-level="k"/><text x="394" y="543" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="40" >T ⊆ S,   |T| = k</text><text x="394" y="577" font-family="Georgia, 'DejaVu Serif', serif"  font-size="25" fill="#CCB9DD">Choose which k elements belong</text><rect x="30" y="636" width="302" height="105" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="181" y="678" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="30" text-anchor="middle" font-weight="700">k = 1</text><text x="181" y="716" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#E2C1F9">C(n,1) = n</text><rect x="357" y="636" width="1289" height="105" rx="18" fill="url(#panel)" stroke="#AB7DE8" stroke-width="3" data-level="1"/><text x="394" y="690" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="40" >{a₁}      {a₂}      …      {aₙ}</text><text x="394" y="724" font-family="Georgia, 'DejaVu Serif', serif"  font-size="25" fill="#CCB9DD">The singleton subsets</text><rect x="30" y="783" width="302" height="105" rx="18" fill="url(#panel)" stroke="#B986F7" stroke-width="3" /><text x="181" y="825" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="30" text-anchor="middle" font-weight="700">k = 0</text><text x="181" y="863" font-family="Georgia, 'DejaVu Serif', serif"  font-size="27" text-anchor="middle" fill="#E2C1F9">C(n,0) = 1</text><rect x="357" y="783" width="1289" height="105" rx="18" fill="url(#panel)" stroke="#AB7DE8" stroke-width="3" data-level="0"/><text x="394" y="837" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="40" >∅</text><text x="394" y="871" font-family="Georgia, 'DejaVu Serif', serif"  font-size="25" fill="#CCB9DD">The one empty subset</text><text x="840" y="959" font-family="Georgia, 'DejaVu Serif', serif"  font-size="30" text-anchor="middle" fill="#DBC6F6">Each subset is counted exactly once: in the row matching its size.</text><rect x="30" y="978" width="1620" height="170" rx="23" fill="url(#footer)" stroke="#B986F7" stroke-width="3" /><text x="840" y="1037" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="46" text-anchor="middle" font-weight="700">|𝒫(S)| = ∑ₖ₌₀ⁿ C(n,k) = (1 + 1)ⁿ = 2ⁿ</text><text x="840" y="1090" font-family="Georgia, 'DejaVu Serif', serif" fill="#FAF5FF" font-size="30" text-anchor="middle" >C(n,k) = n! / (k! (n−k)!) counts all k-element subsets.</text><text x="840" y="1130" font-family="Georgia, 'DejaVu Serif', serif"  font-size="26" text-anchor="middle" fill="#DEC8F8">A schematic of selected levels, not a complete Hasse diagram.</text></svg>