<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 538" width="800" height="538" role="img" aria-labelledby="title desc"><title id="title">Zero and successor</title><desc id="desc">A successor chain with natural numbers 0,1,2,3,4, and arrows showing the successor operation S. Zero is the starting element, not a successor.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="538" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Zero and successor</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">The two primitives before addition exists.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><circle cx="114" cy="280" r="43" fill="#223349" stroke="#EDB86D" stroke-width="3"/><text x="114" y="290" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="34" font-weight="760">0</text><line x1="161" y1="280" x2="204" y2="280" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="254" cy="280" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="254" y="290" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="34" font-weight="760">1</text><line x1="301" y1="280" x2="344" y2="280" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="394" cy="280" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="394" y="290" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="34" font-weight="760">2</text><line x1="441" y1="280" x2="484" y2="280" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="534" cy="280" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="534" y="290" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="34" font-weight="760">3</text><line x1="581" y1="280" x2="624" y2="280" stroke="#87B8EE" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="674" cy="280" r="43" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="674" y="290" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="34" font-weight="760">4</text><text x="400" y="405" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="27" font-weight="550">S(n) is the next natural number</text><text x="400" y="460" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="22" font-weight="550">0 is not the successor of any natural number.</text><text x="40" y="521" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>