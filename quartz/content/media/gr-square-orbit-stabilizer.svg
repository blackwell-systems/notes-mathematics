<svg xmlns="http://www.w3.org/2000/svg" width="800" height="572" viewBox="0 0 800 572" role="img" aria-labelledby="title desc"><title id="title">Orbit–stabilizer for a square</title><desc id="desc">Square with labeled vertices A B C D. The dihedral group D4 has eight symmetries, one orbit of four vertices, and a two-element stabilizer of vertex A. Thus |G| = 4 times 2.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="572" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Orbit–stabilizer for a square</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">D₄ acts on four labeled vertices of a square.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="243" y="175" width="305" height="240" rx="1" fill="none" stroke="#87B8EE" stroke-width="5"/><circle cx="243" cy="175" r="34" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="243" y="184" fill="#F4F3ED" font-size="25" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A</text><circle cx="548" cy="175" r="34" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="548" y="184" fill="#F4F3ED" font-size="25" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">B</text><circle cx="548" cy="415" r="34" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="548" y="424" fill="#F4F3ED" font-size="25" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">C</text><circle cx="243" cy="415" r="34" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="243" y="424" fill="#F4F3ED" font-size="25" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">D</text><text x="395" y="270" fill="#F4F3ED" font-size="27" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">8 symmetries</text><text x="395" y="307" fill="#66C4B4" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4 rotations</text><text x="395" y="341" fill="#BCA8EC" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4 reflections</text><text x="400" y="492" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Orbit(A): {A, B, C, D} = 4 vertices</text><text x="400" y="522" fill="#C4CEDA" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Stabilizer(A): 2 symmetries   →   8 = 4 × 2</text><text x="40" y="552" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>