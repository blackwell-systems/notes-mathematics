<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Four properties of binary relations</title><desc id="desc">Four panel comparison. Reflexivity adds self loops. Symmetry allows reversed pairs. Transitivity requires the shortcut from a to c when a relates to b and b relates to c. Antisymmetry prohibits mutual comparison between distinct vertices.</desc><defs><marker id="blue" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="violet" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="gold" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="690" fill="#101A2C"/><text x="600" y="56" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="38" font-weight="600">How relations behave</text><rect x="25" y="119" width="560" height="246" rx="19" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="35" y="129" width="540" height="59" rx="13" fill="#122338"/><text x="305" y="161" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="25" font-weight="600">Reflexive</text><path d="M196.0 245.0 L411.0 245.0" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M183 225 C220 190,120 190,157 225" fill="none" stroke="#87B8EE" stroke-width="2.6" marker-end="url(#blue)"/><path d="M450 225 C487 190,387 190,424 225" fill="none" stroke="#87B8EE" stroke-width="2.6" marker-end="url(#blue)"/><path d="M316 301 C353 266,253 266,290 301" fill="none" stroke="#87B8EE" stroke-width="2.6" marker-end="url(#blue)"/><circle cx="170" cy="245" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="170" y="245" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">a</text><circle cx="437" cy="245" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="437" y="245" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">b</text><circle cx="303" cy="321" r="22" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><text x="303" y="321" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">c</text><rect x="615" y="119" width="560" height="246" rx="19" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="625" y="129" width="540" height="59" rx="13" fill="#122338"/><text x="895" y="161" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="25" font-weight="600">Symmetric</text><path d="M786.0 245.0 L1001.0 245.0" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M1005 263 Q893 293 782 263" fill="none" stroke="#BCA8EC" stroke-width="3" marker-end="url(#violet)"/><path d="M1004.4 257.8 L915.6 308.2" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M880 300 Q956 278 1008 264" fill="none" stroke="#BCA8EC" stroke-width="3" marker-end="url(#violet)"/><circle cx="760" cy="245" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="760" y="245" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">a</text><circle cx="1027" cy="245" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="1027" y="245" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">b</text><circle cx="893" cy="321" r="22" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><text x="893" y="321" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">c</text><rect x="25" y="377" width="560" height="246" rx="19" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="35" y="387" width="540" height="59" rx="13" fill="#122338"/><text x="305" y="419" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="25" font-weight="600">Transitive</text><path d="M196.0 503.0 L411.0 503.0" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M414.4 515.8 L325.6 566.2" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M192.6 515.9 L280.4 566.1" fill="none" stroke="#EDB86D" stroke-width="3" marker-end="url(#gold)"/><circle cx="170" cy="503" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="170" y="503" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">a</text><circle cx="437" cy="503" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="437" y="503" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">b</text><circle cx="303" cy="579" r="22" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><text x="303" y="579" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">c</text><rect x="615" y="377" width="560" height="246" rx="19" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="625" y="387" width="540" height="59" rx="13" fill="#122338"/><text x="895" y="419" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="25" font-weight="600">Antisymmetric</text><path d="M786.0 503.0 L1001.0 503.0" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M1004.4 515.8 L915.6 566.2" fill="none" stroke="#87B8EE" stroke-width="3" marker-end="url(#blue)"/><path d="M782.6 515.9 L870.4 566.1" fill="none" stroke="#EDB86D" stroke-width="3" marker-end="url(#gold)"/><circle cx="760" cy="503" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="760" y="503" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">a</text><circle cx="1027" cy="503" r="22" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="1027" y="503" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">b</text><circle cx="893" cy="579" r="22" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><text x="893" y="579" text-anchor="middle" dominant-baseline="middle" fill="#F4F3ED" font-size="20" font-weight="600">c</text><text x="600" y="658" text-anchor="middle" dominant-baseline="middle" fill="#98D5A3" font-size="20" font-weight="600">Each axiom is a condition on the pairs in the relation.</text></svg>