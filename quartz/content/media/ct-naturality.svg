<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">The naturality square</title><desc id="desc">Naturality square F(A)→G(A), F(B)→G(B) with vertical F(f) and G(f), horizontal components η_A and η_B; G(f)∘η_A=η_B∘F(f).</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">The naturality square</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Two paths through the diagram must agree.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><circle cx="164" cy="177" r="47" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="164" y="186" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">F(A)</text><circle cx="630" cy="177" r="47" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="630" y="186" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">G(A)</text><circle cx="164" cy="413" r="47" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="164" y="422" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">F(B)</text><circle cx="630" cy="413" r="47" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="630" y="422" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">G(B)</text><line x1="222" y1="177" x2="563" y2="177" stroke="#F4C474" stroke-width="3" marker-end="url(#arr)"/><line x1="222" y1="413" x2="563" y2="413" stroke="#F4C474" stroke-width="3" marker-end="url(#arr)"/><line x1="164" y1="233" x2="164" y2="351" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="630" y1="233" x2="630" y2="351" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><text x="394" y="157" fill="#F4C474" font-size="26" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">η_A</text><text x="394" y="393" fill="#F4C474" font-size="26" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">η_B</text><text x="192" y="295" fill="#91BFF6" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">F(f)</text><text x="668" y="295" fill="#91BFF6" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">G(f)</text><text x="398" y="301" fill="#F4F5EF" font-size="25" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">G(f) ∘ η_A</text><text x="398" y="344" fill="#F4F5EF" font-size="25" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">= η_B ∘ F(f)</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>