<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Scalar fields and vector fields are different</title><desc id="desc">Left panel has level contours of scalar T=x squared+y squared; right panel has arrows of vector field F=(x,y), pointing outward from the origin.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Scalar fields and vector fields are different</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">A scalar labels each point; a vector field assigns directions and magnitudes.</text><line x1="42" y1="124" x2="1238" y2="124" stroke="#4C6983" stroke-width="2" /><rect x="42" y="150" width="578" height="474" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#193249"/><rect x="665" y="150" width="573" height="474" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#193249"/><text x="330" y="210" font-family="Georgia,serif" font-size="28" fill="#7DD9C9" text-anchor="middle">Scalar field T = x² + y²</text><text x="950" y="210" font-family="Georgia,serif" font-size="28" fill="#C6A5ED" text-anchor="middle">Vector field F = (x,y)</text><circle cx="329" cy="400" r="43" fill="none" stroke="#7DD9C9" stroke-width="2.5" opacity=".9"/><circle cx="329" cy="400" r="91" fill="none" stroke="#7DD9C9" stroke-width="2.5" opacity=".9"/><circle cx="329" cy="400" r="137" fill="none" stroke="#7DD9C9" stroke-width="2.5" opacity=".9"/><line x1="858" y1="310" x2="835.56" y2="287.56" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="858" y1="400" x2="824" y2="400" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="858" y1="490" x2="835.56" y2="512.44" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="950" y1="310" x2="950" y2="276" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="950" y1="490" x2="950" y2="524" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="1042" y1="310" x2="1064.44" y2="287.56" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="1042" y1="400" x2="1076" y2="400" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="1042" y1="490" x2="1064.44" y2="512.44" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><circle cx="329" cy="400" r="7" fill="#F1BD75" stroke="#F2F5FB" stroke-width="2"/><circle cx="950" cy="400" r="7" fill="#F1BD75" stroke="#F2F5FB" stroke-width="2"/><text x="329" y="568" font-family="Georgia,serif" font-size="23" fill="#C4D0E0" text-anchor="middle">A number at each location</text><text x="950" y="568" font-family="Georgia,serif" font-size="23" fill="#C4D0E0" text-anchor="middle">A direction and magnitude</text><rect x="116" y="648" width="1048" height="57" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#193249"/><text x="640" y="683" font-family="Georgia,serif" font-size="26" fill="#F2F5FB" text-anchor="middle">A vector field is not a particle trajectory.</text></svg>