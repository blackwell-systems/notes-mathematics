<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">Common factor as a shared side</title>
<desc id="desc">The area of a rectangle with height x and widths x and three is divided into two tiles labeled x squared and 3x. Both tiles share a vertical side x, so their total area is x times (x plus three).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="650" rx="16" fill="#101A2C"/>
<text x="48" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#F4F3ED" font-weight="700" text-anchor="start">Common factor: a shared side</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="500" text-anchor="start">First identify the dimension every term has in common.</text>
<path d="M48 127 H932" fill="none" stroke="#42576D" stroke-width="2" />
<rect x="78" y="173" width="515" height="340" rx="13" fill="#102336" stroke="#42576D" stroke-width="2"/><rect x="164" y="249" width="184" height="184" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="348" y="249" width="120" height="184" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><text x="256" y="353" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#87B8EE" font-weight="700" text-anchor="middle">x²</text><text x="408" y="353" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#EDB86D" font-weight="700" text-anchor="middle">3x</text><text x="256" y="232" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#87B8EE" font-weight="700" text-anchor="middle">x</text><text x="408" y="232" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#EDB86D" font-weight="700" text-anchor="middle">3</text><text x="147" y="355" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#66C4B4" font-weight="700" text-anchor="middle">x</text><path d="M164 470 H468" fill="none" stroke="#66C4B4" stroke-width="3" /><path d="M164 464 V476 M468 464 V476" fill="none" stroke="#66C4B4" stroke-width="3" /><text x="316" y="498" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66C4B4" font-weight="600" text-anchor="middle">total width: x + 3</text><rect x="626" y="199" width="286" height="284" rx="12" fill="#182A3D" stroke="#42576D" stroke-width="2"/><text x="655" y="250" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#EDB86D" font-weight="700" text-anchor="start">ADD AREAS</text><text x="655" y="296" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#F4F3ED" font-weight="700" text-anchor="start">x² + 3x</text><path d="M659 325 H883" fill="none" stroke="#42576D" stroke-width="1.5" /><text x="655" y="372" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#66C4B4" font-weight="700" text-anchor="start">FACTOR THE SIDE</text><text x="655" y="414" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#66C4B4" font-weight="700" text-anchor="start">x(x + 3)</text><text x="658" y="452" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0CBD8" font-weight="500" text-anchor="start">same area</text><text x="85" y="561" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#F4F3ED" font-weight="500" text-anchor="start">A rectangle makes distribution reversible: x(x + 3) = x² + 3x.</text>
<path d="M48 586 H932" fill="none" stroke="#42576D" stroke-width="1.5" />
<text x="48" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" font-weight="500" text-anchor="start">Area interpretation for x ≥ 0; distributivity proves the identity for every x.</text>
</svg>
