<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Union: A ∪ B</title>
<desc id="desc">Dark navy matched Venn diagram for union. All five diagrams use U = {1, 2, 3, 4, 5, 6}, A = {1, 2, 3}, B = {3, 4, 5}. A left circle overlaps B right circle at element 3. The selected violet region consists exactly of elements 1, 2, 3, 4, 5. 6 lies outside both circles.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17102E"/><stop offset=".6" stop-color="#0B0C21"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2B2049"/><stop offset="1" stop-color="#15152F"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#362552"/><stop offset="1" stop-color="#221A3D"/></linearGradient>
<clipPath id="clipA"><circle cx="600" cy="537" r="211"/></clipPath>
<mask id="minusB" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="990"><rect width="1440" height="990" fill="black"/><circle cx="600" cy="537" r="211" fill="white"/><circle cx="850" cy="537" r="211" fill="black"/></mask>
<mask id="minusA" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="990"><rect width="1440" height="990" fill="black"/><circle cx="850" cy="537" r="211" fill="white"/><circle cx="600" cy="537" r="211" fill="black"/></mask>
<mask id="notA" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="990"><rect width="1440" height="990" fill="black"/><rect x="210" y="290" width="1020" height="502" rx="21" fill="white"/><circle cx="600" cy="537" r="211" fill="black"/></mask>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/>
<text x="720" y="80" fill="#CEB1F4" font-size="48" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">SET OPERATIONS / UNION</text><text x="720" y="157" fill="#FAF6FF" font-size="75" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">A ∪ B</text><text x="720" y="210" fill="#E7D7F8" font-size="29" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="normal" text-anchor="middle">All elements in A or B, including their overlap.</text><rect x="153" y="233" width="1134" height="56" rx="15" fill="url(#footer)" stroke="#8B59C3" stroke-width="2"/><text x="720" y="273" fill="#FAF6FF" font-size="27" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="normal" text-anchor="middle">U = {1, 2, 3, 4, 5, 6}     A = {1, 2, 3}     B = {3, 4, 5}</text><rect x="210" y="290" width="1020" height="502" rx="21" fill="#10142D" stroke="#BE8DF2" stroke-width="3"/><circle cx="600" cy="537" r="211" fill="#9A57E9" fill-opacity=".72"/><circle cx="850" cy="537" r="211" fill="#9A57E9" fill-opacity=".72"/><circle cx="600" cy="537" r="211" fill="none" stroke="#E0BBFF" stroke-width="5"/>
 <circle cx="850" cy="537" r="211" fill="none" stroke="#E0BBFF" stroke-width="5"/><text x="426" y="361" fill="#FAF6FF" font-size="46" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">A</text><text x="1012" y="361" fill="#FAF6FF" font-size="46" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">B</text><text x="249" y="338" fill="#FAF6FF" font-size="44" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="italic" text-anchor="middle">U</text><text x="510" y="515" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">1</text><text x="510" y="598" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">2</text><text x="725" y="553" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">3</text><text x="941" y="515" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">4</text><text x="941" y="598" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">5</text><text x="1125" y="733" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">6</text><rect x="176" y="815" width="1088" height="148" rx="22" fill="url(#footer)" stroke="#BB8DF4" stroke-width="3"/><text x="720" y="887" fill="#FAF6FF" font-size="53" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-style="normal" text-anchor="middle">A ∪ B = {1, 2, 3, 4, 5}</text><text x="720" y="932" fill="#E5D1FC" font-size="27" font-family="Georgia, 'DejaVu Serif', serif" font-weight="normal" font-style="normal" text-anchor="middle">Lavender region = elements in the result</text>
</svg>