<svg xmlns="http://www.w3.org/2000/svg" width="800" height="698" viewBox="0 0 800 698" role="img" aria-labelledby="title desc"><title id="title">Multiplication in the four-element field</title><desc id="desc">Multiplication Cayley table for the four-element field with elements 0,1,alpha,alpha+1. Alpha squared is alpha+1, alpha times alpha+1 equals one, and every nonzero element is a unit.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="698" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Multiplication in the four-element field</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">F₄ = F₂[α] where α² + α + 1 = 0.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="160" y="156" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="203" y="211" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">·</text><rect x="251" y="156" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="294" y="211" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="342" y="156" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="385" y="211" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><rect x="433" y="156" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="476" y="211" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α</text><rect x="524" y="156" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="567" y="211" fill="#F4F3ED" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α+1</text><rect x="160" y="247" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="203" y="302" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="251" y="247" width="86" height="86" rx="6" fill="#66C4B4" stroke="#45576F" stroke-width="2"/><text x="294" y="302" fill="#101A2C" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="342" y="247" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="385" y="302" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="433" y="247" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="476" y="302" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="524" y="247" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="567" y="302" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="160" y="338" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="203" y="393" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><rect x="251" y="338" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="294" y="393" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="342" y="338" width="86" height="86" rx="6" fill="#66C4B4" stroke="#45576F" stroke-width="2"/><text x="385" y="393" fill="#101A2C" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><rect x="433" y="338" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="476" y="393" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α</text><rect x="524" y="338" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="567" y="393" fill="#F4F3ED" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α+1</text><rect x="160" y="429" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="203" y="484" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α</text><rect x="251" y="429" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="294" y="484" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="342" y="429" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="385" y="484" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α</text><rect x="433" y="429" width="86" height="86" rx="6" fill="#66C4B4" stroke="#45576F" stroke-width="2"/><text x="476" y="484" fill="#101A2C" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α+1</text><rect x="524" y="429" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="567" y="484" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><rect x="160" y="520" width="86" height="86" rx="6" fill="#223349" stroke="#45576F" stroke-width="2"/><text x="203" y="575" fill="#F4F3ED" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α+1</text><rect x="251" y="520" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="294" y="575" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><rect x="342" y="520" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="385" y="575" fill="#F4F3ED" font-size="23" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α+1</text><rect x="433" y="520" width="86" height="86" rx="6" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="476" y="575" fill="#F4F3ED" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><rect x="524" y="520" width="86" height="86" rx="6" fill="#66C4B4" stroke="#45576F" stroke-width="2"/><text x="567" y="575" fill="#101A2C" font-size="29" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α</text><text x="400" y="649" fill="#EDB86D" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">α² = α + 1 ; α(α + 1) = 1</text><text x="40" y="680" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>