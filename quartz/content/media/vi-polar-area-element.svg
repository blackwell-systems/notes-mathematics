<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Polar area elements widen with radius</title><desc id="desc">An annular polar sector with radial thickness delta r and angular extent delta theta has local area approximately r delta r delta theta.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Polar area elements widen with radius</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C7D4E1" text-anchor="middle">The factor r comes from angular arc length.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#4C6A82" stroke-width="2"/><rect x="48" y="151" width="747" height="471" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#173147"/><rect x="823" y="151" width="409" height="471" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#173147"/><path d="M384.1866651780328,424.1024038983718 L425.9826332009378,351.23885294847435 A213 213 0 0 1 496.99036464833483,417.49510211957704 L427.1913476039211,464.2294280442509 A129 129 0 0 0 384.1866651780328,424.1024038983718 Z" fill="#C6A5ED" fill-opacity=".5" stroke="#F1BD75" stroke-width="4"/><line x1="320" y1="536" x2="437.92433835033927" y2="330.420695534218" stroke="#7DD9C9" stroke-width="2"/><line x1="320" y1="536" x2="516.9329409467388" y2="404.1424375696703" stroke="#7DD9C9" stroke-width="2"/><text x="610" y="267" font-family="Georgia,serif" font-size="23" fill="#C6A5ED" text-anchor="middle">angular width Δθ</text><text x="602" y="314" font-family="Georgia,serif" font-size="22" fill="#7DD9C9" text-anchor="middle">radial thickness Δr</text><text x="1027" y="273" font-family="Georgia,serif" font-size="29" fill="#C6A5ED" text-anchor="middle">arc ≈ r Δθ</text><text x="1027" y="361" font-family="Georgia,serif" font-size="27" fill="#7DD9C9" text-anchor="middle">width = Δr</text><text x="1027" y="451" font-family="Georgia,serif" font-size="28" fill="#F1BD75" text-anchor="middle">ΔA ≈ r Δr Δθ</text><text x="1027" y="534" font-family="Georgia,serif" font-size="30" fill="#F2F5FB" text-anchor="middle">dA = r dr dθ</text><text x="640" y="680" font-family="Georgia,serif" font-size="24" fill="#F2F5FB" text-anchor="middle">Farther from the origin, the same angular interval covers more area.</text></svg>