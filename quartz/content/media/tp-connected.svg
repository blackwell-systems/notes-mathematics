<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 528" width="800" height="528" role="img" aria-labelledby="title desc"><title id="title">Connected versus disconnected</title><desc id="desc">An unbroken interval compared with two disjoint separated intervals. Connectedness prohibits a split into two nonempty relatively open sets.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="528" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Connected versus disconnected</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A separation requires two nonempty disjoint open pieces.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><line x1="94" y1="244" x2="706" y2="244" stroke="#6DD2BD" stroke-width="3" /><text x="400" y="204" fill="#6DD2BD" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">CONNECTED: one interval</text><line x1="111" y1="406" x2="317" y2="406" stroke="#C7B6F4" stroke-width="3" /><line x1="475" y1="406" x2="690" y2="406" stroke="#F4C474" stroke-width="3" /><text x="400" y="363" fill="#F4F5EF" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DISCONNECTED: separated pieces</text><text x="400" y="483" fill="#C1CDDA" font-size="21" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">No nonempty disjoint open split</text><text x="40" y="509" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>