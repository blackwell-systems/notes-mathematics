<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A pushout glues spaces along matching data</title><desc id="desc">A common subspace A has maps f to X and g to Y; take disjoint union X+Y and identify f(a) with g(a) to construct the pushout P, whose universal property factors compatible maps.</desc><defs><marker id="arrow" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="17" fill="#0C1E30"/><text x="640" y="61" font-family="Georgia,serif" font-size="39" fill="#F1F5FC" text-anchor="middle">A pushout glues spaces along matching data</text><text x="640" y="104" font-family="Georgia,serif" font-size="23" fill="#C4D1E1" text-anchor="middle">Disjoint union first; equivalence relation and quotient topology second.</text><rect x="44" y="152" width="1192" height="480" rx="17" fill="#172F46" stroke="#526A82" stroke-width="2.5"/><text x="640" y="208" font-family="Georgia,serif" font-size="31" fill="#F1F5FC" text-anchor="middle">Glue two spaces along a common subspace A</text><ellipse cx="185" cy="310" rx="73" ry="61" fill="#20384A" stroke="#F1BD75" stroke-width="4"/><text x="185" y="319" font-family="Georgia,serif" font-size="35" fill="#F1F5FC" text-anchor="middle">A</text><ellipse cx="498" cy="312" rx="73" ry="61" fill="#20384A" stroke="#7DD9C9" stroke-width="4"/><text x="498" y="321" font-family="Georgia,serif" font-size="35" fill="#F1F5FC" text-anchor="middle">X</text><ellipse cx="780" cy="312" rx="73" ry="61" fill="#20384A" stroke="#C6A5ED" stroke-width="4"/><text x="780" y="321" font-family="Georgia,serif" font-size="35" fill="#F1F5FC" text-anchor="middle">Y</text><ellipse cx="1100" cy="313" rx="73" ry="61" fill="#20384A" stroke="#F1BD75" stroke-width="4"/><text x="1100" y="322" font-family="Georgia,serif" font-size="35" fill="#F1F5FC" text-anchor="middle">P</text><path d="M259 298 L421 298" stroke="#F1BD75" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M252 331 L705 331" stroke="#F1BD75" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="329" y="279" font-family="Georgia,serif" font-size="24" fill="#F1BD75" text-anchor="middle">f</text><text x="619" y="362" font-family="Georgia,serif" font-size="24" fill="#F1BD75" text-anchor="middle">g</text><path d="M545 311 Q838 214 1028 296 M853 315 L1026 315" fill="none" stroke="#7DD9C9" stroke-width="4" marker-end="url(#arrow)"/><text x="737" y="237" font-family="Georgia,serif" font-size="26" fill="#F1BD75" text-anchor="middle">identify f(a) ~ g(a)</text><rect x="110" y="441" width="1056" height="145" rx="17" fill="#263B4F" stroke="#526A82" stroke-width="2.5"/><text x="640" y="482" font-family="Georgia,serif" font-size="29" fill="#F1F5FC" text-anchor="middle">P = (X ⨿ Y) / (f(a) ~ g(a), for every a ∈ A)</text><text x="640" y="531" font-family="Georgia,serif" font-size="23" fill="#C4D1E1" text-anchor="middle">Compatible maps u:X→Z and v:Y→Z yield a unique continuous map P→Z.</text><text x="640" y="674" font-family="Georgia,serif" font-size="23" fill="#F1BD75" text-anchor="middle">The quotient topology makes the gluing operation continuous.</text></svg>