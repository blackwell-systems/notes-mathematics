<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc"><title id="title">Two-point antichain: maximal and minimal but neither greatest nor least</title><desc id="desc">Two isolated vertices a and b with no cover line. Both are maximal and minimal in this poset, while neither is greatest or least because they are incomparable.</desc><rect width="1160" height="520" fill="#0c1428"/><text x="580" y="58" fill="#f7f4ff" font-size="40" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">Two incomparable elements</text><text x="580" y="93" fill="#cbd5ed" font-size="22" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">P = {a, b}, with only the reflexive comparisons a ≤ a and b ≤ b</text><rect x="35" y="124" width="512" height="362" rx="22" fill="#172744" stroke="#7396ca" stroke-width="2.5"/><rect x="575" y="124" width="550" height="362" rx="22" fill="#172744" stroke="#7396ca" stroke-width="2.5"/><circle cx="196" cy="300" r="43" fill="#185761" stroke="#79e5d6" stroke-width="4"/><text x="196" y="310" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">a</text><circle cx="386" cy="300" r="43" fill="#185761" stroke="#79e5d6" stroke-width="4"/><text x="386" y="310" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">b</text><text x="291" y="424" fill="#cbd5ed" font-size="21" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">No Hasse edge: neither compares to the other.</text><text x="604" y="182" fill="#f7f4ff" font-size="25" font-weight="bold" text-anchor="start" font-family="Georgia,serif">Inside the subset P:</text><text x="604" y="234" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Both a and b are maximal.</text><text x="604" y="276" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Both a and b are minimal.</text><text x="604" y="333" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Neither is greatest or least.</text><text x="604" y="390" fill="#cbd5ed" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Why? They are incomparable.</text></svg>
