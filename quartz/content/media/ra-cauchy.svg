<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Cauchy: terms agree with one another</title><desc id="desc">For the sample sequence a_n=1+(-1)^n/n, all displayed points from index five onward fit in a vertical interval narrower than epsilon one half. Thus any two tail values a_m and a_n differ by less than epsilon; no limit value is needed to formulate the Cauchy condition.</desc><rect width="1000" height="590" fill="#101A2C"/><text x="42" y="61" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#F4F3ED" text-anchor="start" >Cauchy: terms agree with one another</text><text x="42" y="100" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >Example: ε = 1/2. The whole tail from N = 5 fits within a narrower strip.</text><line x1="40" y1="119" x2="960" y2="119" stroke="#45576F" stroke-width="2" /><rect x="48" y="143" width="904" height="334" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><rect x="270" y="279" width="655" height="60" fill="#BCA8EC" fill-opacity=".14"/><line x1="284" y1="155" x2="284" y2="456" stroke="#EDB86D" stroke-width="2" stroke-dasharray="6 5"/><line x1="270" y1="279" x2="925" y2="279" stroke="#BCA8EC" stroke-width="2" stroke-dasharray="7 5"/><line x1="270" y1="339" x2="925" y2="339" stroke="#BCA8EC" stroke-width="2" stroke-dasharray="7 5"/><line x1="90" y1="454" x2="924" y2="454" stroke="#C4CEDA" stroke-width="2.5" /><circle cx="112" cy="430.00" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="155" cy="242.50" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="198" cy="346.67" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="241" cy="273.75" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="284" cy="330.00" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="327" cy="284.17" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="370" cy="322.86" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="413" cy="289.38" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="456" cy="318.89" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="499" cy="292.50" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="542" cy="316.36" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="585" cy="294.58" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="628" cy="314.62" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="671" cy="296.07" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="714" cy="313.33" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="757" cy="297.19" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="800" cy="312.35" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><circle cx="843" cy="298.06" r="6" fill="#BCA8EC" stroke="#101A2C" stroke-width="1.5" /><text x="112" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >1</text><text x="284" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#EDB86D" text-anchor="middle" >5</text><text x="456" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >9</text><text x="628" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >13</text><text x="800" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >17</text><text x="101" y="182" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#F4F3ED" text-anchor="start" >aₙ = 1 + (−1)ⁿ/n</text><text x="284" y="208" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#EDB86D" text-anchor="middle" >N = 5</text><line x1="874" y1="285" x2="874" y2="333" stroke="#66C4B4" stroke-width="3" /><line x1="862" y1="285" x2="886" y2="285" stroke="#66C4B4" stroke-width="3" /><line x1="862" y1="333" x2="886" y2="333" stroke="#66C4B4" stroke-width="3" /><text x="858" y="250" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#66C4B4" text-anchor="end" >Tail spread &lt; ε</text><text x="411" y="413" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#BCA8EC" text-anchor="start" >Choose any two terms with m,n ≥ 5</text><text x="813" y="445" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#C4CEDA" text-anchor="start" >n →</text><line x1="40" y1="501" x2="960" y2="501" stroke="#45576F" stroke-width="2" /><text x="46" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#C4CEDA" text-anchor="start" >Cauchy compares late terms with each other, not with a named limit.</text><text x="42" y="577" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C4CEDA" text-anchor="start" >REAL ANALYSIS  /  VISUAL PROOF INTUITION</text></svg>
