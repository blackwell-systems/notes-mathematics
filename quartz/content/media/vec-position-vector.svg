<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">The same displacement from another starting point</title><desc id="desc">The directed segment from A=(1,2) to B=(4,6) is the vector (3,4). Shifting that same arrow to the origin ends at (3,4), with equal length and direction.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">The same displacement from another starting point</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="131" width="732" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="132" width="730" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="406" y="167" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Two arrows, same displacement</text><line x1="52" y1="186" x2="760" y2="186" stroke="#87B8EE" stroke-width="1.4" /><rect x="797" y="131" width="360" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="798" y="132" width="358" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="977" y="167" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Subtract endpoints</text><line x1="809" y1="186" x2="1145" y2="186" stroke="#BCA8EC" stroke-width="1.4" /><rect x="112" y="207" width="531" height="331" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="112" y1="207" x2="112" y2="538" stroke="#40536B" stroke-width="2" /><line x1="187.85714285714286" y1="207" x2="187.85714285714286" y2="538" stroke="#40536B" stroke-width="1" /><line x1="263.7142857142857" y1="207" x2="263.7142857142857" y2="538" stroke="#40536B" stroke-width="1" /><line x1="339.57142857142856" y1="207" x2="339.57142857142856" y2="538" stroke="#40536B" stroke-width="1" /><line x1="415.42857142857144" y1="207" x2="415.42857142857144" y2="538" stroke="#40536B" stroke-width="1" /><line x1="491.2857142857143" y1="207" x2="491.2857142857143" y2="538" stroke="#40536B" stroke-width="1" /><line x1="567.1428571428571" y1="207" x2="567.1428571428571" y2="538" stroke="#40536B" stroke-width="1" /><line x1="643" y1="207" x2="643" y2="538" stroke="#40536B" stroke-width="1" /><line x1="112" y1="538" x2="643" y2="538" stroke="#40536B" stroke-width="2" /><line x1="112" y1="490.7142857142857" x2="643" y2="490.7142857142857" stroke="#40536B" stroke-width="1" /><line x1="112" y1="443.42857142857144" x2="643" y2="443.42857142857144" stroke="#40536B" stroke-width="1" /><line x1="112" y1="396.1428571428571" x2="643" y2="396.1428571428571" stroke="#40536B" stroke-width="1" /><line x1="112" y1="348.8571428571429" x2="643" y2="34