<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">A function is an input–output rule</title><desc id="desc">One input t travels through f(t)=60t to exactly one output; sample results are 1 to 60, 2 to 120, 3 to 180.</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">A function is an input–output rule</text><rect x="32" y="122" width="1136" height="460" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="42" y="132" width="1116" height="59" rx="13" fill="#122338"/><text x="600" y="164" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Every input receives exactly one output</text><path d="M56 192 H1144" stroke="#87B8EE" opacity=".35" stroke-width="2"/><rect x="73" y="270" width="228" height="105" rx="20" fill="#122338" stroke="#87B8EE" stroke-width="2.3"/><text x="187" y="322" fill="#87B8EE" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">input  t</text><path d="M305 322 L399 322" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><rect x="407" y="243" width="380" height="160" rx="20" fill="#261F3A" stroke="#BCA8EC" stroke-width="2.3"/><text x="596" y="280" fill="#C4CEDA" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">the rule</text><text x="596" y="347" fill="#F4F3ED" font-size="43" font-weight="700" text-anchor="middle" dominant-baseline="middle">f(t) = 60t</text><path d="M793 322 L893 322" fill="none" stroke="#EDB86D" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowG)"/><rect x="900" y="270" width="222" height="105" rx="20" fill="#122338" stroke="#EDB86D" stroke-width="2.3"/><text x="1010" y="322" fill="#EDB86D" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">output  f(t)</text><text x="600" y="454" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">t = 1  →  60       t = 2  →  120       t = 3  →  180</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">A function assigns one output to each input.</text></svg>