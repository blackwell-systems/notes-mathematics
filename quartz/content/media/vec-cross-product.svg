<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cross product: perpendicular to a plane</title><desc id="desc">The basis vectors i=(1,0,0) and j=(0,1,0) span the xy plane. The cross product i cross j = k=(0,0,1) is perpendicular to both, with orientation determined by the right-hand rule.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Cross product: perpendicular to a plane</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="131" width="732" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="132" width="730" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="406" y="167" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">A 3D right-hand-rule sketch</text><line x1="52" y1="186" x2="760" y2="186" stroke="#87B8EE" stroke-width="1.4" /><rect x="797" y="131" width="360" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="798" y="132" width="358" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="977" y="167" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">The result</text><line x1="809" y1="186" x2="1145" y2="186" stroke="#BCA8EC" stroke-width="1.4" /><polygon points="361,442 568,500 396,587 189,529" fill="#36526D" fill-opacity="0.25" stroke="#63748B" stroke-width="2.5" stroke-linejoin="round"/><line x1="361" y1="442" x2="568" y2="500" stroke="#F28D95" stroke-width="5" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="361" y1="442" x2="189" y2="529" stroke="#87B8EE" stroke-width="5" marker-end="url(#arr-blue)" stroke-linecap="round"/><line x1="361" y1="442" x2="361" y2="208" stroke="#98D5A3" stroke-width="5" marker-end="url(#arr-green)" stroke-linecap="round"/><text x="617" y="519" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">i : x</text><text x="144" y="548" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">j : y</text><text x="391" y="196" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">k : z</text><text x="976" y="253" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">i = (1,0,0)</text><text x="976" y="319" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">j = (0,1,0)</text><text x="976" y="387" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">i × j = (0,0,1)</text><text x="976" y="461" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">Perpendicular to both</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">i × j = k, and |i × j| = 1 (area of unit square).</text></svg>