<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 567" width="800" height="567" role="img" aria-labelledby="title desc"><title id="title">One set, different topologies</title><desc id="desc">Three topologies on X={a,b,c}: indiscrete with only empty and whole sets open, intermediate nested topology, and discrete with all eight subsets open.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="567" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">One set, different topologies</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Openness is chosen, not inherited from a bare set.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><rect x="72" y="147" width="656" height="89" rx="14" stroke="#6DD2BD" fill="#1C2B40" stroke-width="2.5"/><text x="188" y="182" fill="#6DD2BD" font-size="21" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">INDISCRETE</text><text x="420" y="210" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">∅, X</text><rect x="72" y="257" width="656" height="89" rx="14" stroke="#91BFF6" fill="#1C2B40" stroke-width="2.5"/><text x="188" y="292" fill="#91BFF6" font-size="21" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">INTERMEDIATE</text><text x="420" y="320" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">∅, {a}, {a,b}, X</text><rect x="72" y="367" width="656" height="89" rx="14" stroke="#C7B6F4" fill="#1C2B40" stroke-width="2.5"/><text x="188" y="402" fill="#C7B6F4" font-size="21" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DISCRETE</text><text x="420" y="430" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all 8 subsets</text><text x="400" y="521" fill="#F4C474" font-size="23" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Underlying set X = {a,b,c}</text><text x="40" y="548" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>