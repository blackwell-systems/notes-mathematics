<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Density shifts a solid's center of mass</title><desc id="desc">Eight density slices increase from x zero to two, with dashed markers for geometric center x one and mass center seven sixths.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" fill="#F4F5FB" font-size="38" font-family="Georgia,serif" text-anchor="middle">Density shifts a solid's center of mass</text><text x="640" y="102" fill="#C1D0DF" font-size="22" font-family="Georgia,serif" text-anchor="middle">The heavier side moves the weighted average away from the midpoint.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#506B80" stroke-width="2" /><rect x="50" y="152" width="1180" height="479" rx="17" fill="#1A3148" stroke="#7DD9C9" stroke-width="2.5"/><text x="640" y="215" fill="#F4F5FB" font-size="28" font-family="Georgia,serif" text-anchor="middle">Density ρ(x,y,z) = 1 + x,  from x=0 to x=2</text><rect x="156" y="286" width="117" height="223" fill="#2B4B63" stroke="#506B80" stroke-width="1.5"/><rect x="273" y="286" width="117" height="223" fill="#30546A" stroke="#506B80" stroke-width="1.5"/><rect x="390" y="286" width="117" height="223" fill="#37616D" stroke="#506B80" stroke-width="1.5"/><rect x="507" y="286" width="117" height="223" fill="#427779" stroke="#506B80" stroke-width="1.5"/><rect x="624" y="286" width="117" height="223" fill="#518B83" stroke="#506B80" stroke-width="1.5"/><rect x="741" y="286" width="117" height="223" fill="#69A99A" stroke="#506B80" stroke-width="1.5"/><rect x="858" y="286" width="117" height="223" fill="#8AC8B3" stroke="#506B80" stroke-width="1.5"/><rect x="975" y="286" width="117" height="223" fill="#A7DAC8" stroke="#506B80" stroke-width="1.5"/><line x1="624" y1="268" x2="624" y2="538" stroke="#F1BD75" stroke-width="3" stroke-dasharray="9 6"/><line x1="702" y1="268" x2="702" y2="538" stroke="#C6A5ED" stroke-width="3" stroke-dasharray="9 6"/><text x="574" y="255" fill="#F1BD75" font-size="21" font-family="Georgia,serif" text-anchor="middle">x = 1</text><text x="764" y="255" fill="#C6A5ED" font-size="22" font-family="Georgia,serif" text-anchor="middle">x̄ = 7/6</text><text x="156" y="560" fill="#C1D0DF" font-size="22" font-family="Georgia,serif" text-anchor="start">x = 0</text><text x="1092" y="560" fill="#C1D0DF" font-size="22" font-family="Georgia,serif" text-anchor="end">x = 2</text><text x="640" y="603" fill="#F4F5FB" font-size="23" font-family="Georgia,serif" text-anchor="middle">More mass on the right shifts the weighted average.</text><rect x="122" y="646" width="1036" height="58" rx="17" fill="#1A3148" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="682" fill="#F4F5FB" font-size="25" font-family="Georgia,serif" text-anchor="middle">Geometric center x = 1      Mass center x̄ = 7/6</text></svg>