<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Cantor diagonal construction of a real missing from any purported list</title>
<desc id="desc">Five sample rows of a purported enumeration of real numbers in (0,1), each displayed to five digits. Diagonal digits 1,2,3,4,5 are highlighted. The constructed decimal d begins 0.21111... by choosing 2 when the diagonal digit is 1 and 1 otherwise. It differs from each listed number in the position of that row. The procedure extends to all rows, proving any proposed infinite enumeration misses a real number.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17102F"/><stop offset="1" stop-color="#070A1B"/></linearGradient>
<linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2B2047"/><stop offset="1" stop-color="#10142E"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#33264E"/><stop offset="1" stop-color="#1E1A3C"/></linearGradient>
<linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#674588"/><stop offset="1" stop-color="#37234F"/></linearGradient>
<marker id="uparrow" markerWidth="14" markerHeight="14" refX="6" refY="6" orient="auto" viewBox="0 0 12 12"><path d="M0 12 L6 0 L12 12" fill="none" stroke="#C995FE" stroke-width="2"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/>
<text x="720" y="86" fill="#FAF6FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="70" font-weight="bold" text-anchor="middle">Cantor's Diagonal Argument</text><text x="720" y="144" fill="#D9C6F4" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="normal" text-anchor="middle">Change the n-th digit of the n-th listed real number.</text><path d="M75 166 H1365" stroke="#8759BC" stroke-width="2"/><text x="720" y="212" fill="#EBD7FB" font-family="Georgia, 'DejaVu Serif', serif" font-size="36" font-weight="normal" text-anchor="middle">Suppose someone lists every real in (0, 1):</text><rect  x="156" y="250" width="1128" height="73" rx="12" fill="#1A1835" stroke="#4B385F" stroke-width="1"/><text x="275" y="306" fill="#F3EBFE" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="normal" text-anchor="middle">r₁ = 0.</text><rect data-diagonal="1:1" x="458" y="257" width="80" height="64" rx="11" fill="#6B418F" stroke="#ECBAFF" stroke-width="2"/><text x="498" y="306" fill="#FFEDB8" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="bold" text-anchor="middle">1</text><text x="614" y="306" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">4</text><text x="730" y="306" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">3</text><text x="846" y="306" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">6</text><text x="962" y="306" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">2</text><text x="1086" y="306" fill="#B7A1D3" font-family="Georgia, 'DejaVu Serif', serif" font-size="48" font-weight="normal" text-anchor="middle">…</text><rect  x="156" y="338" width="1128" height="73" rx="12" fill="#1A1835" stroke="#4B385F" stroke-width="1"/><text x="275" y="394" fill="#F3EBFE" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="normal" text-anchor="middle">r₂ = 0.</text><text x="498" y="394" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">7</text><rect data-diagonal="2:2" x="574" y="345" width="80" height="64" rx="11" fill="#6B418F" stroke="#ECBAFF" stroke-width="2"/><text x="614" y="394" fill="#FFEDB8" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="bold" text-anchor="middle">2</text><text x="730" y="394" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">5</text><text x="846" y="394" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">1</text><text x="962" y="394" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">4</text><text x="1086" y="394" fill="#B7A1D3" font-family="Georgia, 'DejaVu Serif', serif" font-size="48" font-weight="normal" text-anchor="middle">…</text><rect  x="156" y="426" width="1128" height="73" rx="12" fill="#1A1835" stroke="#4B385F" stroke-width="1"/><text x="275" y="482" fill="#F3EBFE" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="normal" text-anchor="middle">r₃ = 0.</text><text x="498" y="482" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">2</text><text x="614" y="482" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">9</text><rect data-diagonal="3:3" x="690" y="433" width="80" height="64" rx="11" fill="#6B418F" stroke="#ECBAFF" stroke-width="2"/><text x="730" y="482" fill="#FFEDB8" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="bold" text-anchor="middle">3</text><text x="846" y="482" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">8</text><text x="962" y="482" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">6</text><text x="1086" y="482" fill="#B7A1D3" font-family="Georgia, 'DejaVu Serif', serif" font-size="48" font-weight="normal" text-anchor="middle">…</text><rect  x="156" y="514" width="1128" height="73" rx="12" fill="#1A1835" stroke="#4B385F" stroke-width="1"/><text x="275" y="570" fill="#F3EBFE" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="normal" text-anchor="middle">r₄ = 0.</text><text x="498" y="570" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">4</text><text x="614" y="570" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">6</text><text x="730" y="570" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">7</text><rect data-diagonal="4:4" x="806" y="521" width="80" height="64" rx="11" fill="#6B418F" stroke="#ECBAFF" stroke-width="2"/><text x="846" y="570" fill="#FFEDB8" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="bold" text-anchor="middle">4</text><text x="962" y="570" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">1</text><text x="1086" y="570" fill="#B7A1D3" font-family="Georgia, 'DejaVu Serif', serif" font-size="48" font-weight="normal" text-anchor="middle">…</text><rect  x="156" y="602" width="1128" height="73" rx="12" fill="#1A1835" stroke="#4B385F" stroke-width="1"/><text x="275" y="658" fill="#F3EBFE" font-family="Georgia, 'DejaVu Serif', serif" font-size="42" font-weight="normal" text-anchor="middle">r₅ = 0.</text><text x="498" y="658" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">9</text><text x="614" y="658" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">1</text><text x="730" y="658" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">6</text><text x="846" y="658" fill="#F2EBFF" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="normal" text-anchor="middle">3</text><rect data-diagonal="5:5" x="922" y="609" width="80" height="64" rx="11" fill="#6B418F" stroke="#ECBAFF" stroke-width="2"/><text x="962" y="658" fill="#FFEDB8" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="bold" text-anchor="middle">5</text><text x="1086" y="658" fill="#B7A1D3" font-family="Georgia, 'DejaVu Serif', serif" font-size="48" font-weight="normal" text-anchor="middle">…</text><rect  x="57" y="736" width="1326" height="232" rx="22" fill="url(#footer)" stroke="#BC87F0" stroke-width="3"/><text x="252" y="794" fill="#D7B5F2" font-family="Georgia, 'DejaVu Serif', serif" font-size="35" font-weight="bold" text-anchor="start">Diagonal digits:</text><text x="980" y="794" fill="#FFD6A4" font-family="Georgia, 'DejaVu Serif', serif" font-size="37" font-weight="normal" text-anchor="middle">1   2   3   4   5   …</text><text x="720" y="855" fill="#FAF5FF" font-family="Georgia, 'DejaVu Serif', serif" font-size="47" font-weight="bold" text-anchor="middle">Construct d = 0.2 1 1 1 1 …</text><text x="720" y="913" fill="#E6D9F3" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-weight="normal" text-anchor="middle">Choose 2 if the diagonal digit is 1; otherwise choose 1.</text><text x="720" y="951" fill="#CEB7EC" font-family="Georgia, 'DejaVu Serif', serif" font-size="25" font-weight="normal" text-anchor="middle">Only five rows shown: this construction continues for every n.</text><metadata data-constructed="1:2"/><metadata data-constructed="2:1"/><metadata data-constructed="3:1"/><metadata data-constructed="4:1"/><metadata data-constructed="5:1"/>
</svg>