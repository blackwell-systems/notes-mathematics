<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Join and meet in the divisors of sixty</title>
<desc id="desc">The Hasse subdiagram shows 1 below 2, 2 below 6 and 10, 6 and 10 below 30, and 30 below 60. For divisors of 60 under divisibility, the common lower bounds of 6 and 10 are 1 and 2, so their meet is 2; the common upper bounds are 30 and 60, so their join is 30.</desc>
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17122d"/><stop offset="1" stop-color="#0b1225"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="54" y="58" fill="#f6f2ff" font-family="Georgia,serif" font-size="37" font-weight="700" text-anchor="start">Join and meet: which bound is the best?</text>
<text x="54" y="96" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Divisibility order: gcd gives the meet, lcm gives the join.</text>
<path d="M54 113 H1146" stroke="#695282" stroke-width="2"/>
<rect x="42" y="134" width="735" height="432" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><rect x="800" y="134" width="358" height="432" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="407" y="176" fill="#bea0f1" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Relevant divisors of 60</text><line x1="408" y1="521" x2="408" y2="442" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="1" data-to="2"/><line x1="408" y1="442" x2="268" y2="350" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="2" data-to="6"/><line x1="408" y1="442" x2="548" y2="350" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="2" data-to="10"/><line x1="268" y1="350" x2="408" y2="260" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="6" data-to="30"/><line x1="548" y1="350" x2="408" y2="260" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="10" data-to="30"/><line x1="408" y1="260" x2="408" y2="190" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="30" data-to="60"/><circle cx="408" cy="521" r="29" fill="#333951" stroke="#a9b2cd" stroke-width="3" data-node="1"/><text x="408" y="530" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">1</text><circle cx="408" cy="442" r="29" fill="#26535b" stroke="#78d2c7" stroke-width="3" data-node="2"/><text x="408" y="451" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">2</text><circle cx="268" cy="350" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="6"/><text x="268" y="359" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">6</text><circle cx="548" cy="350" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="10"/><text x="548" y="359" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">10</text><circle cx="408" cy="260" r="29" fill="#624829" stroke="#f1ce90" stroke-width="3" data-node="30"/><text x="408" y="269" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">30</text><circle cx="408" cy="190" r="29" fill="#333951" stroke="#a9b2cd" stroke-width="3" data-node="60"/><text x="408" y="199" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">60</text><text x="825" y="183" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">PAIR: 6 AND 10</text><text x="825" y="238" fill="#c7c6da" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Common lower bounds</text><text x="825" y="273" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">1 and 2</text><text x="825" y="313" fill="#78d2c7" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Meet = gcd(6,10) = 2</text><text x="825" y="378" fill="#c7c6da" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Common upper bounds</text><text x="825" y="415" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">30 and 60</text><text x="825" y="456" fill="#f1ce90" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Join = lcm(6,10) = 30</text><text x="825" y="525" fill="#c7c6da" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Only relevant nodes shown.</text><text x="600" y="596" fill="#f1ce90" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">The join is the least common upper bound; the meet is the greatest common lower bound.</text>
</svg>