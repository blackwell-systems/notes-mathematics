<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Change of basis: one vector, two coordinate lists</title><desc id="desc">The geometric vector v=(3,2) has standard coordinates (3,2), and coordinates (5/2,1/2) in basis b1=(1,1), b2=(1,-1), since (5/2)b1+(1/2)b2=(3,2).</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Change of basis: one vector, two coordinate lists</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="42" y="132" width="534" height="448" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="43" y="133" width="532" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="309" y="168" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Standard basis</text><line x1="54" y1="187" x2="564" y2="187" stroke="#87B8EE" stroke-width="1.4" /><rect x="624" y="132" width="534" height="448" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="625" y="133" width="532" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="891" y="168" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Basis b₁ = (1,1), b₂ = (1,−1)</text><line x1="636" y1="187" x2="1146" y2="187" stroke="#BCA8EC" stroke-width="1.4" /><rect x="115" y="225" width="374" height="300" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="115" y1="225" x2="115" y2="525" stroke="#40536B" stroke-width="1" /><line x1="189.8" y1="225" x2="189.8" y2="525" stroke="#40536B" stroke-width="2" /><line x1="264.6" y1="225" x2="264.6" y2="525" stroke="#40536B" stroke-width="1" /><line x1="339.4" y1="225" x2="339.4" y2="525" stroke="#40536B" stroke-width="1" /><line x1="414.2" y1="225" x2="414.2" y2="525" stroke="#40536B" stroke-width="1" /><line x1="489" y1="225" x2="489" y2="525" stroke="#40536B" stroke-width="1" /><line x1="115" y1="525" x2="489" y2="525" stroke="#40536B" stroke-width="1" /><line x1="115" y1="465" x2="489" y2="465" stroke="#40536B" stroke-width="2" /><line x1="115" y1="405" x2="489" y2="405" stroke="#40536B" stroke-width="1" /><line x1="115" y1="345" x2="489" y2="345" stroke="#40536B" stroke-width="1" /><line x1="115" y1="285" x2="489" y2="285" stroke="#40536B" stroke-width="1" /><line x1="115" y1="225" x2="489" y2="225" stroke="#40536B" stroke-width="1" /><line x1="189.8" y1="465" x2="264.6" y2="465" stroke="#F28D95" stroke-width="4" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="189.8" y1="465" x2="189.8" y2="405" stroke="#BCA8EC" stroke-width="4" marker-end="url(#arr-violet)" stroke-linecap="round"/><line x1="189.8" y1="465" x2="414.2" y2="345" stroke="#87B8EE" stroke-width="4" marker-end="url(#arr-blue)" stroke-linecap="round"/><text x="307" y="562" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">v = 3e₁ + 2e₂</text><rect x="707" y="225" width="374" height="300" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="707" y1="225" x2="707" y2="525" stroke="#40536B" stroke-width="1" /><line x1="781.8" y1="225" x2="781.8" y2="525" stroke="#40536B" stroke-width="2" /><line x1="856.6" y1="225" x2="856.6" y2="525" stroke="#40536B" stroke-width="1" /><line x1="931.4" y1="225" x2="931.4" y2="525" stroke="#40536B" stroke-width="1" /><line x1="1006.2" y1="225" x2="1006.2" y2="525" stroke="#40536B" stroke-width="1" /><line x1="1081" y1="225" x2="1081" y2="525" stroke="#40536B" stroke-width="1" /><line x1="707" y1="525" x2="1081" y2="525" stroke="#40536B" stroke-width="1" /><line x1="707" y1="465" x2="1081" y2="465" stroke="#40536B" stroke-width="2" /><line x1="707" y1="405" x2="1081" y2="405" stroke="#40536B" stroke-width="1" /><line x1="707" y1="345" x2="1081" y2="345" stroke="#40536B" stroke-width="1" /><line x1="707" y1="285" x2="1081" y2="285" stroke="#40536B" stroke-width="1" /><line x1="707" y1="225" x2="1081" y2="225" stroke="#40536B" stroke-width="1" /><line x1="781.8" y1="465" x2="856.6" y2="405" stroke="#F28D95" stroke-width="4" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="781.8" y1="465" x2="856.6" y2="525" stroke="#BCA8EC" stroke-width="4" marker-end="url(#arr-violet)" stroke-linecap="round"/><line x1="781.8" y1="465" x2="968.8" y2="315" stroke="#98D5A3" stroke-width="4" marker-end="url(#arr-green)" stroke-linecap="round"/><line x1="968.8" y1="315" x2="1006.2" y2="345" stroke="#F28D95" stroke-width="4" marker-end="url(#arr-red)" stroke-linecap="round"/><line x1="781.8" y1="465" x2="1006.2" y2="345" stroke="#87B8EE" stroke-width="4" marker-end="url(#arr-blue)" stroke-linecap="round"/><text x="893" y="562" fill="#C4CEDA" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">v = (5/2)b₁ + (1/2)b₂</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Changing basis changes the coordinates, not the underlying vector.</text></svg>