<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 844" role="img" aria-labelledby="title desc"><title id="title">Selecting actual members of a cover</title><desc id="desc">The upper panel has seven labeled open intervals U1 through U7. The three overlapping original intervals U1 from 205 to 525, U2 from 475 to 792, and U3 from 742 to 1080 are repeated at precisely the same horizontal coordinates and with the same open endpoints below. Both upper and lower families cover the closed amber interval from a at 253 to b at 1010.</desc><rect width="1280" height="844" rx="16" fill="#0C1E30"/><text x="42" y="61" font-family="Arial,sans-serif" font-size="35" fill="#F2F7FC" text-anchor="start" font-weight="bold">Selecting actual members of a cover</text><line x1="42" y1="86" x2="1238" y2="86" stroke="#45627B" stroke-width="2" stroke-linecap="round"/><rect x="42" y="104" width="1196" height="623" rx="13" fill="#162F45" stroke="#46617B" stroke-width="2"/><text x="67" y="145" font-family="Arial,sans-serif" font-size="24" fill="#F2F7FC" text-anchor="start" font-weight="normal">Given cover: seven distinct open intervals</text><line x1="205" y1="187" x2="525" y2="187" stroke="#72D4C0" stroke-width="7" stroke-linecap="round"/><circle cx="205" cy="187" r="7" fill="#0C1E30" stroke="#72D4C0" stroke-width="2.8"/><circle cx="525" cy="187" r="7" fill="#0C1E30" stroke="#72D4C0" stroke-width="2.8"/><text x="1125" y="193" font-family="Arial,sans-serif" font-size="18" fill="#72D4C0" text-anchor="start" font-weight="normal">U₁</text><line x1="475" y1="226" x2="792" y2="226" stroke="#C5ACEF" stroke-width="7" stroke-linecap="round"/><circle cx="475" cy="226" r="7" fill="#0C1E30" stroke="#C5ACEF" stroke-width="2.8"/><circle cx="792" cy="226" r="7" fill="#0C1E30" stroke="#C5ACEF" stroke-width="2.8"/><text x="1125" y="232" font-family="Arial,sans-serif" font-size="18" fill="#C5ACEF" text-anchor="start" font-weight="normal">U₂</text><line x1="742" y1="265" x2="1080" y2="265" stroke="#91BEED" 