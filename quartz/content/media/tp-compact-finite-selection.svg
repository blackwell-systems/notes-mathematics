<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">Compactness: select a finite subcover</title><desc id="desc">Two diagrams of the same compact closed interval from a to b: a family of overlapping open intervals above, and a selected set of three open intervals below that overlaps and continues past both endpoints, still covering the full closed interval. The example illustrates a finite subcover; compactness requires such a choice for every open cover.</desc><rect width="1280" height="650" rx="20" fill="#0C1E30"/><text x="54" y="65" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F3F6FC">Compactness: select a finite subcover</text><line x1="54" y1="87" x2="1226" y2="87" stroke="#34566C" stroke-width="2"/><rect x="54" y="110" width="1172" height="433" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><text x="83" y="151" font-family="Arial,sans-serif" font-size="24" fill="#F3F6FC" text-anchor="start" font-weight="normal">An illustrated open cover</text><line x1="157" y1="322" x2="1070" y2="322" stroke="#7CA9C9" stroke-width="3"/><path d="M157 322 l15 -7 v14 Z M1070 322 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="235" y1="322" x2="995" y2="322" stroke="#F2BB68" stroke-width="8" stroke-linecap="round"/><circle cx="235" cy="322" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="995" cy="322" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="235" y="354" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">a</text><text x="995" y="354" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">b</text><line x1="183" y1="186" x2="440" y2="186" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="183" cy="186" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><circle cx="440" cy="186" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><line x1="300" y1="211" x2="610" y2="211" stroke="#91BDF2" stroke-width="8" stroke-linecap="round"/><circle cx="300" cy="211" r="9" fill="#0C1E30" stroke="#91BDF2" stroke-width="3"/><circle cx="610" cy="211" r="9" fill="#0C1E30" stroke="#91BDF2" stroke-width="3"/><line x1="410" y1="184" x2="740" y2="184" stroke="#C3A0E9" stroke-width="8" stroke-linecap="round"/><circle cx="410" cy="184" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><circle cx="740" cy="184" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><line x1="555" y1="209" x2="845" y2="209" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="555" cy="209" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><circle cx="845" cy="209" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><line x1="705" y1="185" x2="1064" y2="185" stroke="#91BDF2" stroke-width="8" stroke-linecap="round"/><circle cx="705" cy="185" r="9" fill="#0C1E30" stroke="#91BDF2" stroke-width="3"/><circle cx="1064" cy="185" r="9" fill="#0C1E30" stroke="#91BDF2" stroke-width="3"/><line x1="209" y1="249" x2="543" y2="249" stroke="#C3A0E9" stroke-width="8" stroke-linecap="round"/><circle cx="209" cy="249" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><circle cx="543" cy="249" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><line x1="680" y1="248" x2="1040" y2="248" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="680" cy="248" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><circle cx="1040" cy="248" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><text x="1111" y="292" font-family="Arial,sans-serif" font-size="18" fill="#F2BB68" text-anchor="middle" font-weight="normal">[a,b]</text><text x="83" y="387" font-family="Arial,sans-serif" font-size="23" fill="#F3F6FC" text-anchor="start" font-weight="normal">Choose a finite subcollection still covering [a,b]</text><line x1="157" y1="483" x2="1070" y2="483" stroke="#7CA9C9" stroke-width="3"/><path d="M157 483 l15 -7 v14 Z M1070 483 l-15 -7 v14 Z" fill="#7CA9C9"/><line x1="235" y1="483" x2="995" y2="483" stroke="#F2BB68" stroke-width="8" stroke-linecap="round"/><circle cx="235" cy="483" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><circle cx="995" cy="483" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="235" y="515" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">a</text><text x="995" y="515" font-family="Arial,sans-serif" font-size="19" fill="#F3F6FC" text-anchor="middle" font-weight="normal">b</text><line x1="180" y1="439" x2="520" y2="439" stroke="#68D2C0" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="439" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><circle cx="520" cy="439" r="9" fill="#0C1E30" stroke="#68D2C0" stroke-width="3"/><line x1="470" y1="440" x2="800" y2="440" stroke="#C3A0E9" stroke-width="8" stroke-linecap="round"/><circle cx="470" cy="440" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><circle cx="800" cy="440" r="9" fill="#0C1E30" stroke="#C3A0E9" stroke-width="3"/><line x1="745" y1="439" x2="1050" y2="439" stroke="#91BDF2" stroke-width="8" stroke-linecap="round"/><circle cx="745" cy="439" r="9" fill="#0C1E30" stroke="#91BDF2" stroke-width="3"/><circle cx="1050" cy="439" r="9" fill="#0C1E30" stroke="#91BDF2" stroke-width="3"/><text x="1110" y="480" font-family="Arial,sans-serif" font-size="18" fill="#68D2C0" text-anchor="middle" font-weight="normal">3 sets</text><rect x="54" y="557" width="1172" height="66" rx="10" fill="#10263A" stroke="#426982" stroke-width="2"/><text x="640" y="596" font-family="Arial,sans-serif" font-size="24" fill="#F3F6FC" text-anchor="middle" font-weight="normal">Compactness means EVERY open cover has SOME finite subcover.</text></svg>