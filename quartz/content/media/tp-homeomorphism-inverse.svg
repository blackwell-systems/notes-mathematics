<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A continuous bijection need not be a homeomorphism</title><desc id="desc">Discrete two-point space mapped by identity to indiscrete two-point space is continuous and bijective, but the reverse identity is not continuous because singletons are open only in the discrete space.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><line x1="54" y1="91" x2="1226" y2="91" stroke="#506885" stroke-width="2"/><text x="640" y="61" fill="#F2F4F9" font-size="39" font-family="Georgia,serif" text-anchor="middle">A continuous bijection need not be a homeomorphism</text><text x="640" y="122" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">Inverse continuity is an additional requirement.</text><rect x="57" y="173" width="545" height="435" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><rect x="678" y="173" width="545" height="435" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><text x="331" y="229" fill="#7DD9C9" font-size="30" font-family="Georgia,serif" text-anchor="middle">X: discrete topology</text><text x="953" y="229" fill="#CAA8F0" font-size="30" font-family="Georgia,serif" text-anchor="middle">Y: indiscrete topology</text><circle cx="236" cy="350" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><circle cx="435" cy="350" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><circle cx="860" cy="350" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><circle cx="1059" cy="350" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><text x="236" y="392" fill="#F2F4F9" font-size="25" font-family="Georgia,serif" text-anchor="middle">0</text><text x="435" y="392" fill="#F2F4F9" font-size="25" font-family="Georgia,serif" text-anchor="middle">1</text><text x="860" y="392" fill="#F2F4F9" font-size="25" font-family="Georgia,serif" text-anchor="middle">0</text><text x="1059" y="392" fill="#F2F4F9" font-size="25" font-family="Georgia,serif" text-anchor="middle">1</text><ellipse cx="236" cy="350" rx="55" ry="83" fill="none" stroke="#7DD9C9" stroke-width="3"/><ellipse cx="435" cy="350" rx="55" ry="83" fill="none" stroke="#7DD9C9" stroke-width="3"/><ellipse cx="957" cy="350" rx="173" ry="92" fill="none" stroke="#CAA8F0" stroke-width="3"/><text x="331" y="503" fill="#7DD9C9" font-size="26" font-family="Georgia,serif" text-anchor="middle">{0} is open</text><text x="953" y="503" fill="#F3A3B3" font-size="26" font-family="Georgia,serif" text-anchor="middle">{0} is not open</text><text x="640" y="625" fill="#F2BC75" font-size="27" font-family="Georgia,serif" text-anchor="middle">Identity X → Y: continuous and bijective</text><text x="640" y="678" fill="#F3A3B3" font-size="24" font-family="Georgia,serif" text-anchor="middle">Inverse Y → X: NOT continuous; therefore NOT a homeomorphism.</text></svg>