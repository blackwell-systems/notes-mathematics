<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Localization: algebraic zoom near zero</title><desc id="desc">Left, the polynomial ring R of real polynomials; choosing the point x equals zero leads right to the local ring of rational functions f over g with denominator g zero not equal zero. The fraction one over one plus x is allowed, but one over x is not, because its denominator vanishes at the selected point.</desc><rect width="1200" height="540" rx="19" fill="#0C1E30"/><text x="44" y="58" fill="#F2F6FA" font-family="Georgia,serif" font-size="37" font-weight="bold">Localization: algebraic zoom near zero</text><line x1="44" y1="82" x2="1156" y2="82" stroke="#48637A" stroke-width="2"/><rect x="50" y="111" width="533" height="369" rx="12" fill="#152D42" stroke="#436078" stroke-width="2"/><rect x="616" y="111" width="534" height="369" rx="12" fill="#152D42" stroke="#436078" stroke-width="2"/><text x="82" y="161" font-family="Arial,sans-serif" font-size="25" text-anchor="start" fill="#F2F6FA">Global polynomials ℝ[x]</text><text x="82" y="217" font-family="Arial,sans-serif" font-size="25" text-anchor="start" fill="#91BCEE">f(x) = a₀ + a₁x + …</text><text x="82" y="279" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#B7CADD">No polynomial division</text><text x="82" y="317" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#B7CADD">by 1+x in ℝ[x]</text><text x="82" y="382" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#EDB96E">Choose the point x = 0</text><text x="648" y="161" font-family="Arial,sans-serif" font-size="25" text-anchor="start" fill="#F2F6FA">Local ring ℝ[x]₍ₓ₎</text><text x="648" y="215" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#91BCEE">Allow f(x)/g(x)</text><text x="648" y="249" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#70D0BE">when g(0) ≠ 0</text><text x="648" y="322" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#70D0BE">1/(1+x)  ✓ permitted</text><text x="648" y="364" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#EF9DA8">1/x       ✕ not permitted</text><line x1="580" y1="288" x2="615" y2="288" stroke="#EDB96E" stroke-width="5" stroke-linecap="round"/><text x="600" y="271" font-family="Arial,sans-serif" font-size="35" text-anchor="middle" fill="#EDB96E">→</text><text x="600" y="517" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#F2F6FA">Localization inverts precisely the denominators that stay nonzero at the chosen point.</text></svg>