<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 586" role="img" aria-labelledby="title desc"><title id="title">Compactness and the finite intersection property</title><desc id="desc">Two panels express De Morgan duality. On the left open sets U_i cover X when their union equals X, and a finite subcover is a finite union equal X. On the right closed complements F_i equal X minus U_i; finite union covering is equivalent to a finite intersection of F_i being empty. Thus no finite subcover corresponds to all finite intersections being nonempty.</desc><rect width="1280" height="586" rx="16" fill="#0C1E30"/><text x="42" y="61" font-family="Arial,sans-serif" font-size="35" fill="#F2F7FC" text-anchor="start" font-weight="bold">Compactness and the finite intersection property</text><line x1="42" y1="86" x2="1238" y2="86" stroke="#45627B" stroke-width="2" stroke-linecap="round"/><rect x="43" y="110" width="577" height="390" rx="13" fill="#162F45" stroke="#46617B" stroke-width="2"/><rect x="651" y="110" width="584" height="390" rx="13" fill="#162F45" stroke="#46617B" stroke-width="2"/><text x="70" y="155" font-family="Arial,sans-serif" font-size="25" fill="#72D4C0" text-anchor="start" font-weight="normal">Open cover (Uᵢ)</text><text x="70" y="207" font-family="Arial,sans-serif" font-size="28" fill="#F2F7FC" text-anchor="start" font-weight="normal">X = ⋃ Uᵢ</text><text x="70" y="259" font-family="Arial,sans-serif" font-size="21" fill="#BDD0E1" text-anchor="start" font-weight="normal">Finite subcover:</text><text x="70" y="302" font-family="Arial,sans-serif" font-size="23" fill="#F2F7FC" text-anchor="start" font-weight="normal">X = Uᵢ₁ ∪ ... ∪ Uᵢₖ</text><text x="672" y="155" font-family="Arial,sans-serif" font-size="25" fill="#C5ACEF" text-anchor="start" font-weight="normal">Closed complements (Fᵢ)</text><text x="672" y="207" font-family="Arial,sans-serif" font-size="27" fill="#F2F7FC" text-anchor="start" font-weight="normal">Fᵢ = X \ Uᵢ</text><text x="672" y="259" font-family="Arial,sans-serif" font-size="21" fill="#BDD0E1" text-anchor="start" font-weight="normal">Equivalent condition:</text><text x="672" y="302" font-family="Arial,sans-serif" font-size="23" fill="#F2F7FC" text-anchor="start" font-weight="normal">Fᵢ₁ ∩ ... ∩ Fᵢₖ = ∅</text><line x1="542" y1="345" x2="724" y2="345" stroke="#F1BD73" stroke-width="4" stroke-linecap="round"/><text x="635" y="329" font-family="Arial,sans-serif" font-size="28" fill="#F1BD73" text-anchor="middle" font-weight="normal">⇔</text><text x="69" y="444" font-family="Arial,sans-serif" font-size="22" fill="#EDA7AA" text-anchor="start" font-weight="normal">No finite subcover</text><text x="671" y="444" font-family="Arial,sans-serif" font-size="21" fill="#EDA7AA" text-anchor="start" font-weight="normal">Every finite intersection nonempty</text><text x="638" y="551" font-family="Arial,sans-serif" font-size="21" fill="#F2F7FC" text-anchor="middle" font-weight="normal">Complements reverse unions and intersections (De Morgan).</text></svg>