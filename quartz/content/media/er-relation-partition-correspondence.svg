<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Equivalence relations and partitions describe the same grouping</title><desc id="desc">On the left the same-parity relation connects one with three and two with four, alongside reflexive pairs. On the right these are the two nonoverlapping blocks of a partition; either description determines the other.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#87B8EE" stroke-width="1.6"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#EF9292" stroke-width="1.6"/></marker></defs><rect width="1000" height="520" fill="#101A2C"/><text x="40" y="57" fill="#F4F3ED" font-size="35" font-weight="760" text-anchor="start">Same structure, two descriptions</text><text x="40" y="96" fill="#C4CEDA" font-size="21" font-weight="450" text-anchor="start">A = {1, 2, 3, 4}; related means having the same parity.</text><line x1="40" y1="113" x2="960" y2="113" stroke="#45576F" stroke-width="2" /><rect x="36" y="140" width="420" height="306" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="544" y="140" width="420" height="306" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="62" y="180" fill="#87B8EE" font-size="22" font-weight="760" text-anchor="start">RELATION: WHO IS RELATED?</text><text x="570" y="180" fill="#66C4B4" font-size="22" font-weight="760" text-anchor="start">PARTITION: WHICH BLOCK?</text><rect x="87" y="211" width="317" height="84" rx="14" fill="#23344B" stroke="#87B8EE" stroke-width="2"/><rect x="87" y="311" width="317" height="84" rx="14" fill="#23344B" stroke="#BCA8EC" stroke-width="2"/><text x="245" y="265" fill="#F4F3ED" font-size="36" font-weight="700" text-anchor="middle">1 ~ 3</text><text x="245" y="365" fill="#F4F3ED" font-size="36" font-weight="700" text-anchor="middle">2 ~ 4</text><text x="245" y="422" fill="#C4CEDA" font-size="17" font-weight="480" text-anchor="middle">Plus a ~ a for every element</text><path d="M 474 274 L 528 274" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 526 327 L 472 327" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="577" y="214" width="171" height="189" rx="14" fill="#203C40" stroke="#66C4B4" stroke-width="2"/><rect x="765" y="214" width="171" height="189" rx="14" fill="#302D47" stroke="#BCA8EC" stroke-width="2"/><text x="662" y="253" fill="#66C4B4" font-size="20" font-weight="750" text-anchor="middle">ODD</text><text x="850" y="253" fill="#BCA8EC" font-size="20" font-weight="750" text-anchor="middle">EVEN</text><circle cx="624" cy="327" r="27" fill="#66C4B4" stroke="#101A2C" stroke-width="2"/><circle cx="699" cy="327" r="27" fill="#66C4B4" stroke="#101A2C" stroke-width="2"/><circle cx="812" cy="327" r="27" fill="#BCA8EC" stroke="#101A2C" stroke-width="2"/><circle cx="889" cy="327" r="27" fill="#BCA8EC" stroke="#101A2C" stroke-width="2"/><text x="624" y="336" fill="#101A2C" font-size="28" font-weight="800" text-anchor="middle">1</text><text x="699" y="336" fill="#101A2C" font-size="28" font-weight="800" text-anchor="middle">3</text><text x="812" y="336" fill="#101A2C" font-size="28" font-weight="800" text-anchor="middle">2</text><text x="889" y="336" fill="#101A2C" font-size="28" font-weight="800" text-anchor="middle">4</text><text x="755" y="423" fill="#C4CEDA" font-size="17" font-weight="470" text-anchor="middle">Each element is in exactly one block</text><text x="500" y="489" fill="#F4F3ED" font-size="22" font-weight="620" text-anchor="middle">Same related pairs  ⇄  same partition blocks</text></svg>
