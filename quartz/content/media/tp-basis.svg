0" y="490" fill="#F4F5EF" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">x ∈ B₃ ⊆ B₁ ∩ B₂</text><text x="40" y="523" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>