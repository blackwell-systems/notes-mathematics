<svg xmlns="http://www.w3.org/2000/svg" width="800" height="573" viewBox="0 0 800 573" role="img" aria-labelledby="title desc"><title id="title">First Isomorphism Theorem</title><desc id="desc">Commutative factorization triangle: a group G maps to its image via f, first to the quotient G/kernel f by the canonical projection, then isomorphically onto image f.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="573" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">First Isomorphism Theorem</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Every homomorphism factors through its kernel.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="105" y="176" width="190" height="90" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="560" y="176" width="175" height="90" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="290" y="405" width="220" height="78" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="200" y="229" fill="#F4F3ED" font-size="28" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">G = Z/6</text><text x="647" y="229" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">im f = Z/3</text><text x="400" y="453" fill="#F4F3ED" font-size="27" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">G / ker f</text><line x1="300" y1="221" x2="550" y2="221" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="424" y="203" fill="#EDB86D" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">f</text><line x1="225" y1="278" x2="346" y2="397" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="258" y="344" fill="#66C4B4" font-size="26" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">π</text><line x1="516" y1="413" x2="624" y2="279" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="600" y="365" fill="#BCA8EC" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">isomorphism</text><text x="400" y="526" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">The kernel is collapsed; the image is preserved.</text><text x="40" y="553" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>