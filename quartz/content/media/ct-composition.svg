<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc"><title id="title">Category: objects and arrows</title><desc id="desc">Objects A, B, C with composable maps f and g and composite g∘f; the categorical associativity law applies to any composable triple.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#91BFF6"/></marker></defs><rect width="800" height="540" fill="#101A2C"/><text x="40" y="55" fill="#F4F5EF" font-size="33" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Category: objects and arrows</text><text x="40" y="93" fill="#C1CDDA" font-size="20" font-weight="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Composition is associative and has identities.</text><line x1="40" y1="110" x2="760" y2="110" stroke="#496078" stroke-width="3" /><circle cx="175" cy="283" r="44" fill="#243850" stroke="#6DD2BD" stroke-width="3"/><text x="175" y="292" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A</text><circle cx="400" cy="283" r="44" fill="#243850" stroke="#C7B6F4" stroke-width="3"/><text x="400" y="292" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">B</text><circle cx="625" cy="283" r="44" fill="#243850" stroke="#F4C474" stroke-width="3"/><text x="625" y="292" fill="#F4F5EF" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C</text><line x1="228" y1="283" x2="342" y2="283" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="453" y1="283" x2="570" y2="283" stroke="#91BFF6" stroke-width="3" marker-end="url(#arr)"/><line x1="175" y1="230" x2="620" y2="230" stroke="#F4C474" stroke-width="3" marker-end="url(#arr)"/><text x="284" y="274" fill="#91BFF6" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">f</text><text x="516" y="274" fill="#91BFF6" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">g</text><text x="403" y="208" fill="#F4C474" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">g ∘ f</text><text x="400" y="419" fill="#C1CDDA" font-size="24" font-weight="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(h ∘ g) ∘ f = h ∘ (g ∘ f)</text><text x="40" y="521" fill="#C1CDDA" font-size="15" font-weight="730" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MATHEMATICAL STRUCTURE / MAPPING PROPERTY</text></svg>