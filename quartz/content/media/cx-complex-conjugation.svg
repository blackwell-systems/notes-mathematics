<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 558" width="800" height="558" role="img" aria-labelledby="title desc"><title id="title">Conjugation in the complex plane</title><desc id="desc">Coordinate axes real and imaginary. Complex vectors (3,2) and (3,-2) reflect across the real axis; their moduli agree.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="558" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Conjugation in the complex plane</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">z = 3 + 2i and conjugate(z) = 3 − 2i.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><line x1="92" y1="320" x2="709" y2="320" stroke="#C4CEDA" stroke-width="2"/><line x1="386" y1="137" x2="386" y2="493" stroke="#C4CEDA" stroke-width="2"/><text x="705" y="307" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="24" font-weight="550">Re</text><text x="405" y="145" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="24" font-weight="550">Im</text><line x1="386" y1="320" x2="521" y2="230" stroke="#66C4B4" stroke-width="4"/><circle cx="521" cy="230" r="8" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="555" y="210" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="24" font-weight="740">3 + 2i</text><line x1="386" y1="320" x2="521" y2="410" stroke="#BCA8EC" stroke-width="4"/><circle cx="521" cy="410" r="8" fill="#223349" stroke="#BCA8EC" stroke-width="3"/><text x="555" y="436" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="24" font-weight="740">3 − 2i</text><text x="175" y="506" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#EDB86D" font-size="20" font-weight="550">Conjugation reflects across real axis.</text><text x="40" y="541" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>