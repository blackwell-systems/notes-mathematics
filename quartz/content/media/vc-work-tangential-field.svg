<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Work measures the field along a path</title><desc id="desc">A rising smooth curve has gold vectors tangent to its travel direction; the integral of F dot dr measures tangential field components and reverses sign when path orientation is reversed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Work measures the field along a path</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C4D0E0" text-anchor="middle">The orientation of the curve matters for a vector line integral.</text><line x1="42" y1="124" x2="1238" y2="124" stroke="#4C6983" stroke-width="2" /><rect x="50" y="154" width="1175" height="469" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#193249"/><line x1="156" y1="533" x2="1093" y2="533" stroke="#4C6983" stroke-width="2" /><line x1="156" y1="533" x2="156" y2="262" stroke="#4C6983" stroke-width="2" /><path d="M203 491 Q414 458 563 342 T1059 294" fill="none" stroke="#7DD9C9" stroke-width="7" stroke-linecap="round" /><circle cx="203" cy="491" r="7" fill="#F1BD75" stroke="#F2F5FB" stroke-width="2"/><circle cx="1059" cy="294" r="7" fill="#F1BD75" stroke="#F2F5FB" stroke-width="2"/><line x1="339" y1="447" x2="411" y2="415" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="583" y1="339" x2="665" y2="311" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><line x1="832" y1="301" x2="925" y2="305" stroke="#F1BD75" stroke-width="3" marker-end="url(#arrow)"/><text x="505" y="249" font-family="Georgia,serif" font-size="26" fill="#C4D0E0" text-anchor="middle">F · dr measures the field along the tangent</text><text x="289" y="545" font-family="Georgia,serif" font-size="21" fill="#C4D0E0" text-anchor="middle">start</text><text x="1050" y="279" font-family="Georgia,serif" font-size="21" fill="#C4D0E0" text-anchor="middle">finish</text><rect x="122" y="647" width="1036" height="59" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#193249"/><text x="640" y="683" font-family="Georgia,serif" font-size="24" fill="#F2F5FB" text-anchor="middle">Reversing a path changes the sign of the vector line integral.</text></svg>