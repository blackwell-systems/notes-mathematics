<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Flux measures the field through a surface</title><desc id="desc">A tilted illustration of a horizontal unit square has upward arrows for the constant field F=(0,0,3); upward flux is +3 and reversed orientation gives -3.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Flux measures the field through a surface</text><text x="640" y="103" font-family="Georgia,serif" font-size="22" fill="#C4D2E1" text-anchor="middle">The chosen normal determines the sign, not the physical area.</text><line x1="43" y1="127" x2="1237" y2="127" stroke="#4D6B82" stroke-width="2" /><rect x="56" y="158" width="1168" height="467" rx="17" fill="#1A3147" stroke="#7DD9C9" stroke-width="2.5"/><polygon points="235,491 544,491 651,358 342,358" fill="#31686C" fill-opacity=".48" stroke="#7DD9C9" stroke-width="4"/><line x1="340" y1="449" x2="340" y2="383" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="394" y1="383" x2="394" y2="317" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="433" y1="449" x2="433" y2="383" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="487" y1="383" x2="487" y2="317" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="526" y1="449" x2="526" y2="383" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="580" y1="383" x2="580" y2="317" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><line x1="461" y1="426" x2="461" y2="298" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><text x="506" y="323" font-family="Georgia,serif" font-size="30" fill="#F1BD75" text-anchor="middle">n</text><text x="919" y="267" font-family="Georgia,serif" font-size="31" fill="#7DD9C9" text-anchor="middle">F = (0,0,3)</text><text x="919" y="347" font-family="Georgia,serif" font-size="29" fill="#C6A5ED" text-anchor="middle">unit area S</text><text x="919" y="438" font-family="Georgia,serif" font-size="27" fill="#F1BD75" text-anchor="middle">upward flux = +3</text><text x="919" y="490" font-family="Georgia,serif" font-size="27" fill="#F1BD75" text-anchor="middle">downward flux = −3</text><rect x="120" y="646" width="1040" height="60" rx="17" fill="#1A3147" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="684" font-family="Georgia,serif" font-size="26" fill="#F2F5FB" text-anchor="middle">Reversing the surface normal reverses signed flux.</text></svg>