<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">T₀, T₁, and Hausdorff are not equivalent</title><desc id="desc">Sierpinski two point space is T0 not T1, cofinite topology on an infinite set is T1 but not Hausdorff, and Euclidean real line has disjoint open neighborhoods for distinct points.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="60" fill="#F2F5FA" font-family="Georgia,serif" font-size="38" text-anchor="middle">T₀, T₁, and Hausdorff are not equivalent</text><text x="640" y="106" fill="#C4D2E0" font-family="Georgia,serif" font-size="22" text-anchor="middle">Counterexamples establish that each implication is genuinely stronger.</text><rect x="37" y="160" width="387" height="459" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><text x="230" y="211" fill="#7DD9C9" font-family="Georgia,serif" font-size="26" text-anchor="middle">T₀, not T₁</text><rect x="449" y="160" width="387" height="459" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><text x="642" y="211" fill="#C6A5ED" font-family="Georgia,serif" font-size="26" text-anchor="middle">T₁, not Hausdorff</text><rect x="861" y="160" width="387" height="459" rx="16" fill="#1A304A" stroke="#4C6980" stroke-width="2.5"/><text x="1054" y="211" fill="#F1BD75" font-family="Georgia,serif" font-size="26" text-anchor="middle">Hausdorff (T₂)</text><text x="230" y="264" fill="#C4D2E0" font-family="Georgia,serif" font-size="24" text-anchor="middle">Sierpiński space</text><text x="230" y="296" fill="#F2F5FA" font-family="Georgia,serif" font-size="22" text-anchor="middle">τ = {∅, {1}, X}</text><ellipse cx="265" cy="401" rx="100" ry="80" fill="#413658" stroke="#C6A5ED" stroke-width="4"/><circle cx="150" cy="401" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><circle cx="265" cy="401" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><text x="150" y="439" fill="#F2F5FA" font-family="Georgia,serif" font-size="24" text-anchor="middle">0</text><text x="265" y="439" fill="#F2F5FA" font-family="Georgia,serif" font-size="24" text-anchor="middle">1</text><text x="230" y="556" fill="#F2F5FA" font-family="Georgia,serif" font-size="21" text-anchor="middle">{1} open, {0} not open</text><text x="644" y="264" fill="#C4D2E0" font-family="Georgia,serif" font-size="24" text-anchor="middle">Infinite cofinite space</text><ellipse cx="601" cy="402" rx="119" ry="86" fill="#254C56" fill-opacity=".7" stroke="#7DD9C9" stroke-width="4"/><ellipse cx="701" cy="402" rx="119" ry="86" fill="#50416A" fill-opacity=".7" stroke="#C6A5ED" stroke-width="4"/><circle cx="547" cy="403" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><circle cx="756" cy="403" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><text x="547" y="441" fill="#F2F5FA" font-family="Georgia,serif" font-size="22" text-anchor="middle">x</text><text x="756" y="441" fill="#F2F5FA" font-family="Georgia,serif" font-size="22" text-anchor="middle">y</text><text x="644" y="557" fill="#F1BD75" font-family="Georgia,serif" font-size="21" text-anchor="middle">U ∩ V ≠ ∅ for nonempty opens</text><text x="1055" y="264" fill="#C4D2E0" font-family="Georgia,serif" font-size="24" text-anchor="middle">Usual ℝ topology</text><ellipse cx="997" cy="402" rx="75" ry="94" fill="#254C56" fill-opacity=".7" stroke="#7DD9C9" stroke-width="4"/><ellipse cx="1116" cy="402" rx="75" ry="94" fill="#50416A" fill-opacity=".7" stroke="#C6A5ED" stroke-width="4"/><circle cx="997" cy="403" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><circle cx="1116" cy="403" r="8" fill="#F1BD75" stroke="#F2F5FA" stroke-width="2"/><text x="997" y="441" fill="#F2F5FA" font-family="Georgia,serif" font-size="22" text-anchor="middle">x</text><text x="1116" y="441" fill="#F2F5FA" font-family="Georgia,serif" font-size="22" text-anchor="middle">y</text><text x="1055" y="557" fill="#F1BD75" font-family="Georgia,serif" font-size="22" text-anchor="middle">U ∩ V = ∅ is possible</text><rect x="125" y="644" width="1030" height="60" rx="16" fill="#263449" stroke="#F1BD75" stroke-width="2.5"/><text x="640" y="682" fill="#F2F5FA" font-family="Georgia,serif" font-size="29" text-anchor="middle">Hausdorff (T₂) ⇒ T₁ ⇒ T₀; both converses fail.</text></svg>