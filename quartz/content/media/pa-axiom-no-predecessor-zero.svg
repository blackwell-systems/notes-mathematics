<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc">
<title id="title">3  ·  Zero is not a successor</title>
<desc id="desc">A successor chain starts from zero, and no arrow into zero is permitted. Every arrow originates at a natural number and ends at a nonzero successor.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 7 L7 3.5 Z" fill="#87B8EE"/></marker></defs>
<rect width="800" height="360" fill="#101A2C"/>
<text x="40" y="52" text-anchor="start" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="750">3  ·  Zero is not a successor</text>
<text x="40" y="87" text-anchor="start" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500">The successor function never takes the value zero.</text>
<path d="M40 108 H760" stroke="#45576F" stroke-width="2"/>

<rect x="48" y="133" width="704" height="170" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2"/>
<text x="194" y="168" text-anchor="middle" fill="#EDB86D" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">No incoming arrow</text>
<path d="M140 187 V260" stroke="#EDB86D" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="211" cy="226" r="37" fill="#223349" stroke="#EDB86D" stroke-width="3"/><text x="211" y="236" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">0</text>
<circle cx="369" cy="226" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="369" y="236" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">1</text>
<circle cx="527" cy="226" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="527" y="236" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">2</text>
<circle cx="685" cy="226" r="33" fill="#223349" stroke="#66C4B4" stroke-width="3"/><text x="685" y="236" text-anchor="middle" fill="#F4F3ED" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600">3</text>
<line x1="250" y1="226" x2="333" y2="226" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="408" y1="226" x2="491" y2="226" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="566" y1="226" x2="649" y2="226" stroke="#87B8EE" stroke-width="3.3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="400" y="288" text-anchor="middle" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600">For every n ∈ N, S(n) ≠ 0</text>

<text x="40" y="343" text-anchor="start" fill="#C4CEDA" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text>
</svg>
