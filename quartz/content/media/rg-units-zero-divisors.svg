<svg xmlns="http://www.w3.org/2000/svg" width="800" height="558" viewBox="0 0 800 558" role="img" aria-labelledby="title desc"><title id="title">Units and zero divisors</title><desc id="desc">Residues 1 and 5 are units in Z modulo 6; 2, 3 and 4 are nonzero zero divisors, while 0 is not a unit. Two times three is zero, five squared equals one.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="558" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Units and zero divisors</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">The six residues of Z/6 under multiplication.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="50" y="152" width="231" height="120" rx="16" fill="#19283A" stroke="#C4CEDA" stroke-width="2"/><text x="93" y="225" fill="#C4CEDA" font-size="44" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><text x="155" y="222" fill="#F4F3ED" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">not a unit</text><rect x="303" y="152" width="231" height="120" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="346" y="225" fill="#66C4B4" font-size="44" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="408" y="222" fill="#F4F3ED" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">unit</text><rect x="556" y="152" width="231" height="120" rx="16" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="599" y="225" fill="#EDB86D" font-size="44" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><text x="661" y="222" fill="#F4F3ED" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">zero divisor</text><rect x="50" y="301" width="231" height="120" rx="16" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="93" y="374" fill="#EDB86D" font-size="44" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3</text><text x="155" y="371" fill="#F4F3ED" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">zero divisor</text><rect x="303" y="301" width="231" height="120" rx="16" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="346" y="374" fill="#EDB86D" font-size="44" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4</text><text x="408" y="371" fill="#F4F3ED" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">zero divisor</text><rect x="556" y="301" width="231" height="120" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="599" y="374" fill="#66C4B4" font-size="44" font-weight="800" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">5</text><text x="661" y="371" fill="#F4F3ED" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">unit</text><text x="400" y="509" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2 × 3 = 0 (mod 6)      5 × 5 = 1 (mod 6)</text><text x="40" y="540" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>