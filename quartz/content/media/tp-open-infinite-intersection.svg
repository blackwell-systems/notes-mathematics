<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Why topologies require only finite intersections</title><desc id="desc">Four nested open intervals around zero, each open, shrink to the singleton {0}, which is not open in the usual topology on real numbers.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><line x1="54" y1="91" x2="1226" y2="91" stroke="#506885" stroke-width="2"/><text x="640" y="61" fill="#F2F4F9" font-size="39" font-family="Georgia,serif" text-anchor="middle">Why topologies require only finite intersections</text><text x="640" y="122" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">Nested open intervals shrink toward a singleton that is not open.</text><rect x="45" y="165" width="810" height="475" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><rect x="883" y="165" width="350" height="475" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><line x1="120" y1="226" x2="770" y2="226" stroke="#506885" stroke-width="1.5" /><line x1="165" y1="226" x2="715" y2="226" stroke="#97C8F4" stroke-width="7" /><circle cx="165" cy="226" r="10" fill="#0C1E30" stroke="#97C8F4" stroke-width="4"/><circle cx="715" cy="226" r="10" fill="#0C1E30" stroke="#97C8F4" stroke-width="4"/><text x="140" y="212" fill="#97C8F4" font-size="24" font-family="Georgia,serif" text-anchor="start">U₁</text><line x1="120" y1="314" x2="770" y2="314" stroke="#506885" stroke-width="1.5" /><line x1="269.5" y1="314" x2="610.5" y2="314" stroke="#CAA8F0" stroke-width="7" /><circle cx="269.5" cy="314" r="10" fill="#0C1E30" stroke="#CAA8F0" stroke-width="4"/><circle cx="610.5" cy="314" r="10" fill="#0C1E30" stroke="#CAA8F0" stroke-width="4"/><text x="140" y="300" fill="#CAA8F0" font-size="24" font-family="Georgia,serif" text-anchor="start">U₂</text><line x1="120" y1="402" x2="770" y2="402" stroke="#506885" stroke-width="1.5" /><line x1="332.75" y1="402" x2="547.25" y2="402" stroke="#7DD9C9" stroke-width="7" /><circle cx="332.75" cy="402" r="10" fill="#0C1E30" stroke="#7DD9C9" stroke-width="4"/><circle cx="547.25" cy="402" r="10" fill="#0C1E30" stroke="#7DD9C9" stroke-width="4"/><text x="140" y="388" fill="#7DD9C9" font-size="24" font-family="Georgia,serif" text-anchor="start">U₃</text><line x1="120" y1="490" x2="770" y2="490" stroke="#506885" stroke-width="1.5" /><line x1="374" y1="490" x2="506" y2="490" stroke="#F2BC75" stroke-width="7" /><circle cx="374" cy="490" r="10" fill="#0C1E30" stroke="#F2BC75" stroke-width="4"/><circle cx="506" cy="490" r="10" fill="#0C1E30" stroke="#F2BC75" stroke-width="4"/><text x="140" y="476" fill="#F2BC75" font-size="24" font-family="Georgia,serif" text-anchor="start">U₄</text><line x1="440" y1="189" x2="440" y2="562" stroke="#F3A3B3" stroke-width="2" stroke-dasharray='6 6'/><text x="440" y="593" fill="#F2BC75" font-size="25" font-family="Georgia,serif" text-anchor="middle">0</text><text x="1047" y="276" fill="#7DD9C9" font-size="32" font-family="Georgia,serif" text-anchor="middle">Every Uₙ</text><text x="1047" y="315" fill="#7DD9C9" font-size="30" font-family="Georgia,serif" text-anchor="middle">is open</text><text x="1047" y="393" fill="#F2BC75" font-size="30" font-family="Georgia,serif" text-anchor="middle">⋂ Uₙ = {0}</text><text x="1047" y="459" fill="#F3A3B3" font-size="26" font-family="Georgia,serif" text-anchor="middle">{0} is NOT</text><text x="1047" y="494" fill="#F3A3B3" font-size="26" font-family="Georgia,serif" text-anchor="middle">open in ℝ</text><text x="640" y="684" fill="#C2D0E0" font-size="24" font-family="Georgia,serif" text-anchor="middle">Finite intersections remain open; an infinite intersection need not.</text></svg>