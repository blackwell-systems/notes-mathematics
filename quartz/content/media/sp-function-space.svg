<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">Same function set, different norms</title><desc id="desc">Triangular continuous spike functions f sub n of t equals maximum of 1 minus n t and zero are drawn for n equals two, four and eight. Every spike has height one, so its supremum norm is always one; its triangular area, the L1 norm, is one over two n and shrinks. These illustrate different norms on the same continuous function space.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">Same function set, different norms</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><rect x="44" y="109" width="773" height="516" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="840" y="109" width="431" height="516" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="73" y="155" font-family="Arial,sans-serif" font-size="25" fill="#F1F5FC" font-weight="normal" text-anchor="start">fₙ(t) = max(1 - nt, 0)</text><line x1="118" y1="512" x2="708" y2="512" stroke="#B9CFE0" stroke-width="3"  stroke-linecap="round"/><line x1="118" y1="512" x2="118" y2="194" stroke="#B9CFE0" stroke-width="3"  stroke-linecap="round"/><text x="99" y="249" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="end">1</text><text x="118" y="550" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="middle">0</text><text x="708" y="550" font-family="Arial,sans-serif" font-size="18" fill="#F1F5FC" font-weight="normal" text-anchor="middle">1</text><path d="M118 235 L413 512 L708 512" stroke="#94C2F2" stroke-width="5" fill="none"/><text x="427" y="494" font-family="Arial,sans-serif" font-size="18" fill="#94C2F2" font-weight="normal" text-anchor="start">n=2</text><path d="M118 235 L265.5 512 L708 512" stroke="#C7B0F3" stroke-width="4" fill="none"/><text x="279.5" y="474" font-family="Arial,sans-serif" font-size="18" fill="#C7B0F3" font-weight="normal" text-anchor="start">n=4</text><path d="M118 235 L191.75 512 L708 512" stroke="#F4BF77" stroke-width="3" fill="none"/><text x="205.75" y="454" font-family="Arial,sans-serif" font-size="18" fill="#F4BF77" font-weight="normal" text-anchor="start">n=8</text><text x="869" y="164" font-family="Arial,sans-serif" font-size="22" fill="#F1F5FC" font-weight="normal" text-anchor="start">Two norms on the same functions</text><text x="869" y="232" font-family="Arial,sans-serif" font-size="22" fill="#B9CFE0" font-weight="normal" text-anchor="start">Worst-case error:</text><text x="869" y="275" font-family="Arial,sans-serif" font-size="29" fill="#F4BF77" font-weight="bold" text-anchor="start">||fₙ||∞ = 1</text><text x="869" y="361" font-family="Arial,sans-serif" font-size="22" fill="#B9CFE0" font-weight="normal" text-anchor="start">Integral error:</text><text x="869" y="402" font-family="Arial,sans-serif" font-size="25" fill="#79D7C2" font-weight="bold" text-anchor="start">||fₙ||₁ = 1/(2n)</text><text x="869" y="486" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="normal" text-anchor="start">n grows → area shrinks</text><text x="659" y="670" font-family="Arial,sans-serif" font-size="21" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Same continuous functions; different notions of convergence and completeness.</text></svg>