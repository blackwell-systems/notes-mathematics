<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc"><title id="title">Construct addition from successor</title><desc id="desc">Recursion laws a+0=a and a+S(n)=S(a+n). Example 3+2=S(S(3))=5, showing addition follows successor rather than being a primitive axiom.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="560" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Construct addition from successor</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">No prior natural-number addition is assumed.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><text x="400" y="166" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="29" font-weight="740">Addition is defined recursively</text><rect x="78" y="197" width="645" height="84" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="335" y="250" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="550">a + 0 = a</text><text x="675" y="247" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="23" font-weight="550">Base</text><rect x="78" y="308" width="645" height="84" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="335" y="361" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="550">a + S(n) = S(a + n)</text><text x="675" y="358" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="23" font-weight="550">Step</text><rect x="125" y="451" width="550" height="56" rx="14" fill="#223349" stroke="#87B8EE" stroke-width="2"/><text x="400" y="486" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="700">3 + 2 = S(S(3)) = 5</text><text x="40" y="543" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>