<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Two integration orders for the same triangle</title><desc id="desc">The triangle with corners (0,0), (2,0), (2,2) is shown with vertical slices of y from zero to x and horizontal slices with x from y to two.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Two integration orders for the same triangle</text><text x="640" y="102" font-family="Georgia,serif" font-size="22" fill="#C7D4E1" text-anchor="middle">Redraw the slice when you exchange the order of integration.</text><line x1="42" y1="126" x2="1238" y2="126" stroke="#4C6A82" stroke-width="2"/><rect x="39" y="152" width="573" height="472" rx="18" stroke="#7DD9C9" stroke-width="2.5" fill="#173147"/><rect x="667" y="152" width="573" height="472" rx="18" stroke="#C6A5ED" stroke-width="2.5" fill="#173147"/><text x="325" y="204" font-family="Georgia,serif" font-size="27" fill="#7DD9C9" text-anchor="middle">Type I: vertical slices</text><polygon points="173,513 477,513 477,253" fill="#2D6664" fill-opacity=".7" stroke="#7DD9C9" stroke-width="3"/><rect x="342" y="360.7631578947369" width="18" height="152.23684210526312" fill="#F1BD75" fill-opacity=".85"/><text x="325" y="575" font-family="Georgia,serif" font-size="22" fill="#F2F5FB" text-anchor="middle">0 ≤ y ≤ x; 0 ≤ x ≤ 2</text><text x="953" y="204" font-family="Georgia,serif" font-size="27" fill="#C6A5ED" text-anchor="middle">Type II: horizontal slices</text><polygon points="801,513 1105,513 1105,253" fill="#554574" fill-opacity=".7" stroke="#C6A5ED" stroke-width="3"/><rect x="962.3538461538461" y="366" width="142.64615384615388" height="18" fill="#F1BD75" fill-opacity=".85"/><text x="953" y="575" font-family="Georgia,serif" font-size="22" fill="#F2F5FB" text-anchor="middle">y ≤ x ≤ 2; 0 ≤ y ≤ 2</text><rect x="112" y="644" width="1056" height="58" rx="18" stroke="#F1BD75" stroke-width="2.5" fill="#173147"/><text x="640" y="682" font-family="Georgia,serif" font-size="25" fill="#F2F5FB" text-anchor="middle">Same triangular region, area 2, described two ways.</text></svg>