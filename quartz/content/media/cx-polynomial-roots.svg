<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 543" width="800" height="543" role="img" aria-labelledby="title desc"><title id="title">Roots require the right field</title><desc id="desc">Polynomial x squared plus one has no root over the real numbers, and roots plus i and minus i in the complex numbers. The choice of coefficient field matters.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="543" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Roots require the right field</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">x² + 1 has no real roots but has two complex roots.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="55" y="163" width="224" height="250" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="167" y="215" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="19" font-weight="770">POLYNOMIAL</text><text x="167" y="323" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="700">x² + 1</text><rect x="305" y="163" width="224" height="250" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="417" y="215" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="19" font-weight="770">REAL ROOTS</text><text x="417" y="323" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="700">none</text><rect x="555" y="163" width="224" height="250" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="667" y="215" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="19" font-weight="770">COMPLEX ROOTS</text><text x="667" y="323" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="30" font-weight="700">+i  and  −i</text><text x="400" y="490" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="23" font-weight="550">A field extension supplies roots not in R.</text><text x="40" y="526" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>