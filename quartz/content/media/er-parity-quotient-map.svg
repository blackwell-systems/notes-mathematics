<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Quotient map for parity on four numbers</title>
  <desc id="desc">The four inputs one, three, two and four are mapped by q to two equivalence classes: one and three both reach the odd class consisting of one and three; two and four both reach the even class consisting of two and four. The quotient is surjective but not injective.</desc>
  <defs>
    <marker id="oddArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#80DFD2"/></marker>
    <marker id="evenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#C9A6EF"/></marker>
  </defs>
  <style>
    text {font-family: Arial, Helvetica, sans-serif;}
    .headline {font-size:39px;font-weight:760;}
    .subtitle {font-size:23px;font-weight:500;}
    .section {font-size:20px;font-weight:730;letter-spacing:.055em;}
    .element {font-size:31px;font-weight:740;fill:#F4F3ED;}
    .class {font-size:31px;font-weight:730;fill:#F4F3ED;}
    .class-label {font-size:19px;font-weight:720;}
    .footer {font-size:21px;font-weight:500;}
  </style>
  <rect width="1200" height="590" fill="#101A2C"/>
  <text x="40" y="59" fill="#F4F3ED" class="headline">The quotient forgets the representative</text>
  <text x="40" y="98" fill="#C4CEDA" class="subtitle">Different original numbers can become the same output object.</text>
  <line x1="40" x2="1160" y1="118" y2="118" stroke="#45576F" stroke-width="2"/>
  <rect x="40" y="149" width="330" height="367" rx="16" fill="#1C2949" stroke="#45576F" stroke-width="2"/>
  <rect x="752" y="149" width="408" height="367" rx="16" fill="#1C2949" stroke="#45576F" stroke-width="2"/>
  <text x="67" y="184" fill="#C4CEDA" class="section">INPUT  A = {1, 2, 3, 4}</text>
  <text x="777" y="184" fill="#C4CEDA" class="section">OUTPUT  A / ∼</text>
  <path d="M232 235 C400 235, 551 265, 740 265" fill="none" stroke="#80DFD2" stroke-width="3.3" marker-end="url(#oddArrow)"/>
  <path d="M232 302 C400 302, 551 265, 740 265" fill="none" stroke="#80DFD2" stroke-width="3.3" marker-end="url(#oddArrow)"/>
  <path d="M232 390 C400 390, 551 413, 740 413" fill="none" stroke="#C9A6EF" stroke-width="3.3" marker-end="url(#evenArrow)"/>
  <path d="M232 457 C400 457, 551 413, 740 413" fill="none" stroke="#C9A6EF" stroke-width="3.3" marker-end="url(#evenArrow)"/>

  <circle cx="196" cy="235" r="30" fill="#243850" stroke="#80DFD2" stroke-width="3"/><text x="196" y="245" text-anchor="middle" class="element">1</text>
  <circle cx="196" cy="302" r="30" fill="#243850" stroke="#80DFD2" stroke-width="3"/><text x="196" y="312" text-anchor="middle" class="element">3</text>
  <circle cx="196" cy="390" r="30" fill="#243850" stroke="#C9A6EF" stroke-width="3"/><text x="196" y="400" text-anchor="middle" class="element">2</text>
  <circle cx="196" cy="457" r="30" fill="#243850" stroke="#C9A6EF" stroke-width="3"/><text x="196" y="467" text-anchor="middle" class="element">4</text>

  <rect x="776" y="219" width="360" height="91" rx="12" fill="#243850" stroke="#80DFD2" stroke-width="3"/>
  <text x="956" y="249" text-anchor="middle" class="class-label" fill="#80DFD2">ODD CLASS</text>
  <text x="956" y="287" text-anchor="middle" class="class">[1] = [3] = {1, 3}</text>
  <rect x="776" y="367" width="360" height="91" rx="12" fill="#243850" stroke="#C9A6EF" stroke-width="3"/>
  <text x="956" y="398" text-anchor="middle" class="class-label" fill="#C9A6EF">EVEN CLASS</text>
  <text x="956" y="435" text-anchor="middle" class="class">[2] = [4] = {2, 4}</text>
  <text x="40" y="556" fill="#C4CEDA" class="footer">Every class is reached; different inputs may reach the same class.</text>
  <text x="40" y="580" fill="#C4CEDA" font-size="15" font-weight="700">QUOTIENT MAP / SURJECTIVE / NOT INJECTIVE</text>
</svg>