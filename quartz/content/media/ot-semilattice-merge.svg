<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 805" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Join-semilattice state merge</title>
<desc id="dsc">Two replicas possess sets {a} and {b}, and their merge is the least upper bound {a,b}, or union. The subset order shows a diamond from empty to two singleton states and the merged state. Commutativity, associativity and idempotence make repeated and reordered pairwise merges agree, assuming replica states are delivered and combined using the join.</desc>
<rect width="1460" height="805" fill="#0e1424"/>
<text x="730" y="70" font-size="51" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">Join-semilattices and state merge</text>
<text x="730" y="111" font-size="23" fill="#c7d2e3" text-anchor="middle" font-family="Georgia,serif">Join merges information without deleting either replica’s facts</text>
<rect x="32" y="154" width="410" height="520" rx="16" fill="#142236" stroke="#65c6be" stroke-width="3"/>
<rect x="462" y="154" width="555" height="520" rx="16" fill="#142236" stroke="#e4bd76" stroke-width="3"/>
<rect x="1037" y="154" width="391" height="520" rx="16" fill="#142236" stroke="#ae95df" stroke-width="3"/>
<text x="237" y="205" font-size="34" fill="#e7d9ba" text-anchor="middle" font-family="Georgia,serif">Information order</text>
<text x="237" y="248" font-size="23" fill="#cbd5e3" text-anchor="middle" font-family="Georgia,serif">A ⊆ B means B contains</text>
<text x="237" y="280" font-size="23" fill="#cbd5e3" text-anchor="middle" font-family="Georgia,serif">at least A’s information</text>
<line x1="238" y1="384" x2="142" y2="467" stroke="#e8c681" stroke-width="4" stroke-linecap="round"/><line x1="238" y1="384" x2="334" y2="467" stroke="#e8c681" stroke-width="4" stroke-linecap="round"/><line x1="142" y1="506" x2="238" y2="581" stroke="#e8c681" stroke-width="4" stroke-linecap="round"/><line x1="334" y1="506" x2="238" y2="581" stroke="#e8c681" stroke-width="4" stroke-linecap="round"/>
<rect x="185" y="327" width="106" height="60" rx="26" fill="#2b253f" stroke="#a4cde2" stroke-width="3"/><text x="238" y="365" font-size="27" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">{a,b}</text><rect x="89" y="460" width="106" height="60" rx="26" fill="#2b253f" stroke="#a4cde2" stroke-width="3"/><text x="142" y="498" font-size="27" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">{a}</text><rect x="281" y="460" width="106" height="60" rx="26" fill="#2b253f" stroke="#a4cde2" stroke-width="3"/><text x="334" y="498" font-size="27" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">{b}</text><rect x="185" y="575" width="106" height="60" rx="26" fill="#2b253f" stroke="#a4cde2" stroke-width="3"/><text x="238" y="613" font-size="27" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">∅</text>
<text x="238" y="651" font-size="20" fill="#80dcca" text-anchor="middle" font-family="Georgia,serif">Greater = more information</text>
<text x="740" y="205" font-size="33" fill="#e7d9ba" text-anchor="middle" font-family="Georgia,serif">Two replicas, one merged state</text>
<rect x="514" y="251" width="214" height="100" rx="16" fill="#24233e" stroke="#b799df" stroke-width="3"/>
<rect x="752" y="251" width="214" height="100" rx="16" fill="#24233e" stroke="#b799df" stroke-width="3"/>
<text x="621" y="290" font-size="25" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">Replica 1</text>
<text x="621" y="328" font-size="34" fill="#94ded4" text-anchor="middle" font-family="Georgia,serif">{a}</text>
<text x="859" y="290" font-size="25" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">Replica 2</text>
<text x="859" y="328" font-size="34" fill="#94ded4" text-anchor="middle" font-family="Georgia,serif">{b}</text>
<path d="M621 351 V403 H740 M859 351 V403 H740 V452" fill="none" stroke="#7ed2c8" stroke-width="4"/>
<rect x="647" y="452" width="186" height="67" rx="16" fill="#3b2d31" stroke="#e4bd76" stroke-width="3"/>
<text x="740" y="493" font-size="26" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">join = union</text>
<path d="M740 519 V554" stroke="#e4bd76" stroke-width="4"/>
<rect x="593" y="554" width="294" height="79" rx="16" fill="#203e3b" stroke="#7dd6c8" stroke-width="3"/>
<text x="740" y="603" font-size="39" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">{a,b}</text>
<text x="740" y="654" font-size="21" fill="#e7c689" text-anchor="middle" font-family="Georgia,serif">Least upper bound</text>
<text x="1232" y="205" font-size="33" fill="#e7d9ba" text-anchor="middle" font-family="Georgia,serif">Why merge is stable</text>
<rect x="1062" y="260" width="341" height="90" rx="16" fill="#26243d" stroke="#b799df" stroke-width="3"/>
<text x="1232" y="291" font-size="26" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">Commutative</text>
<text x="1232" y="326" font-size="24" fill="#edd4a0" text-anchor="middle" font-family="Georgia,serif">x ∨ y = y ∨ x</text>
<rect x="1062" y="375" width="341" height="98" rx="16" fill="#26243d" stroke="#b799df" stroke-width="3"/>
<text x="1232" y="405" font-size="26" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">Associative</text>
<text x="1232" y="442" font-size="23" fill="#edd4a0" text-anchor="middle" font-family="Georgia,serif">(x ∨ y) ∨ z</text>
<text x="1232" y="467" font-size="23" fill="#edd4a0" text-anchor="middle" font-family="Georgia,serif">= x ∨ (y ∨ z)</text>
<rect x="1062" y="498" width="341" height="90" rx="16" fill="#26243d" stroke="#b799df" stroke-width="3"/>
<text x="1232" y="530" font-size="26" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">Idempotent</text>
<text x="1232" y="566" font-size="24" fill="#edd4a0" text-anchor="middle" font-family="Georgia,serif">x ∨ x = x</text>
<text x="1232" y="647" font-size="18" fill="#bac9d8" text-anchor="middle" font-family="Georgia,serif">Order, grouping, and duplicates</text>
<rect x="40" y="708" width="1380" height="64" rx="16" fill="#2a283d" stroke="#e5bd76" stroke-width="3"/>
<text x="730" y="749" font-size="26" fill="#f6f0e7" text-anchor="middle" font-family="Georgia,serif">The laws make merging order-independent; reliable delivery is a separate system requirement.</text>
</svg>