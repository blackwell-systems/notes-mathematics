<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Different invariants detect different holes</title><desc id="desc">Panels compare a disk, circle, sphere, torus and their first fundamental groups and second homology groups, showing that the sphere has trivial pi-one but second homology Z.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F0BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><path d="M42 42 H146 M1134 42 H1238" stroke="#F0BD75" stroke-width="3"/><text x="640" y="62" font-family="Georgia,serif" font-size="37" fill="#F4F2EF" text-anchor="middle" font-weight="700">Different invariants detect different holes</text><text x="640" y="105" font-family="Georgia,serif" font-size="22" fill="#C3D0E0" text-anchor="middle" font-weight="400">A simply connected sphere can still carry a nontrivial two-dimensional cycle.</text><rect x="67" y="154" width="290" height="398" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="91" y="197" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">Disk D²</text><line x1="89" y1="213" x2="335" y2="213" stroke="#4C6685" stroke-width="1.5" /><circle cx="168" cy="345" r="78" fill="#245255" stroke="#7DD9C9" stroke-width="4"/><circle cx="168" cy="345" r="21" fill="none" stroke="#F0BD75" stroke-width="4"/><path d="M189 345 A21 21 0 1 0 157 327" fill="none" stroke="#F0BD75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="168" y="501" font-family="Georgia,serif" font-size="20" fill="#F4F2EF" text-anchor="middle" font-weight="400">π₁ = 0    H₂ = 0</text><rect x="381" y="154" width="290" height="398" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="405" y="197" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">Circle S¹</text><line x1="403" y1="213" x2="649" y2="213" stroke="#4C6685" stroke-width="1.5" /><circle cx="482" cy="345" r="78" fill="none" stroke="#7DD9C9" stroke-width="8"/><circle cx="559" cy="345" r="7" fill="#F0BD75" stroke="#F0BD75" stroke-width="4"/><path d="M534 290 Q497 258 470 268" fill="none" stroke="#F0BD75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="482" y="501" font-family="Georgia,serif" font-size="20" fill="#F4F2EF" text-anchor="middle" font-weight="400">π₁ ≅ ℤ    H₂ = 0</text><rect x="695" y="154" width="290" height="398" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="719" y="197" font-family="Georgia,serif" font-size="26" fill="#7DD9C9" text-anchor="start" font-weight="700">Sphere S²</text><line x1="717" y1="213" x2="963" y2="213" stroke="#4C6685" stroke-width="1.5" /><circle cx="796" cy="345" r="78" fill="#234660" stroke="#7DD9C9" stroke-width="3"/><ellipse cx="796" cy="345" rx="26" ry="78" fill="none" stroke="#9AC4F3" stroke-width="2"/><ellipse cx="796" cy="345" rx="78" ry="22" fill="none" stroke="#9AC4F3" stroke-width="2"/><text x="796" y="501" font-family="Georgia,serif" font-size="20" fill="#F4F2EF" text-anchor="middle" font-weight="400">π₁ = 0    H₂ ≅ ℤ</text><rect x="1009" y="154" width="290" height="398" rx="16" fill="#172C46" stroke="#4C6685" stroke-width="2.5"/><text x="1033" y="197" font-family="Georgia,serif" font-size="26" fill="#C9A8F2" text-anchor="start" font-weight="700">Torus T²</text><line x1="1031" y1="213" x2="1277" y2="213" stroke="#4C6685" stroke-width="1.5" /><ellipse cx="1110" cy="348" rx="96" ry="74" fill="#24435B" stroke="#7DD9C9" stroke-width="3"/><ellipse cx="1110" cy="348" rx="49" ry="33" fill="#0C1E30" stroke="#C9A8F2" stroke-width="5"/><ellipse cx="1110" cy="320" rx="91" ry="43" fill="none" stroke="#9AC4F3" stroke-width="2"/><text x="1110" y="501" font-family="Georgia,serif" font-size="20" fill="#F4F2EF" text-anchor="middle" font-weight="400">π₁ ≅ ℤ²    H₂ ≅ ℤ</text><rect x="70" y="587" width="1140" height="102" rx="14" fill="#253349" stroke="#F0BD75" stroke-width="2.5"/><text x="640" y="627" font-family="Georgia,serif" font-size="25" fill="#F4F2EF" text-anchor="middle" font-weight="400">π₁ detects loop classes; H₂ records two-dimensional cycles.</text><text x="640" y="661" font-family="Georgia,serif" font-size="23" fill="#F0BD75" text-anchor="middle" font-weight="400">A sphere has trivial π₁ but nontrivial H₂.</text></svg>