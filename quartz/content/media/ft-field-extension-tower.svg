<svg xmlns="http://www.w3.org/2000/svg" width="800" height="586" viewBox="0 0 800 586" role="img" aria-labelledby="title desc"><title id="title">A field extension tower</title><desc id="desc">Tower of Q, Q(sqrt2), Q(sqrt2,i) with successive degrees 2 and 2, so total degree 4 by the tower law.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="586" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">A field extension tower</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Each field is a vector space over the one below it.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="170" y="151" width="460" height="85" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="400" y="188" fill="#66C4B4" font-size="29" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">K = Q</text><text x="400" y="220" fill="#C4CEDA" font-size="19" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">base field</text><line x1="400" y1="237" x2="400" y2="268" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="170" y="276" width="460" height="85" rx="16" fill="#19283A" stroke="#87B8EE" stroke-width="2"/><text x="400" y="313" fill="#87B8EE" font-size="29" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">E = Q(√2)</text><text x="400" y="345" fill="#C4CEDA" font-size="19" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">degree [E:K] = 2</text><line x1="400" y1="362" x2="400" y2="393" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="170" y="401" width="460" height="85" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="400" y="438" fill="#BCA8EC" font-size="29" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">L = Q(√2, i)</text><text x="400" y="470" fill="#C4CEDA" font-size="19" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">degree [L:E] = 2</text><text x="400" y="541" fill="#EDB86D" font-size="25" font-weight="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Tower law: [L:K] = 2 × 2 = 4</text><text x="40" y="568" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>