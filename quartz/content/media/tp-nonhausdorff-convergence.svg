<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">One sequence can converge to three points</title><desc id="desc">The constant sequence a,a,a,... belongs to every neighborhood of a, b, and c in the topology {empty,{a},{a,b},X}, so it converges to all three points.</desc><rect width="1280" height="720" rx="18" fill="#0C1E30"/><line x1="54" y1="91" x2="1226" y2="91" stroke="#506885" stroke-width="2"/><text x="640" y="61" fill="#F2F4F9" font-size="39" font-family="Georgia,serif" text-anchor="middle">One sequence can converge to three points</text><text x="640" y="122" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">In a non-Hausdorff topology, every neighborhood of a limit need only contain the sequence eventually.</text><rect x="180" y="180" width="320" height="426" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><text x="340" y="234" fill="#7DD9C9" font-size="31" font-family="Georgia,serif" text-anchor="middle">Limit a</text><text x="340" y="290" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">Open neighborhood:</text><text x="340" y="342" fill="#F2F4F9" font-size="27" font-family="Georgia,serif" text-anchor="middle">{a}</text><ellipse cx="340" cy="434" rx="64" ry="59" fill="#213D50" stroke="#7DD9C9" stroke-width="3"/><circle cx="340" cy="434" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><text x="340" y="517" fill="#F2BC75" font-size="27" font-family="Georgia,serif" text-anchor="middle">a, a, a, a, ...</text><rect x="535" y="180" width="320" height="426" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><text x="695" y="234" fill="#CAA8F0" font-size="31" font-family="Georgia,serif" text-anchor="middle">Limit b</text><text x="695" y="290" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">Open neighborhood:</text><text x="695" y="342" fill="#F2F4F9" font-size="27" font-family="Georgia,serif" text-anchor="middle">{a,b}</text><ellipse cx="695" cy="434" rx="88" ry="59" fill="#213D50" stroke="#CAA8F0" stroke-width="3"/><circle cx="695" cy="434" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><text x="695" y="517" fill="#F2BC75" font-size="27" font-family="Georgia,serif" text-anchor="middle">a, a, a, a, ...</text><rect x="890" y="180" width="320" height="426" rx="18" fill="#192D46" stroke="#506885" stroke-width="2.5"/><text x="1050" y="234" fill="#F2BC75" font-size="31" font-family="Georgia,serif" text-anchor="middle">Limit c</text><text x="1050" y="290" fill="#C2D0E0" font-size="22" font-family="Georgia,serif" text-anchor="middle">Open neighborhood:</text><text x="1050" y="342" fill="#F2F4F9" font-size="27" font-family="Georgia,serif" text-anchor="middle">X = {a,b,c}</text><ellipse cx="1050" cy="434" rx="160" ry="59" fill="#213D50" stroke="#F2BC75" stroke-width="3"/><circle cx="1050" cy="434" r="10" fill="#F2BC75" stroke="#F2BC75" stroke-width="4"/><text x="1050" y="517" fill="#F2BC75" font-size="27" font-family="Georgia,serif" text-anchor="middle">a, a, a, a, ...</text><text x="640" y="651" fill="#F2F4F9" font-size="24" font-family="Georgia,serif" text-anchor="middle">Every open neighborhood of each proposed limit contains a.</text><text x="640" y="689" fill="#F3A3B3" font-size="22" font-family="Georgia,serif" text-anchor="middle">Without Hausdorff separation, sequence limits need not be unique.</text></svg>