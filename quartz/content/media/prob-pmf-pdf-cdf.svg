<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">PMF, PDF and CDF describe different aspects of distributions</title><desc id="desc">Three charts. The PMF gives masses one eighth, three eighths, three eighths, one eighth for 0 through 3 heads in three fair flips. The PDF chart depicts continuous density and shaded interval probability. The CDF chart shows increasing cumulative probability, which is defined for both discrete and continuous variables.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="46" y="60" font-family="Arial,Helvetica,sans-serif" font-size="35" text-anchor="start" font-weight="bold" fill="#F2F5FC">PMF, PDF and CDF describe different aspects of distributions</text><line x1="46" y1="84" x2="1394" y2="84" stroke="#35546A" stroke-width="2" /><rect x="40" y="120" width="439" height="552" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="64" y="160" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#99BFF1">PMF: discrete</text><rect x="500" y="120" width="439" height="552" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="524" y="160" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#7DD9C9">PDF: continuous</text><rect x="960" y="120" width="440" height="552" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="984" y="160" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#C6A5ED">CDF: cumulative</text><line x1="105" y1="528" x2="408" y2="528" stroke="#B9CFE0" stroke-width="2" /><line x1="105" y1="262" x2="105" y2="528" stroke="#B9CFE0" stroke-width="2" /><line x1="105" y1="528" x2="408" y2="528" stroke="#35546A" stroke-width="1" /><text x="93" y="534" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="end" font-weight="normal" fill="#B9CFE0">0</text><