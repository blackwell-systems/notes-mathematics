<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Partition into three nonempty disjoint blocks</title>
<desc id="desc">Dark outline of S equals the integers one through eight containing three nonoverlapping, nonempty colored blocks. B1 has 1, 2, 3; B2 has 4, 5; B3 has 6, 7, 8. The blocks together cover all S, and their intersections are empty.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#171029"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2D204B"/><stop offset="1" stop-color="#11142C"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#382651"/><stop offset="1" stop-color="#211A3B"/></linearGradient>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12" fill="#C69AFF"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/><text x="720" y="88" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="72" font-weight="bold">Partition of a Set</text><text x="720" y="147" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D8C4F5" font-size="30" font-weight="normal">Divide a set into nonempty blocks with no overlaps or omissions.</text><path d="M70 175 H1370" stroke="#9261C6" stroke-width="2"/><text x="720" y="250" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#DBC0FA" font-size="43" font-weight="bold">S = {1, 2, 3, 4, 5, 6, 7, 8}</text><rect x="107" y="286" width="1226" height="510" rx="27" fill="url(#panel)" stroke="#C397F7" stroke-width="4"/><text x="163" y="346" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="start" fill="#D5B9FC" font-size="48" font-weight="bold">S</text><rect x="168" y="401" width="365" height="288" rx="25" fill="#5B3A84" stroke="#C59BF8" stroke-width="4"/><text x="350.5" y="458" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFFFFF" font-size="47" font-weight="bold">B₁</text><text x="259.25" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">1</text><text x="350.5" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">2</text><text x="441.75" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">3</text><rect x="564" y="401" width="266" height="288" rx="25" fill="#215C60" stroke="#83DDD2" stroke-width="4"/><text x="697" y="458" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFFFFF" font-size="47" font-weight="bold">B₂</text><text x="652.6666666666666" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">4</text><text x="741.3333333333334" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">5</text><rect x="864" y="401" width="402" height="288" rx="25" fill="#694B32" stroke="#EBC48D" stroke-width="4"/><text x="1065" y="458" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFFFFF" font-size="47" font-weight="bold">B₃</text><text x="964.5" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">6</text><text x="1065" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">7</text><text x="1165.5" y="593" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="57" font-weight="bold">8</text><rect x="43" y="823" width="1354" height="137" rx="21" fill="url(#footer)" stroke="#B783EF" stroke-width="3"/><text x="720" y="881" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="43" font-weight="bold">Disjoint blocks. No missing elements.</text><text x="720" y="926" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E1CFF4" font-size="27" font-weight="normal">B₁ ∪ B₂ ∪ B₃ = S, and Bᵢ ∩ Bⱼ = ∅ whenever i ≠ j.</text></svg>