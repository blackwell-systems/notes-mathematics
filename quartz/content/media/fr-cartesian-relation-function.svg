<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="875" viewBox="0 0 1600 875" role="img" aria-labelledby="title desc">
<title id="title">From Cartesian product to relation to function</title>
<desc id="desc">Three aligned three-by-three grids use columns 1, 2, 3 from A and rows x, y, z from B. The first grid shows all nine ordered pairs in A times B. The relation grid selects (1,y), (1,z), (2,x), (3,z). The function grid selects exactly one pair for each input: (1,y), (2,x), (3,z). Bright dots indicate selected pairs; dim dots indicate other possible pairs.</desc>
<rect width="1600" height="875" fill="#0E1728"/>
<text x="800" y="79" fill="#F5F2E9" font-size="52" font-weight="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">From Cartesian product to relation to function</text>
<path d="M54 108 H1546" stroke="#5C7090" stroke-width="1.5" opacity=".65"/>
