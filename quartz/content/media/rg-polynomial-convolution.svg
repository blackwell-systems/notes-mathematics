<svg xmlns="http://www.w3.org/2000/svg" width="800" height="577" viewBox="0 0 800 577" role="img" aria-labelledby="title desc"><title id="title">Polynomial multiplication</title><desc id="desc">Polynomial product (1+2x)(3+x) collects coefficients: constant 3, linear 1+6=7x, quadratic 2x squared, giving 3+7x+2x squared.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="577" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Polynomial multiplication</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Collect coefficients by total exponent.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="82" y="140" width="638" height="356" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="400" y="190" fill="#F4F3ED" font-size="34" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">(1 + 2x)(3 + x)</text><rect x="106" y="232" width="591" height="68" rx="7" fill="#223349" stroke="#66C4B4" stroke-width="2"/><text x="137" y="274" fill="#66C4B4" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">constant</text><text x="335" y="274" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1 × 3</text><text x="648" y="274" fill="#66C4B4" font-size="28" font-weight="740" text-anchor="end" font-family="Arial,Helvetica,sans-serif">3</text><rect x="106" y="311" width="591" height="68" rx="7" fill="#223349" stroke="#EDB86D" stroke-width="2"/><text x="137" y="353" fill="#EDB86D" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">x term</text><text x="335" y="353" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1 × 1 + 2 × 3</text><text x="648" y="353" fill="#EDB86D" font-size="28" font-weight="740" text-anchor="end" font-family="Arial,Helvetica,sans-serif">7x</text><rect x="106" y="390" width="591" height="68" rx="7" fill="#223349" stroke="#BCA8EC" stroke-width="2"/><text x="137" y="432" fill="#BCA8EC" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">x² term</text><text x="335" y="432" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">2 × 1</text><text x="648" y="432" fill="#BCA8EC" font-size="28" font-weight="740" text-anchor="end" font-family="Arial,Helvetica,sans-serif">2x²</text><text x="400" y="526" fill="#F4F3ED" font-size="27" font-weight="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Result: 3 + 7x + 2x²</text><text x="40" y="559" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>