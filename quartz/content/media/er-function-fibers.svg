<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Fibers are groups of inputs with equal outputs</title><desc id="desc">Sample inputs minus three and three both map to nine, minus two and two map to four, and zero maps to zero under squaring. Each nonempty fiber is an equivalence class; other real inputs give additional fibers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#87B8EE" stroke-width="1.6"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#EF9292" stroke-width="1.6"/></marker></defs><rect width="1000" height="520" fill="#101A2C"/><text x="40" y="57" fill="#F4F3ED" font-size="35" font-weight="760" text-anchor="start">A function groups inputs by their outputs</text><text x="40" y="96" fill="#C4CEDA" font-size="21" font-weight="450" text-anchor="start">A finite snapshot of f(x) = x² on the real numbers.</text><line x1="40" y1="113" x2="960" y2="113" stroke="#45576F" stroke-width="2" /><rect x="36" y="140" width="420" height="324" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="562" y="140" width="402" height="324" rx="16" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="65" y="183" fill="#66C4B4" font-size="23" font-weight="760" text-anchor="start">INPUT FIBERS</text><text x="590" y="183" fill="#BCA8EC" font-size="23" font-weight="760" text-anchor="start">SHARED OUTPUTS</text><path d="M 422 234 L 735 234" fill="none" stroke="#87B8EE" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 422 328 L 735 328" fill="none" stroke="#87B8EE" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 422 414 L 735 414" fill="none" stroke="#87B8EE" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="89" y="201" width="327" height="62" rx="14" fill="#203C40" stroke="#66C4B4" stroke-width="2"/><rect x="89" y="295" width="327" height="62" rx="14" fill="#203C40" stroke="#66C4B4" stroke-width="2"/><rect x="89" y="381" width="327" height="62" rx="14" fill="#203C40" stroke="#66C4B4" stroke-width="2"/><text x="251" y="242" fill="#F4F3ED" font-size="30" font-weight="680" text-anchor="middle">−3, 3</text><text x="251" y="336" fill="#F4F3ED" font-size="30" font-weight="680" text-anchor="middle">−2, 2</text><text x="251" y="422" fill="#F4F3ED" font-size="30" font-weight="680" text-anchor="middle">0</text><circle cx="777" cy="234" r="32" fill="#BCA8EC" stroke="#101A2C" stroke-width="2"/><circle cx="777" cy="328" r="32" fill="#BCA8EC" stroke="#101A2C" stroke-width="2"/><circle cx="777" cy="414" r="32" fill="#BCA8EC" stroke="#101A2C" stroke-width="2"/><text x="777" y="244" fill="#101A2C" font-size="29" font-weight="780" text-anchor="middle">9</text><text x="777" y="338" fill="#101A2C" font-size="29" font-weight="780" text-anchor="middle">4</text><text x="777" y="424" fill="#101A2C" font-size="29" font-weight="780" text-anchor="middle">0</text><text x="823" y="242" fill="#F4F3ED" font-size="20" font-weight="570" text-anchor="start">f(x) = 9</text><text x="823" y="336" fill="#F4F3ED" font-size="20" font-weight="570" text-anchor="start">f(x) = 4</text><text x="823" y="422" fill="#F4F3ED" font-size="20" font-weight="570" text-anchor="start">f(x) = 0</text><text x="500" y="493" fill="#C4CEDA" font-size="21" font-weight="550" text-anchor="middle">Each nonempty fiber is one equivalence class of inputs.</text></svg>
