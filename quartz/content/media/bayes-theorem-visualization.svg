<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Bayes' theorem: why a positive test can be misleading</title><desc id="desc">Natural-frequency Bayes diagram using the chapter's medical test example. Of 10,000 people, 100 have the disease and 9,900 do not. With 95 percent sensitivity and a 10 percent false-positive rate, 95 true positives and 990 false positives produce 1,085 positive tests. The posterior disease probability is 95 divided by 1,085, about 8.76 percent.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="46" y="60" font-family="Arial,Helvetica,sans-serif" font-size="35" text-anchor="start" font-weight="bold" fill="#F2F5FC">Bayes' theorem: why a positive test can be misleading</text><line x1="46" y1="84" x2="1394" y2="84" stroke="#35546A" stroke-width="2" /><rect x="42" y="126" width="660" height="512" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="66" y="166" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#99BFF1">Prior: 10,000 people</text><rect x="730" y="126" width="668" height="512" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="754" y="166" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#7DD9C9">Among the positive tests</text><text x="78" y="204" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="normal" fill="#B9CFE0">Disease prevalence: 1% (100 people)</text><rect x="84" y="245" width="558" height="72" rx="9" fill="#11293C" stroke="#456783" stroke-width="2"/><rect x="84" y="245" width="5.58" height="72" rx="1" fill="#EA91A0" stroke="#EA91A0" stroke-width="0"/><text x="84" y="350" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="normal" fill="#EA91A0">100 with disease</text><text x="643" y="350" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="end" font-weight="normal" fill="#99BFF1">9,900 without disease</text><text x="78" y="410" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" font-weight="normal" fill="#F2F5FC">Sensitivity: 95% → 95 true positives</text><text x="78" y="449" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" font-weight="normal" fill="#F2F5FC">False positive rate: 10% → 990 false positives</text><text x="78" y="537" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#F0BD75">Positive tests: 95 + 990 = 1,085</text><text x="765" y="210" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#B9CFE0">A positive test is not the same as having the disease</text><rect x="765" y="259" width="590" height="90" rx="5" fill="#99BFF1" stroke="#456783" stroke-width="0"/><rect x="765" y="259" width="51.65898617511521" height="90" rx="3" fill="#F0BD75" stroke="#F0BD75" stroke-width="0"/><text x="765" y="390" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#F0BD75">95 true positives</text><text x="1355" y="390" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="end" font-weight="normal" fill="#99BFF1">990 false positives</text><text x="765" y="467" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="normal" fill="#F2F5FC">P(disease | positive) = 95 / 1,085</text><text x="765" y="526" font-family="Arial,Helvetica,sans-serif" font-size="36" text-anchor="start" font-weight="bold" fill="#7DD9C9">≈ 8.76%</text><rect x="120" y="672" width="1200" height="57" rx="11" fill="#11293C" stroke="#456783" stroke-width="2"/><text x="720" y="710" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#F0BD75">Posterior = prior × likelihood / evidence. The evidence normalizes the result.</text></svg>