<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cosine similarity compares direction, not magnitude</title><desc id="desc">Reference vector (3,0) points right; an aligned vector (2.7,1) has cosine about 0.94, a perpendicular vector (0,2.5) has cosine 0, and an opposing vector (-2,0) has cosine -1.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Cosine similarity compares direction, not magnitude</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="131" width="732" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="132" width="730" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="406" y="167" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Four directions from one origin</text><line x1="52" y1="186" x2="760" y2="186" stroke="#87B8EE" stroke-width="1.4" /><rect x="797" y="131" width="360" height="450" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="798" y="132" width="358" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="977" y="167" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Read the dot products</text><line x1="809" y1="186" x2="1145" y2="186" stroke="#BCA8EC" stroke-width="1.4" /><rect x="130" y="209" width="524" height="325" rx="2" fill="#122338" stroke="#40536B" stroke-width="1"/><line x1="164.93333333333334" y1="209" x2="164.93333333333334" y2="534" stroke="#40536B" stroke-width="1" /><line x1="234.8" y1="209" x2="234.8" y2="534" stroke="#40536B" stroke-width="1" /><line x1="304.66666666666663" y1="209" x2="304.66666666666663" y2="534" stroke="#40536B" stroke-width="1" /><line x1="374.5333333333333" y1="209" x2="374.5333333333333" y2="534" stroke="#40536B" stroke-width="2" /><line x1="444.4" y1="209" x2="444.4" y2="534" stroke="#40536B" stroke-width="1" /><line x1="514.2666666666667" y1="209" x2="514.2666666666667" y2="534" stroke="#40536B" stroke-width="1" /><line x1="584.1333333333333" y1="209" x2="584.1333333333333" y2="534" stroke="#40536B" stroke-width="1" /><line x1="654" y1="209" x2="654" y2="534" stroke="#40536B" stroke-width="1" /><line x1="130" y1="506.3404255319149" x2="654" y2="506.3404255319149" stroke="#40536B" stroke-width="1" /><line x1="130" y1="437.1914893617021" x2="654" y2="437.1914893617021" stroke="#40536B" stroke-width="2" /><line x1="130" y1="368.04255319148933" x2="654" y2="368.04255319148933" stroke="#40536B" stroke-width="1" /><line x1="130" y1="298.89361702127655" x2="654" y2="298.89361702127655" stroke="#40536B" stroke-width="1" /><line x1="130