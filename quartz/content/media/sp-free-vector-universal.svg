<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 908" role="img" aria-labelledby="title desc"><title id="title">A free vector space is defined by its maps</title><desc id="desc">On the top row a set S with generators a and b maps by a given function g into the underlying set of a real vector space V. On the bottom row the free vector space F(S) of finite linear combinations of formal basis vectors e a and e b admits a unique linear extension g hat to V. A generator embedding eta sends a to e a and b to e b. The triangle commutes on generators. The worked example has g(a)=2, g(b)=-1, so g hat(3 e a plus 4 e b)=2. This is the universal mapping property and free-forgetful adjunction.</desc><rect width="1440" height="908" rx="17" fill="#0C1E30"/><text x="56" y="57" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="38" font-weight="700">A free vector space is defined by its maps</text><line x1="56" y1="81" x2="1384" y2="81" stroke="#35546A" stroke-width="2"/><text x="52" y="113" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="20">One ordinary function uniquely determines a linear map out of the free vector space.</text><rect x="52" y="138" width="1336" height="493" rx="17" fill="#112538" stroke="#416077" stroke-width="2"/><rect x="104.5" y="216" width="295" height="80" rx="12" fill="#152F45" stroke="#F0BD75" stroke-width="2.4"/><text x="252" y="245" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">SET S = {a,b}</text><text x="252" y="269" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">two generators</text><rect x="1010" y="216" width="322" height="80" rx="12" fill="#152F45" stroke="#C6A5ED" stroke-width="2.4"/><text x="1171" y="245" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">UNDERLYING SET U(V)</text><text x="1171" y="269" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">forget V's operations</text><line x1="405" y1="256" x2="1005" y2="256" stroke="#F0BD75" stroke-width="2.7" stroke-linecap="round"/><path d="M995.2430558494278 261.0795709309563 L1005 256 L995.2430558494278 250.92042906904368" stroke="#F0BD75" stroke-width="2.7" fill="none" stroke-linecap="round"/><text x="714" y="238" fill="#F0BD75" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">given function g</text><rect x="63" y="423" width="378" height="94" rx="12" fill="#152F45" stroke="#7DD9C9" stroke-width="2.4"/><text x="252" y="452" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">FREE VECTOR SPACE F(S)</text><text x="252" y="476" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">formal finite linear sums of eₐ,eᵦ</text><rect x="1009" y="423" width="324" height="94" rx="12" fill="#152F45" stroke="#99BFF1" stroke-width="2.4"/><text x="1171" y="452" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">VECTOR SPACE V</text><text x="1171" y="476" fill="#BBD0E1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">destination for linear maps</text><line x1="252" y1="296" x2="252" y2="414" stroke="#BBD0E1" stroke-width="2.7" stroke-linecap="round"/><path d="M246.92042906904368 404.2430558494279 L252 414 L257.0795709309563 404.2430558494279" stroke="#BBD0E1" stroke-width="2.7" fill="none" stroke-linecap="round"/><text x="290" y="348" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="19">η: a ↦ eₐ</text><line x1="450" y1="470" x2="1005" y2="470" stroke="#7DD9C9" stroke-width="2.7" stroke-linecap="round"/><path d="M995.2430558494278 475.0795709309563 L1005 470 L995.2430558494278 464.9204290690437" stroke="#7DD9C9" stroke-width="2.7" fill="none" stroke-linecap="round"/><text x="723" y="445" fill="#7DD9C9" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">unique linear extension ĝ</text><line x1="1171" y1="296" x2="1171" y2="414" stroke="#BBD0E1" stroke-width="2.7" stroke-linecap="round"/><path d="M1165.9204290690436 404.2430558494279 L1171 414 L1176.0795709309564 404.2430558494279" stroke="#BBD0E1" stroke-width="2.7" fill="none" stroke-linecap="round"/><text x="1214" y="356" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="18">underlying</text><text x="105" y="568" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="23">Commuting rule: ĝ(eₐ) = g(a), ĝ(eᵦ) = g(b)</text><text x="105" y="597" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="21">and ĝ(r eₐ + s eᵦ) = r g(a) + s g(b).</text><rect x="52" y="651" width="1336" height="165" rx="16" fill="#112538" stroke="#416077" stroke-width="2"/><text x="75" y="690" fill="#F2F6FC" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700">Worked instance</text><text x="75" y="728" fill="#BBD0E1" text-anchor="start" font-family="Arial,sans-serif" font-size="20">Take V = ℝ, g(a) = 2 and g(b) = −1.</text><text x="75" y="769" fill="#F0BD75" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700">Then ĝ(3 eₐ + 4 eᵦ) = 3·2 + 4·(−1) = 2.</text><text x="720" y="863" fill="#F2F6FC" text-anchor="middle" font-family="Arial,sans-serif" font-size="19">Adjunction F ⊣ U: maps S → U(V) correspond naturally to linear maps F(S) → V.</text></svg>