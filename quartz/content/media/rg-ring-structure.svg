<svg xmlns="http://www.w3.org/2000/svg" width="800" height="552" viewBox="0 0 800 552" role="img" aria-labelledby="title desc"><title id="title">The anatomy of a ring</title><desc id="desc">Left panel: addition is an abelian group with identity zero and additive inverses. Right panel: multiplication is associative with identity one but need not have inverses. Distributivity connects the operations.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="552" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">The anatomy of a ring</text><text x="40" y="93" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Two operations joined by distributivity.</text><path d="M40 110H760" stroke="#45576F" stroke-width="2"/><rect x="50" y="156" width="330" height="245" rx="16" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="215" y="208" fill="#66C4B4" font-size="27" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ADDITION</text><text x="215" y="269" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Abelian group</text><text x="215" y="316" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0 is the identity</text><text x="215" y="363" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Every a has −a</text><rect x="420" y="156" width="330" height="245" rx="16" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="585" y="208" fill="#BCA8EC" font-size="27" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">MULTIPLICATION</text><text x="585" y="269" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Associative</text><text x="585" y="316" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1 is the identity</text><text x="585" y="363" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Inverses NOT required</text><rect x="88" y="445" width="625" height="59" rx="16" fill="#223349" stroke="#EDB86D" stroke-width="2"/><text x="400" y="484" fill="#EDB86D" font-size="22" font-weight="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">DISTRIBUTIVITY:   a(b + c) = ab + ac</text><text x="40" y="534" fill="#C4CEDA" font-size="15" font-weight="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>