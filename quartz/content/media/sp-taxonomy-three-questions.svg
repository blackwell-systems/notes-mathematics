<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 690" role="img" aria-labelledby="title desc"><title id="title">Three questions about a mathematical space</title><desc id="desc">Three independent classification questions are displayed side by side: which structure is specified, which properties hold for that structure, and which structure-preserving isomorphisms identify apparently different presentations. These are not three rungs in a hierarchy.</desc><rect width="1320" height="690" rx="20" fill="#0C1E30"/><text x="46" y="58" font-family="Arial,Helvetica,sans-serif" font-size="34" text-anchor="start" fill="#F2F7FC" font-weight="700">Three questions about a mathematical space</text><path d="M46 83 L1274 83" stroke="#496779" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="27" y="134" width="394" height="354" rx="14" fill="#173248" stroke="#72D4C0" stroke-width="2"/><text x="224" y="186" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" fill="#72D4C0" font-weight="700">1. STRUCTURE</text><text x="224" y="238" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" fill="#F2F7FC" font-weight="700">What has been specified?</text><text x="224" y="291" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">Open sets, vector addition,</text><text x="224" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">order, distance, measure</text><rect x="53" y="370" width="342" height="82" rx="14" fill="#112739" stroke="#72D4C0" stroke-width="2"/><text x="224" y="402" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#72D4C0">EXAMPLE</text><text x="224" y="433" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#F2F7FC" font-weight="700">Topological space</text><rect x="463" y="134" width="394" height="354" rx="14" fill="#173248" stroke="#91BEED" stroke-width="2"/><text x="660" y="186" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" fill="#91BEED" font-weight="700">2. PROPERTY</text><text x="660" y="238" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" fill="#F2F7FC" font-weight="700">What can be proved?</text><text x="660" y="291" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">Compact, complete,</text><text x="660" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">connected, finite-dimensional</text><rect x="489" y="370" width="342" height="82" rx="14" fill="#112739" stroke="#91BEED" stroke-width="2"/><text x="660" y="402" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#91BEED">EXAMPLE</text><text x="660" y="433" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#F2F7FC" font-weight="700">Compact topological space</text><rect x="899" y="134" width="394" height="354" rx="14" fill="#173248" stroke="#F1BD73" stroke-width="2"/><text x="1096" y="186" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" fill="#F1BD73" font-weight="700">3. ISOMORPHISM</text><text x="1096" y="238" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" fill="#F2F7FC" font-weight="700">Which differences matter?</text><text x="1096" y="291" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">Maps with inverses that</text><text x="1096" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">preserve chosen structure</text><rect x="925" y="370" width="342" height="82" rx="14" fill="#112739" stroke="#F1BD73" stroke-width="2"/><text x="1096" y="402" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#F1BD73">EXAMPLE</text><text x="1096" y="433" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#F2F7FC" font-weight="700">Homeomorphism class</text><text x="660" y="559" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" fill="#F2F7FC" font-weight="700">Same underlying points can admit different structures.</text><text x="660" y="596" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#C0D0DF">A property depends on the chosen structure; sameness depends on the permitted maps.</text><text x="660" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#F1BD73">These are three questions, NOT successive upgrades of a space.</text></svg>