<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Minimal versus least and maximal versus greatest in partial orders</title>
<desc id="desc">Three finite posets: first, a and b incomparable below c, so each is minimal but neither least while c is greatest; second, a below incomparable b and c, so b and c are maximal but neither greatest while a is least; third, a three-point chain 0 below 1 below 2 has least 0 and greatest 2.</desc>
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17122d"/><stop offset="1" stop-color="#0b1225"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="54" y="58" fill="#f6f2ff" font-family="Georgia,serif" font-size="37" font-weight="700" text-anchor="start">Minimal is not the same as least</text>
<text x="54" y="96" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">And maximal is not the same as greatest.</text>
<path d="M54 113 H1146" stroke="#695282" stroke-width="2"/>
<rect x="38" y="142" width="348" height="420" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="212" y="190" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">NO LEAST</text><text x="212" y="224" fill="#c7c6da" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">a and b are both minimal</text><line x1="130" y1="456" x2="207" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="285" y1="456" x2="207" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><circle cx="130" cy="456" r="29" fill="#26535b" stroke="#78d2c7" stroke-width="3"/><text x="130" y="465" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">a</text><circle cx="285" cy="456" r="29" fill="#26535b" stroke="#78d2c7" stroke-width="3"/><text x="285" y="465" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">b</text><circle cx="207" cy="298" r="29" fill="#624829" stroke="#f1ce90" stroke-width="3"/><text x="207" y="307" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">c</text><text x="212" y="539" fill="#f1ce90" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">c is greatest.</text><rect x="428" y="142" width="348" height="420" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="602" y="190" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">NO GREATEST</text><text x="602" y="224" fill="#c7c6da" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">b and c are both maximal</text><line x1="598" y1="456" x2="527" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="598" y1="456" x2="669" y2="298" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><circle cx="598" cy="456" r="29" fill="#624829" stroke="#f1ce90" stroke-width="3"/><text x="598" y="465" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">a</text><circle cx="527" cy="298" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="527" y="307" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">b</text><circle cx="669" cy="298" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="669" y="307" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">c</text><text x="602" y="539" fill="#f1ce90" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">a is least.</text><rect x="818" y="142" width="348" height="420" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="992" y="190" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">BOTH EXIST</text><text x="992" y="224" fill="#c7c6da" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">a three-element chain</text><line x1="987" y1="469" x2="987" y2="380" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><line x1="987" y1="380" x2="987" y2="291" stroke="#68739c" stroke-width="4" stroke-linecap="round"/><circle cx="987" cy="469" r="29" fill="#26535b" stroke="#78d2c7" stroke-width="3"/><text x="987" y="478" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">0</text><circle cx="987" cy="380" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3"/><text x="987" y="389" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">1</text><circle cx="987" cy="291" r="29" fill="#624829" stroke="#f1ce90" stroke-width="3"/><text x="987" y="300" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">2</text><text x="992" y="539" fill="#f1ce90" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle">0 is least; 2 is greatest.</text><text x="600" y="598" fill="#f1ce90" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Minimal means nothing below it; least means it is below everything.</text>
</svg>