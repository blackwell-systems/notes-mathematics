<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">Factoring by grouping as a common rectangular width</title>
<desc id="desc">Two rows of tiles share one width x plus three. Top row is x cubed plus three x squared with height x squared; bottom row is two x plus six with height two. Together their height is x squared plus two and total area is (x squared plus two)(x plus three).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66C4B4"/></marker></defs>
<rect width="980" height="650" rx="16" fill="#101A2C"/>
<text x="48" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#F4F3ED" font-weight="700" text-anchor="start">Grouping: reveal the common width</text>
<text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#C0CBD8" font-weight="500" text-anchor="start">x³ + 3x² + 2x + 6 = (x² + 2)(x + 3)</text>
<path d="M48 127 H932" fill="none" stroke="#42576D" stroke-width="2" />
<rect x="60" y="165" width="484" height="372" rx="13" fill="#102336" stroke="#42576D" stroke-width="2"/><rect x="181" y="226" width="92" height="184" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="273" y="226" width="138" height="184" rx="2" fill="#14283C" stroke="#87B8EE" stroke-width="2"/><rect x="181" y="410" width="92" height="92" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><rect x="273" y="410" width="138" height="92" rx="2" fill="#14283C" stroke="#EDB86D" stroke-width="2"/><text x="227" y="335" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#87B8EE" font-weight="700" text-anchor="middle">x³</text><text x="342" y="335" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#87B8EE" font-weight="700" text-anchor="middle">3x²</text><text x="227" y="468" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#EDB86D" font-weight="700" text-anchor="middle">2x</text><text x="342" y="468" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#EDB86D" font-weight="700" text-anchor="middle">6</text><text x="227" y="215" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66C4B4" font-weight="700" text-anchor="middle">x</text><text x="342" y="215" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#66C4B4" font-weight="700" text-anchor="middle">3</text><text x="169" y="332" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#87B8EE" font-weight="700" text-anchor="end">x²</text><text x="169" y="468" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#EDB86D" font-weight="700" text-anchor="end">2</text><rect x="578" y="195" width="350" height="304" rx="12" fill="#182A3D" stroke="#42576D" stroke-width="2"/><text x="606" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0CBD8" font-weight="700" text-anchor="start">TWO ROWS</text><text x="606" y="286" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#87B8EE" font-weight="700" text-anchor="start">x²(x + 3)</text><text x="606" y="329" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#EDB86D" font-weight="700" text-anchor="start">+ 2(x + 3)</text><path d="M606 354 H901" fill="none" stroke="#42576D" stroke-width="2" /><text x="606" y="406" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#66C4B4" font-weight="700" text-anchor="start">(x² + 2)(x + 3)</text><text x="608" y="451" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#C0CBD8" font-weight="500" text-anchor="start">same width, added heights</text><text x="82" y="572" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#F4F3ED" font-weight="500" text-anchor="start">Grouping reverses distributivity; both rows carry the same binomial.</text>
<path d="M48 586 H932" fill="none" stroke="#42576D" stroke-width="1.5" />
<text x="48" y="619" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C0CBD8" font-weight="500" text-anchor="start">This area model uses nonnegative lengths; the identity holds algebraically for all x.</text>
</svg>
