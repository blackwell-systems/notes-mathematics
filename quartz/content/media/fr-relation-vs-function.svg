<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">Functions are special relations</title><desc id="desc">Left: a maps to 1, b and c map to 3, each exactly once. Right: a maps to both 1 and 2, so the relation is not a function.</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">Functions are special relations</text><rect x="25" y="116" width="560" height="482" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="35" y="126" width="540" height="59" rx="13" fill="#122338"/><text x="305" y="158" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Function · valid</text><path d="M49 186 H561" stroke="#98D5A3" opacity=".35" stroke-width="2"/><text x="145" y="230" fill="#87B8EE" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">Domain</text><ellipse cx="145" cy="386" rx="70" ry="95" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="471" y="230" fill="#BCA8EC" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">Codomain</text><ellipse cx="471" cy="386" rx="70" ry="95" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><path d="M171 334 L440 334" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M171 386 L440 438" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M171 438 L440 438" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><circle cx="145" cy="334" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="145" y="334" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">a</text><circle cx="145" cy="386" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="145" y="386" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">b</text><circle cx="145" cy="438" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="145" y="438" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">c</text><circle cx="471" cy="334" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="471" y="334" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="471" cy="386" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="471" y="386" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="471" cy="438" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="471" y="438" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">3</text><rect x="615" y="116" width="560" height="482" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="625" y="126" width="540" height="59" rx="13" fill="#122338"/><text x="895" y="158" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Relation · not a function</text><path d="M639 186 H1151" stroke="#F28D95" opacity=".35" stroke-width="2"/><text x="735" y="230" fill="#87B8EE" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">Domain</text><ellipse cx="735" cy="386" rx="70" ry="95" fill="#122338" stroke="#87B8EE" stroke-width="2.5"/><text x="1061" y="230" fill="#BCA8EC" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">Codomain</text><ellipse cx="1061" cy="386" rx="70" ry="95" fill="#122338" stroke="#BCA8EC" stroke-width="2.5"/><path d="M761 334 L1030 334" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><path d="M761 334 L1030 386" fill="none" stroke="#F28D95" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowR)"/><path d="M761 386 L1030 438" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><circle cx="735" cy="334" r="20" fill="#122338" stroke="#EDB86D" stroke-width="2.6"/><text x="735" y="334" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">a</text><circle cx="735" cy="386" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="735" y="386" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">b</text><circle cx="735" cy="438" r="20" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="735" y="438" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">c</text><circle cx="1061" cy="334" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="1061" y="334" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="1061" cy="386" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="1061" y="386" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="1061" cy="438" r="20" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="1061" y="438" fill="#F4F3ED" font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="middle">3</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">Each input must have exactly one output. Two inputs may share one output.</text></svg>