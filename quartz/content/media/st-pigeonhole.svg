<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Pigeonhole principle: four objects in three containers</title>
<desc id="desc">Four labeled objects P1 to P4 are mapped to three containers H1 H2 H3. Arrows from P2 and P3 both enter H2, which is highlighted as holding two objects. The count four divided among three forces at least one container with ceiling four thirds, which is two.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#171029"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2D204B"/><stop offset="1" stop-color="#11142C"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#382651"/><stop offset="1" stop-color="#211A3B"/></linearGradient>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12" fill="#C69AFF"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/><text x="720" y="88" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="72" font-weight="bold">Pigeonhole Principle</text><text x="720" y="147" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D8C4F5" font-size="30" font-weight="normal">Four objects, three containers: some container receives at least two.</text><path d="M70 175 H1370" stroke="#9261C6" stroke-width="2"/><text x="285" y="260" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D2B3F5" font-size="38" font-weight="bold">OBJECTS (4)</text><text x="1055" y="260" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D2B3F5" font-size="38" font-weight="bold">CONTAINERS (3)</text><circle cx="286" cy="338" r="43" fill="#543477" stroke="#CAA0FA" stroke-width="3"/><text x="286" y="350" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="30" font-weight="normal">P1</text><circle cx="286" cy="461" r="43" fill="#543477" stroke="#CAA0FA" stroke-width="3"/><text x="286" y="473" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="30" font-weight="normal">P2</text><circle cx="286" cy="584" r="43" fill="#543477" stroke="#CAA0FA" stroke-width="3"/><text x="286" y="596" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="30" font-weight="normal">P3</text><circle cx="286" cy="707" r="43" fill="#543477" stroke="#CAA0FA" stroke-width="3"/><text x="286" y="719" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="30" font-weight="normal">P4</text><rect x="939" y="290" width="252" height="117" rx="19" fill="url(#panel)" stroke="#AB80E8" stroke-width="3"/><text x="1065" y="360" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="42" font-weight="normal">H1</text><rect x="939" y="471" width="252" height="117" rx="19" fill="#5C3778" stroke="#F3B8FF" stroke-width="5"/><text x="1065" y="541" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="42" font-weight="bold">H2</text><rect x="939" y="644" width="252" height="117" rx="19" fill="url(#panel)" stroke="#AB80E8" stroke-width="3"/><text x="1065" y="714" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="42" font-weight="normal">H3</text><line x1="345" y1="338" x2="934" y2="348" stroke="#C29AF6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="345" y1="461" x2="934" y2="519" stroke="#F2B6FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="345" y1="584" x2="934" y2="541" stroke="#F2B6FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="345" y1="707" x2="934" y2="702" stroke="#C29AF6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1218" y="543" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="start" fill="#E7B5F9" font-size="34" font-weight="bold">2 objects</text><rect x="43" y="823" width="1354" height="137" rx="21" fill="url(#footer)" stroke="#B783EF" stroke-width="3"/><text x="720" y="881" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="43" font-weight="bold">Maximum occupancy ≥ ⌈4 / 3⌉ = 2</text><text x="720" y="926" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E1CFF4" font-size="27" font-weight="normal">The general guarantee for m objects in n nonempty containers is at least ⌈m / n⌉ in one.</text></svg>