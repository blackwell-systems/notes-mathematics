<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc"><title id="title">Bounds in the divisibility poset of 12</title><desc id="desc">Hasse diagram for positive divisors of 12 with the subset S equals 2 and 3 colored teal, its two upper bounds 6 and 12 colored gold, and its only lower bound 1 colored violet. Shows that bounds are taken in the ambient poset and need not belong to the subset.</desc><rect width="1180" height="720" fill="#0c1428"/><text x="590" y="57" fill="#f7f4ff" font-size="40" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">Bounds belong to the surrounding poset</text><text x="590" y="93" fill="#cbd5ed" font-size="23" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Positive divisors of 12, ordered by divisibility; S = {2, 3}</text><rect x="35" y="122" width="690" height="566" rx="22" fill="#172744" stroke="#7396ca" stroke-width="2.5"/><rect x="752" y="122" width="393" height="566" rx="22" fill="#172744" stroke="#7396ca" stroke-width="2.5"/><text x="380" y="165" fill="#cbd5ed" font-size="24" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Divisibility Hasse diagram of P</text><path d="M380 608 L235 495" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M380 608 L520 495" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M235 495 L235 379" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M235 495 L520 379" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M520 495 L520 379" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M235 379 L380 253" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><path d="M520 379 L380 253" fill="none" stroke="#aebfe4" stroke-width="4" stroke-linecap="round"/><circle cx="380" cy="608" r="32" fill="#483e6d" stroke="#cab8f5" stroke-width="4"/><text x="380" y="618" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">1</text><circle cx="235" cy="495" r="32" fill="#185761" stroke="#79e5d6" stroke-width="4"/><text x="235" y="505" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">2</text><circle cx="520" cy="495" r="32" fill="#185761" stroke="#79e5d6" stroke-width="4"/><text x="520" y="505" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">3</text><circle cx="235" cy="379" r="32" fill="#293858" stroke="#99add1" stroke-width="4"/><text x="235" y="389" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">4</text><circle cx="520" cy="379" r="32" fill="#62501c" stroke="#f1cb74" stroke-width="4"/><text x="520" y="389" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">6</text><circle cx="380" cy="253" r="32" fill="#62501c" stroke="#f1cb74" stroke-width="4"/><text x="380" y="263" fill="#f7f4ff" font-size="29" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">12</text><text x="948" y="166" fill="#f7f4ff" font-size="23" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">Read the highlighted elements</text><circle cx="790" cy="215" r="13" fill="#185761" stroke="#79e5d6" stroke-width="3"/><text x="817" y="223" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Subset S = {2, 3}</text><circle cx="790" cy="274" r="13" fill="#62501c" stroke="#f1cb74" stroke-width="3"/><text x="817" y="282" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Upper bounds: 6 and 12</text><circle cx="790" cy="333" r="13" fill="#483e6d" stroke="#cab8f5" stroke-width="3"/><text x="817" y="341" fill="#f7f4ff" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Lower bound: 1</text><path d="M781 374 H1115" stroke="#7396ca" stroke-width="2"/><text x="781" y="419" fill="#cbd5ed" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">2 and 3 both divide 6 and 12.</text><text x="781" y="455" fill="#cbd5ed" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1 divides both 2 and 3.</text><text x="781" y="525" fill="#f7f4ff" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Bounds are elements of P.</text><text x="781" y="562" fill="#f7f4ff" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">They need not belong to S.</text><text x="781" y="622" fill="#cbd5ed" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Read comparisons by</text><text x="781" y="650" fill="#cbd5ed" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">following upward paths.</text></svg>
