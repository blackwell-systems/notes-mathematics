<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">Bijection: pairing three numbers with three distinct apples</title>
<desc id="desc">Three numbered inputs 1, 2, 3 each have one arrow to a different illustrated apple a1, a2, a3. Every apple receives one arrow, demonstrating the function is injective and surjective. The two sets have cardinality three even though their objects differ.</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#171029"/><stop offset="1" stop-color="#080B1B"/></linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#2D204B"/><stop offset="1" stop-color="#11142C"/></linearGradient>
<linearGradient id="footer" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#382651"/><stop offset="1" stop-color="#211A3B"/></linearGradient>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12" fill="#C69AFF"/></marker>
</defs>
<rect width="1440" height="990" fill="url(#bg)"/><text x="720" y="88" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="72" font-weight="bold">A Bijection: Counting by Pairing</text><text x="720" y="147" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#D8C4F5" font-size="30" font-weight="normal">Different kinds of objects can still have the same cardinality.</text><path d="M70 175 H1370" stroke="#9261C6" stroke-width="2"/><text x="350" y="248" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E1C9FE" font-size="43" font-weight="bold">A = {1, 2, 3}</text><text x="1110" y="248" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E1C9FE" font-size="43" font-weight="bold">B = {a₁, a₂, a₃}</text><circle cx="350" cy="364" r="51" fill="#503474" stroke="#C798FE" stroke-width="4"/><text x="350" y="379" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="47" font-weight="normal">1</text><line x1="420" y1="364" x2="994" y2="364" stroke="#C999FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1062 335 C1037 298,996 326,1003 370 C1008 416,1045 422,1063 407 C1088 422,1121 416,1130 370 C1137 326,1092 302,1062 335 Z" fill="#C96F99" fill-opacity=".68" stroke="#F5ACD0" stroke-width="3"/><path d="M1063 334 Q1067 311 1080 307" fill="none" stroke="#BBD5A4" stroke-width="5"/><path d="M1075 312 Q1095 289 1112 312 Q1090 324 1075 312" fill="#8DBF94" stroke="#BDE5B1" stroke-width="2"/><text x="1067" y="383" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="32" font-weight="bold">a1</text><circle cx="350" cy="522" r="51" fill="#503474" stroke="#C798FE" stroke-width="4"/><text x="350" y="537" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="47" font-weight="normal">2</text><line x1="420" y1="522" x2="994" y2="522" stroke="#C999FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1062 493 C1037 456,996 484,1003 528 C1008 574,1045 580,1063 565 C1088 580,1121 574,1130 528 C1137 484,1092 460,1062 493 Z" fill="#C96F99" fill-opacity=".68" stroke="#F5ACD0" stroke-width="3"/><path d="M1063 492 Q1067 469 1080 465" fill="none" stroke="#BBD5A4" stroke-width="5"/><path d="M1075 470 Q1095 447 1112 470 Q1090 482 1075 470" fill="#8DBF94" stroke="#BDE5B1" stroke-width="2"/><text x="1067" y="541" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="32" font-weight="bold">a2</text><circle cx="350" cy="680" r="51" fill="#503474" stroke="#C798FE" stroke-width="4"/><text x="350" y="695" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="47" font-weight="normal">3</text><line x1="420" y1="680" x2="994" y2="680" stroke="#C999FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1062 651 C1037 614,996 642,1003 686 C1008 732,1045 738,1063 723 C1088 738,1121 732,1130 686 C1137 642,1092 618,1062 651 Z" fill="#C96F99" fill-opacity=".68" stroke="#F5ACD0" stroke-width="3"/><path d="M1063 650 Q1067 627 1080 623" fill="none" stroke="#BBD5A4" stroke-width="5"/><path d="M1075 628 Q1095 605 1112 628 Q1090 640 1075 628" fill="#8DBF94" stroke="#BDE5B1" stroke-width="2"/><text x="1067" y="699" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FFF9FF" font-size="32" font-weight="bold">a3</text><rect x="43" y="823" width="1354" height="137" rx="21" fill="url(#footer)" stroke="#B783EF" stroke-width="3"/><text x="720" y="881" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#FAF6FF" font-size="43" font-weight="bold">Function + injective + surjective = bijection</text><text x="720" y="926" font-family="Georgia, 'DejaVu Serif', serif" text-anchor="middle" fill="#E1CFF4" font-size="27" font-weight="normal">Every number has one image; every apple is reached exactly once. So |A| = |B| = 3.</text></svg>