<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Convergence means eventual control</title><desc id="desc">A sequence a_n=(-1)^n/n with limit L=0 is drawn as alternating points. For epsilon one fourth and N=4, every term with n greater than four lies strictly between L minus epsilon and L plus epsilon. Earlier terms need not lie there.</desc><rect width="1000" height="590" fill="#101A2C"/><text x="42" y="61" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#F4F3ED" text-anchor="start" >Convergence means eventual control</text><text x="42" y="100" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C4CEDA" text-anchor="start" >Example: aₙ = (−1)ⁿ/n, with ε = 1/4 and N = 4.</text><line x1="40" y1="119" x2="960" y2="119" stroke="#45576F" stroke-width="2" /><rect x="48" y="143" width="904" height="334" rx="14" fill="#19283A" stroke="#45576F" stroke-width="2" /><rect x="96" y="265" width="830" height="70" fill="#66C4B4" fill-opacity=".12"/><line x1="96" y1="265" x2="926" y2="265" stroke="#66C4B4" stroke-width="2" stroke-dasharray="8 5"/><line x1="96" y1="335" x2="926" y2="335" stroke="#66C4B4" stroke-width="2" stroke-dasharray="8 5"/><line x1="96" y1="300" x2="926" y2="300" stroke="#87B8EE" stroke-width="2" /><line x1="245" y1="162" x2="245" y2="449" stroke="#EDB86D" stroke-width="2" stroke-dasharray="7 5"/><line x1="96" y1="450" x2="925" y2="450" stroke="#C4CEDA" stroke-width="2.5" /><text x="75" y="271" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#66C4B4" text-anchor="end" >L+ε</text><text x="75" y="307" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#87B8EE" text-anchor="end" >L = 0</text><text x="75" y="342" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#66C4B4" text-anchor="end" >L−ε</text><circle cx="116" cy="440.00" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="159" cy="230.00" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="202" cy="346.67" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="245" cy="265.00" r="7" fill="#EDB86D" stroke="#101A2C" stroke-width="1.5" /><circle cx="288" cy="328.00" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="331" cy="276.67" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="374" cy="320.00" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="417" cy="282.50" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="460" cy="315.56" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="503" cy="286.00" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="546" cy="312.73" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="589" cy="288.33" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="632" cy="310.77" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="675" cy="290.00" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="718" cy="309.33" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="761" cy="291.25" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="804" cy="308.24" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><circle cx="847" cy="292.22" r="6" fill="#66C4B4" stroke="#101A2C" stroke-width="1.5" /><text x="116" y="471" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >1</text><text x="245" y="471" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#EDB86D" text-anchor="middle" >4</text><text x="417" y="471" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >8</text><text x="589" y="471" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >12</text><text x="761" y="471" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >16</text><text x="847" y="471" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#C4CEDA" text-anchor="middle" >18</text><text x="245" y="185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#EDB86D" text-anchor="middle" >N = 4</text><text x="485" y="194" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#66C4B4" text-anchor="start" >All n &gt; N stay in the tolerance band</text><text x="884" y="437" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#C4CEDA" text-anchor="middle" >n →</text><line x1="40" y1="501" x2="960" y2="501" stroke="#45576F" stroke-width="2" /><text x="46" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#C4CEDA" text-anchor="start" >The tail stays inside the band; early outliers do not matter.</text><text x="42" y="577" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#C4CEDA" text-anchor="start" >REAL ANALYSIS  /  VISUAL PROOF INTUITION</text></svg>
