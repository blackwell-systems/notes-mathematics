<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title desc"><title id="title">Cosets partition a group</title><desc id="desc">Three disjoint cosets of H equal to {0,3} in additive Z modulo 6: {0,3}, {1,4}, {2,5}. Three cosets each of size two partition all six elements.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="570" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Cosets partition a group</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Example: Z/6 under addition; H = {0, 3}.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="90" y="155" width="620" height="91" rx="18" fill="#19283A" stroke="#66C4B4" stroke-width="2.5"/><text x="125" y="210" fill="#66C4B4" font-size="25" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">H = {0,3}</text><circle cx="480" cy="200" r="30" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="480" y="209" fill="#F4F3ED" font-size="26" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><circle cx="565" cy="200" r="30" fill="#223349" stroke="#66C4B4" stroke-width="2.6"/><text x="565" y="209" fill="#F4F3ED" font-size="26" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3</text><rect x="90" y="266" width="620" height="91" rx="18" fill="#19283A" stroke="#BCA8EC" stroke-width="2.5"/><text x="125" y="321" fill="#BCA8EC" font-size="25" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1 + H</text><circle cx="480" cy="311" r="30" fill="#223349" stroke="#BCA8EC" stroke-width="2.6"/><text x="480" y="320" fill="#F4F3ED" font-size="26" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><circle cx="565" cy="311" r="30" fill="#223349" stroke="#BCA8EC" stroke-width="2.6"/><text x="565" y="320" fill="#F4F3ED" font-size="26" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4</text><rect x="90" y="377" width="620" height="91" rx="18" fill="#19283A" stroke="#EDB86D" stroke-width="2.5"/><text x="125" y="432" fill="#EDB86D" font-size="25" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">2 + H</text><circle cx="480" cy="422" r="30" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="480" y="431" fill="#F4F3ED" font-size="26" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><circle cx="565" cy="422" r="30" fill="#223349" stroke="#EDB86D" stroke-width="2.6"/><text x="565" y="431" fill="#F4F3ED" font-size="26" font-weight="750" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">5</text><text x="400" y="527" fill="#F4F3ED" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3 disjoint cosets × 2 elements = 6 elements.</text><text x="40" y="550" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>