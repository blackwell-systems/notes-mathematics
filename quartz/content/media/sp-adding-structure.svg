<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc"><title id="title">Adding data and checking properties</title><desc id="desc">Three panels show the same set with four points: just a collection, then a chosen family of open neighborhoods, then a chosen metric giving numerical distances. Beneath, a separate branch states that adding vector operations is independent; a norm requires a metric compatible with those operations. Completeness and compactness are properties to prove rather than operations.</desc><rect width="1320" height="720" rx="18" fill="#0C1E30"/><text x="50" y="60" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#F1F5FC">Adding data and checking properties</text><line x1="50" y1="83" x2="1270" y2="83" stroke="#48657A" stroke-width="2"/><text x="53" y="119" font-family="Arial,sans-serif" font-size="20" fill="#B9CFE0" font-weight="normal" text-anchor="start">Data is specified; properties are then proved.</text><rect x="40" y="142" width="330" height="270" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="495" y="142" width="330" height="270" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><rect x="950" y="142" width="330" height="270" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><circle cx="131" cy="240" r="9" fill="#F4BF77"/><circle cx="280" cy="252" r="9" fill="#F4BF77"/><circle cx="156" cy="351" r="9" fill="#F4BF77"/><circle cx="268" cy="346" r="9" fill="#F4BF77"/><text x="205" y="175" font-family="Arial,sans-serif" font-size="24" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Underlying set</text><text x="205" y="387" font-family="Arial,sans-serif" font-size="19" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Four points; no closeness</text><text x="660" y="175" font-family="Arial,sans-serif" font-size="24" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Choose a topology</text><ellipse cx="624" cy="271" rx="84" ry="70" fill="#255773" fill-opacity=".5" stroke="#94C2F2" stroke-width="3"/><circle cx="586" cy="240" r="8" fill="#F4BF77"/><circle cx="735" cy="252" r="8" fill="#F4BF77"/><circle cx="611" cy="351" r="8" fill="#F4BF77"/><circle cx="723" cy="346" r="8" fill="#F4BF77"/><text x="660" y="387" font-family="Arial,sans-serif" font-size="19" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Open sets become meaningful</text><text x="1115" y="175" font-family="Arial,sans-serif" font-size="24" fill="#F1F5FC" font-weight="normal" text-anchor="middle">Choose a metric</text><circle cx="1041" cy="240" r="8" fill="#F4BF77"/><circle cx="1190" cy="252" r="8" fill="#F4BF77"/><circle cx="1066" cy="351" r="8" fill="#F4BF77"/><circle cx="1178" cy="346" r="8" fill="#F4BF77"/><line x1="1055" y1="241" x2="1188" y2="252" stroke="#79D7C2" stroke-width="4"  stroke-linecap="round"/><text x="1115" y="224" font-family="Arial,sans-serif" font-size="18" fill="#79D7C2" font-weight="normal" text-anchor="middle">d(a,b)</text><text x="1115" y="387" font-family="Arial,sans-serif" font-size="19" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Distances obey 4 axioms</text><line x1="370" y1="285" x2="489" y2="285" stroke="#94C2F2" stroke-width="3"  stroke-linecap="round"/><path d="M477.94726807196537 289.6730201077038 L489 285 L477.94726807196537 280.3269798922962" stroke="#94C2F2" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="827" y1="285" x2="941" y2="285" stroke="#79D7C2" stroke-width="3"  stroke-linecap="round"/><path d="M929.9472680719654 289.6730201077038 L941 285 L929.9472680719654 280.3269798922962" stroke="#79D7C2" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="120" y="470" width="1080" height="142" rx="13" stroke="#456783" stroke-width="2" fill="#173248"/><text x="659" y="516" font-family="Arial,sans-serif" font-size="22" fill="#79D7C2" font-weight="bold" text-anchor="middle">A DIFFERENT BRANCH: vector addition and scalar multiplication</text><text x="659" y="554" font-family="Arial,sans-serif" font-size="20" fill="#F1F5FC" font-weight="normal" text-anchor="middle">To obtain a normed space, the distance must respect the vector operations.</text><text x="660" y="678" font-family="Arial,sans-serif" font-size="18" fill="#B9CFE0" font-weight="normal" text-anchor="middle">Completeness, compactness and connectedness are properties, not freely added operations.</text></svg>