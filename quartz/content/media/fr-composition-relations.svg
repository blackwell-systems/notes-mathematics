<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc"><title id="title">Composition of relations</title><desc id="desc">R maps 1 to 2 and 3 and 2 to 4. S maps 2 to 5,3 to 6,4 to 5. Composite contains (1,5),(1,6),(2,5).</desc><defs><marker id="arrowB" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#87B8EE"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#F28D95"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98D5A3"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#BCA8EC"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#EDB86D"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="53" fill="#F4F3ED" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle">Composition of relations</text><rect x="25" y="118" width="1150" height="474" rx="21" fill="#19283A" stroke="#526580" stroke-width="2"/><rect x="35" y="128" width="1130" height="59" rx="13" fill="#122338"/><text x="600" y="160" fill="#F4F3ED" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Follow R, then S · compose their paths</text><path d="M49 188 H1151" stroke="#87B8EE" opacity=".35" stroke-width="2"/><text x="180" y="225" fill="#87B8EE" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Set A</text><circle cx="180" cy="300" r="23" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="180" y="300" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">1</text><circle cx="180" cy="387" r="23" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="180" y="387" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="180" cy="474" r="23" fill="#122338" stroke="#87B8EE" stroke-width="2.6"/><text x="180" y="474" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">3</text><text x="565" y="225" fill="#BCA8EC" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Set B</text><circle cx="565" cy="300" r="23" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="565" y="300" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="565" cy="387" r="23" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="565" y="387" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">3</text><circle cx="565" cy="474" r="23" fill="#122338" stroke="#BCA8EC" stroke-width="2.6"/><text x="565" y="474" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">4</text><text x="1010" y="225" fill="#98D5A3" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Set C</text><circle cx="1010" cy="335" r="23" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="1010" y="335" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="1010" cy="448" r="23" fill="#122338" stroke="#98D5A3" stroke-width="2.6"/><text x="1010" y="448" fill="#F4F3ED" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">6</text><path d="M205 300 L540 300" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M205 300 L540 387" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M205 387 L540 474" fill="none" stroke="#87B8EE" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowB)"/><path d="M590 300 L985 335" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><path d="M590 387 L985 448" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><path d="M590 474 L985 335" fill="none" stroke="#98D5A3" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrowM)"/><path d="M200 269 Q594 139 989 304" fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6" marker-end="url(#arrowV)"/><path d="M200 281 Q602 185 992 417" fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6" marker-end="url(#arrowV)"/><path d="M200 373 Q630 140 992 313" fill="none" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 6" marker-end="url(#arrowV)"/><text x="590" y="530" fill="#F4F3ED" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Blue = R     Mint = S     Violet dashed = S ∘ R</text><text x="600" y="647" fill="#98D5A3" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">S ∘ R = {(1,5), (1,6), (2,5)}</text></svg>