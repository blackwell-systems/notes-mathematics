<svg xmlns="http://www.w3.org/2000/svg" width="800" height="565" viewBox="0 0 800 565" role="img" aria-labelledby="title desc"><title id="title">Subgroup correspondence</title><desc id="desc">Correspondence between subgroups of Z modulo 6 containing H={0,3} and the subgroups of the quotient Z modulo 3: the whole group maps to the whole quotient and H maps to the identity subgroup.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="565" fill="#101A2C"/><text x="40" y="55" fill="#F4F3ED" font-size="34" font-weight="760" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Subgroup correspondence</text><text x="40" y="92" fill="#C4CEDA" font-size="20" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">For H = {0,3} in Z/6, exactly two subgroups contain H.</text><line x1="40" x2="760" y1="110" y2="110" stroke="#45576F" stroke-width="2"/><rect x="65" y="141" width="320" height="68" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="416" y="141" width="320" height="68" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="225" y="182" fill="#66C4B4" font-size="19" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Subgroups of G containing H</text><text x="576" y="182" fill="#BCA8EC" font-size="19" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Subgroups of G/H</text><rect x="115" y="224" width="220" height="95" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="465" y="224" width="220" height="95" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="225" y="279" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">G = Z/6</text><text x="575" y="279" fill="#F4F3ED" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">G/H = Z/3</text><line x1="353" y1="270" x2="452" y2="270" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="115" y="380" width="220" height="95" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><rect x="465" y="380" width="220" height="95" rx="18" fill="#19283A" stroke="#45576F" stroke-width="2"/><text x="225" y="435" fill="#F4F3ED" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">H = {0,3}</text><text x="575" y="435" fill="#F4F3ED" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">{0 + H}</text><line x1="353" y1="426" x2="452" y2="426" stroke="#87B8EE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="225" y1="324" x2="225" y2="374" stroke="#66C4B4" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="575" y1="324" x2="575" y2="374" stroke="#BCA8EC" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="400" y="522" fill="#C4CEDA" font-size="21" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Inclusion is preserved through the quotient.</text><text x="40" y="545" fill="#C4CEDA" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRUCTURE  /  PROOF  /  EXAMPLE</text></svg>