<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Events are subsets of the sample space</title><desc id="desc">Two equal-likelihood experiments. In a fair die roll the even event includes three of six outcomes, and in two fair coin flips the at-least-one-head event includes three of four outcomes. Highlighted tiles form each event.</desc><rect width="1440" height="760" fill="#0C1E30"/><text x="46" y="60" font-family="Arial,Helvetica,sans-serif" font-size="35" text-anchor="start" font-weight="bold" fill="#F2F5FC">Events are subsets of the sample space</text><line x1="46" y1="84" x2="1394" y2="84" stroke="#35546A" stroke-width="2" /><rect x="44" y="122" width="652" height="522" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="68" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#99BFF1">One die roll: even outcomes</text><rect x="718" y="122" width="678" height="522" rx="15" fill="#173248" stroke="#456783" stroke-width="2"/><text x="742" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#7DD9C9">Two coins: at least one head</text><text x="73" y="206" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="normal" fill="#B9CFE0">Ω = {1, 2, 3, 4, 5, 6}</text><text x="746" y="206" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="normal" fill="#B9CFE0">Ω = {HH, HT, TH, TT}</text><rect x="78" y="252" width="80" height="96" rx="12" fill="#11293C" stroke="#456783" stroke-width="2.8"/><text x="118" y="310" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#B9CFE0">1</text><rect x="174" y="252" width="80" height="96" rx="12" fill="#274F69" stroke="#99BFF1" stroke-width="2.8"/><text x="214" y="310" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#F2F5FC">2</text><rect x="270" y="252" width="80" height="96" rx="12" fill="#11293C" stroke="#456783" stroke-width="2.8"/><text x="310" y="310" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#B9CFE0">3</text><rect x="366" y="252" width="80" height="96" rx="12" fill="#274F69" stroke="#99BFF1" stroke-width="2.8"/><text x="406" y="310" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#F2F5FC">4</text><rect x="462" y="252" width="80" height="96" rx="12" fill="#11293C" stroke="#456783" stroke-width="2.8"/><text x="502" y="310" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#B9CFE0">5</text><rect x="558" y="252" width="80" height="96" rx="12" fill="#274F69" stroke="#99BFF1" stroke-width="2.8"/><text x="598" y="310" font-family="Arial,Helvetica,sans-serif" font-size="32" text-anchor="middle" font-weight="bold" fill="#F2F5FC">6</text><rect x="762" y="252" width="130" height="96" rx="12" fill="#23544F" stroke="#7DD9C9" stroke-width="2.8"/><text x="827" y="310" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#F2F5FC">HH</text><rect x="915" y="252" width="130" height="96" rx="12" fill="#23544F" stroke="#7DD9C9" stroke-width="2.8"/><text x="980" y="310" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#F2F5FC">HT</text><rect x="1068" y="252" width="130" height="96" rx="12" fill="#23544F" stroke="#7DD9C9" stroke-width="2.8"/><text x="1133" y="310" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#F2F5FC">TH</text><rect x="1221" y="252" width="130" height="96" rx="12" fill="#11293C" stroke="#456783" stroke-width="2.8"/><text x="1286" y="310" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#B9CFE0">TT</text><text x="76" y="418" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="normal" fill="#99BFF1">E = {2, 4, 6}</text><text x="754" y="418" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" font-weight="normal" fill="#7DD9C9">E = {HH, HT, TH}</text><text x="76" y="499" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#F2F5FC">P(E) = 3 / 6 = 1 / 2</text><text x="754" y="499" font-family="Arial,Helvetica,sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#F2F5FC">P(E) = 3 / 4</text><text x="76" y="570" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#B9CFE0">3 favorable outcomes of 6</text><text x="754" y="570" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" font-weight="normal" fill="#B9CFE0">3 favorable outcomes of 4</text><rect x="100" y="675" width="1240" height="56" rx="12" fill="#11293C" stroke="#456783" stroke-width="2"/><text x="720" y="711" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#F0BD75">Counting outcomes works here because every outcome is equally likely.</text></svg>