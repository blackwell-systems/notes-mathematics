<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 522" width="800" height="522" role="img" aria-labelledby="title desc"><title id="title">Fractions are equivalence classes</title><desc id="desc">Fractions 1/2, 2/4 and 3/6 represent the same rational number. Cross multiplication establishes pair equivalence.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="522" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">Fractions are equivalence classes</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Different numerator–denominator pairs can agree.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="54" y="156" width="225" height="210" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="166" y="280" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="52" font-weight="760">1/2</text><rect x="304" y="156" width="225" height="210" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="416" y="280" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="52" font-weight="760">2/4</text><rect x="554" y="156" width="225" height="210" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="666" y="280" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="52" font-weight="760">3/6</text><rect x="116" y="402" width="570" height="65" rx="14" fill="#223349" stroke="#87B8EE" stroke-width="2"/><text x="400" y="442" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="27" font-weight="550">ad = bc  ⇒  same rational</text><text x="40" y="505" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>