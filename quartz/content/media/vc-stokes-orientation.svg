<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Stokes' theorem links curl and boundary work</title><desc id="desc">An oriented curved-perspective surface has an upward normal and boundary direction indicated by an arrow. Stokes theorem equates boundary circulation and normal curl flux.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#F1BD75"/></marker></defs><rect width="1280" height="720" rx="18" fill="#0C1E30"/><text x="640" y="59" font-family="Georgia,serif" font-size="38" fill="#F2F5FB" text-anchor="middle">Stokes' theorem links curl and boundary work</text><text x="640" y="103" font-family="Georgia,serif" font-size="22" fill="#C4D2E1" text-anchor="middle">Orient the boundary consistently with the chosen normal.</text><line x1="43" y1="127" x2="1237" y2="127" stroke="#4D6B82" stroke-width="2" /><rect x="57" y="153" width="1165" height="477" rx="17" fill="#1A3147" stroke="#C6A5ED" stroke-width="2.5"/><ellipse cx="404" cy="428" rx="212" ry="86" fill="#315B67" fill-opacity=".66" stroke="#7DD9C9" stroke-width="4"/><path d="M614 428 A212 86 0 0 0 404 342" fill="none" stroke="#F1BD75" stroke-width="5" marker-end="url(#arr)"/><line x1="404" y1="428" x2="404" y2="253" stroke="#F1BD75" stroke-width="4" marker-end="url(#arr)"/><text x="444" y="267" font-family="Georgia,serif" font-size="28" fill="#F1BD75" text-anchor="middle">n</text><circle cx="276" cy="395" r="19" stroke="#C6A5ED" stroke-width="3" fill="none"/><circle cx="364" cy="395" r="19" stroke="#C6A5ED" stroke-width="3" fill="none"/><circle cx="452" cy="395" r="19" stroke="#C6A5ED" stroke-width="3" fill="none"/><circle cx="276" cy="446" r="19" stroke="#C6A5ED" stroke-width="3" fill="none"/><circle cx="364" cy="446" r="19" stroke="#C6A5ED" stroke-width="3" fill="none"/><text x="920" y="246" font-family="Georgia,serif" font-size="27" fill="#7DD9C9" text-anchor="middle">Oriented surface S</text><text x="920" y="326" font-family="Georgia,serif" font-size="25" fill="#C4D2E1" text-anchor="middle">normal n fixes the</text><text x="920" y="359" font-family="Georgia,serif" font-size="25" fill="#C4D2E1" text-anchor="middle">boundary direction</text><text x="916" y="485" font-family="Georgia,serif" font-size="30" fill="#F1BD75" text-anchor="middle">∮∂S F · dr</text><text x="920" y="533" font-family="Georgia,serif" font-size="27" fill="#F1BD75" text-anchor="middle">= ∬S curl F · n dS</text><text x="640" y="680" font-family="Georgia,serif" font-size="25" fill="#F2F5FB" text-anchor="middle">Flip the normal and boundary direction together.</text></svg>