<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 577" width="800" height="577" role="img" aria-labelledby="title desc"><title id="title">The rationals have a gap</title><desc id="desc">Three exact rational brackets: 1.4 less than sqrt2 less than 1.5; 1.41 less than sqrt2 less than 1.42; 1.414 less than sqrt2 less than 1.415. No rational squares to two.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L6 3 Z" fill="#87B8EE"/></marker></defs><rect width="800" height="577" fill="#101A2C"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#F4F3ED" font-size="35" font-weight="750">The rationals have a gap</text><text x="40" y="89" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="21" font-weight="550">Successive rational brackets approach √2.</text><path d="M40 108H760" stroke="#45576F" stroke-width="2"/><rect x="76" y="149" width="650" height="100" rx="14" fill="#19283A" stroke="#66C4B4" stroke-width="2"/><text x="176" y="209" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="29" font-weight="550">1.4</text><text x="400" y="206" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="29" font-weight="550">&lt;  √2  &lt;</text><text x="629" y="209" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#66C4B4" font-size="29" font-weight="550">1.5</text><rect x="76" y="271" width="650" height="100" rx="14" fill="#19283A" stroke="#BCA8EC" stroke-width="2"/><text x="176" y="331" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="29" font-weight="550">1.41</text><text x="400" y="328" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="29" font-weight="550">&lt;  √2  &lt;</text><text x="629" y="331" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#BCA8EC" font-size="29" font-weight="550">1.42</text><rect x="76" y="393" width="650" height="100" rx="14" fill="#19283A" stroke="#EDB86D" stroke-width="2"/><text x="176" y="453" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="29" font-weight="550">1.414</text><text x="400" y="450" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#F4F3ED" font-size="29" font-weight="550">&lt;  √2  &lt;</text><text x="629" y="453" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#EDB86D" font-size="29" font-weight="550">1.415</text><text x="400" y="527" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#C4CEDA" font-size="25" font-weight="550">No rational squares to 2.</text><text x="40" y="560" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#C4CEDA" font-size="15" font-weight="750">CONSTRUCTION  /  PROOF  /  EXAMPLE</text></svg>