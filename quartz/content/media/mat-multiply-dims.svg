<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Matrix product: inner dimensions must agree</title><desc id="desc">A matrix A of size 2 by 3 multiplied by B of size 3 by 2 gives result C of size 2 by 2. The inner 3 and 3 must match; outer dimensions 2 and 2 determine the output.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Matrix product: inner dimensions must agree</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="44" y="132" width="1112" height="448" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="45" y="133" width="1110" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="600" y="168" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Shapes determine whether AB is defined</text><line x1="56" y1="187" x2="1144" y2="187" stroke="#87B8EE" stroke-width="1.4" /><rect x="107" y="260" width="244" height="175" rx="12" fill="#253D59" stroke="#87B8EE" stroke-width="2"/><text x="229" y="333" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle">A</text><text x="229" y="380" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">2 rows × 3 cols</text><text x="405" y="345" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="400" text-anchor="middle">×</text><rect x="470" y="227" width="186" height="227" rx="12" fill="#403344" stroke="#BCA8EC" stroke-width="2"/><text x="563" y="333" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle">B</text><text x="563" y="380" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">3 rows × 2 cols</text><text x="722" y="345" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="400" text-anchor="middle">=</text><rect x="790" y="258" width="250" height="182" rx="12" fill="#20453F" stroke="#98D5A3" stroke-width="2"/><text x="915" y="333" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">C = AB</text><text x="915" y="381" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">2 rows × 2 cols</text><text x="564" y="509" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle">Inner sizes: 3 = 3</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">(2 × 3) (3 × 2) = (2 × 2)      •      inner 3 = 3</text></svg>