<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc"><title id="title">Basis neighborhoods: refine an overlap</title><desc id="desc">Two overlapping basis neighborhoods B one and B two are shown as large circles, and a smaller golden basis neighborhood B three contains the point x wholly inside their intersection. This is the local refinement condition in the basis axiom.</desc><rect width="1280" height="610" rx="20" fill="#0C1E30"/><text x="54" y="65" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F3F6FC">Basis neighborhoods: refine an overlap</text><line x1="54" y1="87" x2="1226" y2="87" stroke="#34566C" stroke-width="2"/><rect x="52" y="111" width="1176" height="394" rx="14" fill="#152D42" stroke="#35566E" stroke-width="2"/><circle cx="510" cy="295" r="202" fill="#264866" fill-opacity=".80" stroke="#91BDF2" stroke-width="5"/><circle cx="770" cy="295" r="202" fill="#23545A" fill-opacity=".66" stroke="#68D2C0" stroke-width="5"/><circle cx="640" cy="295" r="65" fill="#725C38" fill-opacity=".75" stroke="#F2BB68" stroke-width="5"/><text x="427" y="254" font-family="Arial,sans-serif" font-size="34" fill="#91BDF2" text-anchor="middle" font-weight="bold">B₁</text><text x="851" y="254" font-family="Arial,sans-serif" font-size="34" fill="#68D2C0" text-anchor="middle" font-weight="bold">B₂</text><circle cx="640" cy="315" r="9" fill="#F2BB68" stroke="#F2BB68" stroke-width="3"/><text x="640" y="300" font-family="Arial,sans-serif" font-size="30" fill="#F2BB68" text-anchor="middle" font-weight="bold">B₃</text><text x="661" y="342" font-family="Arial,sans-serif" font-size="23" fill="#F2BB68" text-anchor="start" font-weight="normal">x</text><text x="77" y="470" font-family="Arial,sans-serif" font-size="24" fill="#F3F6FC" text-anchor="start" font-weight="normal">Local condition: x ∈ B₃ ⊆ B₁ ∩ B₂</text><rect x="52" y="518" width="1176" height="63" rx="10" fill="#10263A" stroke="#426982" stroke-width="2"/><text x="640" y="558" font-family="Arial,sans-serif" font-size="22" fill="#F3F6FC" text-anchor="middle" font-weight="normal">The smaller basis set B₃ sits entirely inside the overlap around x.</text></svg>