<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Three-variable systems: three planes in space</title><desc id="desc">Three translucent coordinate planes x=1, y=1, z=1 meet at one point (1,1,1); the unique solution is their triple intersection. Parallel planes have no common solution; planes meeting in a line produce infinitely many solutions.</desc><defs><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#87B8EE"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F28D95"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#98D5A3"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BCA8EC"/></marker><marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#EDB86D"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#F4F3ED"/></marker></defs><rect width="1200" height="680" fill="#101A2C"/><text x="600" y="57" fill="#F4F3ED" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle">Three-variable systems: three planes in space</text><line x1="42" y1="108" x2="1158" y2="108" stroke="#40536B" stroke-width="1.5" /><rect x="40" y="130" width="740" height="449" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="41" y="131" width="738" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="410" y="166" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Three intersecting planes</text><line x1="52" y1="185" x2="768" y2="185" stroke="#87B8EE" stroke-width="1.4" /><rect x="805" y="130" width="351" height="449" rx="14" fill="#19283A" stroke="#40536B" stroke-width="1.6"/><rect x="806" y="131" width="349" height="55" rx="12" fill="#122338" stroke="none" stroke-width="0"/><text x="980.5" y="166" fill="#BCA8EC" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Each equation is a plane</text><line x1="817" y1="185" x2="1144" y2="185" stroke="#BCA8EC" stroke-width="1.4" /><polygon points="548,425 348,537 348,336 548,224" fill="#87B8EE" fill-opacity="0.21" stroke="#87B8EE" stroke-width="2.8" stroke-linejoin="round"/><polygon points="292,415 604,547 604,346 292,214" fill="#F28D95" fill-opacity="0.21" stroke="#F28D95" stroke-width="2.8" stroke-linejoin="round"/><polygon points="392,292 704,424 504,536 192,404" fill="#98D5A3" fill-opacity="0.21" stroke="#98D5A3" stroke-width="2.8" stroke-linejoin="round"/><circle cx="448" cy="414" r="12" fill="#EDB86D" stroke="none" stroke-width="1.5"/><text x="580" y="255" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle">(1,1,1)</text><line x1="565" y1="264" x2="456" y2="406" stroke="#EDB86D" stroke-width="1.6" /><text x="981" y="242" fill="#87B8EE" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle">x = 1</text><text x="981" y="305" fill="#F28D95" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle">y = 1</text><text x="981" y="368" fill="#98D5A3" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle">z = 1</text><text x="981" y="450" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">One point satisfies all</text><line x1="44" y1="604" x2="1156" y2="604" stroke="#40536B" stroke-width="1.5" /><text x="600" y="638" fill="#EDB86D" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle">Unique solution: one common point belongs to all three planes.</text></svg>