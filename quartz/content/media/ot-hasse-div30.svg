<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Divisors of thirty form the Boolean cube</title>
<desc id="desc">An eight-node divisibility Hasse diagram: bottom one; next level two, three, five; next six, ten, fifteen; and top thirty. Twelve cover edges join precisely pairs where the upper number adds one new prime factor. This poset is order-isomorphic to the subsets of two, three, five.</desc>
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#17122d"/><stop offset="1" stop-color="#0b1225"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<text x="54" y="58" fill="#f6f2ff" font-family="Georgia,serif" font-size="37" font-weight="700" text-anchor="start">Hasse diagram: three prime-factor choices</text>
<text x="54" y="96" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Every divisor corresponds to a unique subset of {2, 3, 5}.</text>
<path d="M54 113 H1146" stroke="#695282" stroke-width="2"/>
<rect x="42" y="134" width="738" height="430" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><rect x="802" y="134" width="356" height="430" rx="20" fill="#21203b" stroke="#51496b" stroke-width="2"/><text x="411" y="173" fill="#bea0f1" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle">Positive divisors of 30</text><line x1="411" y1="511" x2="238" y2="414" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="1" data-to="2"/><line x1="411" y1="511" x2="411" y2="414" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="1" data-to="3"/><line x1="411" y1="511" x2="584" y2="414" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="1" data-to="5"/><line x1="238" y1="414" x2="238" y2="299" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="2" data-to="6"/><line x1="238" y1="414" x2="411" y2="299" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="2" data-to="10"/><line x1="411" y1="414" x2="238" y2="299" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="3" data-to="6"/><line x1="411" y1="414" x2="584" y2="299" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="3" data-to="15"/><line x1="584" y1="414" x2="411" y2="299" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="5" data-to="10"/><line x1="584" y1="414" x2="584" y2="299" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="5" data-to="15"/><line x1="238" y1="299" x2="411" y2="204" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="6" data-to="30"/><line x1="411" y1="299" x2="411" y2="204" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="10" data-to="30"/><line x1="584" y1="299" x2="411" y2="204" stroke="#68739c" stroke-width="4" stroke-linecap="round" data-from="15" data-to="30"/><circle cx="411" cy="511" r="29" fill="#26535b" stroke="#78d2c7" stroke-width="3" data-node="1"/><text x="411" y="520" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">1</text><circle cx="238" cy="414" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="2"/><text x="238" y="423" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">2</text><circle cx="411" cy="414" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="3"/><text x="411" y="423" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">3</text><circle cx="584" cy="414" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="5"/><text x="584" y="423" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">5</text><circle cx="238" cy="299" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="6"/><text x="238" y="308" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">6</text><circle cx="411" cy="299" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="10"/><text x="411" y="308" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">10</text><circle cx="584" cy="299" r="29" fill="#493767" stroke="#bea0f1" stroke-width="3" data-node="15"/><text x="584" y="308" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">15</text><circle cx="411" cy="204" r="29" fill="#624829" stroke="#f1ce90" stroke-width="3" data-node="30"/><text x="411" y="213" fill="#f6f2ff" font-family="Georgia,serif" font-size="27" font-weight="700" text-anchor="middle">30</text><text x="827" y="190" fill="#f1ce90" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">THREE PRIMES</text><text x="827" y="242" fill="#f6f2ff" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">30 = 2 × 3 × 5</text><text x="827" y="301" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Each element is</text><text x="827" y="333" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">a product of a</text><text x="827" y="365" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">subset of the</text><text x="827" y="397" fill="#c7c6da" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">three primes.</text><text x="827" y="470" fill="#78d2c7" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">8 nodes · 12 covers</text><text x="600" y="597" fill="#f1ce90" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Choosing prime factors gives the same order shape as the subsets of a three-element set.</text>
</svg>